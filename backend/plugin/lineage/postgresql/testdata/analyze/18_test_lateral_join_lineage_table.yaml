name: TestLateralJoinLineage_Table
cases:
    - name: LATERAL subquery
      sql: "SELECT u.id, u.name, recent.order_id\n\t\t\t      FROM users u\n\t\t\t      LEFT JOIN LATERAL (\n\t\t\t          SELECT order_id FROM orders \n\t\t\t          WHERE user_id = u.id \n\t\t\t          ORDER BY created_at DESC \n\t\t\t          LIMIT 1\n\t\t\t      ) recent ON true"
      expected_edges:
        - from_table: users
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: direct
          is_temp: true
        - from_table: users
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: direct
          is_temp: true
        - from_table: orders
          from_field: order_id
          to_table: __result__
          to_field: order_id
          relation_type: direct
          is_temp: true
        - from_table: orders
          from_field: user_id
          to_table: __result__
          to_field: ""
          relation_type: indirect
          is_temp: true
          transformations:
            - operation: FILTER
              condition: user_id = u.id
        - from_table: users
          from_field: id
          to_table: __result__
          to_field: ""
          relation_type: indirect
          is_temp: true
          transformations:
            - operation: FILTER
              condition: user_id = u.id