name: TestPredicateAttribution_Table
cases:
    # A predicate decides the rows of the scope it was written in. Those rows are
    # consumed by whatever reads them — an enclosing query for a derived table or
    # an expression subquery, the query that references it for a CTE, the merged
    # result for a set-operation arm — and the influence travels with them. A
    # scope whose rows reach no output keeps its influences, so an unreferenced
    # CTE can no longer filter a result nobody reads it from. The influences used
    # to sit in one statement-wide list that the last emitter drained, which
    # attributed an unused CTE's WHERE to the statement's result.
    - name: an unreferenced CTE reaches no result
      sql: "WITH unused AS (SELECT id FROM t WHERE x = 1) SELECT 1 AS one"
      expected_edges: []
    - name: a referenced CTE keeps its influence
      sql: "WITH c AS (SELECT id FROM t WHERE x = 1) SELECT id FROM c"
      expected_edges:
        - from_table: t
          from_field: "id"
          to_table: __result__
          to_field: "id"
          relation_type: direct
          is_temp: true
        - from_table: t
          from_field: "x"
          to_table: __result__
          to_field: ""
          relation_type: indirect
          is_temp: true
          transformations:
            - operation: FILTER
              condition: "x = 1"
    - name: an influence travels through a chain of CTEs
      sql: "WITH a AS (SELECT id FROM t WHERE x = 1), b AS (SELECT id FROM a) SELECT id FROM b"
      expected_edges:
        - from_table: t
          from_field: "id"
          to_table: __result__
          to_field: "id"
          relation_type: direct
          is_temp: true
        - from_table: t
          from_field: "x"
          to_table: __result__
          to_field: ""
          relation_type: indirect
          is_temp: true
          transformations:
            - operation: FILTER
              condition: "x = 1"
    - name: an unused CTE beside a used one contributes nothing
      sql: "WITH u AS (SELECT id FROM t WHERE x = 1), c AS (SELECT id FROM s WHERE y = 2) SELECT id FROM c"
      expected_edges:
        - from_table: s
          from_field: "id"
          to_table: __result__
          to_field: "id"
          relation_type: direct
          is_temp: true
        - from_table: s
          from_field: "y"
          to_table: __result__
          to_field: ""
          relation_type: indirect
          is_temp: true
          transformations:
            - operation: FILTER
              condition: "y = 2"
    - name: a derived table's influence reaches the query that reads it
      sql: "SELECT d.a FROM (SELECT a FROM t WHERE x = 1) d"
      expected_edges:
        - from_table: t
          from_field: "a"
          to_table: __result__
          to_field: "a"
          relation_type: direct
          is_temp: true
        - from_table: t
          from_field: "x"
          to_table: __result__
          to_field: ""
          relation_type: indirect
          is_temp: true
          transformations:
            - operation: FILTER
              condition: "x = 1"
    - name: an expression subquery's influence reaches its query
      sql: "SELECT (SELECT max(s.v) FROM s WHERE s.k = t.k) AS m FROM t"
      expected_edges:
        - from_table: s
          from_field: "v"
          to_table: __result__
          to_field: "m"
          relation_type: indirect
          is_temp: true
          transformations:
            - operation: PROJECT
              expression: "(SELECT max(s.v) FROM s WHERE s.k = t.k)"
        - from_table: s
          from_field: "k"
          to_table: __result__
          to_field: ""
          relation_type: indirect
          is_temp: true
          transformations:
            - operation: FILTER
              condition: "s.k = t.k"
        - from_table: t
          from_field: "k"
          to_table: __result__
          to_field: ""
          relation_type: indirect
          is_temp: true
          transformations:
            - operation: FILTER
              condition: "s.k = t.k"
    - name: a set operation arm's influence reaches the merged result
      sql: "SELECT a FROM t1 WHERE x = 1 UNION ALL SELECT b FROM t2 WHERE y = 2"
      expected_edges:
        - from_table: t1
          from_field: "a"
          to_table: __result__
          to_field: "a"
          relation_type: union
          is_temp: true
          transformations:
            - operation: UNION
        - from_table: t2
          from_field: "b"
          to_table: __result__
          to_field: "a"
          relation_type: union
          is_temp: true
          transformations:
            - operation: UNION
        - from_table: t1
          from_field: "x"
          to_table: __result__
          to_field: ""
          relation_type: indirect
          is_temp: true
          transformations:
            - operation: FILTER
              condition: "x = 1"
        - from_table: t2
          from_field: "y"
          to_table: __result__
          to_field: ""
          relation_type: indirect
          is_temp: true
          transformations:
            - operation: FILTER
              condition: "y = 2"
