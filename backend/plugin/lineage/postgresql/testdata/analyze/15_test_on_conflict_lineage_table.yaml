name: TestOnConflictLineage_Table
cases:
    - name: INSERT ON CONFLICT DO NOTHING
      sql: |-
        INSERT INTO users (id, name, email)
        			      SELECT id, name, email FROM pending_users
        			      ON CONFLICT (id) DO NOTHING
      expected_edges:
        - from_table: pending_users
          from_field: id
          to_table: users
          to_field: id
          relation_type: direct
          is_temp: false
        - from_table: pending_users
          from_field: name
          to_table: users
          to_field: name
          relation_type: direct
          is_temp: false
        - from_table: pending_users
          from_field: email
          to_table: users
          to_field: email
          relation_type: direct
          is_temp: false
    # The conflict clause rewrites the column from the row the insert proposed,
    # and EXCLUDED.name names that row's value, whose own source is the INSERT's
    # SELECT. The rewrite is a second, different derivation of the same target
    # column, so it is recorded beside the insert's edge rather than collapsed
    # with it.
    - name: INSERT ON CONFLICT DO UPDATE
      sql: "INSERT INTO users (id, name, email)\n\t\t\t      SELECT id, name, email FROM pending_users\n\t\t\t      ON CONFLICT (id) DO UPDATE SET \n\t\t\t          name = EXCLUDED.name,\n\t\t\t          email = EXCLUDED.email"
      expected_edges:
        - from_table: pending_users
          from_field: id
          to_table: users
          to_field: id
          relation_type: direct
          is_temp: false
        - from_table: pending_users
          from_field: name
          to_table: users
          to_field: name
          relation_type: direct
          is_temp: false
        - from_table: pending_users
          from_field: email
          to_table: users
          to_field: email
          relation_type: direct
          is_temp: false
        - from_table: pending_users
          from_field: name
          to_table: users
          to_field: name
          relation_type: indirect
          is_temp: false
          transformations:
            - operation: PROJECT
              expression: EXCLUDED.name
        - from_table: pending_users
          from_field: email
          to_table: users
          to_field: email
          relation_type: indirect
          is_temp: false
          transformations:
            - operation: PROJECT
              expression: EXCLUDED.email
    - name: INSERT ON CONFLICT with expression update
      sql: |-
        INSERT INTO inventory (product_id, quantity)
        			      SELECT product_id, quantity FROM shipment
        			      ON CONFLICT (product_id) DO UPDATE SET
        			          quantity = inventory.quantity + EXCLUDED.quantity
      expected_edges:
        - from_table: shipment
          from_field: product_id
          to_table: inventory
          to_field: product_id
          relation_type: direct
          is_temp: false
        - from_table: shipment
          from_field: quantity
          to_table: inventory
          to_field: quantity
          relation_type: direct
          is_temp: false
        - from_table: inventory
          from_field: quantity
          to_table: inventory
          to_field: quantity
          relation_type: indirect
          has_transform: true
          is_temp: false
          transformations:
            - operation: OPERATOR
              expression: inventory.quantity + EXCLUDED.quantity
              op_type: +
        # The on-conflict value also reads the proposed quantity, which the
        # insert's SELECT took from shipment.
        - from_table: shipment
          from_field: quantity
          to_table: inventory
          to_field: quantity
          relation_type: indirect
          is_temp: false
          transformations:
            - operation: OPERATOR
              expression: inventory.quantity + EXCLUDED.quantity
              op_type: +

    # A DO UPDATE's WHERE decides which conflicting rows are rewritten — an
    # UPDATE's row set — and this analyzer records no modification's row-set
    # conditions as lineage (an UPDATE's own WHERE is dropped for the same reason).
    # The clause is not analyzed at all: neither its target-column predicate nor
    # the audit subquery behind it contributes an edge, so this statement's edges
    # are exactly the ones the same statement without the WHERE would produce.
    # PostgreSQL 16.15 runs the form and lets the clause name the target relation,
    # EXCLUDED and a subquery, so the shape is pinned here: changing the decision
    # has to be a deliberate diff rather than a silent one.
    - name: an on-conflict where clause contributes no lineage
      sql: "INSERT INTO inventory (product_id, quantity) SELECT product_id, quantity FROM shipment ON CONFLICT (product_id) DO UPDATE SET quantity = EXCLUDED.quantity WHERE inventory.updated_at < now() AND (SELECT count(*) FROM audit) > 0"
      expected_edges:
        - from_table: shipment
          from_field: product_id
          to_table: inventory
          to_field: product_id
          relation_type: direct
          is_temp: false
        - from_table: shipment
          from_field: quantity
          to_table: inventory
          to_field: quantity
          relation_type: direct
          is_temp: false
        - from_table: shipment
          from_field: quantity
          to_table: inventory
          to_field: quantity
          relation_type: indirect
          is_temp: false
          transformations:
            - operation: PROJECT
              expression: EXCLUDED.quantity
