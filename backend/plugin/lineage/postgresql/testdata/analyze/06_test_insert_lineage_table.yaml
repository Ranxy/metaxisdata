name: TestInsertLineage_Table
cases:
    - name: INSERT SELECT
      sql: INSERT INTO tmp_users SELECT id, name FROM users WHERE age > 30
      expected_edges:
        - from_table: users
          from_field: id
          to_table: tmp_users
          to_field: id
          relation_type: direct
          is_temp: false
        - from_table: users
          from_field: name
          to_table: tmp_users
          to_field: name
          relation_type: direct
          is_temp: false
        - from_table: users
          from_field: age
          to_table: tmp_users
          to_field: ""
          relation_type: indirect
          is_temp: false
          transformations:
            - operation: FILTER
              condition: age > 30
    - name: INSERT SELECT with explicit columns
      sql: INSERT INTO tmp_users (user_id, user_name) SELECT id, name FROM users
      expected_edges:
        - from_table: users
          from_field: id
          to_table: tmp_users
          to_field: user_id
          relation_type: direct
          is_temp: false
        - from_table: users
          from_field: name
          to_table: tmp_users
          to_field: user_name
          relation_type: direct
          is_temp: false
    - name: INSERT SELECT with JOIN
      sql: "INSERT INTO summary \n\t\t\t      SELECT u.id, u.name, COUNT(o.id) AS order_count \n\t\t\t      FROM users u \n\t\t\t      JOIN orders o ON u.id = o.user_id \n\t\t\t      GROUP BY u.id, u.name"
      expected_edges:
        - from_table: users
          from_field: id
          to_table: summary
          to_field: id
          relation_type: direct
          is_temp: false
        - from_table: users
          from_field: name
          to_table: summary
          to_field: name
          relation_type: direct
          is_temp: false
        - from_table: orders
          from_field: id
          to_table: summary
          to_field: order_count
          relation_type: group
          has_transform: true
          is_temp: false
          transformations:
            - operation: AGGREGATE
              function_name: COUNT
              expression: COUNT(o.id)
              group_keys:
                - u.id
                - u.name
        - from_table: users
          from_field: id
          to_table: summary
          to_field: ""
          relation_type: join
          is_temp: false
          transformations:
            - operation: JOIN
              condition: u.id = o.user_id
        - from_table: orders
          from_field: user_id
          to_table: summary
          to_field: ""
          relation_type: join
          is_temp: false
          transformations:
            - operation: JOIN
              condition: u.id = o.user_id
    - name: INSERT with CTE
      sql: |-
        WITH active_users AS (
        			          SELECT id, name FROM users WHERE status = 'active'
        			      )
        			      INSERT INTO user_backup SELECT * FROM active_users
      expected_edges:
        - from_table: users
          from_field: id
          to_table: user_backup
          to_field: id
          relation_type: direct
          is_temp: false
        - from_table: users
          from_field: name
          to_table: user_backup
          to_field: name
          relation_type: direct
          is_temp: false
        - from_table: users
          from_field: status
          to_table: user_backup
          to_field: ""
          relation_type: indirect
          is_temp: false
          transformations:
            - operation: FILTER
              condition: status = 'active'
    - name: INSERT with CTE explicit column names
      sql: |-
        WITH active_users (user_id, user_name) AS (
        			          SELECT id, name FROM users WHERE status = 'active'
        			      )
        			      INSERT INTO user_backup (id, name)
        			      SELECT user_id, user_name FROM active_users
      expected_edges:
        - from_table: users
          from_field: id
          to_table: user_backup
          to_field: id
          relation_type: direct
          is_temp: false
        - from_table: users
          from_field: name
          to_table: user_backup
          to_field: name
          relation_type: direct
          is_temp: false
        - from_table: users
          from_field: status
          to_table: user_backup
          to_field: ""
          relation_type: indirect
          is_temp: false
          transformations:
            - operation: FILTER
              condition: status = 'active'
    - name: INSERT with RETURNING clause
      sql: |-
        INSERT INTO users (name, email)
        			      SELECT name, email FROM pending_users
        			      RETURNING id, name
      expected_edges:
        - from_table: pending_users
          from_field: name
          to_table: users
          to_field: name
          relation_type: direct
          is_temp: false
        - from_table: pending_users
          from_field: email
          to_table: users
          to_field: email
          relation_type: direct
          is_temp: false    # A column list declares exactly which target columns the query fills, so an
    # output beyond the list has no target. PostgreSQL rejects the statement, and
    # inferring a target for the extra column invented an edge to a column the
    # statement never writes.
    - name: an output beyond the declared column list has no target
      sql: INSERT INTO dst (a) SELECT x, y FROM src
      expected_edges:
        - from_table: src
          from_field: x
          to_table: dst
          to_field: a
          relation_type: direct
          is_temp: false
