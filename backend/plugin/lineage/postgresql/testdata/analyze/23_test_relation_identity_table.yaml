name: TestRelationIdentity_Table
cases:
    # A qualifier is part of a relation's identity. Two schemas can hold a table
    # of the same name, and each keeps its own source: resolving `s1.t` by table
    # name alone would attribute its columns to `s2.t`.
    - name: same-name tables in two schemas are told apart by the qualifier
      sql: SELECT s1.t.a, s2.t.b FROM s1.t JOIN s2.t ON s1.t.id = s2.t.id
      expected_edges:
        - from_schema: s1
          from_table: t
          from_field: a
          to_table: __result__
          to_field: a
          relation_type: direct
          is_temp: true
        - from_schema: s2
          from_table: t
          from_field: b
          to_table: __result__
          to_field: b
          relation_type: direct
          is_temp: true
        - from_schema: s1
          from_table: t
          from_field: id
          to_table: __result__
          to_field: ""
          relation_type: join
          is_temp: true
          transformations:
            - operation: JOIN
              condition: s1.t.id = s2.t.id
        - from_schema: s2
          from_table: t
          from_field: id
          to_table: __result__
          to_field: ""
          relation_type: join
          is_temp: true
          transformations:
            - operation: JOIN
              condition: s1.t.id = s2.t.id
    - name: a qualified projection keeps the qualifier it was written with
      sql: SELECT s1.t.a FROM s1.t JOIN s2.t ON s1.t.id = s2.t.id
      expected_edges:
        - from_schema: s1
          from_table: t
          from_field: a
          to_table: __result__
          to_field: a
          relation_type: direct
          is_temp: true
        - from_schema: s1
          from_table: t
          from_field: id
          to_table: __result__
          to_field: ""
          relation_type: join
          is_temp: true
          transformations:
            - operation: JOIN
              condition: s1.t.id = s2.t.id
        - from_schema: s2
          from_table: t
          from_field: id
          to_table: __result__
          to_field: ""
          relation_type: join
          is_temp: true
          transformations:
            - operation: JOIN
              condition: s1.t.id = s2.t.id
    - name: aliased same-name tables in two schemas keep both edges
      sql: SELECT a.id, b.id FROM s1.t a JOIN s2.t b ON a.id = b.id
      expected_edges:
        - from_schema: s1
          from_table: t
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: direct
          is_temp: true
        - from_schema: s2
          from_table: t
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: direct
          is_temp: true
        - from_schema: s1
          from_table: t
          from_field: id
          to_table: __result__
          to_field: ""
          relation_type: join
          is_temp: true
          transformations:
            - operation: JOIN
              condition: a.id = b.id
        - from_schema: s2
          from_table: t
          from_field: id
          to_table: __result__
          to_field: ""
          relation_type: join
          is_temp: true
          transformations:
            - operation: JOIN
              condition: a.id = b.id
    - name: an unqualified star expands every same-name relation
      sql: SELECT * FROM s1.t JOIN s2.t ON s1.t.id = s2.t.id
      expected_edges:
        - from_schema: s1
          from_table: t
          from_field: '*'
          to_table: __result__
          to_field: '*'
          relation_type: direct
          is_temp: true
        - from_schema: s2
          from_table: t
          from_field: '*'
          to_table: __result__
          to_field: '*'
          relation_type: direct
          is_temp: true
        - from_schema: s1
          from_table: t
          from_field: id
          to_table: __result__
          to_field: ""
          relation_type: join
          is_temp: true
          transformations:
            - operation: JOIN
              condition: s1.t.id = s2.t.id
        - from_schema: s2
          from_table: t
          from_field: id
          to_table: __result__
          to_field: ""
          relation_type: join
          is_temp: true
          transformations:
            - operation: JOIN
              condition: s1.t.id = s2.t.id
    - name: a qualified star names the schema it was written with
      sql: SELECT s1.t.*, s2.t.* FROM s1.t JOIN s2.t ON s1.t.id = s2.t.id
      expected_edges:
        - from_schema: s1
          from_table: t
          from_field: '*'
          to_table: __result__
          to_field: '*'
          relation_type: direct
          is_temp: true
        - from_schema: s2
          from_table: t
          from_field: '*'
          to_table: __result__
          to_field: '*'
          relation_type: direct
          is_temp: true
        - from_schema: s1
          from_table: t
          from_field: id
          to_table: __result__
          to_field: ""
          relation_type: join
          is_temp: true
          transformations:
            - operation: JOIN
              condition: s1.t.id = s2.t.id
        - from_schema: s2
          from_table: t
          from_field: id
          to_table: __result__
          to_field: ""
          relation_type: join
          is_temp: true
          transformations:
            - operation: JOIN
              condition: s1.t.id = s2.t.id
    - name: the same qualified column twice is one edge
      sql: SELECT t.id, s1.t.id FROM s1.t
      expected_edges:
        - from_schema: s1
          from_table: t
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: direct
          is_temp: true
    - name: a CTE does not capture a qualified table of the same name
      sql: WITH t AS (SELECT id FROM src) SELECT s1.t.name FROM s1.t
      expected_edges:
        - from_schema: s1
          from_table: t
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: direct
          is_temp: true
    - name: a CTE and a same-named qualified table both contribute
      sql: WITH t AS (SELECT id FROM src) SELECT s1.t.name, t.id FROM s1.t JOIN t ON t.id = s1.t.id
      expected_edges:
        - from_schema: s1
          from_table: t
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: direct
          is_temp: true
        - from_table: src
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: direct
          is_temp: true
        - from_table: src
          from_field: id
          to_table: __result__
          to_field: ""
          relation_type: join
          is_temp: true
          transformations:
            - operation: JOIN
              condition: t.id = s1.t.id
        - from_schema: s1
          from_table: t
          from_field: id
          to_table: __result__
          to_field: ""
          relation_type: join
          is_temp: true
          transformations:
            - operation: JOIN
              condition: t.id = s1.t.id