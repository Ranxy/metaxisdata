name: TestOutputTarget_Table
cases:
    # An object that names its columns renames the query's output positionally,
    # which is what the created object's synced column list holds. Only a
    # materialized view honoured the list; CREATE TABLE ... (columns) AS ignored
    # it and recorded the query's own names.
    - name: a create table as honours its column list
      sql: "CREATE TABLE dst (p, q) AS SELECT a, b FROM src"
      expected_edges:
        - from_table: src
          from_field: "a"
          to_table: dst
          to_field: "p"
          relation_type: direct
          is_temp: false
        - from_table: src
          from_field: "b"
          to_table: dst
          to_field: "q"
          relation_type: direct
          is_temp: false
    # SELECT ... INTO creates the table it names, so the edges reach that table.
    # It was read as a bare SELECT, which reported the query's columns against
    # __result__ and lost the object the statement creates.
    - name: a select into writes the named table
      sql: "SELECT a, b INTO newtab FROM t"
      expected_edges:
        - from_table: t
          from_field: "a"
          to_table: newtab
          to_field: "a"
          relation_type: direct
          is_temp: false
        - from_table: t
          from_field: "b"
          to_table: newtab
          to_field: "b"
          relation_type: direct
          is_temp: false
    # A data-modifying statement in WITH returns its RETURNING rows to the query
    # that reads it. The list was never read, so the CTE described no columns and
    # the INSERT that consumed it recorded nothing at all.
    - name: a delete returning feeds the query that reads it
      sql: "WITH moved AS (DELETE FROM products WHERE d < '2020' RETURNING id, name) INSERT INTO log (id, name) SELECT id, name FROM moved"
      expected_edges:
        - from_table: products
          from_field: "d"
          to_table: products
          to_field: "__deletion__"
          relation_type: indirect
          is_temp: false
          transformations:
            - operation: DELETE
              condition: "d < '2020'"
        - from_table: products
          from_field: "id"
          to_table: log
          to_field: "id"
          relation_type: direct
          is_temp: false
        - from_table: products
          from_field: "name"
          to_table: log
          to_field: "name"
          relation_type: direct
          is_temp: false
    - name: a delete returning star feeds the query that reads it
      sql: "WITH moved AS (DELETE FROM products RETURNING *) INSERT INTO log SELECT * FROM moved"
      expected_edges:
        - from_table: products
          from_field: "*"
          to_table: log
          to_field: "*"
          relation_type: direct
          is_temp: false
    - name: an insert returning feeds the query that reads it
      sql: "WITH src AS (INSERT INTO products (name) VALUES ('x') RETURNING id) INSERT INTO log (id) SELECT id FROM src"
      expected_edges:
        - from_table: products
          from_field: "id"
          to_table: log
          to_field: "id"
          relation_type: direct
          is_temp: false
    - name: an update returning feeds the query that reads it
      sql: "WITH upd AS (UPDATE products SET name = 'y' RETURNING id, name) INSERT INTO log (id, name) SELECT id, name FROM upd"
      expected_edges:
        - from_table: products
          from_field: "*"
          to_table: products
          to_field: "name"
          relation_type: indirect
          is_temp: false
          transformations:
            - operation: PROJECT
              expression: "'y'"
        - from_table: products
          from_field: "id"
          to_table: log
          to_field: "id"
          relation_type: direct
          is_temp: false
        - from_table: products
          from_field: "name"
          to_table: log
          to_field: "name"
          relation_type: direct
          is_temp: false
    # An output column with no name of its own is named the way PostgreSQL names
    # it, which is what the created object's synced column list holds. The
    # analyzer used to report the expression's source text, which is not a column
    # name at all (`count(*)`, `aa + bb`); pg_get_viewdef writes the real names
    # out, so this only changes a manually entered statement. Verified against
    # PostgreSQL 16, CASE included.
    - name: an unaliased expression is named as PostgreSQL names it
      sql: "CREATE TABLE dst AS SELECT count(*), aa + bb, ts::date, CURRENT_DATE FROM t"
      expected_edges:
        - from_table: t
          from_field: "*"
          to_table: dst
          to_field: "count"
          relation_type: group
          is_temp: false
          transformations:
            - operation: AGGREGATE
              function_name: "COUNT"
              expression: "count(*)"
              group_keys: []
        - from_table: t
          from_field: "aa"
          to_table: dst
          to_field: "?column?"
          relation_type: indirect
          is_temp: false
          transformations:
            - operation: OPERATOR
              op_type: "+"
              expression: "aa + bb"
        - from_table: t
          from_field: "bb"
          to_table: dst
          to_field: "?column?"
          relation_type: indirect
          is_temp: false
          transformations:
            - operation: OPERATOR
              op_type: "+"
              expression: "aa + bb"
        - from_table: t
          from_field: "ts"
          to_table: dst
          to_field: "ts"
          relation_type: indirect
          is_temp: false
          transformations:
            - operation: FUNCTION
              function_name: "CAST"
              expression: "ts::date"
              arguments: ["ts"]
    - name: a named expression node keeps its own name
      sql: "CREATE VIEW v AS SELECT count(*), aa + bb, ts::date, CASE WHEN aa > 1 THEN bb END FROM t"
      expected_edges:
        - from_table: t
          from_field: "*"
          to_table: v
          to_field: "count"
          relation_type: group
          is_temp: false
          transformations:
            - operation: AGGREGATE
              function_name: "COUNT"
              expression: "count(*)"
              group_keys: []
        - from_table: t
          from_field: "aa"
          to_table: v
          to_field: "?column?"
          relation_type: indirect
          is_temp: false
          transformations:
            - operation: OPERATOR
              op_type: "+"
              expression: "aa + bb"
        - from_table: t
          from_field: "bb"
          to_table: v
          to_field: "?column?"
          relation_type: indirect
          is_temp: false
          transformations:
            - operation: OPERATOR
              op_type: "+"
              expression: "aa + bb"
        - from_table: t
          from_field: "ts"
          to_table: v
          to_field: "ts"
          relation_type: indirect
          is_temp: false
          transformations:
            - operation: FUNCTION
              function_name: "CAST"
              expression: "ts::date"
              arguments: ["ts"]
        - from_table: t
          from_field: "aa"
          to_table: v
          to_field: "case"
          relation_type: indirect
          is_temp: false
          transformations:
            - operation: CASE
              expression: "CASE WHEN aa > 1 THEN bb END"
        - from_table: t
          from_field: "bb"
          to_table: v
          to_field: "case"
          relation_type: indirect
          is_temp: false
          transformations:
            - operation: CASE
              expression: "CASE WHEN aa > 1 THEN bb END"

    # The row an insert writes comes from a query level of its own, so the CTE it
    # forms exposes the RETURNING list and nothing else: the columns the query read
    # are the write's input, not the rows it returns. PostgreSQL agrees — a name the
    # two share exists only once in the CTE (verified on 16.15). Appending the two
    # lists attributed the shared name to the source table as well, which named a
    # table the CTE never returns from.
    - name: an insert returning exposes only the returned columns
      sql: "WITH ins AS (INSERT INTO t (id, a) SELECT id, a FROM stage RETURNING id) SELECT id FROM ins"
      expected_edges:
        - from_table: stage
          from_field: "id"
          to_table: t
          to_field: "id"
          relation_type: direct
          is_temp: false
        - from_table: stage
          from_field: "a"
          to_table: t
          to_field: "a"
          relation_type: direct
          is_temp: false
        - from_table: t
          from_field: "id"
          to_table: __result__
          to_field: "id"
          relation_type: direct
          is_temp: true

    # Reading the CTE with a star reads exactly that one column.
    - name: an insert returning star reads the returned columns only
      sql: "WITH ins AS (INSERT INTO t (id, a) SELECT id, a FROM stage RETURNING id) SELECT * FROM ins"
      expected_edges:
        - from_table: stage
          from_field: "id"
          to_table: t
          to_field: "id"
          relation_type: direct
          is_temp: false
        - from_table: stage
          from_field: "a"
          to_table: t
          to_field: "a"
          relation_type: direct
          is_temp: false
        - from_table: t
          from_field: "id"
          to_table: __result__
          to_field: "id"
          relation_type: direct
          is_temp: true

    # The clause reads the target relation's own row, so naming the query it writes
    # from is "missing FROM-clause entry for table stage" (verified on 16.15) and
    # records no lineage.
    - name: a returning clause cannot name the query the insert writes from
      sql: "WITH ins AS (INSERT INTO t (id, a) SELECT id, a FROM stage RETURNING stage.id) SELECT id FROM ins"
      expected_edges:
        - from_table: stage
          from_field: "id"
          to_table: t
          to_field: "id"
          relation_type: direct
          is_temp: false
        - from_table: stage
          from_field: "a"
          to_table: t
          to_field: "a"
          relation_type: direct
          is_temp: false

    # Without RETURNING the statement forms no rows, and PostgreSQL refuses to read
    # such a CTE at all ("WITH query ins does not have a RETURNING clause"), so it
    # exposes no columns to read.
    - name: a data-modifying cte without a returning clause exposes no columns
      sql: "WITH ins AS (INSERT INTO t (id, a) SELECT id, a FROM stage) SELECT * FROM ins"
      expected_edges:
        - from_table: stage
          from_field: "id"
          to_table: t
          to_field: "id"
          relation_type: direct
          is_temp: false
        - from_table: stage
          from_field: "a"
          to_table: t
          to_field: "a"
          relation_type: direct
          is_temp: false

    # The relations an update or a delete reads from are its own, not a nested
    # query's, so its RETURNING list may name them (verified on 16.15). A scope
    # that refused them would drop this lineage.
    - name: a returning clause names the relations an update reads from
      sql: "WITH ins AS (UPDATE t SET a = stage.a FROM stage RETURNING stage.id) SELECT id FROM ins"
      expected_edges:
        - from_table: stage
          from_field: "a"
          to_table: t
          to_field: "a"
          relation_type: indirect
          is_temp: false
          transformations:
            - operation: PROJECT
              expression: "stage.a"
        - from_table: stage
          from_field: "id"
          to_table: __result__
          to_field: "id"
          relation_type: direct
          is_temp: true

    - name: a returning clause names the relations a delete reads from
      sql: "WITH ins AS (DELETE FROM t USING stage WHERE t.id = stage.id RETURNING stage.id) SELECT id FROM ins"
      expected_edges:
        - from_table: t
          from_field: "id"
          to_table: t
          to_field: __deletion__
          relation_type: indirect
          is_temp: false
          transformations:
            - operation: DELETE
              condition: t.id = stage.id
        - from_table: stage
          from_field: "id"
          to_table: t
          to_field: __deletion__
          relation_type: indirect
          is_temp: false
          transformations:
            - operation: DELETE
              condition: t.id = stage.id
        - from_table: stage
          from_field: "id"
          to_table: __result__
          to_field: "id"
          relation_type: direct
          is_temp: true

    # One data-modifying CTE reads the row another one returned, so the second
    # insert's source is the first one's returned column — the target's own column —
    # and not the column the first insert read.
    - name: a chained data-modifying cte reads the row the first one returned
      sql: "WITH a1 AS (INSERT INTO t (id) SELECT id FROM stage RETURNING id), a2 AS (INSERT INTO t2 (id) SELECT id FROM a1 RETURNING id) SELECT id FROM a2"
      expected_edges:
        - from_table: stage
          from_field: "id"
          to_table: t
          to_field: "id"
          relation_type: direct
          is_temp: false
        - from_table: t
          from_field: "id"
          to_table: t2
          to_field: "id"
          relation_type: direct
          is_temp: false
        - from_table: t2
          from_field: "id"
          to_table: __result__
          to_field: "id"
          relation_type: direct
          is_temp: true
