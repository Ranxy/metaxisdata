name: TestDeleteLineage_Table
cases:
    - name: simple DELETE
      sql: DELETE FROM users WHERE status = 'inactive' AND last_login < NOW() - INTERVAL '1 year'
      expected_edges:
        - from_field: status
          to_table: users
          to_field: __deletion__
          has_transform: true
        - from_field: last_login
          to_table: users
          to_field: __deletion__
          has_transform: true
    - name: DELETE with USING clause
      sql: |-
        DELETE FROM orders
        			      USING users u
        			      WHERE orders.user_id = u.id AND u.status = 'deleted'
      expected_edges:
        - from_table: users
          from_field: status
          to_table: orders
          to_field: __deletion__
          has_transform: true
    - name: DELETE with subquery
      sql: "DELETE FROM users \n\t\t\t      WHERE id IN (SELECT user_id FROM orders WHERE status = 'cancelled' GROUP BY user_id HAVING COUNT(*) > 5)"
      expected_edges:
        - to_table: users
          to_field: __deletion__
          has_transform: true
    - name: DELETE with CTE
      sql: |-
        WITH inactive_users AS (
        			          SELECT id FROM users WHERE last_login < NOW() - INTERVAL '2 years'
        			      )
        			      DELETE FROM user_sessions
        			      USING inactive_users iu
        			      WHERE user_sessions.user_id = iu.id
      expected_edges:
        - from_table: users
          from_field: id
          to_table: user_sessions
          to_field: __deletion__
          has_transform: true
    - name: DELETE with RETURNING
      sql: DELETE FROM logs WHERE created_at < '2020-01-01' RETURNING id, message
      expected_edges:
        - from_field: created_at
          to_table: logs
          to_field: __deletion__
          has_transform: true
