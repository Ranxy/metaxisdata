name: TestCatalogIntegration_Table
cases:
    - name: SELECT * with catalog
      sql: SELECT * FROM users
      catalog:
        tables:
            users:
                - id
                - name
                - email
      expected_edges:
        - from_table: users
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: direct
          is_temp: true
        - from_table: users
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: direct
          is_temp: true
        - from_table: users
          from_field: email
          to_table: __result__
          to_field: email
          relation_type: direct
          is_temp: true
    - name: table.* with catalog
      sql: SELECT users.*, orders.total FROM users JOIN orders ON users.id = orders.user_id
      catalog:
        tables:
            orders:
                - order_id
                - user_id
                - total
            users:
                - id
                - name
      expected_edges:
        - from_table: users
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: direct
          is_temp: true
        - from_table: users
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: direct
          is_temp: true
        - from_table: orders
          from_field: total
          to_table: __result__
          to_field: total
          relation_type: direct
          is_temp: true
        - from_table: users
          from_field: id
          to_table: __result__
          to_field: ""
          relation_type: join
          is_temp: true
          transformations:
            - operation: JOIN
              condition: users.id = orders.user_id
        - from_table: orders
          from_field: user_id
          to_table: __result__
          to_field: ""
          relation_type: join
          is_temp: true
          transformations:
            - operation: JOIN
              condition: users.id = orders.user_id
    - name: SELECT * in subquery with catalog
      sql: SELECT * FROM (SELECT * FROM users WHERE status = 'active') AS active_users
      catalog:
        tables:
            users:
                - id
                - name
                - email
                - status
      expected_edges:
        - from_table: users
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: direct
          is_temp: true
        - from_table: users
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: direct
          is_temp: true
        - from_table: users
          from_field: email
          to_table: __result__
          to_field: email
          relation_type: direct
          is_temp: true
        - from_table: users
          from_field: status
          to_table: __result__
          to_field: status
          relation_type: direct
          is_temp: true
        - from_table: users
          from_field: status
          to_table: __result__
          to_field: ""
          relation_type: indirect
          is_temp: true
          transformations:
            - operation: FILTER
              condition: status = 'active'
    - name: SELECT * in CTE with catalog
      sql: |-
        WITH active_users AS (SELECT * FROM users WHERE status = 'active')
        			      SELECT * FROM active_users
      catalog:
        tables:
            users:
                - id
                - name
                - email
                - status
      expected_edges:
        - from_table: users
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: direct
          is_temp: true
        - from_table: users
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: direct
          is_temp: true
        - from_table: users
          from_field: email
          to_table: __result__
          to_field: email
          relation_type: direct
          is_temp: true
        - from_table: users
          from_field: status
          to_table: __result__
          to_field: status
          relation_type: direct
          is_temp: true
        - from_table: users
          from_field: status
          to_table: __result__
          to_field: ""
          relation_type: indirect
          is_temp: true
          transformations:
            - operation: FILTER
              condition: status = 'active'
    - name: unqualified column disambiguated by catalog
      sql: SELECT z FROM a JOIN b ON a.id = b.id
      catalog:
        tables:
            a:
                - id
                - x
            b:
                - id
                - y
                - z
      expected_edges:
        - from_table: b
          from_field: z
          to_table: __result__
          to_field: z
          relation_type: direct
          is_temp: true
        - from_table: a
          from_field: id
          to_table: __result__
          to_field: ""
          relation_type: join
          is_temp: true
          transformations:
            - operation: JOIN
              condition: a.id = b.id
        - from_table: b
          from_field: id
          to_table: __result__
          to_field: ""
          relation_type: join
          is_temp: true
          transformations:
            - operation: JOIN
              condition: a.id = b.id
    - name: unqualified column disambiguated inside a CTE
      sql: WITH c AS (SELECT z FROM a JOIN b ON a.id = b.id) SELECT z FROM c
      catalog:
        tables:
            a:
                - id
                - x
            b:
                - id
                - y
                - z
      expected_edges:
        - from_table: b
          from_field: z
          to_table: __result__
          to_field: z
          relation_type: direct
          is_temp: true
        - from_table: a
          from_field: id
          to_table: __result__
          to_field: ""
          relation_type: join
          is_temp: true
          transformations:
            - operation: JOIN
              condition: a.id = b.id
        - from_table: b
          from_field: id
          to_table: __result__
          to_field: ""
          relation_type: join
          is_temp: true
          transformations:
            - operation: JOIN
              condition: a.id = b.id
    - name: unknown column is not attributed to an arbitrary relation
      sql: SELECT z FROM a JOIN b ON a.id = b.id
      catalog:
        tables:
            a:
                - id
                - x
            b:
                - id
                - y
      expected_edges:
        - from_table: a
          from_field: id
          to_table: __result__
          to_field: ""
          relation_type: join
          is_temp: true
          transformations:
            - operation: JOIN
              condition: a.id = b.id
        - from_table: b
          from_field: id
          to_table: __result__
          to_field: ""
          relation_type: join
          is_temp: true
          transformations:
            - operation: JOIN
              condition: a.id = b.id
    - name: aliased table star with catalog
      sql: SELECT e.*, d.* FROM employees e JOIN departments d ON e.department_id = d.id
      catalog:
        tables:
            employees:
                - id
                - name
                - department_id
            departments:
                - id
                - name
      expected_edges:
        - from_table: employees
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: direct
          is_temp: true
        - from_table: employees
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: direct
          is_temp: true
        - from_table: employees
          from_field: department_id
          to_table: __result__
          to_field: department_id
          relation_type: direct
          is_temp: true
        - from_table: departments
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: direct
          is_temp: true
        - from_table: departments
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: direct
          is_temp: true
        - from_table: employees
          from_field: department_id
          to_table: __result__
          to_field: ""
          relation_type: join
          is_temp: true
          transformations:
            - operation: JOIN
              condition: e.department_id = d.id
        - from_table: departments
          from_field: id
          to_table: __result__
          to_field: ""
          relation_type: join
          is_temp: true
          transformations:
            - operation: JOIN
              condition: e.department_id = d.id