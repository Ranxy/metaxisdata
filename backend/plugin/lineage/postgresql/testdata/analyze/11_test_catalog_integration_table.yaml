name: TestCatalogIntegration_Table
cases:
    - name: SELECT * with catalog
      sql: SELECT * FROM users
      catalog:
        tables:
            users:
                - id
                - name
                - email
      expected_edges:
        - from_table: users
          from_field: id
          to_table: __result__
          to_field: id
        - from_table: users
          from_field: name
          to_table: __result__
          to_field: name
        - from_table: users
          from_field: email
          to_table: __result__
          to_field: email
    - name: table.* with catalog
      sql: SELECT users.*, orders.total FROM users JOIN orders ON users.id = orders.user_id
      catalog:
        tables:
            orders:
                - order_id
                - user_id
                - total
            users:
                - id
                - name
      expected_edges:
        - from_table: users
          from_field: '*'
          to_table: __result__
          to_field: '*'
        - from_table: orders
          from_field: total
          to_table: __result__
          to_field: total
    - name: SELECT * in subquery with catalog
      sql: SELECT * FROM (SELECT * FROM users WHERE status = 'active') AS active_users
      catalog:
        tables:
            users:
                - id
                - name
                - email
                - status
      expected_edges:
        - from_table: users
          from_field: id
          to_table: __result__
          to_field: id
        - from_table: users
          from_field: name
          to_table: __result__
          to_field: name
        - from_table: users
          from_field: email
          to_table: __result__
          to_field: email
        - from_table: users
          from_field: status
          to_table: __result__
          to_field: status
    - name: SELECT * in CTE with catalog
      sql: |-
        WITH active_users AS (SELECT * FROM users WHERE status = 'active')
        			      SELECT * FROM active_users
      catalog:
        tables:
            users:
                - id
                - name
                - email
                - status
      expected_edges:
        - from_table: users
          from_field: id
          to_table: __result__
          to_field: id
        - from_table: users
          from_field: name
          to_table: __result__
          to_field: name
        - from_table: users
          from_field: email
          to_table: __result__
          to_field: email
        - from_table: users
          from_field: status
          to_table: __result__
          to_field: status
    # The scope resolver disambiguates an unqualified column from catalog
    # metadata in every scope, including a CTE body.
    - name: unqualified column disambiguated by catalog
      sql: SELECT z FROM a JOIN b ON a.id = b.id
      catalog:
        tables:
            a:
                - id
                - x
            b:
                - id
                - y
                - z
      expected_edges:
        - from_table: b
          from_field: z
          to_table: __result__
          to_field: z
    - name: unqualified column disambiguated inside a CTE
      sql: WITH c AS (SELECT z FROM a JOIN b ON a.id = b.id) SELECT z FROM c
      catalog:
        tables:
            a:
                - id
                - x
            b:
                - id
                - y
                - z
      expected_edges:
        - from_table: b
          from_field: z
          to_table: __result__
          to_field: z
    - name: unknown column is not attributed to an arbitrary relation
      sql: SELECT z FROM a JOIN b ON a.id = b.id
      catalog:
        tables:
            a:
                - id
                - x
            b:
                - id
                - y
      expected_edges: []
