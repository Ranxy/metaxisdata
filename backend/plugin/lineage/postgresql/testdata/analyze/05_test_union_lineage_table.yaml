name: TestUnionLineage_Table
cases:
    - name: simple UNION
      sql: "SELECT id, name FROM employees \n\t\t\t      UNION \n\t\t\t      SELECT id, name FROM contractors"
      expected_edges:
        - from_table: employees
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: union
          is_temp: true
          transformations:
            - operation: UNION
        - from_table: contractors
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: union
          is_temp: true
          transformations:
            - operation: UNION
        - from_table: employees
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: union
          is_temp: true
          transformations:
            - operation: UNION
        - from_table: contractors
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: union
          is_temp: true
          transformations:
            - operation: UNION
    - name: UNION ALL
      sql: "SELECT user_id, amount FROM sales \n\t\t\t      UNION ALL \n\t\t\t      SELECT user_id, amount FROM refunds"
      expected_edges:
        - from_table: sales
          from_field: user_id
          to_table: __result__
          to_field: user_id
          relation_type: union
          is_temp: true
          transformations:
            - operation: UNION
        - from_table: refunds
          from_field: user_id
          to_table: __result__
          to_field: user_id
          relation_type: union
          is_temp: true
          transformations:
            - operation: UNION
        - from_table: sales
          from_field: amount
          to_table: __result__
          to_field: amount
          relation_type: union
          is_temp: true
          transformations:
            - operation: UNION
        - from_table: refunds
          from_field: amount
          to_table: __result__
          to_field: amount
          relation_type: union
          is_temp: true
          transformations:
            - operation: UNION
    - name: multiple UNION
      sql: "SELECT id, name FROM employees \n\t\t\t      UNION \n\t\t\t      SELECT id, name FROM contractors\n\t\t\t      UNION\n\t\t\t      SELECT id, name FROM vendors"
      expected_edges:
        - from_table: employees
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: union
          is_temp: true
          transformations:
            - operation: UNION
        - from_table: contractors
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: union
          is_temp: true
          transformations:
            - operation: UNION
        - from_table: vendors
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: union
          is_temp: true
          transformations:
            - operation: UNION
        - from_table: employees
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: union
          is_temp: true
          transformations:
            - operation: UNION
        - from_table: contractors
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: union
          is_temp: true
          transformations:
            - operation: UNION
        - from_table: vendors
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: union
          is_temp: true
          transformations:
            - operation: UNION
    - name: INTERSECT operation
      sql: "SELECT id FROM users \n\t\t\t      INTERSECT \n\t\t\t      SELECT user_id AS id FROM orders"
      expected_edges:
        - from_table: users
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: intersect
          is_temp: true
          transformations:
            - operation: INTERSECT
        - from_table: orders
          from_field: user_id
          to_table: __result__
          to_field: id
          relation_type: intersect
          is_temp: true
          transformations:
            - operation: INTERSECT
    - name: EXCEPT operation
      sql: "SELECT id FROM users \n\t\t\t      EXCEPT \n\t\t\t      SELECT user_id AS id FROM blocked_users"
      expected_edges:
        - from_table: users
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: except
          is_temp: true
          transformations:
            - operation: EXCEPT
        - from_table: blocked_users
          from_field: user_id
          to_table: __result__
          to_field: id
          relation_type: except
          is_temp: true
          transformations:
            - operation: EXCEPT
    # UNION ALL keeps duplicate rows where UNION removes them, and PG's INTERSECT
    # ALL / EXCEPT ALL have the same pair. The flag is part of the transformation,
    # so the two spellings are different lineage metadata rather than the same one
    # written twice.
    - name: UNION ALL keeps duplicate rows
      sql: SELECT a FROM t1 UNION ALL SELECT a FROM t2
      expected_edges:
        - from_table: t1
          from_field: a
          to_table: __result__
          to_field: a
          relation_type: union
          is_temp: true
          transformations:
            - operation: UNION
              all: true
        - from_table: t2
          from_field: a
          to_table: __result__
          to_field: a
          relation_type: union
          is_temp: true
          transformations:
            - operation: UNION
              all: true
    - name: UNION removes duplicate rows
      sql: SELECT a FROM t1 UNION SELECT a FROM t2
      expected_edges:
        - from_table: t1
          from_field: a
          to_table: __result__
          to_field: a
          relation_type: union
          is_temp: true
          transformations:
            - operation: UNION
              all: false
        - from_table: t2
          from_field: a
          to_table: __result__
          to_field: a
          relation_type: union
          is_temp: true
          transformations:
            - operation: UNION
              all: false
    - name: each operation in a chain carries its own ALL flag
      sql: SELECT a FROM t1 UNION ALL SELECT b FROM t2 INTERSECT ALL SELECT c FROM t3
      expected_edges:
        - from_table: t1
          from_field: a
          to_table: __result__
          to_field: a
          relation_type: union
          is_temp: true
          transformations:
            - operation: UNION
              all: true
        - from_table: t2
          from_field: b
          to_table: __result__
          to_field: a
          relation_type: union
          is_temp: true
          transformations:
            - operation: UNION
              all: true
            - operation: INTERSECT
              all: true
        - from_table: t3
          from_field: c
          to_table: __result__
          to_field: a
          relation_type: union
          is_temp: true
          transformations:
            - operation: UNION
              all: true
            - operation: INTERSECT
              all: true
    - name: EXCEPT ALL keeps duplicate rows
      sql: SELECT a FROM t1 EXCEPT ALL SELECT a FROM t2
      expected_edges:
        - from_table: t1
          from_field: a
          to_table: __result__
          to_field: a
          relation_type: except
          is_temp: true
          transformations:
            - operation: EXCEPT
              all: true
        - from_table: t2
          from_field: a
          to_table: __result__
          to_field: a
          relation_type: except
          is_temp: true
          transformations:
            - operation: EXCEPT
              all: true
