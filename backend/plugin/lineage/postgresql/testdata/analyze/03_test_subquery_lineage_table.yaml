name: TestSubqueryLineage_Table
cases:
    - name: subquery in FROM clause
      sql: |-
        SELECT sub.id, sub.total_orders
        			      FROM (SELECT user_id AS id, COUNT(*) AS total_orders FROM orders GROUP BY user_id) AS sub
      expected_edges:
        - from_table: orders
          from_field: user_id
          to_table: __result__
          to_field: id
        - from_table: orders
          from_field: '*'
          to_table: __result__
          to_field: total_orders
          has_transform: true
    - name: nested subquery filters intermediate lineage
      sql: |-
        SELECT foo.user_id, foo.total_amount
        			      FROM (
        			          SELECT user_id, total_amount
        			          FROM (
        			              SELECT user_id, SUM(amount) AS total_amount
        			              FROM orders
        			              GROUP BY user_id
        			          ) sub
        			      ) foo
        			      JOIN (
        			          SELECT user_id, COUNT(*) AS order_count
        			          FROM user_orders
        			          GROUP BY user_id
        			      ) bar
        			      ON foo.user_id = bar.user_id
      expected_edges:
        - from_table: orders
          from_field: user_id
          to_table: __result__
          to_field: user_id
        - from_table: orders
          from_field: amount
          to_table: __result__
          to_field: total_amount
    # The subquery is analyzed in its own scope: its output depends on the rows
    # of orders, not on the enclosing query's columns.
    - name: correlated subquery in SELECT
      sql: "SELECT u.id, u.name, \n\t\t\t          (SELECT COUNT(*) FROM orders o WHERE o.user_id = u.id) AS order_count\n\t\t\t      FROM users u"
      expected_edges:
        - from_table: users
          from_field: id
          to_table: __result__
          to_field: id
        - from_table: users
          from_field: name
          to_table: __result__
          to_field: name
        - from_table: orders
          from_field: '*'
          to_table: __result__
          to_field: order_count
          relation_type: indirect
          has_transform: true
          is_temp: true
    - name: subquery in WHERE EXISTS
      sql: |-
        SELECT u.id, u.name
        			      FROM users u
        			      WHERE EXISTS (SELECT 1 FROM orders o WHERE o.user_id = u.id)
      expected_edges:
        - from_table: users
          from_field: id
          to_table: __result__
          to_field: id
        - from_table: users
          from_field: name
          to_table: __result__
          to_field: name

    # A derived table's alias list renames the body's output positionally, so the
    # reference and the lineage both name the column the derived table exposes.
    - name: derived table with a column alias list
      sql: SELECT user_name FROM (SELECT name FROM users) AS d (user_name)
      expected_edges:
        - from_table: users
          from_field: name
          to_table: __result__
          to_field: user_name
          relation_type: direct
          is_temp: true

    - name: derived table column alias list referenced through the alias
      sql: SELECT d.user_name FROM (SELECT name FROM users) AS d (user_name)
      expected_edges:
        - from_table: users
          from_field: name
          to_table: __result__
          to_field: user_name
          relation_type: direct
          is_temp: true
