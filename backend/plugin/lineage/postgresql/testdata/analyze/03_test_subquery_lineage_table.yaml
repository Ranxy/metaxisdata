name: TestSubqueryLineage_Table
cases:
    - name: subquery in FROM clause
      sql: |-
        SELECT sub.id, sub.total_orders
        			      FROM (SELECT user_id AS id, COUNT(*) AS total_orders FROM orders GROUP BY user_id) AS sub
      expected_edges:
        - from_table: orders
          from_field: user_id
          to_table: __result__
          to_field: id
          relation_type: direct
          is_temp: true
        - from_table: orders
          from_field: '*'
          to_table: __result__
          to_field: total_orders
          relation_type: group
          has_transform: true
          is_temp: true
          transformations:
            - operation: AGGREGATE
              function_name: COUNT
              expression: COUNT(*)
              group_keys:
                - user_id
    - name: nested subquery filters intermediate lineage
      sql: |-
        SELECT foo.user_id, foo.total_amount
        			      FROM (
        			          SELECT user_id, total_amount
        			          FROM (
        			              SELECT user_id, SUM(amount) AS total_amount
        			              FROM orders
        			              GROUP BY user_id
        			          ) sub
        			      ) foo
        			      JOIN (
        			          SELECT user_id, COUNT(*) AS order_count
        			          FROM user_orders
        			          GROUP BY user_id
        			      ) bar
        			      ON foo.user_id = bar.user_id
      expected_edges:
        - from_table: orders
          from_field: user_id
          to_table: __result__
          to_field: user_id
          relation_type: direct
          is_temp: true
        - from_table: orders
          from_field: amount
          to_table: __result__
          to_field: total_amount
          relation_type: group
          is_temp: true
          transformations:
            - operation: AGGREGATE
              function_name: SUM
              expression: SUM(amount)
              group_keys:
                - user_id
        - from_table: orders
          from_field: user_id
          to_table: __result__
          to_field: ""
          relation_type: join
          is_temp: true
          transformations:
            - operation: JOIN
              condition: foo.user_id = bar.user_id
        - from_table: user_orders
          from_field: user_id
          to_table: __result__
          to_field: ""
          relation_type: join
          is_temp: true
          transformations:
            - operation: JOIN
              condition: foo.user_id = bar.user_id
    - name: correlated subquery in SELECT
      sql: "SELECT u.id, u.name, \n\t\t\t          (SELECT COUNT(*) FROM orders o WHERE o.user_id = u.id) AS order_count\n\t\t\t      FROM users u"
      expected_edges:
        - from_table: users
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: direct
          is_temp: true
        - from_table: users
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: direct
          is_temp: true
        - from_table: orders
          from_field: '*'
          to_table: __result__
          to_field: order_count
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: PROJECT
              expression: (SELECT COUNT(*) FROM orders o WHERE o.user_id = u.id)
        - from_table: orders
          from_field: user_id
          to_table: __result__
          to_field: ""
          relation_type: indirect
          is_temp: true
          transformations:
            - operation: FILTER
              condition: o.user_id = u.id
        - from_table: users
          from_field: id
          to_table: __result__
          to_field: ""
          relation_type: indirect
          is_temp: true
          transformations:
            - operation: FILTER
              condition: o.user_id = u.id
    - name: subquery in WHERE EXISTS
      sql: |-
        SELECT u.id, u.name
        			      FROM users u
        			      WHERE EXISTS (SELECT 1 FROM orders o WHERE o.user_id = u.id)
      expected_edges:
        - from_table: users
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: direct
          is_temp: true
        - from_table: users
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: direct
          is_temp: true
        - from_table: orders
          from_field: user_id
          to_table: __result__
          to_field: ""
          relation_type: indirect
          is_temp: true
          transformations:
            - operation: FILTER
              condition: o.user_id = u.id
        - from_table: users
          from_field: id
          to_table: __result__
          to_field: ""
          relation_type: indirect
          is_temp: true
          transformations:
            - operation: FILTER
              condition: o.user_id = u.id
    - name: derived table with a column alias list
      sql: SELECT user_name FROM (SELECT name FROM users) AS d (user_name)
      expected_edges:
        - from_table: users
          from_field: name
          to_table: __result__
          to_field: user_name
          relation_type: direct
          is_temp: true
    - name: derived table column alias list referenced through the alias
      sql: SELECT d.user_name FROM (SELECT name FROM users) AS d (user_name)
      expected_edges:
        - from_table: users
          from_field: name
          to_table: __result__
          to_field: user_name
          relation_type: direct
          is_temp: true