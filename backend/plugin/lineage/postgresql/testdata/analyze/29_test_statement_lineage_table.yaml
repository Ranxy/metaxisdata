name: TestStatementLineage_Table
cases:
    # MERGE carries column lineage this analyzer does not model, and a parseable
    # statement must never produce an empty result silently. It is reported as a
    # gap, which keeps it visible without discarding the edges the statements
    # around it produced.
    #
    # A multi-statement script is not analyzed here: the analyzer is defined for
    # exactly one statement and the root package splits the script, so the contract
    # is pinned by TestScriptStatementsStayIndependent in the lineage package.
    - name: merge is reported as not modelled
      sql: MERGE INTO t USING s ON t.id = s.id WHEN MATCHED THEN UPDATE SET a = s.a
      expect_error: true
      error_contains: "not modelled: MERGE"
      expected_edges: []
