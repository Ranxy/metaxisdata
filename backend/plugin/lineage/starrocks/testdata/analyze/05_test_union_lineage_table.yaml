name: TestUnionLineage_Table
cases:
    - name: simple UNION
      sql: SELECT id, name FROM employees UNION SELECT id, name FROM contractors
      expected_edges:
        - from_table: employees
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: union
          is_temp: true
          transformations:
            - operation: UNION
        - from_table: employees
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: union
          is_temp: true
        - from_table: contractors
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: union
          is_temp: true
        - from_table: contractors
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: union
          is_temp: true
    # The output columns of a set operation are named by its first arm, so the
    # second arm's differently named column maps onto uid too.
    - name: UNION ALL with differing aliases
      sql: SELECT user_id AS uid, amount FROM sales UNION ALL SELECT user_id, amount FROM refunds
      expected_edges:
        - from_table: sales
          from_field: user_id
          to_table: __result__
          to_field: uid
          relation_type: union
          is_temp: true
          transformations:
            - operation: UNION
        - from_table: sales
          from_field: amount
          to_table: __result__
          to_field: amount
          relation_type: union
          is_temp: true
        - from_table: refunds
          from_field: user_id
          to_table: __result__
          to_field: uid
          relation_type: union
          is_temp: true
        - from_table: refunds
          from_field: amount
          to_table: __result__
          to_field: amount
          relation_type: union
          is_temp: true
    - name: three-way UNION
      sql: SELECT id, name FROM employees UNION SELECT id, name FROM contractors UNION SELECT id, name FROM vendors
      expected_edges:
        - from_table: employees
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: union
          is_temp: true
          transformations:
            - operation: UNION
        - from_table: employees
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: union
          is_temp: true
        - from_table: contractors
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: union
          is_temp: true
        - from_table: contractors
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: union
          is_temp: true
        - from_table: vendors
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: union
          is_temp: true
        - from_table: vendors
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: union
          is_temp: true
    - name: parenthesized arms
      sql: (SELECT id FROM t1) UNION ALL (SELECT id FROM t2)
      expected_edges:
        - from_table: t1
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: union
          is_temp: true
          transformations:
            - operation: UNION
        - from_table: t2
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: union
          is_temp: true
    - name: UNION with a CTE arm
      sql: WITH recent AS (SELECT id, amount FROM orders) SELECT id, amount FROM recent UNION ALL SELECT id, amount FROM archive
      expected_edges:
        - from_table: orders
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: union
          is_temp: true
          transformations:
            - operation: UNION
        - from_table: orders
          from_field: amount
          to_table: __result__
          to_field: amount
          relation_type: union
          is_temp: true
        - from_table: archive
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: union
          is_temp: true
        - from_table: archive
          from_field: amount
          to_table: __result__
          to_field: amount
          relation_type: union
          is_temp: true
    - name: INTERSECT keeps every arm
      sql: SELECT id FROM a INTERSECT SELECT id FROM b
      expected_edges:
        - from_table: a
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: intersect
          is_temp: true
          transformations:
            - operation: INTERSECT
        - from_table: b
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: intersect
          is_temp: true
    - name: EXCEPT keeps every arm
      sql: SELECT id FROM a EXCEPT SELECT id FROM b
      expected_edges:
        - from_table: a
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: except
          is_temp: true
          transformations:
            - operation: EXCEPT
        - from_table: b
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: except
          is_temp: true
