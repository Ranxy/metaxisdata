name: TestSelectLineage_Table
cases:
    - name: simple select with qualified columns
      sql: SELECT users.id, users.name FROM users
      expected_edges:
        - from_table: users
          from_field: id
          to_table: __result__
          to_field: id
          is_temp: true
        - from_table: users
          from_field: name
          to_table: __result__
          to_field: name
    - name: select with column aliases
      sql: SELECT users.id AS user_id, users.name AS user_name FROM users
      expected_edges:
        - from_table: users
          from_field: id
          to_table: __result__
          to_field: user_id
        - from_table: users
          from_field: name
          to_table: __result__
          to_field: user_name
    - name: select with function expression
      sql: SELECT id, CONCAT(first_name, ' ', last_name) AS full_name FROM users
      expected_edges:
        - from_table: users
          from_field: id
          to_table: __result__
          to_field: id
          has_transform: false
        - from_table: users
          from_field: first_name
          to_table: __result__
          to_field: full_name
          has_transform: true
        - from_table: users
          from_field: last_name
          to_table: __result__
          to_field: full_name
          has_transform: true
    - name: select with aggregate expression
      sql: SELECT tag, COUNT(*) AS cnt FROM users GROUP BY tag
      expected_edges:
        - from_table: users
          from_field: tag
          to_table: __result__
          to_field: tag
        - from_table: users
          from_field: '*'
          to_table: __result__
          to_field: cnt
          has_transform: true
    - name: select with window function
      sql: SELECT id, ROW_NUMBER() OVER (PARTITION BY tag ORDER BY id) AS rn FROM users
      expected_edges:
        - from_table: users
          from_field: id
          to_table: __result__
          to_field: rn
          has_transform: true
        - from_table: users
          from_field: tag
          to_table: __result__
          to_field: rn
          has_transform: true
    - name: select with WHERE clause
      sql: SELECT id, name FROM users WHERE age > 30
      expected_edges:
        - from_table: users
          from_field: id
          to_table: __result__
          to_field: id
        - from_table: users
          from_field: name
          to_table: __result__
          to_field: name
    - name: select star without catalog
      sql: SELECT * FROM users
      expected_edges:
        - from_table: users
          from_field: '*'
          to_table: __result__
    - name: select star with catalog expansion
      sql: SELECT * FROM users
      catalog:
        tables:
          users: [id, name, email]
      expected_edges:
        - from_table: users
          from_field: id
          to_table: __result__
          to_field: id
        - from_table: users
          from_field: name
          to_table: __result__
          to_field: name
        - from_table: users
          from_field: email
          to_table: __result__
          to_field: email
    - name: select star except with catalog expansion
      sql: SELECT * EXCEPT (email) FROM users
      catalog:
        tables:
          users: [id, name, email]
      expected_edges:
        - from_table: users
          from_field: id
          to_table: __result__
          to_field: id
        - from_table: users
          from_field: name
          to_table: __result__
          to_field: name
    - name: select with database-qualified table
      sql: SELECT mydb.users.id, mydb.users.name FROM mydb.users
      expected_edges:
        - from_database: mydb
          from_table: users
          from_field: id
          to_table: __result__
          to_field: id
        - from_database: mydb
          from_table: users
          from_field: name
          to_table: __result__
          to_field: name
    - name: select table wildcard
      sql: SELECT users.* FROM users
      expected_edges:
        - from_table: users
          from_field: '*'
          to_table: __result__
    - name: select with join
      sql: SELECT a.id AS aid, b.name AS bname FROM t1 a JOIN t2 b ON a.id = b.id
      expected_edges:
        - from_table: t1
          from_field: id
          to_table: __result__
          to_field: aid
        - from_table: t2
          from_field: name
          to_table: __result__
          to_field: bname
