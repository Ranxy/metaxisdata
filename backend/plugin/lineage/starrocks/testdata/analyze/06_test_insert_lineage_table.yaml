name: TestInsertLineage_Table
cases:
    - name: INSERT SELECT
      sql: INSERT INTO t2 SELECT id, name FROM users
      expected_edges:
        - from_table: users
          from_field: id
          to_table: t2
          to_field: id
          relation_type: direct
          has_transform: false
          is_temp: false
        - from_table: users
          from_field: name
          to_table: t2
          to_field: name
          relation_type: direct
          is_temp: false
    - name: INSERT SELECT with an explicit column list
      sql: INSERT INTO t2 (a, b) SELECT id, name FROM users
      expected_edges:
        - from_table: users
          from_field: id
          to_table: t2
          to_field: a
          relation_type: direct
          is_temp: false
        - from_table: users
          from_field: name
          to_table: t2
          to_field: b
          relation_type: direct
          is_temp: false
    - name: INSERT OVERWRITE
      sql: INSERT OVERWRITE t2 SELECT id, name FROM users
      expected_edges:
        - from_table: users
          from_field: id
          to_table: t2
          to_field: id
          relation_type: direct
          is_temp: false
        - from_table: users
          from_field: name
          to_table: t2
          to_field: name
          relation_type: direct
          is_temp: false
    - name: INSERT BY NAME
      sql: INSERT INTO t2 BY NAME SELECT id, name FROM users
      expected_edges:
        - from_table: users
          from_field: id
          to_table: t2
          to_field: id
          relation_type: direct
          is_temp: false
        - from_table: users
          from_field: name
          to_table: t2
          to_field: name
          relation_type: direct
          is_temp: false
    - name: INSERT SELECT with an aggregate
      sql: INSERT INTO t2 SELECT user_id, COUNT(*) AS orders FROM sales GROUP BY user_id
      expected_edges:
        - from_table: sales
          from_field: user_id
          to_table: t2
          to_field: user_id
          relation_type: direct
          is_temp: false
        - from_table: sales
          from_field: '*'
          to_table: t2
          to_field: orders
          relation_type: group
          has_transform: true
          is_temp: false
    - name: INSERT SELECT with a star
      sql: INSERT INTO t2 SELECT * FROM users u
      expected_edges:
        - from_table: users
          from_field: '*'
          to_table: t2
          relation_type: direct
          is_temp: false
    - name: INSERT SELECT with a CTE
      sql: INSERT INTO t2 WITH c AS (SELECT id, name FROM users) SELECT c.id, c.name FROM c
      expected_edges:
        - from_table: users
          from_field: id
          to_table: t2
          to_field: id
          relation_type: direct
          is_temp: false
        - from_table: users
          from_field: name
          to_table: t2
          to_field: name
          relation_type: direct
          is_temp: false
    - name: INSERT SELECT with a set operation
      sql: INSERT INTO t2 SELECT id FROM t1 UNION ALL SELECT id FROM t3
      expected_edges:
        - from_table: t1
          from_field: id
          to_table: t2
          to_field: id
          relation_type: direct
          is_temp: false
        - from_table: t3
          from_field: id
          to_table: t2
          to_field: id
          relation_type: direct
          is_temp: false
