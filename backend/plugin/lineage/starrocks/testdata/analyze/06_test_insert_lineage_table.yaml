name: TestInsertLineage_Table
cases:
    - name: INSERT SELECT
      sql: INSERT INTO t2 SELECT id, name FROM users
      expected_edges:
        - from_table: users
          from_field: id
          to_table: t2
          to_field: id
          relation_type: direct
          has_transform: false
          is_temp: false
        - from_table: users
          from_field: name
          to_table: t2
          to_field: name
          relation_type: direct
          is_temp: false
    - name: INSERT SELECT with an explicit column list
      sql: INSERT INTO t2 (a, b) SELECT id, name FROM users
      expected_edges:
        - from_table: users
          from_field: id
          to_table: t2
          to_field: a
          relation_type: direct
          is_temp: false
        - from_table: users
          from_field: name
          to_table: t2
          to_field: b
          relation_type: direct
          is_temp: false
    - name: INSERT OVERWRITE
      sql: INSERT OVERWRITE t2 SELECT id, name FROM users
      expected_edges:
        - from_table: users
          from_field: id
          to_table: t2
          to_field: id
          relation_type: direct
          is_temp: false
        - from_table: users
          from_field: name
          to_table: t2
          to_field: name
          relation_type: direct
          is_temp: false
    - name: INSERT BY NAME
      sql: INSERT INTO t2 BY NAME SELECT id, name FROM users
      expected_edges:
        - from_table: users
          from_field: id
          to_table: t2
          to_field: id
          relation_type: direct
          is_temp: false
        - from_table: users
          from_field: name
          to_table: t2
          to_field: name
          relation_type: direct
          is_temp: false
    - name: INSERT SELECT with an aggregate
      sql: INSERT INTO t2 SELECT user_id, COUNT(*) AS orders FROM sales GROUP BY user_id
      expected_edges:
        - from_table: sales
          from_field: user_id
          to_table: t2
          to_field: user_id
          relation_type: direct
          is_temp: false
        - from_table: sales
          from_field: '*'
          to_table: t2
          to_field: orders
          relation_type: group
          has_transform: true
          is_temp: false
          transformations:
            - operation: AGGREGATE
              function_name: COUNT
              expression: COUNT(*)
              group_keys:
                - user_id
    - name: INSERT SELECT with a star
      sql: INSERT INTO t2 SELECT * FROM users u
      expected_edges:
        - from_table: users
          from_field: '*'
          to_table: t2
          to_field: '*'
          relation_type: direct
          is_temp: false
    - name: INSERT SELECT with a CTE
      sql: INSERT INTO t2 WITH c AS (SELECT id, name FROM users) SELECT c.id, c.name FROM c
      expected_edges:
        - from_table: users
          from_field: id
          to_table: t2
          to_field: id
          relation_type: direct
          is_temp: false
        - from_table: users
          from_field: name
          to_table: t2
          to_field: name
          relation_type: direct
          is_temp: false
    - name: INSERT SELECT with a set operation
      sql: INSERT INTO t2 SELECT id FROM t1 UNION ALL SELECT id FROM t3
      expected_edges:
        - from_table: t1
          from_field: id
          to_table: t2
          to_field: id
          relation_type: union
          is_temp: false
          transformations:
            - operation: UNION
        - from_table: t3
          from_field: id
          to_table: t2
          to_field: id
          relation_type: union
          is_temp: false
          transformations:
            - operation: UNION

    # A VALUES row can hold a subquery, and what it selects is a source of the
    # column it is written into. The clause read only literal rows, so the
    # statement wrote the value and reported no lineage at all. Rows merge column
    # by column, so a literal row beside the subquery takes nothing away.
    - name: an insert values row reads a subquery
      sql: INSERT INTO t (a) VALUES ((SELECT MAX(x) FROM other))
      expected_edges:
        - from_table: other
          from_field: x
          to_table: t
          to_field: a
          relation_type: indirect
          is_temp: false
          transformations:
            - operation: PROJECT
    - name: an insert values list merges its rows column by column
      sql: INSERT INTO t (a, b) VALUES (1, 2), (3, (SELECT MAX(x) FROM other))
      expected_edges:
        - from_table: other
          from_field: x
          to_table: t
          to_field: b
          relation_type: indirect
          is_temp: false
          transformations:
            - operation: PROJECT
    - name: an insert values list of literals records nothing
      sql: INSERT INTO t (a, b) VALUES (1, 2)
      expected_edges: []
