name: TestUnqualifiedResolution_Table
cases:
    # StarRocks shares the scope resolver, so both decisions apply here: every
    # relation the catalog confirms owns an unqualified name is a source of it,
    # and a scope whose known relations all lack the name lets the search
    # continue in the enclosing scope.
    #
    # StarRocks reports no row-set influences either, so the projection path is
    # where the effect shows: a coalesced USING / NATURAL JOIN column names both
    # sides, and a correlated subquery's select item reaches the enclosing
    # table's column.
    - name: every relation that owns the column is reported
      sql: SELECT id FROM a JOIN b ON a.id = b.id
      catalog:
        tables:
            a:
                - id
                - x
            b:
                - id
                - y
      expected_edges:
        - from_table: a
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: direct
          is_temp: true
        - from_table: b
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: direct
          is_temp: true

    - name: without metadata the scope keeps one relation by name
      sql: SELECT id FROM a JOIN b ON a.id = b.id
      expected_edges:
        - from_table: a
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: direct
          is_temp: true

    - name: same-named relations in two databases each contribute the column
      sql: SELECT id FROM db1.t JOIN db2.t ON db1.t.id = db2.t.id
      catalog:
        databases:
            db1:
                t:
                    - id
                    - x
            db2:
                t:
                    - id
                    - y
      expected_edges:
        - from_database: db1
          from_table: t
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: direct
          is_temp: true
        - from_database: db2
          from_table: t
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: direct
          is_temp: true

    - name: a coalesced USING column comes from both sides
      sql: SELECT dept_id FROM employees e JOIN departments d USING (dept_id)
      catalog:
        tables:
            departments:
                - dept_id
                - dname
            employees:
                - name
                - dept_id
      expected_edges:
        - from_table: departments
          from_field: dept_id
          to_table: __result__
          to_field: dept_id
          relation_type: direct
          is_temp: true
        - from_table: employees
          from_field: dept_id
          to_table: __result__
          to_field: dept_id
          relation_type: direct
          is_temp: true

    - name: a coalesced NATURAL JOIN column comes from both sides
      sql: SELECT id FROM a NATURAL JOIN b
      catalog:
        tables:
            a:
                - id
                - x
            b:
                - id
                - y
      expected_edges:
        - from_table: a
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: direct
          is_temp: true
        - from_table: b
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: direct
          is_temp: true

    - name: a CTE body keeps both owners of a coalesced column
      sql: WITH c AS (SELECT dept_id FROM employees e JOIN departments d USING (dept_id)) SELECT dept_id FROM c
      catalog:
        tables:
            departments:
                - dept_id
                - dname
            employees:
                - name
                - dept_id
      expected_edges:
        - from_table: departments
          from_field: dept_id
          to_table: __result__
          to_field: dept_id
          relation_type: direct
          is_temp: true
        - from_table: employees
          from_field: dept_id
          to_table: __result__
          to_field: dept_id
          relation_type: direct
          is_temp: true

    # The enclosing scope provides the name, so the subquery's own relation does
    # not: before the search walked outward this was attributed to `customers`.
    - name: a correlated subquery select item resolves in the enclosing scope
      sql: SELECT (SELECT amount FROM customers c) AS owner FROM orders o
      catalog:
        tables:
            customers:
                - id
                - name
            orders:
                - id
                - amount
      expected_edges:
        - from_table: orders
          from_field: amount
          to_table: __result__
          to_field: owner
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: PROJECT

    - name: without metadata the inner relation keeps the reference
      sql: SELECT (SELECT amount FROM customers c) AS owner FROM orders o
      expected_edges:
        - from_table: customers
          from_field: amount
          to_table: __result__
          to_field: owner
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: PROJECT

    - name: the outward reference reaches a real target too
      sql: CREATE VIEW v AS SELECT (SELECT amount FROM customers c) AS owner FROM orders o
      catalog:
        tables:
            customers:
                - id
                - name
            orders:
                - id
                - amount
      expected_edges:
        - from_table: orders
          from_field: amount
          to_table: v
          to_field: owner
          relation_type: indirect
          has_transform: true
          is_temp: false
          transformations:
            - operation: PROJECT

    # A relation whose columns are unknown cannot be ruled out either, so it
    # answers for a name no described relation owns. A derived table is described
    # as soon as the analyzer could name all of its columns, which needs no
    # catalog: its own output list is enough. An unexpanded wildcard leaves it
    # undescribed, which keeps the fallback rather than ruling it out.
    - name: a relation with no snapshot answers for the name
      sql: SELECT x FROM a JOIN u ON a.id = u.id
      catalog:
        tables:
            a:
                - id
      expected_edges:
        - from_table: u
          from_field: x
          to_table: __result__
          to_field: x
          relation_type: direct
          is_temp: true

    - name: a derived table answers through its own lineage
      sql: SELECT x FROM a JOIN (SELECT id, x FROM b) d ON a.id = d.id
      catalog:
        tables:
            a:
                - id
      expected_edges:
        - from_table: b
          from_field: x
          to_table: __result__
          to_field: x
          relation_type: direct
          is_temp: true

    - name: a name a base table and a derived table both own is reported from both
      sql: SELECT id FROM a JOIN (SELECT id, x FROM b) d ON a.id = d.id
      catalog:
        tables:
            a:
                - id
      expected_edges:
        - from_table: a
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: direct
          is_temp: true
        - from_table: b
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: direct
          is_temp: true

    - name: a CTE is a described relation too
      sql: WITH d AS (SELECT id, x FROM b) SELECT id FROM a JOIN d ON a.id = d.id
      catalog:
        tables:
            a:
                - id
      expected_edges:
        - from_table: a
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: direct
          is_temp: true
        - from_table: b
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: direct
          is_temp: true

    - name: a correlated subquery select item reaches past a derived table
      sql: SELECT (SELECT amount FROM (SELECT id, y FROM b) d) AS owner FROM orders o
      expected_edges:
        - from_table: orders
          from_field: amount
          to_table: __result__
          to_field: owner
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: PROJECT

    - name: an expanded wildcard body describes the derived table
      sql: SELECT x FROM a JOIN (SELECT * FROM b) d ON a.id = d.id
      catalog:
        tables:
            a:
                - id
            b:
                - id
                - x
      expected_edges:
        - from_table: b
          from_field: x
          to_table: __result__
          to_field: x
          relation_type: direct
          is_temp: true

    - name: an unexpanded wildcard body leaves the derived table undescribed
      sql: SELECT x FROM a JOIN (SELECT * FROM b) d ON a.id = d.id
      catalog:
        tables:
            a:
                - id
      expected_edges: []
