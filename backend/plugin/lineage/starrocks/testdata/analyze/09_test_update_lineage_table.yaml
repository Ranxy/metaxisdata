name: TestUpdateLineage_Table
cases:
    - name: UPDATE with a literal
      sql: UPDATE t1 SET name = 'x' WHERE id = 1
      expected_edges:
        - from_table: t1
          from_field: '*'
          to_table: t1
          to_field: name
          relation_type: indirect
          has_transform: true
          is_temp: false
    - name: UPDATE from another column of the same table
      sql: UPDATE t1 SET name = t1.other WHERE id = 1
      expected_edges:
        - from_table: t1
          from_field: other
          to_table: t1
          to_field: name
          relation_type: indirect
          has_transform: true
          is_temp: false
    - name: UPDATE with an arithmetic expression
      sql: UPDATE t1 SET amount = amount + 1 WHERE id = 1
      expected_edges:
        - from_table: t1
          from_field: amount
          to_table: t1
          to_field: amount
          relation_type: indirect
          has_transform: true
          is_temp: false
    - name: UPDATE from a joined table
      sql: UPDATE t1 SET name = t2.tag FROM t2 WHERE t1.id = t2.id
      expected_edges:
        - from_table: t2
          from_field: tag
          to_table: t1
          to_field: name
          relation_type: indirect
          has_transform: true
          is_temp: false
