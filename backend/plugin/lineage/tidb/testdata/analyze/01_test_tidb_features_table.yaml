name: TestTiDBFeaturesLineage_Table
cases:
    - name: read from storage hint
      sql: SELECT /*+ READ_FROM_STORAGE(TIFLASH[e]) */ e.name FROM employees e
      expected_edges:
        - from_table: employees
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: direct
          is_temp: true
    - name: set var hint
      sql: SELECT /*+ SET_VAR(tidb_distsql_scan_concurrency=1) */ name FROM employees
      expected_edges:
        - from_table: employees
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: direct
          is_temp: true
    - name: hash join hint
      sql: SELECT /*+ HASH_JOIN(a, b) */ a.id, b.name AS n FROM a JOIN b ON a.id = b.id
      expected_edges:
        - from_table: a
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: direct
          is_temp: true
        - from_table: b
          from_field: name
          to_table: __result__
          to_field: "n"
          relation_type: direct
          is_temp: true
    - name: partition selection
      sql: SELECT name FROM employees PARTITION (p0, p1)
      expected_edges:
        - from_table: employees
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: direct
          is_temp: true
    - name: insert ignore select
      sql: INSERT IGNORE INTO dst (a) SELECT id FROM src
      expected_edges:
        - from_table: src
          from_field: id
          to_table: dst
          to_field: a
          relation_type: direct
          is_temp: false
    - name: replace select
      sql: REPLACE INTO dst (a, b) SELECT id, name FROM src
      expected_edges:
        - from_table: src
          from_field: id
          to_table: dst
          to_field: a
          relation_type: direct
          is_temp: false
        - from_table: src
          from_field: name
          to_table: dst
          to_field: b
          relation_type: direct
          is_temp: false
    - name: insert odku values
      sql: INSERT INTO dst (a, b) SELECT id, name FROM src ON DUPLICATE KEY UPDATE b = VALUES(b)
      expected_edges:
        - from_table: src
          from_field: b
          to_table: dst
          to_field: b
          relation_type: indirect
          has_transform: true
          is_temp: false
        - from_table: src
          from_field: id
          to_table: dst
          to_field: a
          relation_type: direct
          is_temp: false
        - from_table: src
          from_field: name
          to_table: dst
          to_field: b
          relation_type: direct
          is_temp: false
    - name: select for update
      sql: SELECT name FROM employees FOR UPDATE
      expected_edges:
        - from_table: employees
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: direct
          is_temp: true
    - name: select lock in share mode
      sql: SELECT name FROM employees LOCK IN SHARE MODE
      expected_edges:
        - from_table: employees
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: direct
          is_temp: true
    - name: insert select star
      sql: INSERT INTO dst SELECT * FROM src
      expected_edges:
        - from_table: src
          from_field: '*'
          to_table: dst
          to_field: '*'
          relation_type: direct
          is_temp: false
    - name: multi table delete
      sql: DELETE t1 FROM t1 JOIN t2 ON t1.id = t2.id WHERE t2.x = 1
      expected_edges:
        - from_table: t2
          from_field: x
          to_table: t1
          to_field: __deletion__
          relation_type: indirect
          has_transform: true
          is_temp: false
    - name: multi table update
      sql: UPDATE t1 JOIN t2 ON t1.id = t2.id SET t1.x = t2.y WHERE t2.z = 1
      expected_edges:
        - from_table: t2
          from_field: "y"
          to_table: t1
          to_field: x
          relation_type: indirect
          has_transform: true
          is_temp: false
    - name: intersect
      sql: SELECT id FROM a INTERSECT SELECT id FROM b
      expected_edges:
        - from_table: a
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: direct
          is_temp: true
        - from_table: b
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: direct
          is_temp: true
    - name: except
      sql: SELECT id FROM a EXCEPT SELECT id FROM b
      expected_edges:
        - from_table: a
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: direct
          is_temp: true
        - from_table: b
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: direct
          is_temp: true
    - name: create or replace view
      sql: CREATE OR REPLACE VIEW v AS SELECT id, name FROM employees
      expected_edges:
        - from_table: employees
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: direct
          is_temp: true
        - from_table: employees
          from_field: id
          to_table: v
          to_field: id
          relation_type: direct
          is_temp: false
        - from_table: employees
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: direct
          is_temp: true
        - from_table: employees
          from_field: name
          to_table: v
          to_field: name
          relation_type: direct
          is_temp: false
