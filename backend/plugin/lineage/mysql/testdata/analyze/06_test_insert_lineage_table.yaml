name: TestInsertLineage_Table
cases:
    - name: INSERT SELECT
      sql: INSERT INTO tmp_users SELECT id, name FROM users WHERE age > 30
      expected_edges:
        - from_table: users
          from_field: id
          to_table: tmp_users
          to_field: id
          is_temp: false
          relation_type: direct
        - from_table: users
          from_field: name
          to_table: tmp_users
          to_field: name
          is_temp: false
          relation_type: direct
        - from_table: users
          from_field: age
          to_table: tmp_users
          to_field: ""
          relation_type: indirect
          has_transform: true
          is_temp: false
          transformations:
            - operation: FILTER
    - name: INSERT SELECT with explicit columns
      sql: INSERT INTO tmp_users (user_id, user_name) SELECT id, name FROM users
      expected_edges:
        - from_table: users
          from_field: id
          to_table: tmp_users
          to_field: user_id
          relation_type: direct
          is_temp: false
        - from_table: users
          from_field: name
          to_table: tmp_users
          to_field: user_name
          relation_type: direct
          is_temp: false
    - name: INSERT SELECT with JOIN
      sql: "INSERT INTO summary \n\t\t\t      SELECT u.id, u.name, COUNT(o.id) AS order_count \n\t\t\t      FROM users u \n\t\t\t      JOIN orders o ON u.id = o.user_id \n\t\t\t      GROUP BY u.id, u.name"
      expected_edges:
        - from_table: users
          from_field: id
          to_table: summary
          to_field: id
          relation_type: direct
          is_temp: false
        - from_table: users
          from_field: name
          to_table: summary
          to_field: name
          relation_type: direct
          is_temp: false
        - from_table: orders
          from_field: id
          to_table: summary
          to_field: order_count
          has_transform: true
          relation_type: group
          is_temp: false
          transformations:
            - operation: AGGREGATE
              function_name: COUNT
              group_keys:
                - "u.id"
                - "u.name"
        - from_table: users
          from_field: id
          to_table: summary
          to_field: ""
          relation_type: join
          has_transform: true
          is_temp: false
          transformations:
            - operation: JOIN
        - from_table: orders
          from_field: user_id
          to_table: summary
          to_field: ""
          relation_type: join
          has_transform: true
          is_temp: false
          transformations:
            - operation: JOIN
    - name: INSERT SELECT with parenthesized join tree
      sql: INSERT INTO order_summary (`order_id`, `customer_name`, `total_amount`) SELECT `o`.`id`,`c`.`name`,sum(`oi`.`amount`) AS `total_amount` FROM (((`orders` `o` JOIN `customers` `c` ON((`o`.`customer_id` = `c`.`id`)))) LEFT JOIN `order_items` `oi` ON((`o`.`id` = `oi`.`order_id`))) GROUP BY `o`.`id`,`c`.`name`
      expected_edges:
        - from_table: orders
          from_field: id
          to_table: order_summary
          to_field: order_id
          is_temp: false
          relation_type: direct
        - from_table: customers
          from_field: name
          to_table: order_summary
          to_field: customer_name
          is_temp: false
          relation_type: direct
        - from_table: order_items
          from_field: amount
          to_table: order_summary
          to_field: total_amount
          has_transform: true
          is_temp: false
          relation_type: group
          transformations:
            - operation: AGGREGATE
              function_name: SUM
              group_keys:
                - "`o`.`id`"
                - "`c`.`name`"
        - from_table: orders
          from_field: customer_id
          to_table: order_summary
          to_field: ""
          relation_type: join
          has_transform: true
          is_temp: false
          transformations:
            - operation: JOIN
        - from_table: customers
          from_field: id
          to_table: order_summary
          to_field: ""
          relation_type: join
          has_transform: true
          is_temp: false
          transformations:
            - operation: JOIN
        - from_table: orders
          from_field: id
          to_table: order_summary
          to_field: ""
          relation_type: join
          has_transform: true
          is_temp: false
          transformations:
            - operation: JOIN
        - from_table: order_items
          from_field: order_id
          to_table: order_summary
          to_field: ""
          relation_type: join
          has_transform: true
          is_temp: false
          transformations:
            - operation: JOIN

    # A VALUES row can hold a subquery, and what it selects is a source of the
    # column it is written into. The clause read only literal rows, so the
    # statement wrote the value and reported no lineage at all. Rows merge column
    # by column, so a literal row beside the subquery takes nothing away.
    - name: an insert values row reads a subquery
      sql: INSERT INTO t (a) VALUES ((SELECT MAX(x) FROM other))
      expected_edges:
        - from_table: other
          from_field: x
          to_table: t
          to_field: a
          relation_type: indirect
          is_temp: false
          transformations:
            - operation: PROJECT
    - name: an insert values list merges its rows column by column
      sql: INSERT INTO t (a, b) VALUES (1, 2), (3, (SELECT MAX(x) FROM other))
      expected_edges:
        - from_table: other
          from_field: x
          to_table: t
          to_field: b
          relation_type: indirect
          is_temp: false
          transformations:
            - operation: PROJECT
    - name: an insert values list of literals records nothing
      sql: INSERT INTO t (a, b) VALUES (1, 2)
      expected_edges: []
