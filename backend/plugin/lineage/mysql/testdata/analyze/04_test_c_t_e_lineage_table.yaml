name: TestCTELineage_Table
cases:
    - name: simple CTE
      sql: |-
        WITH active_users AS (
        			          SELECT id, name FROM users WHERE status = 'active'
        			      )
        			      SELECT au.id, au.name FROM active_users au
      expected_edges:
        - from_table: users
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: direct
          is_temp: true
        - from_table: users
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: direct
          is_temp: true
        - from_table: users
          from_field: status
          to_table: __result__
          to_field: ""
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: FILTER
    - name: multiple CTEs
      sql: "WITH \n\t\t\t          active_users AS (\n\t\t\t              SELECT id, name FROM users WHERE status = 'active'\n\t\t\t          ),\n\t\t\t          user_orders AS (\n\t\t\t              SELECT user_id, COUNT(*) AS order_count FROM orders GROUP BY user_id\n\t\t\t          )\n\t\t\t      SELECT au.id, au.name, uo.order_count\n\t\t\t      FROM active_users au\n\t\t\t      LEFT JOIN user_orders uo ON au.id = uo.user_id"
      expected_edges:
        - from_table: users
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: direct
          is_temp: true
        - from_table: users
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: direct
          is_temp: true
        - from_table: orders
          from_field: '*'
          to_table: __result__
          to_field: order_count
          has_transform: true
          relation_type: group
          is_temp: true
          transformations:
            - operation: AGGREGATE
              function_name: COUNT
              group_keys:
                - "user_id"
        - from_table: users
          from_field: status
          to_table: __result__
          to_field: ""
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: FILTER
        - from_table: users
          from_field: id
          to_table: __result__
          to_field: ""
          relation_type: join
          has_transform: true
          is_temp: true
          transformations:
            - operation: JOIN
        - from_table: orders
          from_field: user_id
          to_table: __result__
          to_field: ""
          relation_type: join
          has_transform: true
          is_temp: true
          transformations:
            - operation: JOIN

    # A CTE column list renames the body's output positionally: the CTE exposes
    # `user_id`, so that is the name both the lineage and the scope resolver use.
    # Without the rename the CTE owns `id` instead and a reference to `user_id`
    # resolves to nothing.
    - name: CTE with an explicit column list
      sql: WITH user_summary (user_id, user_name) AS (SELECT id, name FROM users) SELECT user_id, user_name FROM user_summary
      expected_edges:
        - from_table: users
          from_field: id
          to_table: __result__
          to_field: user_id
          relation_type: direct
          is_temp: true
        - from_table: users
          from_field: name
          to_table: __result__
          to_field: user_name
          relation_type: direct
          is_temp: true

    - name: CTE with an explicit column list referenced through an alias
      sql: WITH user_summary (user_id, user_name) AS (SELECT id, name FROM users) SELECT us.user_id, us.user_name FROM user_summary us
      expected_edges:
        - from_table: users
          from_field: id
          to_table: __result__
          to_field: user_id
          relation_type: direct
          is_temp: true
        - from_table: users
          from_field: name
          to_table: __result__
          to_field: user_name
          relation_type: direct
          is_temp: true

    # A recursive CTE is analyzed like any other: the anchor arm's columns are the
    # sources, and the self-reference in the recursive arm is query-local, so it
    # contributes nothing of its own. Verified on MySQL 8.3 that the statement is
    # legal.
    - name: recursive CTE keeps the anchor arm's sources
      sql: WITH RECURSIVE tree AS (SELECT id, parent_id FROM nodes WHERE parent_id IS NULL UNION ALL SELECT n.id, n.parent_id FROM nodes n JOIN tree t ON n.parent_id = t.id) SELECT id FROM tree
      expected_edges:
        - from_table: nodes
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: union
          has_transform: true
          is_temp: true
          transformations:
            - operation: UNION
        - from_table: nodes
          from_field: parent_id
          to_table: __result__
          to_field: ""
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: FILTER

        - from_table: nodes
          from_field: parent_id
          to_table: __result__
          to_field: ""
          relation_type: join
          has_transform: true
          is_temp: true
          transformations:
            - operation: JOIN
              condition: n.parent_id=t.id

    # The value comes from the literal 1 and the recursive arm only reads the CTE's
    # own column, so the recursion has no source column to point at.
    - name: a recursion over a literal has no source column
      sql: WITH RECURSIVE counter AS (SELECT 1 AS n UNION ALL SELECT n + 1 FROM counter WHERE n < 5) SELECT n FROM counter
      expected_edges: []
