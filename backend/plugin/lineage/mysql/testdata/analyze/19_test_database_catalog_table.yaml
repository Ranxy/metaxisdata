name: TestDatabaseCatalog_Table
cases:
    # The MySQL family addresses a SQL qualifier as the database, so a catalog
    # entry has to be written under databases:. A schemas: entry addresses
    # PostgreSQL and is invisible here, which left every qualified wildcard
    # expansion untested for this family until this suite existed.
    - name: a qualified star expands from a database-qualified catalog entry
      sql: SELECT db1.t.* FROM db1.t
      catalog:
        databases:
            db1:
                t:
                    - a
                    - b
      expected_edges:
        - from_database: db1
          from_table: t
          from_field: a
          to_table: __result__
          to_field: a
          relation_type: direct
          is_temp: true
        - from_database: db1
          from_table: t
          from_field: b
          to_table: __result__
          to_field: b
          relation_type: direct
          is_temp: true

    - name: a qualified star in a cross-database join expands each database
      sql: SELECT db1.t.*, db2.t.* FROM db1.t JOIN db2.t ON db1.t.id = db2.t.id
      catalog:
        databases:
            db1:
                t:
                    - a
                    - b
            db2:
                t:
                    - c
                    - d
      expected_edges:
        - from_database: db1
          from_table: t
          from_field: a
          to_table: __result__
          to_field: a
          relation_type: direct
          is_temp: true
        - from_database: db1
          from_table: t
          from_field: b
          to_table: __result__
          to_field: b
          relation_type: direct
          is_temp: true
        - from_database: db2
          from_table: t
          from_field: c
          to_table: __result__
          to_field: c
          relation_type: direct
          is_temp: true
        - from_database: db2
          from_table: t
          from_field: d
          to_table: __result__
          to_field: d
          relation_type: direct
          is_temp: true
        - from_database: db1
          from_table: t
          from_field: id
          to_table: __result__
          to_field: ""
          relation_type: join
          has_transform: true
          is_temp: true
          transformations:
            - operation: JOIN
        - from_database: db2
          from_table: t
          from_field: id
          to_table: __result__
          to_field: ""
          relation_type: join
          has_transform: true
          is_temp: true
          transformations:
            - operation: JOIN

    # The negative half of the same decision: a schemas: entry does not become a
    # database one. Without this case the harness bug was invisible, because a
    # MySQL case written with schemas: silently fell back to `*` and still
    # passed.
    - name: a schema-qualified catalog entry is not visible to a MySQL analyzer
      sql: SELECT * FROM db1.t
      catalog:
        schemas:
            db1:
                t:
                    - a
                    - b
      expected_edges:
        - from_database: db1
          from_table: t
          from_field: '*'
          to_table: __result__
          to_field: '*'
          relation_type: direct
          is_temp: true
