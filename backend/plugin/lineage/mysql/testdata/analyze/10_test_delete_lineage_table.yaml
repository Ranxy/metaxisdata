name: TestDeleteLineage_Table
cases:
    - name: simple DELETE
      exact_edges: true
      sql: DELETE FROM users WHERE status = 'inactive' AND last_login < DATE_SUB(NOW(), INTERVAL 1 YEAR)
      expected_edges:
        - from_table: users
          from_field: status
          to_table: users
          to_field: __deletion__
          relation_type: indirect
          has_transform: true
          is_temp: false
          transformations:
            - operation: DELETE
        - from_table: users
          from_field: last_login
          to_table: users
          to_field: __deletion__
          relation_type: indirect
          has_transform: true
          is_temp: false
    - name: DELETE with JOIN
      exact_edges: true
      sql: |-
        DELETE o FROM orders o
        			      JOIN users u ON o.user_id = u.id
        			      WHERE u.status = 'deleted'
      expected_edges:
        - from_table: users
          from_field: status
          to_table: orders
          to_field: __deletion__
          relation_type: indirect
          has_transform: true
          is_temp: false
          transformations:
            - operation: DELETE
    - name: DELETE with subquery
      exact_edges: true
      sql: "DELETE FROM users \n\t\t\t      WHERE id IN (SELECT user_id FROM orders WHERE status = 'cancelled' GROUP BY user_id HAVING COUNT(*) > 5)"
      expected_edges:
        - from_table: users
          from_field: id
          to_table: users
          to_field: __deletion__
          relation_type: indirect
          has_transform: true
          is_temp: false
          transformations:
            - operation: DELETE
        - from_table: orders
          from_field: user_id
          to_table: users
          to_field: __deletion__
          relation_type: indirect
          has_transform: true
          is_temp: false
