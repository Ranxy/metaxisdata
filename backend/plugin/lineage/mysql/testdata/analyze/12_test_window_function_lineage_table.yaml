name: TestWindowFunctionLineage_Table
cases:
    # A window function depends on its arguments, its PARTITION BY keys and its
    # ORDER BY keys, so all three are recorded as sources of the output column.
    - name: ROW_NUMBER window function
      sql: "SELECT \n\t\t\t        id, \n\t\t\t        name, \n\t\t\t        salary,\n\t\t\t        ROW_NUMBER() OVER (PARTITION BY department ORDER BY salary DESC) AS rank_in_dept\n\t\t\t      FROM employees"
      expected_edges:
        - from_table: employees
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: direct
          is_temp: true
        - from_table: employees
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: direct
          is_temp: true
        - from_table: employees
          from_field: salary
          to_table: __result__
          to_field: salary
          relation_type: direct
          is_temp: true
        - from_table: employees
          from_field: department
          to_table: __result__
          to_field: rank_in_dept
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: WINDOW
              function_name: ROW_NUMBER
              partition_by: [department]
              order_by: [salary]
        - from_table: employees
          from_field: salary
          to_table: __result__
          to_field: rank_in_dept
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: WINDOW
              function_name: ROW_NUMBER
              partition_by: [department]
              order_by: [salary]
    - name: multiple window functions
      sql: "SELECT \n\t\t\t        product_id,\n\t\t\t        sale_date,\n\t\t\t        amount,\n\t\t\t        SUM(amount) OVER (PARTITION BY product_id ORDER BY sale_date) AS running_total,\n\t\t\t        AVG(amount) OVER (PARTITION BY product_id) AS avg_amount\n\t\t\t      FROM sales"
      expected_edges:
        - from_table: sales
          from_field: product_id
          to_table: __result__
          to_field: product_id
          relation_type: direct
          is_temp: true
        - from_table: sales
          from_field: sale_date
          to_table: __result__
          to_field: sale_date
          relation_type: direct
          is_temp: true
        - from_table: sales
          from_field: amount
          to_table: __result__
          to_field: amount
          relation_type: direct
          is_temp: true
        - from_table: sales
          from_field: amount
          to_table: __result__
          to_field: running_total
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: WINDOW
              function_name: SUM
              partition_by: [product_id]
              order_by: [sale_date]
        - from_table: sales
          from_field: product_id
          to_table: __result__
          to_field: running_total
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: WINDOW
              function_name: SUM
              partition_by: [product_id]
              order_by: [sale_date]
        - from_table: sales
          from_field: sale_date
          to_table: __result__
          to_field: running_total
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: WINDOW
              function_name: SUM
              partition_by: [product_id]
              order_by: [sale_date]
        - from_table: sales
          from_field: amount
          to_table: __result__
          to_field: avg_amount
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: WINDOW
              function_name: AVG
              partition_by: [product_id]
        - from_table: sales
          from_field: product_id
          to_table: __result__
          to_field: avg_amount
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: WINDOW
              function_name: AVG
              partition_by: [product_id]
