name: TestWindowFunctionLineage_Table
cases:
    # A window function depends on its arguments, its PARTITION BY keys and its
    # ORDER BY keys, so all three are recorded as sources of the output column.
    - name: ROW_NUMBER window function
      sql: "SELECT \n\t\t\t        id, \n\t\t\t        name, \n\t\t\t        salary,\n\t\t\t        ROW_NUMBER() OVER (PARTITION BY department ORDER BY salary DESC) AS rank_in_dept\n\t\t\t      FROM employees"
      expected_edges:
        - from_table: employees
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: direct
          is_temp: true
        - from_table: employees
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: direct
          is_temp: true
        - from_table: employees
          from_field: salary
          to_table: __result__
          to_field: salary
          relation_type: direct
          is_temp: true
        - from_table: employees
          from_field: department
          to_table: __result__
          to_field: rank_in_dept
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: WINDOW
              function_name: ROW_NUMBER
              partition_by: [department]
              order_by: [salary]
        - from_table: employees
          from_field: salary
          to_table: __result__
          to_field: rank_in_dept
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: WINDOW
              function_name: ROW_NUMBER
              partition_by: [department]
              order_by: [salary]
    - name: multiple window functions
      sql: "SELECT \n\t\t\t        product_id,\n\t\t\t        sale_date,\n\t\t\t        amount,\n\t\t\t        SUM(amount) OVER (PARTITION BY product_id ORDER BY sale_date) AS running_total,\n\t\t\t        AVG(amount) OVER (PARTITION BY product_id) AS avg_amount\n\t\t\t      FROM sales"
      expected_edges:
        - from_table: sales
          from_field: product_id
          to_table: __result__
          to_field: product_id
          relation_type: direct
          is_temp: true
        - from_table: sales
          from_field: sale_date
          to_table: __result__
          to_field: sale_date
          relation_type: direct
          is_temp: true
        - from_table: sales
          from_field: amount
          to_table: __result__
          to_field: amount
          relation_type: direct
          is_temp: true
        - from_table: sales
          from_field: amount
          to_table: __result__
          to_field: running_total
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: WINDOW
              function_name: SUM
              partition_by: [product_id]
              order_by: [sale_date]
        - from_table: sales
          from_field: product_id
          to_table: __result__
          to_field: running_total
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: WINDOW
              function_name: SUM
              partition_by: [product_id]
              order_by: [sale_date]
        - from_table: sales
          from_field: sale_date
          to_table: __result__
          to_field: running_total
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: WINDOW
              function_name: SUM
              partition_by: [product_id]
              order_by: [sale_date]
        - from_table: sales
          from_field: amount
          to_table: __result__
          to_field: avg_amount
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: WINDOW
              function_name: AVG
              partition_by: [product_id]
        - from_table: sales
          from_field: product_id
          to_table: __result__
          to_field: avg_amount
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: WINDOW
              function_name: AVG
              partition_by: [product_id]
    # `OVER w` keeps the whole window definition — PARTITION BY, ORDER BY and the
    # frame bounds — in the statement's WINDOW clause, which the walk over the
    # expression cannot reach. Only the function's own arguments were recorded, so
    # the columns that decide the window were missing from the lineage and the
    # transformation carried no partition or order detail. MySQL spells the clause
    # the same way PostgreSQL does.
    - name: a named window contributes its partition and order columns
      sql: SELECT SUM(x) OVER w AS s FROM t WINDOW w AS (PARTITION BY y ORDER BY z)
      expected_edges:
        - from_table: t
          from_field: y
          to_table: __result__
          to_field: s
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: WINDOW
              function_name: SUM
              expression: SUM(x)OVERw
              partition_by: [y]
              order_by: [z]
        - from_table: t
          from_field: z
          to_table: __result__
          to_field: s
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: WINDOW
              function_name: SUM
              expression: SUM(x)OVERw
              partition_by: [y]
              order_by: [z]
        - from_table: t
          from_field: x
          to_table: __result__
          to_field: s
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: WINDOW
              function_name: SUM
              expression: SUM(x)OVERw
              partition_by: [y]
              order_by: [z]
    # MySQL lets one named window be defined over another, so the chain is
    # followed: w2 orders by z and inherits w1's PARTITION BY.
    - name: a window defined over another window follows the chain
      sql: SELECT SUM(x) OVER w2 AS s FROM t WINDOW w2 AS (w1 ORDER BY z), w1 AS (PARTITION BY y)
      expected_edges:
        - from_table: t
          from_field: z
          to_table: __result__
          to_field: s
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: WINDOW
              function_name: SUM
              expression: SUM(x)OVERw2
              partition_by: [y]
              order_by: [z]
        - from_table: t
          from_field: y
          to_table: __result__
          to_field: s
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: WINDOW
              function_name: SUM
              expression: SUM(x)OVERw2
              partition_by: [y]
              order_by: [z]
        - from_table: t
          from_field: x
          to_table: __result__
          to_field: s
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: WINDOW
              function_name: SUM
              expression: SUM(x)OVERw2
              partition_by: [y]
              order_by: [z]
    - name: an inline window is unchanged by the named window support
      sql: SELECT SUM(x) OVER (PARTITION BY y ORDER BY z) AS s FROM t
      expected_edges:
        - from_table: t
          from_field: x
          to_table: __result__
          to_field: s
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: WINDOW
              function_name: SUM
              partition_by: [y]
              order_by: [z]
        - from_table: t
          from_field: y
          to_table: __result__
          to_field: s
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: WINDOW
              function_name: SUM
              partition_by: [y]
              order_by: [z]
        - from_table: t
          from_field: z
          to_table: __result__
          to_field: s
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: WINDOW
              function_name: SUM
              partition_by: [y]
              order_by: [z]
