name: TestSubqueryLineage_Table
cases:
    - name: subquery in FROM clause
      sql: |-
        SELECT sub.id, sub.total_orders
        			      FROM (SELECT user_id AS id, COUNT(*) AS total_orders FROM orders GROUP BY user_id) AS sub
      expected_edges:
        - from_table: orders
          from_field: user_id
          to_table: __result__
          to_field: id
          relation_type: direct
          is_temp: true
        - from_table: orders
          from_field: '*'
          to_table: __result__
          to_field: total_orders
          has_transform: true
          relation_type: group
          is_temp: true
          transformations:
            - operation: AGGREGATE
              function_name: COUNT
              group_keys:
                - "user_id"
    - name: nested subquery filters intermediate lineage
      sql: |-
        SELECT foo.user_id, foo.total_amount
        			      FROM (
        			          SELECT user_id, total_amount
        			          FROM (
        			              SELECT user_id, SUM(amount) AS total_amount
        			              FROM orders
        			              GROUP BY user_id
        			          ) sub
        			      ) foo
        			      JOIN (
        			          SELECT user_id, COUNT(*) AS order_count
        			          FROM user_orders
        			          GROUP BY user_id
        			      ) bar
        			      ON foo.user_id = bar.user_id
      expected_edges:
        - from_table: orders
          from_field: user_id
          to_table: __result__
          to_field: user_id
          relation_type: direct
          is_temp: true
        - from_table: orders
          from_field: amount
          to_table: __result__
          to_field: total_amount
          relation_type: group
          is_temp: true
          transformations:
            - operation: AGGREGATE
              function_name: SUM
              group_keys:
                - "user_id"
