name: TestJoinLineage_Table
cases:
    - name: inner join
      sql: "SELECT u.id, u.name, o.order_id, o.total \n\t\t\t      FROM users u \n\t\t\t      JOIN orders o ON u.id = o.user_id"
      expected_edges:
        - from_table: users
          from_field: id
          to_table: __result__
          to_field: id
        - from_table: users
          from_field: name
          to_table: __result__
          to_field: name
        - from_table: orders
          from_field: order_id
          to_table: __result__
          to_field: order_id
        - from_table: orders
          from_field: total
          to_table: __result__
          to_field: total
