name: TestUnionLineage_Table
cases:
    - name: simple UNION
      exact_edges: true
      sql: "SELECT id, name FROM employees \n\t\t\t      UNION \n\t\t\t      SELECT id, name FROM contractors"
      expected_edges:
        - from_table: employees
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: union
          is_temp: true
          transformations:
            - operation: UNION
        - from_table: employees
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: union
          is_temp: true
        - from_table: contractors
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: union
          is_temp: true
        - from_table: contractors
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: union
          is_temp: true
    - name: UNION ALL
      exact_edges: true
      sql: "SELECT user_id, amount FROM sales \n\t\t\t      UNION ALL \n\t\t\t      SELECT user_id, amount FROM refunds"
      expected_edges:
        - from_table: sales
          from_field: user_id
          to_table: __result__
          to_field: user_id
          relation_type: union
          is_temp: true
          transformations:
            - operation: UNION
        - from_table: sales
          from_field: amount
          to_table: __result__
          to_field: amount
          relation_type: union
          is_temp: true
        - from_table: refunds
          from_field: user_id
          to_table: __result__
          to_field: user_id
          relation_type: union
          is_temp: true
        - from_table: refunds
          from_field: amount
          to_table: __result__
          to_field: amount
          relation_type: union
          is_temp: true
    - name: multiple UNION
      exact_edges: true
      sql: "SELECT id, name FROM employees \n\t\t\t      UNION \n\t\t\t      SELECT id, name FROM contractors\n\t\t\t      UNION\n\t\t\t      SELECT id, name FROM vendors"
      expected_edges:
        - from_table: employees
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: union
          is_temp: true
          transformations:
            - operation: UNION
        - from_table: employees
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: union
          is_temp: true
        - from_table: contractors
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: union
          is_temp: true
        - from_table: contractors
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: union
          is_temp: true
        - from_table: vendors
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: union
          is_temp: true
        - from_table: vendors
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: union
          is_temp: true
