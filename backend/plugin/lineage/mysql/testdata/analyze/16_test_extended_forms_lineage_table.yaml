name: TestExtendedFormsLineage_Table
cases:
    - name: window_row_number
      sql: SELECT name, ROW_NUMBER() OVER (PARTITION BY department_id ORDER BY salary) AS rn FROM employees
      expected_edges:
        - from_table: employees
          from_field: department_id
          to_table: __result__
          to_field: rn
          relation_type: indirect
          has_transform: true
          is_temp: true
        - from_table: employees
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: direct
          is_temp: true
        - from_table: employees
          from_field: salary
          to_table: __result__
          to_field: rn
          relation_type: indirect
          has_transform: true
          is_temp: true
    - name: window_aggregate_over
      sql: SELECT product_id, SUM(amount) OVER (PARTITION BY product_id ORDER BY sale_date) AS running_total FROM sales
      expected_edges:
        - from_table: sales
          from_field: amount
          to_table: __result__
          to_field: running_total
          relation_type: group
          has_transform: true
          is_temp: true
        - from_table: sales
          from_field: product_id
          to_table: __result__
          to_field: product_id
          relation_type: direct
          is_temp: true
        - from_table: sales
          from_field: product_id
          to_table: __result__
          to_field: running_total
          relation_type: group
          has_transform: true
          is_temp: true
        - from_table: sales
          from_field: sale_date
          to_table: __result__
          to_field: running_total
          relation_type: group
          has_transform: true
          is_temp: true
    - name: union_three_arms
      sql: SELECT id, name FROM employees UNION SELECT id, name FROM contractors UNION SELECT id, name FROM vendors
      expected_edges:
        - from_table: contractors
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: direct
          is_temp: true
        - from_table: contractors
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: direct
          is_temp: true
        - from_table: employees
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: direct
          is_temp: true
        - from_table: employees
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: direct
          is_temp: true
        - from_table: vendors
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: direct
          is_temp: true
        - from_table: vendors
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: direct
          is_temp: true
    - name: union_all
      sql: SELECT user_id, amount FROM sales UNION ALL SELECT user_id, amount FROM refunds
      expected_edges:
        - from_table: refunds
          from_field: amount
          to_table: __result__
          to_field: amount
          relation_type: direct
          is_temp: true
        - from_table: refunds
          from_field: user_id
          to_table: __result__
          to_field: user_id
          relation_type: direct
          is_temp: true
        - from_table: sales
          from_field: amount
          to_table: __result__
          to_field: amount
          relation_type: direct
          is_temp: true
        - from_table: sales
          from_field: user_id
          to_table: __result__
          to_field: user_id
          relation_type: direct
          is_temp: true
    - name: cte_chain
      sql: WITH a AS (SELECT id, name FROM employees), b AS (SELECT name FROM a) SELECT name FROM b
      expected_edges:
        - from_table: employees
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: direct
          is_temp: true
    - name: cte_join
      sql: WITH d AS (SELECT id, name FROM departments) SELECT e.name, d.name AS dept FROM employees e JOIN d ON e.department_id = d.id
      expected_edges:
        - from_table: departments
          from_field: name
          to_table: __result__
          to_field: dept
          relation_type: direct
          is_temp: true
        - from_table: employees
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: direct
          is_temp: true
    - name: derived_table
      sql: SELECT s.n FROM (SELECT name AS n FROM employees) s
      expected_edges:
        - from_table: employees
          from_field: name
          to_table: __result__
          to_field: "n"
          relation_type: direct
          is_temp: true
    - name: derived_join
      sql: SELECT s.n, d.name AS dn FROM (SELECT e.name AS n, e.department_id AS did FROM employees e) s JOIN departments d ON s.did = d.id
      expected_edges:
        - from_table: departments
          from_field: name
          to_table: __result__
          to_field: dn
          relation_type: direct
          is_temp: true
        - from_table: employees
          from_field: name
          to_table: __result__
          to_field: "n"
          relation_type: direct
          is_temp: true
    - name: scalar_subquery
      sql: SELECT (SELECT MAX(salary) FROM employees) AS m FROM departments
      expected_edges:
        - from_table: departments
          from_field: salary
          to_table: __result__
          to_field: m
          relation_type: group
          has_transform: true
          is_temp: true
    - name: case_expression
      sql: SELECT CASE WHEN salary > 100 THEN 'hi' ELSE name END AS band FROM employees
      expected_edges:
        - from_table: employees
          from_field: name
          to_table: __result__
          to_field: band
          relation_type: indirect
          has_transform: true
          is_temp: true
        - from_table: employees
          from_field: salary
          to_table: __result__
          to_field: band
          relation_type: indirect
          has_transform: true
          is_temp: true
    - name: coalesce
      sql: SELECT COALESCE(name, 'unknown') AS n FROM employees
      expected_edges:
        - from_table: employees
          from_field: name
          to_table: __result__
          to_field: "n"
          relation_type: indirect
          has_transform: true
          is_temp: true
    - name: group_concat
      sql: SELECT department_id, GROUP_CONCAT(name) AS names FROM employees GROUP BY department_id
      expected_edges:
        - from_table: employees
          from_field: department_id
          to_table: __result__
          to_field: department_id
          relation_type: direct
          is_temp: true
        - from_table: employees
          from_field: name
          to_table: __result__
          to_field: names
          relation_type: group
          has_transform: true
          is_temp: true
    - name: count_distinct
      sql: SELECT COUNT(DISTINCT department_id) AS c FROM employees
      expected_edges:
        - from_table: employees
          from_field: department_id
          to_table: __result__
          to_field: c
          relation_type: group
          has_transform: true
          is_temp: true
    - name: star_join
      sql: SELECT * FROM employees e JOIN departments d ON e.department_id = d.id
      expected_edges: []
    - name: table_star
      sql: SELECT e.*, d.name FROM employees e JOIN departments d ON e.department_id = d.id
      expected_edges:
        - from_table: departments
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: direct
          is_temp: true
    - name: comma_join
      sql: SELECT e.name, d.name AS dn FROM employees e, departments d WHERE e.department_id = d.id
      expected_edges:
        - from_table: departments
          from_field: name
          to_table: __result__
          to_field: dn
          relation_type: direct
          is_temp: true
        - from_table: employees
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: direct
          is_temp: true
    - name: insert_odku
      sql: INSERT INTO t2 (a, b) SELECT id, name FROM employees ON DUPLICATE KEY UPDATE b = VALUES(b)
      expected_edges:
        - from_table: employees
          from_field: b
          to_table: t2
          to_field: b
          relation_type: indirect
          has_transform: true
          is_temp: false
        - from_table: employees
          from_field: id
          to_table: t2
          to_field: a
          relation_type: direct
          is_temp: false
        - from_table: employees
          from_field: name
          to_table: t2
          to_field: b
          relation_type: direct
          is_temp: false
    - name: update_join
      sql: UPDATE employees e JOIN departments d ON e.department_id = d.id SET e.salary = d.budget WHERE d.name = 'eng'
      expected_edges:
        - from_table: departments
          from_field: budget
          to_table: employees
          to_field: salary
          relation_type: indirect
          has_transform: true
          is_temp: false
    - name: delete_multi
      sql: DELETE e FROM employees e JOIN departments d ON e.department_id = d.id WHERE d.name = 'x'
      expected_edges:
        - from_table: departments
          from_field: name
          to_table: employees
          to_field: __deletion__
          relation_type: indirect
          has_transform: true
          is_temp: false
    - name: load_data_columns
      sql: LOAD DATA INFILE 'a.csv' INTO TABLE employees FIELDS TERMINATED BY ',' (id, name)
      expected_edges:
        - from_table: __file__
          from_field: col1
          to_table: employees
          to_field: id
          relation_type: direct
          is_temp: false
        - from_table: __file__
          from_field: col2
          to_table: employees
          to_field: name
          relation_type: direct
          is_temp: false
    - name: load_data_set
      sql: LOAD DATA INFILE 'a.csv' INTO TABLE employees FIELDS TERMINATED BY ',' (id, @name) SET name = @name
      expected_edges:
        - from_table: __file__
          from_field: '*'
          to_table: employees
          to_field: name
          relation_type: indirect
          has_transform: true
          is_temp: false
        - from_table: __file__
          from_field: col1
          to_table: employees
          to_field: id
          relation_type: direct
          is_temp: false
    - name: qualified_columns
      sql: SELECT testdb.employees.name FROM testdb.employees
      expected_edges:
        - from_database: testdb
          from_table: employees
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: direct
          is_temp: true
