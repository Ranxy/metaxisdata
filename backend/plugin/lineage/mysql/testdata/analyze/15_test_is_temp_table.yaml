name: TestIsTemp_Table
cases:
    - name: SELECT produces temporary result
      exact_edges: true
      sql: SELECT id, name FROM users
      expected_edges:
        - from_table: users
          from_field: id
          to_table: __result__
          to_field: id
          is_temp: true
        - from_table: users
          from_field: name
          to_table: __result__
          to_field: name
          is_temp: true
    - name: INSERT targets real table
      exact_edges: true
      sql: INSERT INTO orders (order_id, user_id) SELECT id, user_id FROM temp_orders
      expected_edges:
        - from_table: temp_orders
          from_field: id
          to_table: orders
          to_field: order_id
          is_temp: false
        - from_table: temp_orders
          from_field: user_id
          to_table: orders
          to_field: user_id
          is_temp: false
    - name: UPDATE targets real table
      exact_edges: true
      sql: UPDATE products SET price = price * 1.1 WHERE category = 'electronics'
      expected_edges:
        - from_table: products
          from_field: price
          to_table: products
          to_field: price
          relation_type: indirect
          has_transform: true
          is_temp: false
          transformations:
            - operation: OPERATOR
              op_type: MULTIPLICATION
    - name: DELETE targets real table
      exact_edges: true
      sql: DELETE FROM logs WHERE created_at < '2020-01-01'
      expected_edges:
        - from_table: logs
          from_field: created_at
          to_table: logs
          to_field: __deletion__
          relation_type: indirect
          has_transform: true
          is_temp: false
          transformations:
            - operation: DELETE
    - name: CREATE TABLE AS SELECT targets real table
      exact_edges: true
      sql: CREATE TABLE summary AS SELECT category, COUNT(*) as cnt FROM products GROUP BY category
      expected_edges:
        - from_table: products
          from_field: category
          to_table: summary
          to_field: category
          is_temp: false
        - from_table: products
          from_field: '*'
          to_table: summary
          to_field: cnt
          relation_type: group
          has_transform: true
          is_temp: false
          transformations:
            - operation: AGGREGATE
              function_name: COUNT
