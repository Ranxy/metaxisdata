name: TestReplaceLineage_Table
cases:
    - name: REPLACE SELECT
      sql: REPLACE INTO tmp_users SELECT id, name FROM users WHERE age > 30
      expected_edges:
        - from_table: users
          from_field: id
          to_table: tmp_users
          to_field: id
        - from_table: users
          from_field: name
          to_table: tmp_users
          to_field: name
    - name: REPLACE SELECT with explicit columns
      sql: REPLACE INTO tmp_users (user_id, user_name) SELECT id, name FROM users
      expected_edges:
        - from_table: users
          from_field: id
          to_table: tmp_users
          to_field: user_id
        - from_table: users
          from_field: name
          to_table: tmp_users
          to_field: user_name
    - name: REPLACE SELECT with JOIN
      sql: "REPLACE INTO summary \n\t\t\t      SELECT u.id, u.name, COUNT(o.id) AS order_count \n\t\t\t      FROM users u \n\t\t\t      JOIN orders o ON u.id = o.user_id \n\t\t\t      GROUP BY u.id, u.name"
      expected_edges:
        - from_table: users
          from_field: id
          to_table: summary
          to_field: id
        - from_table: users
          from_field: name
          to_table: summary
          to_field: name
        - to_table: summary
          to_field: order_count
          has_transform: true
