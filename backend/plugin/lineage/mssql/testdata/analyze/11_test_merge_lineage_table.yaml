name: TestMergeLineageTable
cases:
    - name: merge update and insert
      sql: MERGE INTO tgt AS t USING src AS s ON t.id = s.id WHEN MATCHED THEN UPDATE SET t.a = s.a WHEN NOT MATCHED THEN INSERT (a) VALUES (s.a)
      expected_edges:
        - from_table: src
          from_field: a
          to_table: tgt
          to_field: a
          relation_type: direct
          has_transform: false
          is_temp: false
        - from_table: tgt
          from_field: id
          to_table: tgt
          to_field: ''
          relation_type: join
          has_transform: true
          is_temp: false
          transformations:
            - operation: JOIN
              condition: t.id = s.id
        - from_table: src
          from_field: id
          to_table: tgt
          to_field: ''
          relation_type: join
          has_transform: true
          is_temp: false
          transformations:
            - operation: JOIN
              condition: t.id = s.id
    - name: merge without a target alias
      sql: MERGE INTO tgt USING src ON tgt.id = src.id WHEN MATCHED THEN UPDATE SET tgt.a = src.a
      expected_edges:
        - from_table: src
          from_field: a
          to_table: tgt
          to_field: a
          relation_type: direct
          has_transform: false
          is_temp: false
        - from_table: tgt
          from_field: id
          to_table: tgt
          to_field: ''
          relation_type: join
          has_transform: true
          is_temp: false
          transformations:
            - operation: JOIN
              condition: tgt.id = src.id
        - from_table: src
          from_field: id
          to_table: tgt
          to_field: ''
          relation_type: join
          has_transform: true
          is_temp: false
          transformations:
            - operation: JOIN
              condition: tgt.id = src.id
    - name: merge delete by source
      sql: MERGE INTO tgt USING src ON tgt.id = src.id WHEN NOT MATCHED BY SOURCE THEN DELETE
      expected_edges:
        - from_table: tgt
          from_field: '*'
          to_table: tgt
          to_field: __deletion__
          relation_type: indirect
          has_transform: true
          is_temp: false
          transformations:
            - operation: DELETE
        - from_table: tgt
          from_field: id
          to_table: tgt
          to_field: ''
          relation_type: join
          has_transform: true
          is_temp: false
          transformations:
            - operation: JOIN
              condition: tgt.id = src.id
        - from_table: src
          from_field: id
          to_table: tgt
          to_field: ''
          relation_type: join
          has_transform: true
          is_temp: false
          transformations:
            - operation: JOIN
              condition: tgt.id = src.id
    - name: merge from a derived table
      sql: MERGE INTO tgt AS t USING (SELECT id, a FROM src) AS s ON t.id = s.id WHEN MATCHED THEN UPDATE SET t.a = s.a
      expected_edges:
        - from_table: src
          from_field: a
          to_table: tgt
          to_field: a
          relation_type: direct
          has_transform: false
          is_temp: false
        - from_table: tgt
          from_field: id
          to_table: tgt
          to_field: ''
          relation_type: join
          has_transform: true
          is_temp: false
          transformations:
            - operation: JOIN
              condition: t.id = s.id
        - from_table: src
          from_field: id
          to_table: tgt
          to_field: ''
          relation_type: join
          has_transform: true
          is_temp: false
          transformations:
            - operation: JOIN
              condition: t.id = s.id
    # The parser records USING as an alias of a MERGE target that has none. A statement that
    # really aliased its target must keep that alias — NATURAL and USING are ODBC and future
    # reserved words rather than T-SQL reserved ones — so the guard looks at what follows the
    # keyword, and here the written alias is what addresses the row.
    - name: merge whose target alias is the keyword itself
      sql: 'MERGE INTO [tgt] AS [USING] USING src ON 1 = 1 WHEN MATCHED THEN UPDATE SET [USING].a = 1'
      expected_edges:
        - from_table: tgt
          from_field: '*'
          to_table: tgt
          to_field: a
          relation_type: direct
          has_transform: false
          is_temp: false
    # Every WHEN clause writes the target, so a target the registry cannot address has nowhere
    # to write: the clauses are not run at all rather than recording edges with an empty name.
    - name: merge into a table variable is reported as a gap
      sql: 'MERGE INTO @tv USING src ON 1 = 1 WHEN MATCHED THEN UPDATE SET a = src.a'
      expect_error: true
      error_contains: 'a target the registry cannot address: the table variable @tv'
      expected_edges:
        []
    - name: merge into a temporary table is reported as a gap
      sql: 'MERGE INTO #stage USING src ON 1 = 1 WHEN NOT MATCHED BY SOURCE THEN DELETE'
      expect_error: true
      error_contains: 'a target the registry cannot address: the temporary table #stage'
      expected_edges:
        []
    # A WHEN clause's own AND condition decides which of the matched rows this action writes,
    # so the columns it names are a row-set influence on the target, like the ON condition.
    - name: merge update under a when condition
      sql: MERGE INTO tgt AS t USING src AS s ON t.id = s.id WHEN MATCHED AND s.flag = 1 THEN UPDATE SET t.a = s.a
      expected_edges:
        - from_table: src
          from_field: a
          to_table: tgt
          to_field: a
          relation_type: direct
          has_transform: false
          is_temp: false
        - from_table: tgt
          from_field: id
          to_table: tgt
          to_field: ''
          relation_type: join
          has_transform: true
          is_temp: false
          transformations:
            - operation: JOIN
              condition: t.id = s.id
        - from_table: src
          from_field: id
          to_table: tgt
          to_field: ''
          relation_type: join
          has_transform: true
          is_temp: false
          transformations:
            - operation: JOIN
              condition: t.id = s.id
        - from_table: src
          from_field: flag
          to_table: tgt
          to_field: ''
          relation_type: indirect
          has_transform: true
          is_temp: false
          transformations:
            - operation: FILTER
              condition: s.flag = 1
    - name: merge insert under a when condition
      sql: MERGE INTO tgt AS t USING src AS s ON t.id = s.id WHEN NOT MATCHED BY TARGET AND s.flag = 1 THEN INSERT (a) VALUES (s.a)
      expected_edges:
        - from_table: src
          from_field: a
          to_table: tgt
          to_field: a
          relation_type: direct
          has_transform: false
          is_temp: false
        - from_table: tgt
          from_field: id
          to_table: tgt
          to_field: ''
          relation_type: join
          has_transform: true
          is_temp: false
          transformations:
            - operation: JOIN
              condition: t.id = s.id
        - from_table: src
          from_field: id
          to_table: tgt
          to_field: ''
          relation_type: join
          has_transform: true
          is_temp: false
          transformations:
            - operation: JOIN
              condition: t.id = s.id
        - from_table: src
          from_field: flag
          to_table: tgt
          to_field: ''
          relation_type: indirect
          has_transform: true
          is_temp: false
          transformations:
            - operation: FILTER
              condition: s.flag = 1
