name: TestJoinLineageTable
cases:
    - name: inner join records the join predicate
      sql: SELECT a FROM t1 JOIN t2 ON t1.id = t2.id
      expected_edges:
        - from_table: t1
          from_field: a
          to_table: __result__
          to_field: a
          relation_type: direct
          has_transform: false
          is_temp: true
        - from_table: t1
          from_field: id
          to_table: __result__
          to_field: ''
          relation_type: join
          has_transform: true
          is_temp: true
          transformations:
            - operation: JOIN
              condition: t1.id = t2.id
        - from_table: t2
          from_field: id
          to_table: __result__
          to_field: ''
          relation_type: join
          has_transform: true
          is_temp: true
          transformations:
            - operation: JOIN
              condition: t1.id = t2.id
    - name: left join
      sql: SELECT t1.a FROM t1 LEFT JOIN t2 ON t1.id = t2.id
      expected_edges:
        - from_table: t1
          from_field: a
          to_table: __result__
          to_field: a
          relation_type: direct
          has_transform: false
          is_temp: true
        - from_table: t1
          from_field: id
          to_table: __result__
          to_field: ''
          relation_type: join
          has_transform: true
          is_temp: true
          transformations:
            - operation: JOIN
              condition: t1.id = t2.id
        - from_table: t2
          from_field: id
          to_table: __result__
          to_field: ''
          relation_type: join
          has_transform: true
          is_temp: true
          transformations:
            - operation: JOIN
              condition: t1.id = t2.id
    - name: cross join has no predicate
      sql: SELECT t1.a FROM t1 CROSS JOIN t2
      expected_edges:
        - from_table: t1
          from_field: a
          to_table: __result__
          to_field: a
          relation_type: direct
          has_transform: false
          is_temp: true
    - name: comma separated from
      sql: SELECT t1.a FROM t1, t2
      expected_edges:
        - from_table: t1
          from_field: a
          to_table: __result__
          to_field: a
          relation_type: direct
          has_transform: false
          is_temp: true
    - name: aliased relations
      sql: SELECT x.a FROM t1 x JOIN t2 y ON x.id = y.id
      expected_edges:
        - from_table: t1
          from_field: a
          to_table: __result__
          to_field: a
          relation_type: direct
          has_transform: false
          is_temp: true
        - from_table: t1
          from_field: id
          to_table: __result__
          to_field: ''
          relation_type: join
          has_transform: true
          is_temp: true
          transformations:
            - operation: JOIN
              condition: x.id = y.id
        - from_table: t2
          from_field: id
          to_table: __result__
          to_field: ''
          relation_type: join
          has_transform: true
          is_temp: true
          transformations:
            - operation: JOIN
              condition: x.id = y.id
    - name: natural join is not read as an alias
      sql: SELECT t1.a FROM t1 NATURAL JOIN t2
      expected_edges:
        - from_table: t1
          from_field: a
          to_table: __result__
          to_field: a
          relation_type: direct
          has_transform: false
          is_temp: true
    - name: table hint
      sql: SELECT a FROM t WITH (NOLOCK)
      expected_edges:
        - from_table: t
          from_field: a
          to_table: __result__
          to_field: a
          relation_type: direct
          has_transform: false
          is_temp: true
    - name: unqualified column resolved with catalog metadata
      sql: SELECT id FROM users
      catalog:
        tables:
          users: [id, name]
      expected_edges:
        - from_table: users
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: direct
          has_transform: false
          is_temp: true
    - name: star expanded with catalog metadata
      sql: 'SELECT * FROM users'
      catalog:
        tables:
          users: [id, name]
      expected_edges:
        - from_table: users
          from_field: '*'
          to_table: __result__
          to_field: id
          relation_type: direct
          has_transform: false
          is_temp: true
        - from_table: users
          from_field: '*'
          to_table: __result__
          to_field: name
          relation_type: direct
          has_transform: false
          is_temp: true
    - name: qualified table star with catalog metadata
      sql: 'SELECT o.* FROM dbo.orders o'
      catalog:
        schemas:
          dbo:
            orders: [order_id, amount]
      expected_edges:
        - from_table: orders
          from_schema: dbo
          from_field: '*'
          to_table: __result__
          to_field: order_id
          relation_type: direct
          has_transform: false
          is_temp: true
        - from_table: orders
          from_schema: dbo
          from_field: '*'
          to_table: __result__
          to_field: amount
          relation_type: direct
          has_transform: false
          is_temp: true
