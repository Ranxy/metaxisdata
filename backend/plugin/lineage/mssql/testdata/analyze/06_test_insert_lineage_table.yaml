name: TestInsertLineageTable
cases:
    - name: insert select
      sql: INSERT INTO t2 (a, b) SELECT c, d FROM t1
      expected_edges:
        - from_table: t1
          from_field: c
          to_table: t2
          to_field: a
          relation_type: direct
          has_transform: false
          is_temp: false
        - from_table: t1
          from_field: d
          to_table: t2
          to_field: b
          relation_type: direct
          has_transform: false
          is_temp: false
    - name: insert select without a column list
      sql: INSERT INTO t2 SELECT c AS a, d AS b FROM t1
      expected_edges:
        - from_table: t1
          from_field: c
          to_table: t2
          to_field: a
          relation_type: direct
          has_transform: false
          is_temp: false
        - from_table: t1
          from_field: d
          to_table: t2
          to_field: b
          relation_type: direct
          has_transform: false
          is_temp: false
    - name: insert values of literals has no lineage
      sql: INSERT INTO t2 (a) VALUES (1)
      expected_edges:
        []
    - name: insert values with a subquery
      sql: INSERT INTO t2 (a) VALUES ((SELECT MAX(x) FROM s))
      expected_edges:
        - from_table: s
          from_field: x
          to_table: t2
          to_field: a
          relation_type: indirect
          has_transform: true
          is_temp: false
          transformations:
            - operation: PROJECT
              expression: (SELECT MAX(x) FROM s)
    - name: insert with an output clause still writes the target
      sql: INSERT INTO t2 (a) OUTPUT inserted.a SELECT b FROM t1
      expected_edges:
        - from_table: t1
          from_field: b
          to_table: t2
          to_field: a
          relation_type: direct
          has_transform: false
          is_temp: false
    - name: insert into a table variable is reported as a gap
      sql: 'INSERT INTO @tv (a) SELECT b FROM t1'
      expect_error: true
      error_contains: an INSERT into a table variable
      expected_edges:
        []
    - name: insert exec is reported as a gap
      sql: INSERT INTO t2 (a) EXEC p 1
      expect_error: true
      error_contains: not modelled
      expected_edges:
        []
