name: TestSubqueryLineageTable
cases:
    - name: derived table
      sql: SELECT d.a FROM (SELECT a FROM t) d
      expected_edges:
        - from_table: t
          from_field: a
          to_table: __result__
          to_field: a
          relation_type: direct
          has_transform: false
          is_temp: true
    - name: derived table with a declared column list
      sql: SELECT d.x FROM (SELECT a FROM t) AS d(x)
      expected_edges:
        - from_table: t
          from_field: a
          to_table: __result__
          to_field: x
          relation_type: direct
          has_transform: false
          is_temp: true
    - name: derived table joined to a table
      sql: SELECT t1.a FROM t1 JOIN (SELECT a, id FROM t2) d ON d.id = t1.id
      expected_edges:
        - from_table: t1
          from_field: a
          to_table: __result__
          to_field: a
          relation_type: direct
          has_transform: false
          is_temp: true
        - from_table: t2
          from_field: id
          to_table: __result__
          to_field: ''
          relation_type: join
          has_transform: true
          is_temp: true
          transformations:
            - operation: JOIN
              condition: d.id = t1.id
        - from_table: t1
          from_field: id
          to_table: __result__
          to_field: ''
          relation_type: join
          has_transform: true
          is_temp: true
          transformations:
            - operation: JOIN
              condition: d.id = t1.id
    - name: cross apply
      sql: SELECT t1.a, x.b FROM t1 CROSS APPLY (SELECT TOP 1 b FROM t2 WHERE t2.id = t1.id) x
      expected_edges:
        - from_table: t1
          from_field: a
          to_table: __result__
          to_field: a
          relation_type: direct
          has_transform: false
          is_temp: true
        - from_table: t2
          from_field: b
          to_table: __result__
          to_field: b
          relation_type: direct
          has_transform: false
          is_temp: true
        - from_table: t2
          from_field: id
          to_table: __result__
          to_field: ''
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: FILTER
              condition: t2.id = t1.id
        - from_table: t1
          from_field: id
          to_table: __result__
          to_field: ''
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: FILTER
              condition: t2.id = t1.id
    - name: outer apply
      sql: SELECT t1.a, x.b FROM t1 OUTER APPLY (SELECT b FROM t2) x
      expected_edges:
        - from_table: t1
          from_field: a
          to_table: __result__
          to_field: a
          relation_type: direct
          has_transform: false
          is_temp: true
        - from_table: t2
          from_field: b
          to_table: __result__
          to_field: b
          relation_type: direct
          has_transform: false
          is_temp: true
    - name: scalar subquery in the select list
      sql: SELECT (SELECT MAX(b) FROM t2) AS m FROM t1
      expected_edges:
        - from_table: t2
          from_field: b
          to_table: __result__
          to_field: m
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: PROJECT
              expression: (SELECT MAX(b) FROM t2)
    - name: in subquery records its table
      sql: SELECT a FROM t WHERE a IN (SELECT b FROM s)
      expected_edges:
        - from_table: t
          from_field: a
          to_table: __result__
          to_field: a
          relation_type: direct
          has_transform: false
          is_temp: true
        - from_table: t
          from_field: a
          to_table: __result__
          to_field: ''
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: FILTER
              condition: a IN (SELECT b FROM s)
        - from_table: s
          from_field: b
          to_table: __result__
          to_field: ''
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: FILTER
              condition: a IN (SELECT b FROM s)
    - name: exists subquery records its table
      sql: SELECT a FROM t WHERE EXISTS (SELECT 1 FROM s WHERE s.id = t.id)
      expected_edges:
        - from_table: t
          from_field: a
          to_table: __result__
          to_field: a
          relation_type: direct
          has_transform: false
          is_temp: true
        - from_table: s
          from_field: id
          to_table: __result__
          to_field: ''
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: FILTER
              condition: s.id = t.id
        - from_table: t
          from_field: id
          to_table: __result__
          to_field: ''
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: FILTER
              condition: s.id = t.id
    - name: comparison against all
      sql: 'SELECT a FROM t WHERE a > ALL (SELECT b FROM s)'
      expected_edges:
        - from_table: t
          from_field: a
          to_table: __result__
          to_field: a
          relation_type: direct
          has_transform: false
          is_temp: true
        - from_table: t
          from_field: a
          to_table: __result__
          to_field: ''
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: FILTER
              condition: 'a > ALL (SELECT b FROM s)'
        - from_table: s
          from_field: b
          to_table: __result__
          to_field: ''
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: FILTER
              condition: 'a > ALL (SELECT b FROM s)'
