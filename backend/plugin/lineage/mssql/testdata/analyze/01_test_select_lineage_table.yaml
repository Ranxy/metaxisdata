name: TestSelectLineageTable
cases:
    - name: column aliases and a schema qualified relation
      sql: SELECT t.a AS x, t.b FROM dbo.t AS t
      expected_edges:
        - from_table: t
          from_schema: dbo
          from_field: a
          to_table: __result__
          to_field: x
          relation_type: direct
          has_transform: false
          is_temp: true
        - from_table: t
          from_schema: dbo
          from_field: b
          to_table: __result__
          to_field: b
          relation_type: direct
          has_transform: false
          is_temp: true
    - name: bracketed identifiers
      sql: 'SELECT [a], [b] FROM [dbo].[t]'
      expected_edges:
        - from_table: t
          from_schema: dbo
          from_field: a
          to_table: __result__
          to_field: a
          relation_type: direct
          has_transform: false
          is_temp: true
        - from_table: t
          from_schema: dbo
          from_field: b
          to_table: __result__
          to_field: b
          relation_type: direct
          has_transform: false
          is_temp: true
    - name: three part name in the current database
      sql: SELECT dbo.t.a FROM dbo.t
      expected_edges:
        - from_table: t
          from_schema: dbo
          from_field: a
          to_table: __result__
          to_field: a
          relation_type: direct
          has_transform: false
          is_temp: true
    - name: select star without catalog
      sql: 'SELECT * FROM t'
      expected_edges:
        - from_table: t
          from_field: '*'
          to_table: __result__
          to_field: '*'
          relation_type: direct
          has_transform: false
          is_temp: true
    - name: select table star
      sql: 'SELECT t.* FROM t AS t'
      expected_edges:
        - from_table: t
          from_field: '*'
          to_table: __result__
          to_field: '*'
          relation_type: direct
          has_transform: false
          is_temp: true
    - name: select distinct
      sql: SELECT DISTINCT a FROM t
      expected_edges:
        - from_table: t
          from_field: a
          to_table: __result__
          to_field: a
          relation_type: direct
          has_transform: false
          is_temp: true
    - name: select top with order by
      sql: SELECT TOP 10 a FROM t ORDER BY a
      expected_edges:
        - from_table: t
          from_field: a
          to_table: __result__
          to_field: a
          relation_type: direct
          has_transform: false
          is_temp: true
    - name: expression projections
      sql: SELECT a + 1 AS b, CAST(a AS INT) AS c, COALESCE(a, b) AS d FROM t
      expected_edges:
        - from_table: t
          from_field: a
          to_table: __result__
          to_field: b
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: OPERATOR
              expression: a + 1
              op_type: ADDITION
        - from_table: t
          from_field: a
          to_table: __result__
          to_field: c
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: FUNCTION
              function_name: CAST
              expression: CAST(a AS INT)
              arguments:
                - a
        - from_table: t
          from_field: a
          to_table: __result__
          to_field: d
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: FUNCTION
              function_name: COALESCE
              expression: COALESCE(a, b)
              arguments:
                - a
                - b
        - from_table: t
          from_field: b
          to_table: __result__
          to_field: d
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: FUNCTION
              function_name: COALESCE
              expression: COALESCE(a, b)
              arguments:
                - a
                - b
    - name: case expression
      sql: 'SELECT CASE WHEN a > 1 THEN b ELSE c END AS x FROM t'
      expected_edges:
        - from_table: t
          from_field: a
          to_table: __result__
          to_field: x
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: CASE
              expression: 'CASE WHEN a > 1 THEN b ELSE c END'
        - from_table: t
          from_field: b
          to_table: __result__
          to_field: x
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: CASE
              expression: 'CASE WHEN a > 1 THEN b ELSE c END'
        - from_table: t
          from_field: c
          to_table: __result__
          to_field: x
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: CASE
              expression: 'CASE WHEN a > 1 THEN b ELSE c END'
    - name: scalar function
      sql: 'SELECT CONCAT(a, ''-'', b) AS k FROM t'
      expected_edges:
        - from_table: t
          from_field: a
          to_table: __result__
          to_field: k
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: FUNCTION
              function_name: CONCAT
              expression: 'CONCAT(a, ''-'', b)'
              arguments:
                - a
                - '''-'''
                - b
        - from_table: t
          from_field: b
          to_table: __result__
          to_field: k
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: FUNCTION
              function_name: CONCAT
              expression: 'CONCAT(a, ''-'', b)'
              arguments:
                - a
                - '''-'''
                - b
    - name: where clause is a row set influence
      sql: SELECT a FROM t WHERE b = 1
      expected_edges:
        - from_table: t
          from_field: a
          to_table: __result__
          to_field: a
          relation_type: direct
          has_transform: false
          is_temp: true
        - from_table: t
          from_field: b
          to_table: __result__
          to_field: ''
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: FILTER
              condition: b = 1
    - name: having may name a select-list alias
      sql: 'SELECT a AS k, COUNT(*) AS c FROM t GROUP BY a HAVING COUNT(*) > 1'
      expected_edges:
        - from_table: t
          from_field: a
          to_table: __result__
          to_field: k
          relation_type: direct
          has_transform: false
          is_temp: true
        - from_table: t
          from_field: '*'
          to_table: __result__
          to_field: c
          relation_type: group
          has_transform: true
          is_temp: true
          transformations:
            - operation: AGGREGATE
              function_name: COUNT
              expression: 'COUNT(*)'
              group_keys:
                - a
    - name: aggregate carries the group keys
      sql: SELECT SUM(a) AS s FROM t GROUP BY b
      expected_edges:
        - from_table: t
          from_field: a
          to_table: __result__
          to_field: s
          relation_type: group
          has_transform: true
          is_temp: true
          transformations:
            - operation: AGGREGATE
              function_name: SUM
              expression: SUM(a)
              group_keys:
                - b
    - name: window function reads its partition and order keys
      sql: SELECT ROW_NUMBER() OVER (PARTITION BY b ORDER BY c) AS rn, a FROM t
      expected_edges:
        - from_table: t
          from_field: b
          to_table: __result__
          to_field: rn
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: WINDOW
              function_name: ROW_NUMBER
              expression: ROW_NUMBER() OVER (PARTITION BY b ORDER BY c)
              partition_by:
                - b
              order_by:
                - c
        - from_table: t
          from_field: c
          to_table: __result__
          to_field: rn
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: WINDOW
              function_name: ROW_NUMBER
              expression: ROW_NUMBER() OVER (PARTITION BY b ORDER BY c)
              partition_by:
                - b
              order_by:
                - c
        - from_table: t
          from_field: a
          to_table: __result__
          to_field: a
          relation_type: direct
          has_transform: false
          is_temp: true
    - name: windowed aggregate is a window, not a group
      sql: SELECT SUM(a) OVER (PARTITION BY b) AS s FROM t
      expected_edges:
        - from_table: t
          from_field: a
          to_table: __result__
          to_field: s
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: WINDOW
              function_name: SUM
              expression: SUM(a) OVER (PARTITION BY b)
              partition_by:
                - b
        - from_table: t
          from_field: b
          to_table: __result__
          to_field: s
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: WINDOW
              function_name: SUM
              expression: SUM(a) OVER (PARTITION BY b)
              partition_by:
                - b
    - name: named window definition
      sql: SELECT SUM(a) OVER w AS s FROM t WINDOW w AS (PARTITION BY b)
      expected_edges:
        - from_table: t
          from_field: a
          to_table: __result__
          to_field: s
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: WINDOW
              function_name: SUM
              expression: SUM(a) OVER w
              partition_by:
                - b
    - name: select variable assignment produces no column
      sql: 'SELECT @v = a FROM t'
      expected_edges:
        []
    - name: unaliased expression is named by its own text
      sql: SELECT a + 1, CONCAT(a, b) FROM t
      expected_edges:
        - from_table: t
          from_field: a
          to_table: __result__
          to_field: a + 1
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: OPERATOR
              expression: a + 1
              op_type: ADDITION
        - from_table: t
          from_field: a
          to_table: __result__
          to_field: CONCAT(a, b)
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: FUNCTION
              function_name: CONCAT
              expression: CONCAT(a, b)
              arguments:
                - a
                - b
        - from_table: t
          from_field: b
          to_table: __result__
          to_field: CONCAT(a, b)
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: FUNCTION
              function_name: CONCAT
              expression: CONCAT(a, b)
              arguments:
                - a
                - b
