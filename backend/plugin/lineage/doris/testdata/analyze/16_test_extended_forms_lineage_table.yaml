name: TestExtendedFormsLineage_Table
cases:
    - name: window_row_number
      sql: SELECT name, ROW_NUMBER() OVER (PARTITION BY department_id ORDER BY salary) AS rn FROM employees
      expected_edges:
        - from_table: employees
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: direct
          is_temp: true
        - from_table: employees
          from_field: department_id
          to_table: __result__
          to_field: rn
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: WINDOW
              function_name: ROW_NUMBER
              expression: ROW_NUMBER()OVER(PARTITIONBYdepartment_idORDERBYsalary)
              partition_by:
                - department_id
              order_by:
                - salary
        - from_table: employees
          from_field: salary
          to_table: __result__
          to_field: rn
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: WINDOW
              function_name: ROW_NUMBER
              expression: ROW_NUMBER()OVER(PARTITIONBYdepartment_idORDERBYsalary)
              partition_by:
                - department_id
              order_by:
                - salary
    - name: window_aggregate_over
      sql: SELECT product_id, SUM(amount) OVER (PARTITION BY product_id ORDER BY sale_date) AS running_total FROM sales
      expected_edges:
        - from_table: sales
          from_field: product_id
          to_table: __result__
          to_field: product_id
          relation_type: direct
          is_temp: true
        - from_table: sales
          from_field: amount
          to_table: __result__
          to_field: running_total
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: WINDOW
              function_name: SUM
              expression: SUM(amount)OVER(PARTITIONBYproduct_idORDERBYsale_date)
              group_keys: []
              partition_by:
                - product_id
              order_by:
                - sale_date
        - from_table: sales
          from_field: product_id
          to_table: __result__
          to_field: running_total
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: WINDOW
              function_name: SUM
              expression: SUM(amount)OVER(PARTITIONBYproduct_idORDERBYsale_date)
              group_keys: []
              partition_by:
                - product_id
              order_by:
                - sale_date
        - from_table: sales
          from_field: sale_date
          to_table: __result__
          to_field: running_total
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: WINDOW
              function_name: SUM
              expression: SUM(amount)OVER(PARTITIONBYproduct_idORDERBYsale_date)
              group_keys: []
              partition_by:
                - product_id
              order_by:
                - sale_date
    - name: case_expression
      sql: SELECT CASE WHEN salary > 100 THEN 'hi' ELSE name END AS band FROM employees
      expected_edges:
        - from_table: employees
          from_field: salary
          to_table: __result__
          to_field: band
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: CASE
              expression: CASEWHENsalary>100THEN'hi'ELSEnameEND
        - from_table: employees
          from_field: name
          to_table: __result__
          to_field: band
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: CASE
              expression: CASEWHENsalary>100THEN'hi'ELSEnameEND
    - name: coalesce
      sql: SELECT COALESCE(name, 'unknown') AS n FROM employees
      expected_edges:
        - from_table: employees
          from_field: name
          to_table: __result__
          to_field: n
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: FUNCTION
              function_name: COALESCE
              expression: COALESCE(name,'unknown')
              arguments:
                - name
                - '''unknown'''
    - name: group_concat
      sql: SELECT department_id, GROUP_CONCAT(name) AS names FROM employees GROUP BY department_id
      expected_edges:
        - from_table: employees
          from_field: department_id
          to_table: __result__
          to_field: department_id
          relation_type: direct
          is_temp: true
        - from_table: employees
          from_field: name
          to_table: __result__
          to_field: names
          relation_type: group
          has_transform: true
          is_temp: true
          transformations:
            - operation: AGGREGATE
              function_name: GROUP_CONCAT
              expression: GROUP_CONCAT(name)
              group_keys:
                - department_id
    - name: count_distinct
      sql: SELECT COUNT(DISTINCT department_id) AS c FROM employees
      expected_edges:
        - from_table: employees
          from_field: department_id
          to_table: __result__
          to_field: c
          relation_type: group
          has_transform: true
          is_temp: true
          transformations:
            - operation: AGGREGATE
              function_name: COUNT
              expression: COUNT(DISTINCTdepartment_id)
              group_keys: []
    - name: star_join_with_aliases
      sql: SELECT * FROM employees e JOIN departments d ON e.department_id = d.id
      expected_edges:
        - from_table: employees
          from_field: '*'
          to_table: __result__
          to_field: '*'
          relation_type: direct
          is_temp: true
        - from_table: departments
          from_field: '*'
          to_table: __result__
          to_field: '*'
          relation_type: direct
          is_temp: true
        - from_table: employees
          from_field: department_id
          to_table: __result__
          to_field: ""
          relation_type: join
          is_temp: true
          transformations:
            - operation: JOIN
              condition: e.department_id=d.id
        - from_table: departments
          from_field: id
          to_table: __result__
          to_field: ""
          relation_type: join
          is_temp: true
          transformations:
            - operation: JOIN
              condition: e.department_id=d.id
    - name: table_star_with_alias
      sql: SELECT e.*, d.name FROM employees e JOIN departments d ON e.department_id = d.id
      expected_edges:
        - from_table: employees
          from_field: '*'
          to_table: __result__
          to_field: '*'
          relation_type: direct
          is_temp: true
        - from_table: departments
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: direct
          is_temp: true
        - from_table: employees
          from_field: department_id
          to_table: __result__
          to_field: ""
          relation_type: join
          is_temp: true
          transformations:
            - operation: JOIN
              condition: e.department_id=d.id
        - from_table: departments
          from_field: id
          to_table: __result__
          to_field: ""
          relation_type: join
          is_temp: true
          transformations:
            - operation: JOIN
              condition: e.department_id=d.id
    - name: count_star_with_alias
      sql: SELECT COUNT(*) AS c FROM employees e
      expected_edges:
        - from_table: employees
          from_field: '*'
          to_table: __result__
          to_field: c
          relation_type: group
          has_transform: true
          is_temp: true
          transformations:
            - operation: AGGREGATE
              function_name: COUNT
              expression: COUNT(*)
              group_keys: []
    - name: comma_join
      sql: SELECT e.name, d.name AS dn FROM employees e, departments d WHERE e.department_id = d.id
      expected_edges:
        - from_table: employees
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: direct
          is_temp: true
        - from_table: departments
          from_field: name
          to_table: __result__
          to_field: dn
          relation_type: direct
          is_temp: true
        - from_table: employees
          from_field: department_id
          to_table: __result__
          to_field: ""
          relation_type: indirect
          is_temp: true
          transformations:
            - operation: FILTER
              condition: e.department_id=d.id
        - from_table: departments
          from_field: id
          to_table: __result__
          to_field: ""
          relation_type: indirect
          is_temp: true
          transformations:
            - operation: FILTER
              condition: e.department_id=d.id
    - name: scalar_subquery
      sql: SELECT (SELECT MAX(salary) FROM employees) AS m FROM departments
      expected_edges:
        - from_table: employees
          from_field: salary
          to_table: __result__
          to_field: m
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: PROJECT
              expression: (SELECTMAX(salary)FROMemployees)
    - name: scalar_subquery_alongside_outer_columns
      sql: SELECT id, (SELECT COUNT(*) FROM orders) AS c FROM users
      expected_edges:
        - from_table: users
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: direct
          is_temp: true
        - from_table: orders
          from_field: '*'
          to_table: __result__
          to_field: c
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: PROJECT
              expression: (SELECTCOUNT(*)FROMorders)
    - name: set_operation_nested_in_derived_table
      sql: SELECT u.id FROM (SELECT id FROM t1 UNION ALL SELECT id FROM t2) u
      expected_edges:
        - from_table: t1
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: union
          is_temp: true
          transformations:
            - operation: UNION
        - from_table: t2
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: union
          is_temp: true
          transformations:
            - operation: UNION
    - name: set_operation_nested_in_cte
      sql: WITH c AS (SELECT id FROM t1 UNION ALL SELECT id FROM t2) SELECT id FROM c
      expected_edges:
        - from_table: t1
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: union
          is_temp: true
          transformations:
            - operation: UNION
        - from_table: t2
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: union
          is_temp: true
          transformations:
            - operation: UNION
    - name: cte_star_with_alias
      sql: WITH c AS (SELECT id, name FROM users) SELECT x.* FROM c x
      expected_edges:
        - from_table: users
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: direct
          is_temp: true
        - from_table: users
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: direct
          is_temp: true
    - name: constant expression has no lineage
      sql: SELECT '2020-01-01' AS s FROM t
      expected_edges: []
    - name: volatile expression has no lineage
      sql: SELECT DATE_SUB(NOW(), INTERVAL 1 YEAR) AS d FROM t
      expected_edges: []
    # The engine names an unaliased output column after the column itself, so a
    # quoted identifier contributes its bare name. The quoting used to survive
    # because the name was inferred from the expression text, which the MySQL
    # analyzer has always read as `created-at` for the same statement.
    - name: quoted identifier with an operator character is direct
      sql: SELECT `created-at` FROM t
      expected_edges:
        - from_table: t
          from_field: created-at
          to_table: __result__
          to_field: created-at
          relation_type: direct
          has_transform: false
          is_temp: true
    - name: group keys are recorded on the aggregate
      sql: SELECT department, COUNT(*) AS emp_count FROM employees GROUP BY department
      expected_edges:
        - from_table: employees
          from_field: department
          to_table: __result__
          to_field: department
          relation_type: direct
          is_temp: true
        - from_table: employees
          from_field: '*'
          to_table: __result__
          to_field: emp_count
          relation_type: group
          has_transform: true
          is_temp: true
          transformations:
            - operation: AGGREGATE
              function_name: COUNT
              expression: COUNT(*)
              group_keys:
                - department
    - name: several group keys keep their written order
      sql: SELECT department, category, COUNT(*) AS n FROM products GROUP BY department, category
      expected_edges:
        - from_table: products
          from_field: department
          to_table: __result__
          to_field: department
          relation_type: direct
          is_temp: true
        - from_table: products
          from_field: category
          to_table: __result__
          to_field: category
          relation_type: direct
          is_temp: true
        - from_table: products
          from_field: '*'
          to_table: __result__
          to_field: n
          relation_type: group
          has_transform: true
          is_temp: true
          transformations:
            - operation: AGGREGATE
              function_name: COUNT
              expression: COUNT(*)
              group_keys:
                - department
                - category
    - name: an aggregate expression carries its keys
      sql: SELECT SUM(price) + 1 AS top_price FROM products GROUP BY department
      expected_edges:
        - from_table: products
          from_field: price
          to_table: __result__
          to_field: top_price
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: OPERATOR
              expression: SUM(price)+1
              op_type: ADDITION
              group_keys:
                - department
    - name: a windowed aggregate records no keys
      sql: SELECT SUM(price) OVER (PARTITION BY department) AS running FROM products GROUP BY department, price
      expected_edges:
        - from_table: products
          from_field: price
          to_table: __result__
          to_field: running
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: WINDOW
              function_name: SUM
              expression: SUM(price)OVER(PARTITIONBYdepartment)
              group_keys: []
              partition_by:
                - department
        - from_table: products
          from_field: department
          to_table: __result__
          to_field: running
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: WINDOW
              function_name: SUM
              expression: SUM(price)OVER(PARTITIONBYdepartment)
              group_keys: []
              partition_by:
                - department
    - name: an aggregate inside a subquery records no keys
      sql: SELECT (SELECT COUNT(*) FROM orders) AS n FROM users GROUP BY users.id
      expected_edges:
        - from_table: orders
          from_field: '*'
          to_table: __result__
          to_field: n
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: PROJECT
              expression: (SELECTCOUNT(*)FROMorders)
              group_keys: []