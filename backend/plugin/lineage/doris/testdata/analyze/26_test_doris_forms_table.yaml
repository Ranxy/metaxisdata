name: TestDorisForms_Table
# Syntax Doris accepts that the StarRocks grammar does not. Each case pins the
# lineage the new shape must keep producing, not merely that it parses.
cases:
    # Doris declares ROLLUP on the GROUP BY clause; the grouping keys are the
    # same, so the aggregate edge is unchanged.
    - name: GROUP BY WITH ROLLUP keeps the aggregate's group keys
      sql: SELECT dept, COUNT(*) AS c FROM emp GROUP BY dept WITH ROLLUP
      expected_edges:
        - from_table: emp
          from_field: dept
          to_table: __result__
          to_field: dept
          relation_type: direct
          is_temp: true
        - from_table: emp
          from_field: '*'
          to_table: __result__
          to_field: c
          relation_type: group
          has_transform: true
          is_temp: true
          transformations:
            - operation: AGGREGATE
              function_name: COUNT
              expression: COUNT(*)
              group_keys:
                - dept
    # An array slice is an expression over the column it slices, and the derived
    # column name is the whole source text.
    - name: an array slice reads the column it slices
      sql: SELECT a[1:2] FROM t
      expected_edges:
        - from_table: t
          from_field: a
          to_table: __result__
          to_field: a[1:2]
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: PROJECT
              expression: a[1:2]
    # CONVERT(x USING charset) is Doris's charset conversion; the aliased form
    # still records the function and its argument.
    - name: CONVERT USING is a function over its argument
      sql: SELECT CONVERT(a USING utf8) AS converted FROM t
      expected_edges:
        - from_table: t
          from_field: a
          to_table: __result__
          to_field: converted
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: FUNCTION
              function_name: CONVERT
              expression: CONVERT(aUSINGutf8)
              arguments: [a]
    # A TABLESAMPLE suffix restricts the rows read without changing which
    # relation the wildcard expands.
    - name: TABLESAMPLE leaves the table's wildcard lineage alone
      sql: SELECT * FROM t TABLESAMPLE(10 PERCENT)
      expected_edges:
        - from_table: t
          from_field: '*'
          to_table: __result__
          to_field: '*'
          relation_type: direct
          is_temp: true
    # Doris's asynchronous materialized view is refreshed on a schedule; its
    # body is still the query that defines the target columns.
    - name: an asynchronous materialized view keeps its body's lineage
      sql: CREATE MATERIALIZED VIEW mv REFRESH ASYNC AS SELECT id, amount FROM t1
      expected_edges:
        - from_table: t1
          from_field: id
          to_table: mv
          to_field: id
          relation_type: direct
          is_temp: false
        - from_table: t1
          from_field: amount
          to_table: mv
          to_field: amount
          relation_type: direct
          is_temp: false
