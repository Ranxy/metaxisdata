name: TestSelectLineage_Table
cases:
    - name: simple select with qualified columns
      sql: SELECT users.id, users.name FROM users
      expected_edges:
        - from_table: users
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: direct
          is_temp: true
        - from_table: users
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: direct
          is_temp: true
    - name: select with column aliases
      sql: SELECT users.id AS user_id, users.name AS user_name FROM users
      expected_edges:
        - from_table: users
          from_field: id
          to_table: __result__
          to_field: user_id
          relation_type: direct
          is_temp: true
        - from_table: users
          from_field: name
          to_table: __result__
          to_field: user_name
          relation_type: direct
          is_temp: true
    - name: select with function expression
      sql: SELECT id, CONCAT(first_name, ' ', last_name) AS full_name FROM users
      expected_edges:
        - from_table: users
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: direct
          has_transform: false
          is_temp: true
        - from_table: users
          from_field: first_name
          to_table: __result__
          to_field: full_name
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: FUNCTION
              function_name: CONCAT
              expression: CONCAT(first_name,' ',last_name)
              arguments:
                - first_name
                - ''' '''
                - last_name
        - from_table: users
          from_field: last_name
          to_table: __result__
          to_field: full_name
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: FUNCTION
              function_name: CONCAT
              expression: CONCAT(first_name,' ',last_name)
              arguments:
                - first_name
                - ''' '''
                - last_name
    - name: select with aggregate expression
      sql: SELECT tag, COUNT(*) AS cnt FROM users GROUP BY tag
      expected_edges:
        - from_table: users
          from_field: tag
          to_table: __result__
          to_field: tag
          relation_type: direct
          is_temp: true
        - from_table: users
          from_field: '*'
          to_table: __result__
          to_field: cnt
          relation_type: group
          has_transform: true
          is_temp: true
          transformations:
            - operation: AGGREGATE
              function_name: COUNT
              expression: COUNT(*)
              group_keys:
                - tag
    - name: select with window function
      sql: SELECT id, ROW_NUMBER() OVER (PARTITION BY tag ORDER BY id) AS rn FROM users
      expected_edges:
        - from_table: users
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: direct
          is_temp: true
        - from_table: users
          from_field: tag
          to_table: __result__
          to_field: rn
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: WINDOW
              function_name: ROW_NUMBER
              expression: ROW_NUMBER()OVER(PARTITIONBYtagORDERBYid)
              partition_by:
                - tag
              order_by:
                - id
        - from_table: users
          from_field: id
          to_table: __result__
          to_field: rn
          relation_type: indirect
          has_transform: true
          is_temp: true
          transformations:
            - operation: WINDOW
              function_name: ROW_NUMBER
              expression: ROW_NUMBER()OVER(PARTITIONBYtagORDERBYid)
              partition_by:
                - tag
              order_by:
                - id
    - name: select with WHERE clause
      sql: SELECT id, name FROM users WHERE age > 30
      expected_edges:
        - from_table: users
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: direct
          is_temp: true
        - from_table: users
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: direct
          is_temp: true
        - from_table: users
          from_field: age
          to_table: __result__
          to_field: ""
          relation_type: indirect
          is_temp: true
          transformations:
            - operation: FILTER
              condition: age>30
    - name: select star without catalog
      sql: SELECT * FROM users
      expected_edges:
        - from_table: users
          from_field: '*'
          to_table: __result__
          to_field: '*'
          relation_type: direct
          is_temp: true
    - name: select star with catalog expansion
      sql: SELECT * FROM users
      catalog:
        tables:
          users: [id, name, email]
      expected_edges:
        - from_table: users
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: direct
          is_temp: true
        - from_table: users
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: direct
          is_temp: true
        - from_table: users
          from_field: email
          to_table: __result__
          to_field: email
          relation_type: direct
          is_temp: true
    - name: select star except with catalog expansion
      sql: SELECT * EXCEPT (email) FROM users
      catalog:
        tables:
          users: [id, name, email]
      expected_edges:
        - from_table: users
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: direct
          is_temp: true
        - from_table: users
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: direct
          is_temp: true
    - name: select with database-qualified table
      sql: SELECT mydb.users.id, mydb.users.name FROM mydb.users
      expected_edges:
        - from_database: mydb
          from_table: users
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: direct
          is_temp: true
        - from_database: mydb
          from_table: users
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: direct
          is_temp: true
    - name: select table wildcard
      sql: SELECT users.* FROM users
      expected_edges:
        - from_table: users
          from_field: '*'
          to_table: __result__
          to_field: '*'
          relation_type: direct
          is_temp: true
    - name: select with join
      sql: SELECT a.id AS aid, b.name AS bname FROM t1 a JOIN t2 b ON a.id = b.id
      expected_edges:
        - from_table: t1
          from_field: id
          to_table: __result__
          to_field: aid
          relation_type: direct
          is_temp: true
        - from_table: t2
          from_field: name
          to_table: __result__
          to_field: bname
          relation_type: direct
          is_temp: true
        - from_table: t1
          from_field: id
          to_table: __result__
          to_field: ""
          relation_type: join
          is_temp: true
          transformations:
            - operation: JOIN
              condition: a.id=b.id
        - from_table: t2
          from_field: id
          to_table: __result__
          to_field: ""
          relation_type: join
          is_temp: true
          transformations:
            - operation: JOIN
              condition: a.id=b.id