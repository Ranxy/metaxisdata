name: TestCTELineage_Table
cases:
    - name: simple CTE
      sql: WITH active_users AS (SELECT id, name FROM users WHERE status = 'active') SELECT au.id, au.name FROM active_users au
      expected_edges:
        - from_table: users
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: direct
          is_temp: true
        - from_table: users
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: direct
          is_temp: true
        - from_table: users
          from_field: status
          to_table: __result__
          to_field: ""
          relation_type: indirect
          is_temp: true
          transformations:
            - operation: FILTER
              condition: status='active'
    - name: multiple CTEs with join
      sql: WITH active_users AS (SELECT id, name FROM users WHERE status = 'active'), user_orders AS (SELECT user_id, COUNT(*) AS order_count FROM orders GROUP BY user_id) SELECT au.id, au.name, uo.order_count FROM active_users au LEFT JOIN user_orders uo ON au.id = uo.user_id
      expected_edges:
        - from_table: users
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: direct
          is_temp: true
        - from_table: users
          from_field: name
          to_table: __result__
          to_field: name
          relation_type: direct
          is_temp: true
        - from_table: orders
          from_field: '*'
          to_table: __result__
          to_field: order_count
          relation_type: group
          has_transform: true
          is_temp: true
          transformations:
            - operation: AGGREGATE
              function_name: COUNT
              expression: COUNT(*)
              group_keys:
                - user_id
        - from_table: users
          from_field: status
          to_table: __result__
          to_field: ""
          relation_type: indirect
          is_temp: true
          transformations:
            - operation: FILTER
              condition: status='active'
        - from_table: users
          from_field: id
          to_table: __result__
          to_field: ""
          relation_type: join
          is_temp: true
          transformations:
            - operation: JOIN
              condition: au.id=uo.user_id
        - from_table: orders
          from_field: user_id
          to_table: __result__
          to_field: ""
          relation_type: join
          is_temp: true
          transformations:
            - operation: JOIN
              condition: au.id=uo.user_id
    - name: chained CTEs
      sql: WITH base AS (SELECT id, amount FROM orders), agg AS (SELECT id, SUM(amount) AS total FROM base GROUP BY id) SELECT agg.id, agg.total FROM agg
      expected_edges:
        - from_table: orders
          from_field: id
          to_table: __result__
          to_field: id
          relation_type: direct
          is_temp: true
        - from_table: orders
          from_field: amount
          to_table: __result__
          to_field: total
          relation_type: group
          has_transform: true
          is_temp: true
          transformations:
            - operation: AGGREGATE
              function_name: SUM
              expression: SUM(amount)
              group_keys:
                - id
    - name: CTE with explicit column aliases
      sql: WITH c (a, b) AS (SELECT id, name FROM users) SELECT c.a, c.b FROM c
      expected_edges:
        - from_table: users
          from_field: id
          to_table: __result__
          to_field: a
          relation_type: direct
          is_temp: true
        - from_table: users
          from_field: name
          to_table: __result__
          to_field: b
          relation_type: direct
          is_temp: true