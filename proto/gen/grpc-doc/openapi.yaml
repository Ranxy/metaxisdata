    /v1/lineages:
        get:
            tags:
                - LineageService
            description: |-
                GetLineage returns the lineage relations for the given metadata.
                 The lineage relations can be either source lineage or target lineage,
                 depending on the lineage_type specified in the request.
                 If lineage_type is not specified, both source and target lineage will be returned.
            operationId: LineageService_GetLineage
            parameters:
                - name: guid
                  in: query
                  description: |-
                    The global unique id for metadata
                     table: "instance_1;db2;schema3;table4"
                  schema:
                    type: string
                - name: metaType
                  in: query
                  schema:
                    enum:
                        - UNSPECIFIED
                        - INSTANCE
                        - DATABASE
                        - SCHEMA
                        - TABLE
                        - EXTERNAL_TABLE
                        - EXTERNAL_DATASET
                        - MANUAL_SQL
                        - APPLICATION_SQL
                        - VIEW
                        - MATERIALIZED_VIEW
                        - COLUMN
                        - INDEX
                        - FOREIGN_KEY
                        - PROCEDURE
                        - FUNCTION
                        - SEQUENCE
                        - OPENLINEAGE
                    type: string
                    format: enum
                - name: lineageType
                  in: query
                  description: The lineage type to query, source or target. If not specified, both source and target lineage will be returned.
                  schema:
                    enum:
                        - LINEAGE_TYPE_UNSPECIFIED
                        - SOURCE
                        - TARGET
                    type: string
                    format: enum
                - name: pageSize
                  in: query
                  description: |-
                    The maximum number of relations to return. The service may return fewer
                     than this value. page_size applies to relations_source and relations_target
                     separately.
                     If unspecified, at most 500 relations are returned per list. The maximum
                     value is 5000; values above 5000 will be coerced to 5000.
                  schema:
                    type: integer
                    format: int32
                - name: pageToken
                  in: query
                  description: |-
                    A page token, received from a previous `GetLineage` call.
                     Provide this to retrieve the subsequent page.

                     When paginating, all other parameters provided to `GetLineage` must match
                     the call that provided the page token.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetLineageResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/lineages:analyzeSql:
        post:
            tags:
                - LineageService
            description: |-
                AnalyzeSQL parses an arbitrary SQL statement and returns its column-level
                 relations, resolved against one or more analysis scopes. The analysis is
                 stateless: nothing is persisted and no lineage runner is triggered, so the
                 result describes this statement only and is not part of the stored graph.
            operationId: LineageService_AnalyzeSQL
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AnalyzeSQLRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AnalyzeSQLResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/lineages:context:
        get:
            tags:
                - LineageService
            description: GetLineageForContext retrieves the field-level lineage graph derived from a specific SQL context (e.g., view, stored procedure).
            operationId: LineageService_GetLineageForContext
            parameters:
