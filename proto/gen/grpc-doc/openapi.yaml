                        $ref: '#/components/schemas/ColumnProfile'
        ProfileValue:
            type: object
            properties:
                value:
                    type: string
                count:
                    type: string
            description: ProfileValue is one frequent value of a low-cardinality column.
        QualityFilter:
            type: object
            properties:
                clauses:
                    type: array
                    items:
                        $ref: '#/components/schemas/QualityFilterClause'
            description: |-
                QualityFilter is the AND filter a rule applies before observing. Values are
                 encoded as strings and converted by the compiler using the column's type; no
                 user text reaches SQL unparameterized.
        QualityFilterClause:
            type: object
            properties:
                column:
                    type: string
                op:
                    enum:
                        - QUALITY_FILTER_OPERATOR_UNSPECIFIED
                        - QUALITY_FILTER_OPERATOR_EQ
                        - QUALITY_FILTER_OPERATOR_NE
                        - QUALITY_FILTER_OPERATOR_LT
                        - QUALITY_FILTER_OPERATOR_LTE
                        - QUALITY_FILTER_OPERATOR_GT
                        - QUALITY_FILTER_OPERATOR_GTE
                        - QUALITY_FILTER_OPERATOR_IN
                        - QUALITY_FILTER_OPERATOR_NOT_IN
                        - QUALITY_FILTER_OPERATOR_IS_NULL
                        - QUALITY_FILTER_OPERATOR_IS_NOT_NULL
                    type: string
                    format: enum
                values:
                    type: array
                    items:
                        type: string
                    description: Unused by IS_NULL / IS_NOT_NULL, at most 100 values for IN / NOT_IN.
            description: QualityFilterClause is one comparison in a QualityFilter.
        QualityIssue:
            type: object
            properties:
                name:
                    type: string
                    description: 'Format: workspaces/{workspace}/qualityIssues/{quality_issue}'
                rule:
                    type: string
                    description: 'Format: workspaces/{workspace}/qualityRules/{quality_rule}'
                target:
                    allOf:
                        - $ref: '#/components/schemas/QualityTarget'
                    description: The target as it was when the issue was opened.
                status:
                    enum:
                        - QUALITY_ISSUE_STATUS_UNSPECIFIED
                        - QUALITY_ISSUE_STATUS_OPEN
                        - QUALITY_ISSUE_STATUS_ACKNOWLEDGED
                        - QUALITY_ISSUE_STATUS_RESOLVED
                    type: string
                    format: enum
                severity:
                    enum:
                        - QUALITY_SEVERITY_UNSPECIFIED
                        - QUALITY_SEVERITY_WARNING
                        - QUALITY_SEVERITY_ERROR
                        - QUALITY_SEVERITY_CRITICAL
                    type: string
                    format: enum
                firstSeenRun:
                    type: string
                    description: The run that opened the issue. Unset when it was opened without a run.
                lastSeenRun:
                    type: string
                    description: The newest run that observed the problem again.
                firstSeenTime:
                    type: string
                    format: date-time
                lastSeenTime:
                    type: string
                    format: date-time
                resolvedTime:
                    type: string
                    description: When the issue was resolved. Unset while it is open or acknowledged.
