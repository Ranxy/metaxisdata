                    type: string
                    description: 'Format: workspaces/{workspace}. "workspaces/-" is the current workspace.'
                rule:
                    allOf:
                        - $ref: '#/components/schemas/QualityRule'
                    description: The rule to validate, typically one that has not been saved yet.
        PreviewQualityRuleResponse:
            type: object
            properties:
                compiledSql:
                    type: string
