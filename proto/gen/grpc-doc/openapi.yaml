                collationConnection:
                    type: string
                databaseCollation:
                    type: string
                sqlMode:
                    type: string
                comment:
                    type: string
                skipDump:
                    type: boolean
            description: ProcedureMetadata is the metadata for procedures.
        ProfileColumnsRequest:
