                workTablespace:
                    type: string
                sdoLevel:
                    type: integer
                    format: int32
                commitInterval:
                    type: integer
                    format: int32
                padIndex:
                    type: boolean
                    description: SQL Server parameters.
                sortInTempdb:
                    type: string
