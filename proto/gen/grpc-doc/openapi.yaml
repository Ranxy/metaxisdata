                resolutionReason:
                    enum:
                        - QUALITY_RESOLUTION_REASON_UNSPECIFIED
                        - QUALITY_RESOLUTION_REASON_FIXED
                        - QUALITY_RESOLUTION_REASON_EXPECTED
                        - QUALITY_RESOLUTION_REASON_NO_ACTION_NEEDED
                        - QUALITY_RESOLUTION_REASON_DUPLICATE
                        - QUALITY_RESOLUTION_REASON_AUTO_RECOVERED
                    type: string
                    format: enum
                resolutionNote:
                    type: string
                    description: The note recorded with the resolution.
                acknowledgedBy:
                    type: string
                    description: 'Who acknowledged it. Format: users/{user}. Empty when never acknowledged.'
                acknowledgedTime:
                    type: string
                    format: date-time
                mutedUntil:
                    type: string
                    description: |-
                        Issue-level mute: notifications are suppressed until it passes, while the
                         rule keeps running and results keep being recorded.
                    format: date-time
                occurrenceCount:
                    type: integer
                    description: How many runs observed the problem while the issue was unresolved.
                    format: int32
            description: |-
                QualityIssue is the durable problem behind a rule's failures. A rule has at
                 most one unresolved issue; a later failing run touches it instead of opening
                 another, and a resolved issue is never reopened.
        QualityOverview:
            type: object
