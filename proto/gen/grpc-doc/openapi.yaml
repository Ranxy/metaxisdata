                    type: string
                    description: The schema dump from metadata.
            description: MetadataSchemaString is the schema define for metadata.
        NamespaceMapping:
            required:
                - namespace
                - instanceResourceId
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        The name of the namespace mapping.
                         Format: openlineage/namespaceMappings/{namespace_mapping}
                namespace:
                    type: string
                instanceResourceId:
                    type: string
                databaseName:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
        Notification:
            type: object
            properties:
                id:
                    type: string
                    description: The notification row's primary key.
                createTime:
                    type: string
                    format: date-time
                parent:
                    type: string
                    description: 'Format: workspaces/{workspace}'
                recipientId:
                    type: integer
                    description: The principal id this message is for.
                    format: int32
                type:
                    enum:
                        - NOTIFICATION_TYPE_UNSPECIFIED
                        - NOTIFICATION_TYPE_SCHEMA_SYNC
                        - NOTIFICATION_TYPE_OPENLINEAGE
                        - NOTIFICATION_TYPE_DATA_QUALITY
                    type: string
                    format: enum
                severity:
                    enum:
                        - NOTIFICATION_SEVERITY_UNSPECIFIED
                        - NOTIFICATION_SEVERITY_INFO
                        - NOTIFICATION_SEVERITY_WARNING
                        - NOTIFICATION_SEVERITY_ERROR
                    type: string
                    format: enum
                readTime:
                    type: string
                    description: |-
                        When the recipient read it. Unset means unread. Backed by notification.read_at,
                         not by the payload, so the unread count can be answered from a partial index.
                    format: date-time
                dedupeKey:
                    type: string
                    description: |-
                        Notification deduplication key, empty when the message is not deduplicated.
                         Format: <event>:<target>:<bucket>, where the bucket is a timestamp aligned
                         to the event's suppression window.
                schemaSync:
                    $ref: '#/components/schemas/SchemaSyncDetail'
                openlineage:
                    $ref: '#/components/schemas/OpenLineageDetail'
                dataQuality:
                    $ref: '#/components/schemas/DataQualityDetail'
            description: |-
                Notification is one in-app message for one recipient: the outcome of a sync
                 operation the recipient asked for, or an ingestion failure the workspace
                 administrators need to see. It is personal data, so every read is scoped by
                 recipient_id rather than by the workspace.

                 id, create_time, recipient_id, read_time and dedupe_key are columns of the
                 notification table and are not written into the payload; the store stamps
                 them on insert and fills them from the row on read, so the payload and the
                 columns cannot disagree. The payload holds only the message proper.
        NullPercentConfig:
            type: object
            properties:
                column:
                    type: string
                maxNullCount:
                    type: string
                warnNullCount:
                    type: string
                maxNullPct:
                    type: number
                    format: double
                warnNullPct:
                    type: number
                    format: double
                nullValues:
                    type: array
                    items:
                        type: string
                    description: |-
                        Values that also count as missing, besides SQL NULL. Encoded as strings and
                         converted with the column's type; at most 20.
            description: |-
                NullPercentConfig bounds a column's nulls. Exactly one of the count pair and
                 the percentage pair carries the fail threshold; each pair's warn field is
                 optional and must not exceed the fail threshold.
        OAuth2IdentityProviderConfig:
            required:
                - fieldMapping
            type: object
            properties:
                authUrl:
                    type: string
                    description: |-
                        The authorization endpoint the browser is sent to. Not used by the server:
                         the client builds the authorize URL from it.
                tokenUrl:
                    type: string
                    description: The token endpoint. Required.
                userInfoUrl:
                    type: string
                    description: 'The userinfo endpoint. Required: the login reads the claims from here.'
                clientId:
                    type: string
                    description: The client id. Required. Not a secret; it travels in the authorize URL.
                clientSecret:
                    writeOnly: true
                    type: string
                    description: |-
                        The client secret. Required on create. Never returned by a read, and an
                         empty value on update keeps the stored one.

                         It is stored encrypted with the deployment's data key (see
                         `backend/common/crypto`), so a database reader without the key cannot
                         authenticate as this application to the provider.
                scopes:
                    type: array
                    items:
                        type: string
                    description: The scopes to request.
                fieldMapping:
                    allOf:
                        - $ref: '#/components/schemas/FieldMapping'
                    description: The claim mapping.
                skipTlsVerify:
                    type: boolean
                    description: |-
                        Whether to skip TLS certificate verification on the provider's endpoints.

                         Off by default and off is the only safe setting: with it on, anyone able to
                         intercept the connection can forge the userinfo response and take over every
                         account bound to this provider. The settings page warns when it is enabled.
                authStyle:
                    enum:
                        - OAUTH2_AUTH_STYLE_UNSPECIFIED
                        - IN_PARAMS
                        - IN_HEADER
                    type: string
                    description: How the client id and secret are sent to the token endpoint.
                    format: enum
            description: OAuth2IdentityProviderConfig is an OAuth2 provider's configuration.
        OAuth2IdentityProviderContext:
            type: object
            properties:
                code:
                    type: string
                state:
                    type: string
                    description: |-
                        The state issued by CreateSSOState. Required: the server rejects a login
                         whose state is missing, unknown or already used.
                codeVerifier:
                    type: string
                    description: |-
                        code_verifier is the PKCE verifier matching the code_challenge sent to the
                         identity provider. Optional; providers that do not use PKCE ignore it.
        OAuth2IdentityProviderTestRequestContext:
            type: object
            properties:
                code:
                    type: string
                    description: The authorization code the provider returned to the callback.
                codeVerifier:
                    type: string
                    description: The code_verifier matching the code_challenge sent to the provider.
        OAuthAuthorizationRequest:
            type: object
            properties:
                name:
                    type: string
                    description: 'Format: oauthAuthorizationRequests/{request_id}'
                clientName:
                    type: string
                    description: |-
                        The client's self-reported name, as registered. It is not verified: it is
                         shown so the user can tell clients apart, not relied upon.
                redirectUri:
                    type: string
                    description: |-
                        Where the authorization code will be delivered. Shown in full so the user
                         can recognise a redirect they did not expect.
                resource:
                    type: string
                    description: |-
                        The resource the client asked for, which must be this deployment's MCP
                         endpoint.
                scopes:
                    type: array
                    items:
                        type: string
                    description: The scopes the client asked for.
                createTime:
                    type: string
                    format: date-time
                expireTime:
                    type: string
                    format: date-time
                requestIp:
                    type: string
                    description: |-
                        The source address the request came from, as the server sees it (it follows
                         the trusted-proxy rules).
            description: |-
                OAuthAuthorizationRequest is one pending OAuth 2.1 authorization request. It
                 is display-only: the server trusts nothing the consent page sends back except
                 the approve decision, and never exposes the authorization code, the PKCE
                 challenge or the client's polling state here.
