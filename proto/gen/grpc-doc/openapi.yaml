        SyncDatabaseResult:
            type: object
            properties:
                database:
                    type: string
                    description: 'Format: instances/{instance}/databases/{database}'
                state:
                    enum:
                        - SYNC_DATABASE_STATE_UNSPECIFIED
                        - SYNC_DATABASE_STATE_SUCCEEDED
                        - SYNC_DATABASE_STATE_FAILED
                        - SYNC_DATABASE_STATE_UNFINISHED
                    type: string
                    format: enum
                error:
                    type: string
                    description: Truncated before it is stored, so one runaway error cannot bloat the row.
            description: SyncDatabaseResult is one database's outcome in a schema sync operation.
        SyncInstanceRequest:
            required:
                - name
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        The name of instance.
                         Format: instances/{instance}
                enableFullSync:
                    type: boolean
                    description: |-
                        Whether the sync also refreshes every existing database of the instance.

                         Unset means true: a user-triggered sync refreshes the metadata and every database,
                         which is what the background scan and instance creation already do. Set it to false
                         only for a discovery-only sync that refreshes the instance metadata and queues the
                         databases that were just discovered, leaving the existing ones to the background scan.
        SyncInstanceResponse:
            type: object
            properties:
                databases:
                    type: array
                    items:
                        type: string
                    description: All database name list in the instance.
        TableMetadata:
            type: object
            properties:
                name:
                    type: string
                    description: The name of the table.
                columns:
                    type: array
                    items:
                        $ref: '#/components/schemas/ColumnMetadata'
                    description: The columns is the ordered list of columns in a table.
                indexes:
                    type: array
                    items:
                        $ref: '#/components/schemas/IndexMetadata'
                    description: The indexes is the list of indexes in a table.
                engine:
                    type: string
                    description: The engine is the engine of a table.
                collation:
                    type: string
                    description: The collation is the collation of a table.
                charset:
                    type: string
                    description: The character set of the table.
                rowCount:
                    type: string
                    description: The row_count is the estimated number of rows of a table.
                dataSize:
                    type: string
                    description: The data_size is the estimated data size of a table.
                indexSize:
                    type: string
                    description: The index_size is the estimated index size of a table.
                dataFree:
                    type: string
                    description: The data_free is the estimated free data size of a table.
                createOptions:
                    type: string
                    description: The create_options is the create option of a table.
                comment:
                    type: string
                    description: |-
                        The comment is the comment of a table.
                         classification and user_comment is parsed from the comment.
                userComment:
                    type: string
                    description: The user_comment is the user comment of a table parsed from the comment.
                foreignKeys:
                    type: array
                    items:
                        $ref: '#/components/schemas/ForeignKeyMetadata'
                    description: The foreign_keys is the list of foreign keys in a table.
                partitions:
                    type: array
                    items:
                        $ref: '#/components/schemas/TablePartitionMetadata'
                    description: The partitions is the list of partitions in a table.
                checkConstraints:
                    type: array
                    items:
                        $ref: '#/components/schemas/CheckConstraintMetadata'
                    description: The check_constraints is the list of check constraints in a table.
                owner:
                    type: string
                sortingKeys:
                    type: array
                    items:
                        type: string
                    description: |-
                        The sorting_keys is a tuple of column names or arbitrary expressions. ClickHouse specific field.
