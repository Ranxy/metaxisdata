                    items:
                        $ref: '#/components/schemas/TaskMetadata'
                    description: The list of tasks in a schema, currently only used for Snowflake.
                materializedViews:
                    type: array
                    items:
                        $ref: '#/components/schemas/MaterializedViewMetadata'
                    description: The list of materialized views in a schema.
                sequences:
                    type: array
                    items:
                        $ref: '#/components/schemas/SequenceMetadata'
                    description: The list of sequences in a schema.
                packages:
                    type: array
                    items:
                        $ref: '#/components/schemas/PackageMetadata'
                    description: The list of packages in a schema.
                owner:
                    type: string
                comment:
                    type: string
                events:
                    type: array
                    items:
                        $ref: '#/components/schemas/EventMetadata'
                enumTypes:
                    type: array
                    items:
                        $ref: '#/components/schemas/EnumTypeMetadata'
                skipDump:
                    type: boolean
            description: |-
                SchemaMetadata is the metadata for schemas.
                 This is the concept of schema in Postgres, but it's a no-op for MySQL.
        SearchManualSQLResponse:
            type: object
            properties:
                manualSqls:
                    type: array
                    items:
                        $ref: '#/components/schemas/ManualSQL'
                nextPageToken:
                    type: string
        SearchMetadataResponse:
            type: object
            properties:
                results:
                    type: array
                    items:
                        $ref: '#/components/schemas/SearchMetadataResult'
                    description: The search results.
                nextPageToken:
                    type: string
                    description: |-
                        A token, which can be sent as `page_token` to retrieve the next page.
                         If this field is omitted, there are no subsequent pages.
        SearchMetadataResult:
            type: object
            properties:
                guid:
                    type: string
                    description: The GUID of found metadata, e.g. "instance_1;db2;schema3;table4".
                metaType:
                    enum:
                        - UNSPECIFIED
                        - INSTANCE
                        - DATABASE
                        - SCHEMA
                        - TABLE
                        - EXTERNAL_TABLE
                        - MANUAL_SQL
                        - VIEW
                        - MATERIALIZED_VIEW
                        - COLUMN
                        - INDEX
                        - FOREIGN_KEY
                        - PROCEDURE
                        - FUNCTION
                        - SEQUENCE
                        - PACKAGE
                        - STREAM
                        - TASK
                    type: string
                    description: The type of the metadata.
                    format: enum
                metadata:
                    allOf:
                        - $ref: '#/components/schemas/StoredMetadata'
                    description: The metadata content.
        SequenceMetadata:
            type: object
            properties:
                name:
                    type: string
                    description: The name of a sequence.
                dataType:
                    type: string
                    description: The data type of a sequence.
                start:
                    type: string
                    description: The start value of a sequence.
                minValue:
                    type: string
                    description: The minimum value of a sequence.
                maxValue:
                    type: string
                    description: The maximum value of a sequence.
                increment:
                    type: string
                    description: The increment value of a sequence.
                cycle:
                    type: boolean
                    description: Whether the sequence cycles.
                cacheSize:
                    type: string
                    description: Cache size of a sequence.
                lastValue:
                    type: string
                    description: The last value of a sequence.
                ownerTable:
                    type: string
                    description: The table that owns the sequence.
                ownerColumn:
                    type: string
                    description: The column that owns the sequence.
                comment:
                    type: string
                skipDump:
                    type: boolean
        SpatialIndexConfig:
            type: object
            properties:
                method:
                    type: string
                    description: |-
                        Index method/type (database-specific)
                         Examples: "SPATIAL" (MySQL/SQL Server), "GIST"/"SPGIST" (PostgreSQL), "MDSYS.SPATIAL_INDEX_V2" (Oracle)
                tessellation:
                    allOf:
                        - $ref: '#/components/schemas/TessellationConfig'
                    description: Tessellation configuration (primarily SQL Server)
                storage:
                    allOf:
                        - $ref: '#/components/schemas/StorageConfig'
                    description: Storage and performance parameters
                dimensional:
                    allOf:
                        - $ref: '#/components/schemas/DimensionalConfig'
                    description: Dimensional and constraint parameters
                engineSpecific:
                    type: object
                    additionalProperties:
                        type: string
                    description: Database-specific parameters (stored as key-value pairs for extensibility)
            description: SpatialIndexConfig is the configuration for spatial indexes across different database engines.
        Status:
            type: object
            properties:
                code:
                    type: integer
                    description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
                    format: int32
                message:
                    type: string
                    description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
                details:
                    type: array
                    items:
                        $ref: '#/components/schemas/GoogleProtobufAny'
                    description: A list of messages that carry the error details.  There is a common set of message types for APIs to use.
            description: 'The `Status` type defines a logical error model that is suitable for different programming environments, including REST APIs and RPC APIs. It is used by [gRPC](https://github.com/grpc). Each `Status` message contains three pieces of data: error code, error message, and error details. You can find out more about this error model and how to work with it in the [API Design Guide](https://cloud.google.com/apis/design/errors).'
        StorageConfig:
            type: object
            properties:
                fillfactor:
                    type: integer
                    description: PostgreSQL parameters
                    format: int32
                buffering:
                    type: string
                tablespace:
                    type: string
                    description: Oracle parameters
                workTablespace:
                    type: string
                sdoLevel:
                    type: integer
                    format: int32
                commitInterval:
                    type: integer
                    format: int32
                padIndex:
                    type: boolean
                    description: SQL Server parameters
                sortInTempdb:
                    type: string
                dropExisting:
                    type: boolean
                online:
                    type: boolean
                allowRowLocks:
                    type: boolean
                allowPageLocks:
                    type: boolean
                maxdop:
                    type: integer
                    format: int32
                dataCompression:
                    type: string
            description: StorageConfig defines storage and performance parameters for spatial indexes.
        StoredMetadata:
            type: object
            properties:
                databaseSchemaMetadata:
                    $ref: '#/components/schemas/DatabaseSchemaMetadata'
                schemaMetadata:
                    $ref: '#/components/schemas/SchemaMetadata'
                tableMetadata:
                    $ref: '#/components/schemas/TableMetadata'
                externalTableMetadata:
                    $ref: '#/components/schemas/ExternalTableMetadata'
                viewMetadata:
                    $ref: '#/components/schemas/ViewMetadata'
                materializedViewMetadata:
                    $ref: '#/components/schemas/MaterializedViewMetadata'
                functionMetadata:
                    $ref: '#/components/schemas/FunctionMetadata'
                procedureMetadata:
                    $ref: '#/components/schemas/ProcedureMetadata'
                packageMetadata:
                    $ref: '#/components/schemas/PackageMetadata'
                sequenceMetadata:
                    $ref: '#/components/schemas/SequenceMetadata'
                streamMetadata:
                    $ref: '#/components/schemas/StreamMetadata'
                taskMetadata:
                    $ref: '#/components/schemas/TaskMetadata'
                manualSqlMetadata:
                    $ref: '#/components/schemas/ManualSQLMetadata'
                columnMetadata:
                    $ref: '#/components/schemas/ColumnMetadata'
        StreamMetadata:
            type: object
            properties:
                name:
                    type: string
                    description: The name of the stream.
                tableName:
                    type: string
                    description: The table_name is the name of the table/view that the stream is created on.
                owner:
                    type: string
                    description: The owner of the stream.
                comment:
                    type: string
                    description: The comment of the stream.
                type:
                    enum:
                        - TYPE_UNSPECIFIED
                        - TYPE_DELTA
                    type: string
                    description: The type of the stream.
                    format: enum
                stale:
                    type: boolean
                    description: Indicates whether the stream was last read before the `stale_after` time.
                mode:
                    enum:
                        - MODE_UNSPECIFIED
                        - MODE_DEFAULT
                        - MODE_APPEND_ONLY
                        - MODE_INSERT_ONLY
                    type: string
                    description: The mode of the stream.
                    format: enum
                definition:
                    type: string
                    description: The definition of the stream.
        SyncDatabaseRequest:
            required:
                - name
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        The name of the database to sync.
                         Format: instances/{instance}/databases/{database}
        SyncDatabaseResponse:
            type: object
            properties: {}
        SyncInstanceRequest:
            required:
                - name
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        The name of instance.
                         Format: instances/{instance}
                enableFullSync:
                    type: boolean
                    description: |-
                        When full sync is enabled, all databases in the instance will be synchronized. Otherwise, only
                         the instance metadata (such as the database list) and any newly discovered instances will be synced.
        SyncInstanceResponse:
            type: object
            properties:
                databases:
                    type: array
                    items:
                        type: string
                    description: All database name list in the instance.
        TableMetadata:
            type: object
            properties:
                name:
                    type: string
                    description: The name of the table.
                columns:
                    type: array
                    items:
                        $ref: '#/components/schemas/ColumnMetadata'
                    description: The columns is the ordered list of columns in a table.
                indexes:
                    type: array
                    items:
                        $ref: '#/components/schemas/IndexMetadata'
                    description: The indexes is the list of indexes in a table.
                engine:
                    type: string
                    description: The engine is the engine of a table.
                collation:
                    type: string
                    description: The collation is the collation of a table.
                charset:
                    type: string
                    description: The character set of the table.
                rowCount:
                    type: string
                    description: The row_count is the estimated number of rows of a table.
                dataSize:
                    type: string
                    description: The data_size is the estimated data size of a table.
                indexSize:
                    type: string
                    description: The index_size is the estimated index size of a table.
                dataFree:
                    type: string
                    description: The data_free is the estimated free data size of a table.
                createOptions:
                    type: string
                    description: The create_options is the create option of a table.
                comment:
                    type: string
                    description: |-
                        The comment is the comment of a table.
                         classification and user_comment is parsed from the comment.
                userComment:
                    type: string
                    description: The user_comment is the user comment of a table parsed from the comment.
                foreignKeys:
                    type: array
                    items:
                        $ref: '#/components/schemas/ForeignKeyMetadata'
                    description: The foreign_keys is the list of foreign keys in a table.
                partitions:
                    type: array
                    items:
                        $ref: '#/components/schemas/TablePartitionMetadata'
                    description: The partitions is the list of partitions in a table.
                checkConstraints:
                    type: array
                    items:
                        $ref: '#/components/schemas/CheckConstraintMetadata'
                    description: The check_constraints is the list of check constraints in a table.
                owner:
                    type: string
                sortingKeys:
                    type: array
                    items:
                        type: string
                    description: |-
                        The sorting_keys is a tuple of column names or arbitrary expressions. ClickHouse specific field.
                         Reference: https://clickhouse.com/docs/en/engines/table-engines/mergetree-family/mergetree#order_by
                triggers:
                    type: array
                    items:
                        $ref: '#/components/schemas/TriggerMetadata'
                skipDump:
                    type: boolean
                rules:
                    type: array
                    items:
                        $ref: '#/components/schemas/RuleMetadata'
                    description: The rules is the list of rules in a table (PostgreSQL specific).
                shardingInfo:
                    type: string
                    description: https://docs.pingcap.com/tidb/stable/information-schema-tables/
                primaryKeyType:
                    type: string
                    description: |-
                        https://docs.pingcap.com/tidb/stable/clustered-indexes/#clustered-indexes
                         CLUSTERED or NONCLUSTERED.
                excludeConstraints:
                    type: array
                    items:
                        $ref: '#/components/schemas/ExcludeConstraintMetadata'
                    description: The exclude_constraints is the list of EXCLUDE constraints in a table (PostgreSQL specific).
            description: TableMetadata is the metadata for tables.
        TablePartitionMetadata:
            type: object
            properties:
                name:
                    type: string
                    description: The name of the table partition.
                type:
                    enum:
                        - TYPE_UNSPECIFIED
                        - RANGE
                        - RANGE_COLUMNS
                        - LIST
                        - LIST_COLUMNS
                        - HASH
                        - LINEAR_HASH
                        - KEY
                        - LINEAR_KEY
                    type: string
                    description: The type of a table partition.
                    format: enum
                expression:
                    type: string
                    description: |-
                        The expression is the expression of a table partition.
                         For PostgreSQL, the expression is the text of {FOR VALUES
                         partition_bound_spec}, see
                         https://www.postgresql.org/docs/current/sql-createtable.html. For MySQL,
                         the expression is the `expr` or `column_list` of the following syntax.
                         PARTITION BY
                            { [LINEAR] HASH(expr)
                            | [LINEAR] KEY [ALGORITHM={1 | 2}] (column_list)
                            | RANGE{(expr) | COLUMNS(column_list)}
                            | LIST{(expr) | COLUMNS(column_list)} }.
                value:
                    type: string
                    description: |-
                        The value is the value of a table partition.
                         For MySQL, the value is for RANGE and LIST partition types,
                         - For a RANGE partition, it contains the value set in the partition's
                         VALUES LESS THAN clause, which can be either an integer or MAXVALUE.
                         - For a LIST partition, this column contains the values defined in the
                         partition's VALUES IN clause, which is a list of comma-separated integer
                         values.
                         - For others, it's an empty string.
                useDefault:
                    type: string
                    description: |-
                        The use_default is whether the users use the default partition, it stores
                         the different value for different database engines. For MySQL, it's [INT]
                         type, 0 means not use default partition, otherwise, it's equals to number
                         in syntax [SUB]PARTITION {number}.
                subpartitions:
                    type: array
                    items:
                        $ref: '#/components/schemas/TablePartitionMetadata'
                    description: The subpartitions is the list of subpartitions in a table partition.
                indexes:
                    type: array
                    items:
                        $ref: '#/components/schemas/IndexMetadata'
                checkConstraints:
                    type: array
                    items:
                        $ref: '#/components/schemas/CheckConstraintMetadata'
                excludeConstraints:
                    type: array
                    items:
                        $ref: '#/components/schemas/ExcludeConstraintMetadata'
            description: TablePartitionMetadata is the metadata for table partitions.
        TaskMetadata:
            type: object
            properties:
                name:
                    type: string
                    description: The name of the task.
                id:
                    type: string
                    description: |-
                        The Snowflake-generated ID of the task.
                         Example: 01ad32a0-1bb6-5e93-0000-000000000001.
                owner:
                    type: string
                    description: The owner of the task.
                comment:
                    type: string
                    description: The comment of the task.
                warehouse:
                    type: string
                    description: The warehouse of the task.
                schedule:
                    type: string
                    description: The schedule interval of the task.
                predecessors:
                    type: array
                    items:
                        type: string
                    description: The predecessor tasks of the task.
                state:
                    enum:
                        - STATE_UNSPECIFIED
                        - STATE_STARTED
                        - STATE_SUSPENDED
                    type: string
                    description: The state of the task.
                    format: enum
                condition:
                    type: string
                    description: The condition of the task.
                definition:
                    type: string
                    description: The definition of the task.
        TessellationConfig:
            type: object
            properties:
                scheme:
                    type: string
                    description: |-
                        Tessellation scheme
                         Examples: GEOMETRY_GRID, GEOGRAPHY_GRID, GEOMETRY_AUTO_GRID, GEOGRAPHY_AUTO_GRID
                boundingBox:
                    allOf:
                        - $ref: '#/components/schemas/BoundingBox'
                    description: Bounding box for GEOMETRY indexes (SQL Server)
                gridLevels:
                    type: array
                    items:
                        $ref: '#/components/schemas/GridLevel'
                    description: Grid level configuration (SQL Server)
                cellsPerObject:
                    type: integer
                    description: Cells per object (SQL Server)
                    format: int32
            description: TessellationConfig defines tessellation parameters for spatial indexes.
        TriggerMetadata:
            type: object
            properties:
                name:
                    type: string
                    description: The name of the trigger.
                event:
                    type: string
                    description: The event that triggers this action, such as INSERT, UPDATE, DELETE, or TRUNCATE.
                timing:
                    type: string
                    description: The timing of when the trigger fires, such as BEFORE or AFTER.
                body:
                    type: string
                    description: The body of the trigger.
                sqlMode:
                    type: string
                characterSetClient:
                    type: string
                collationConnection:
                    type: string
                comment:
                    type: string
                skipDump:
                    type: boolean
        UndeleteInstanceRequest:
            required:
                - name
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        The name of the deleted instance.
                         Format: instances/{instance}
        UndeleteUserRequest:
            required:
                - name
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        The name of the deleted user.
                         Format: users/{user}
        UpdateInstanceRequest:
            required:
                - instance
            type: object
            properties:
                instance:
                    allOf:
                        - $ref: '#/components/schemas/Instance'
                    description: |-
                        The instance to update.

                         The instance's `name` field is used to identify the instance to update.
                         Format: instances/{instance}
                updateMask:
                    type: string
                    description: The list of fields to update.
                    format: field-mask
        User:
            type: object
            properties:
                name:
                    readOnly: true
                    type: string
                    description: |-
                        The name of the user.
                         Format: users/{user}. {user} is a system-generated unique ID.
                state:
                    enum:
                        - STATE_UNSPECIFIED
                        - ACTIVE
                        - DELETED
                    type: string
                    format: enum
                email:
                    type: string
                title:
                    type: string
                userType:
                    enum:
                        - USER_TYPE_UNSPECIFIED
                        - USER
                        - SERVICE_ACCOUNT
                        - SYSTEM_BOT
                    type: string
                    format: enum
                password:
                    writeOnly: true
                    type: string
                serviceKey:
                    writeOnly: true
                    type: string
                recoveryCodes:
                    type: array
                    items:
                        type: string
                    description: The recovery_codes is the temporary recovery codes using in two phase verification.
                phone:
                    type: string
                    description: |-
                        Should be a valid E.164 compliant phone number.
                         Could be empty.
                profile:
                    $ref: '#/components/schemas/UserProfile'
                groups:
                    readOnly: true
                    type: array
                    items:
                        type: string
                    description: |-
                        The groups for the user.
                         Format: groups/{email}
        UserProfile:
            type: object
            properties:
                lastLoginTime:
                    type: string
                    format: date-time
                lastChangePasswordTime:
                    type: string
                    format: date-time
                source:
                    type: string
                    description: source means where the user comes from. For now we support Entra ID SCIM sync, so the source could be Entra ID.
        ViewMetadata:
            type: object
            properties:
                name:
                    type: string
                    description: The name of the view.
                definition:
                    type: string
                    description: The definition is the definition of a view.
                comment:
                    type: string
                    description: The comment is the comment of a view.
                dependencyColumns:
                    type: array
                    items:
                        $ref: '#/components/schemas/DependencyColumn'
                    description: The list of dependency columns of a view.
                columns:
                    type: array
                    items:
                        $ref: '#/components/schemas/ColumnMetadata'
                    description: The ordered list of columns in the view.
                triggers:
                    type: array
                    items:
                        $ref: '#/components/schemas/TriggerMetadata'
                    description: The list of triggers in the view.
                skipDump:
                    type: boolean
                rules:
                    type: array
                    items:
                        $ref: '#/components/schemas/RuleMetadata'
                    description: The rules is the list of rules in a view (PostgreSQL specific).
            description: ViewMetadata is the metadata for views.
tags:
    - name: AuditLogService
    - name: AuthService
    - name: DatabaseService
    - name: InstanceService
    - name: LineageService
    - name: OpenLineageService
    - name: UserService
