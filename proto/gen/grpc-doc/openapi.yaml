                    items:
                        type: string
                    description: The enum values of the type.
                comment:
                    type: string
                skipDump:
                    type: boolean
        EventMetadata:
            type: object
            properties:
                name:
                    type: string
                    description: The name of the event.
                definition:
                    type: string
                    description: The schedule of the event.
                timeZone:
                    type: string
                    description: The time zone of the event.
                sqlMode:
                    type: string
                characterSetClient:
                    type: string
                collationConnection:
                    type: string
                comment:
                    type: string
        EventTriggerMetadata:
            type: object
            properties:
                name:
                    type: string
                    description: The name of the event trigger.
                event:
                    type: string
                    description: 'The event type: DDL_COMMAND_START, DDL_COMMAND_END, SQL_DROP, TABLE_REWRITE.'
                tags:
                    type: array
                    items:
                        type: string
                    description: The tags filter (e.g., ['CREATE TABLE', 'DROP TABLE']).
                functionSchema:
                    type: string
                    description: The schema of the function to execute.
                functionName:
                    type: string
                    description: The name of the function to execute.
                enabled:
                    type: boolean
                    description: Whether the trigger is enabled.
                definition:
                    type: string
                    description: |-
                        The full CREATE EVENT TRIGGER definition from pg_get_event_trigger_def().
                         SDL output should prefer using this field.
                comment:
                    type: string
                    description: The comment on the event trigger.
                skipDump:
                    type: boolean
                    description: Skip dump flag (for extension-owned triggers).
            description: |-
                EventTriggerMetadata is the metadata for PostgreSQL event triggers.
                 Event triggers are database-level objects that fire on DDL events.
        ExcludeConstraintMetadata:
            type: object
            properties:
                name:
                    type: string
