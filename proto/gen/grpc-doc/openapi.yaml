                linkedDatabases:
                    type: array
                    items:
                        $ref: '#/components/schemas/LinkedDatabaseMetadata'
                owner:
                    type: string
                searchPath:
                    type: string
                    description: The search_path is the search path of a PostgreSQL database.
                eventTriggers:
                    type: array
                    items:
                        $ref: '#/components/schemas/EventTriggerMetadata'
                    description: |-
                        The list of event triggers in a database (PostgreSQL specific).
                         Event triggers are database-level objects, not schema-scoped.
            description: DatabaseSchemaMetadata is the schema metadata for databases.
        DependencyColumn:
            type: object
            properties:
                schema:
                    type: string
                    description: The schema is the schema of a reference column.
                table:
                    type: string
                    description: The table is the table of a reference column.
                column:
                    type: string
                    description: The column is the name of a reference column.
            description: DependencyColumn is the metadata for dependency columns.
        DependencyTable:
            type: object
            properties:
                schema:
                    type: string
                    description: The schema is the schema of a reference table.
                table:
                    type: string
                    description: The table is the name of a reference table.
        DimensionalConfig:
            type: object
            properties:
                dimensions:
                    type: integer
                    description: Number of dimensions (2-4, default 2)
                    format: int32
                dataType:
                    type: string
                    description: |-
                        Spatial data type
                         Examples: GEOMETRY, GEOGRAPHY, POINT, POLYGON, etc.
                operatorClass:
                    type: string
                    description: |-
                        PostgreSQL operator class
                         Examples: gist_geometry_ops_2d, gist_geometry_ops_nd, etc.
                layerGtype:
                    type: string
                    description: |-
                        Oracle geometry type constraint
                         Examples: POINT, LINE, POLYGON, COLLECTION
                parallelBuild:
                    type: boolean
                    description: Parallel index creation
            description: DimensionalConfig defines dimensional and constraint parameters for spatial indexes.
        EnumTypeMetadata:
            type: object
            properties:
                name:
