                functionMetadata:
                    $ref: '#/components/schemas/FunctionMetadata'
                procedureMetadata:
                    $ref: '#/components/schemas/ProcedureMetadata'
                sequenceMetadata:
                    $ref: '#/components/schemas/SequenceMetadata'
                manualSqlMetadata:
                    $ref: '#/components/schemas/ManualSQLMetadata'
                columnMetadata:
                    $ref: '#/components/schemas/ColumnMetadata'
                applicationSqlMetadata:
                    $ref: '#/components/schemas/ApplicationSQLMetadata'
                guid:
                    readOnly: true
                    type: string
                    description: |-
                        The globally unique metadata GUID of this object, e.g.
                         "instance_1;db2;schema3;table4". It is what ListMetadata results are
                         addressed by in GetMetadata, GetSchemaString and the lineage methods.
            description: |-
                StoredMetadata is the v1 view of one meta_registry_resource row.

                 OpenLineage registry rows (store.MetaType_OPENLINEAGE) have no v1
                 representation: they are internal summaries of ingested events, and the
                 supported way to read them is the OpenLineageService resources. They are
                 filtered out of ListMetadata/GetMetadata/SearchMetadata rather than
                 serialized as an empty StoredMetadata.
