    /v1/identityProviderBindings:
        get:
            tags:
                - IdentityProviderService
            description: |-
                List the accounts bound to an identity provider subject.

                 A binding is what a login resolves against, so this is the read an
                 administrator needs before moving or deleting an account: without it the
                 only way to see why a login lands on an account is SQL.
            operationId: IdentityProviderService_ListIdentityProviderBindings
            parameters:
                - name: idp
                  in: query
                  description: |-
                    Optional. Restrict the answer to one identity provider.
                     Format: idps/{idp}
                  schema:
                    type: string
                - name: user
                  in: query
                  description: |-
                    Optional. Restrict the answer to one account.
                     Format: users/{user}
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListIdentityProviderBindingsResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/identityProviderBindings:delete:
        post:
            tags:
                - IdentityProviderService
            description: |-
                DeleteIdentityProviderBinding unbinds one account from one provider subject.

                 The account loses that way in but keeps every other one; nothing else about
                 it changes. Deleting the last binding of an account whose password was
                 replaced on adoption leaves it reachable only by an administrator resetting
                 the password, so the caller is expected to confirm before doing it.

                 It is gated by `update`, not `delete`, and the settings page hides the button
                 behind the same permission: this edits a provider's configuration, and
                 `delete` is reserved for removing a provider outright.
            operationId: IdentityProviderService_DeleteIdentityProviderBinding
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/DeleteIdentityProviderBindingRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content: {}
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/idps:
        get:
            tags:
                - IdentityProviderService
            description: |-
                List every configured identity provider. Public so the login page can render
                 the enabled SSO targets without credentials.

                 The `permission` annotation is kept beside `allow_without_credential`, as on
                 `SettingService.GetWorkspaceProfileSetting`: the latter wins in the
                 interceptor, and the annotation is what records the permission this read
                 belongs to in the catalog.
            operationId: IdentityProviderService_ListIdentityProviders
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListIdentityProvidersResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
        post:
            tags:
                - IdentityProviderService
            description: |-
                Create an identity provider. The id becomes the final segment of the
                 resource name and is immutable, so it is derived from the title by the
                 client and checked here.
            operationId: IdentityProviderService_CreateIdentityProvider
            parameters:
                - name: identityProviderId
                  in: query
                  description: |-
                    The id to use, which becomes the final segment of the resource name.
                     Format: a lower-case letter followed by up to 62 lower-case letters, digits
                     or hyphens.
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/IdentityProvider'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IdentityProvider'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/idps/{idp}:
        get:
            tags:
                - IdentityProviderService
            description: Get an identity provider, including the non-secret half of its config.
            operationId: IdentityProviderService_GetIdentityProvider
            parameters:
                - name: idp
                  in: path
                  description: The idp id.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IdentityProvider'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
        delete:
            tags:
                - IdentityProviderService
            description: |-
                Delete an identity provider.

                 Accounts bound to it keep their binding rows but can no longer sign in
                 through it: the binding records the subject the provider assigned, which no
                 longer resolves to a configured provider. Re-creating the provider with the
                 same id makes those accounts reachable again, which is why the id matters.
            operationId: IdentityProviderService_DeleteIdentityProvider
            parameters:
                - name: idp
                  in: path
                  description: The idp id.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content: {}
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
        patch:
            tags:
                - IdentityProviderService
            description: |-
                Update an identity provider. Only title, domain and config are mutable; the
                 resource name is not. An empty secret in the config means "keep the stored
                 one", because the read path never hands the stored secret back.
            operationId: IdentityProviderService_UpdateIdentityProvider
            parameters:
                - name: idp
                  in: path
                  description: The idp id.
                  required: true
                  schema:
                    type: string
                - name: updateMask
                  in: query
                  description: The fields to update. Only `title`, `domain` and `config` are mutable.
                  schema:
                    type: string
                    format: field-mask
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/IdentityProvider'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IdentityProvider'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/idps/{idp}:test:
        post:
            tags:
                - IdentityProviderService
            description: |-
                TestIdentityProvider completes a real authorization-code exchange against a
                 stored provider and reports the identity it resolves.

                 The provider has to be saved first: the exchange needs the stored client
                 secret, and the browser is never given it. The caller obtains an
                 authorization code by sending an administrator's browser to the provider's
                 authorization endpoint with `{external_url}/oauth/callback` as the redirect
                 URI — the same URI a login uses — so no extra callback has to be registered
                 with the provider. The client marks that state record as a test so the
                 callback page tests instead of signing the administrator in.

                 This verifies the client id and secret end to end, which endpoint
                 reachability alone cannot.
            operationId: IdentityProviderService_TestIdentityProvider
            parameters:
                - name: idp
                  in: path
                  description: The idp id.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TestIdentityProviderRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TestIdentityProviderResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/instances:
        get:
            tags:
                - InstanceService
            operationId: InstanceService_ListInstances
            parameters:
                - name: pageSize
                  in: query
                  description: |-
                    The maximum number of instances to return. The service may return fewer than
                     this value.
                     If unspecified, at most 10 instances will be returned.
                     The maximum value is 1000; values above 1000 will be coerced to 1000.
                  schema:
                    type: integer
                    format: int32
                - name: pageToken
                  in: query
                  description: |-
                    A page token, received from a previous `ListInstances` call.
                     Provide this to retrieve the subsequent page.

                     When paginating, all other parameters provided to `ListInstances` must match
                     the call that provided the page token.
                  schema:
                    type: string
                - name: showDeleted
                  in: query
                  description: Show deleted instances if specified.
                  schema:
                    type: boolean
                - name: filter
                  in: query
                  description: |-
                    Filter the instance.
                     The syntax and semantics of CEL are documented at https://github.com/google/cel-spec

                     Supported filters:
                     - name: the instance name, support "==" and ".matches()" operator.
                     - resource_id: the instance id, support "==" and ".matches()" operator.
                     - environment: the environment full name in "environments/{id}" format, support "==" operator.
                     - state: the instance state, check State enum for values, support "==" operator.
                     - engine: the instance engine, check Engine enum for values. Support "==", "in [xx]", "!(in [xx])" operator.
                     - host: the instance host, support "==" and ".matches()" operator.
                     - port: the instance port, support "==" and ".matches()" operator.

                     For example:
                     name == "sample instance"
                     name.matches("sample")
                     resource_id = "sample-instance"
                     resource_id.matches("sample")
                     state == "DELETED"
                     environment == "environments/test"
                     engine == "MYSQL"
                     engine in ["MYSQL", "POSTGRES"]
                     !(engine in ["MYSQL", "POSTGRES"])
                     host == "127.0.0.1"
                     host.matches("127.0")
                     port == "54321"
                     port.matches("543")
                     You can combine filter conditions like:
                     name.matches("sample") && environment == "environments/test"
                     host == "127.0.0.1" && port == "54321"
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListInstancesResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
