                type:
                    enum:
                        - SECRET_TYPE_UNSPECIFIED
                        - PLAIN
                        - ENVIRONMENT
                    type: string
                    format: enum
                mountPath:
                    type: string
                    description: The path where the approle auth method is mounted.
        DataSource_AWSCredential:
