                    description: |-
                        When full sync is enabled, all databases in the instance will be synchronized. Otherwise, only
                         the instance metadata (such as the database list) and any newly discovered instances will be synced.
        SyncInstanceResponse:
            type: object
            properties:
                databases:
                    type: array
                    items:
                        type: string
                    description: All database name list in the instance.
        TableMetadata:
            type: object
            properties:
                name:
                    type: string
                    description: The name of the table.
                columns:
                    type: array
                    items:
                        $ref: '#/components/schemas/ColumnMetadata'
                    description: The columns is the ordered list of columns in a table.
                indexes:
                    type: array
                    items:
                        $ref: '#/components/schemas/IndexMetadata'
                    description: The indexes is the list of indexes in a table.
                engine:
                    type: string
                    description: The engine is the engine of a table.
                collation:
                    type: string
                    description: The collation is the collation of a table.
                charset:
                    type: string
                    description: The character set of the table.
                rowCount:
                    type: string
                    description: The row_count is the estimated number of rows of a table.
                dataSize:
                    type: string
                    description: The data_size is the estimated data size of a table.
                indexSize:
                    type: string
                    description: The index_size is the estimated index size of a table.
                dataFree:
                    type: string
                    description: The data_free is the estimated free data size of a table.
                createOptions:
                    type: string
                    description: The create_options is the create option of a table.
                comment:
                    type: string
                    description: |-
                        The comment is the comment of a table.
                         classification and user_comment is parsed from the comment.
                userComment:
                    type: string
                    description: The user_comment is the user comment of a table parsed from the comment.
                foreignKeys:
                    type: array
                    items:
                        $ref: '#/components/schemas/ForeignKeyMetadata'
                    description: The foreign_keys is the list of foreign keys in a table.
                partitions:
                    type: array
                    items:
                        $ref: '#/components/schemas/TablePartitionMetadata'
                    description: The partitions is the list of partitions in a table.
                checkConstraints:
                    type: array
                    items:
                        $ref: '#/components/schemas/CheckConstraintMetadata'
                    description: The check_constraints is the list of check constraints in a table.
                owner:
                    type: string
                sortingKeys:
                    type: array
                    items:
                        type: string
                    description: |-
                        The sorting_keys is a tuple of column names or arbitrary expressions. ClickHouse specific field.
                         Reference: https://clickhouse.com/docs/en/engines/table-engines/mergetree-family/mergetree#order_by
                triggers:
                    type: array
                    items:
                        $ref: '#/components/schemas/TriggerMetadata'
                skipDump:
                    type: boolean
                rules:
                    type: array
                    items:
                        $ref: '#/components/schemas/RuleMetadata'
                    description: The rules is the list of rules in a table (PostgreSQL specific).
                shardingInfo:
                    type: string
                    description: https://docs.pingcap.com/tidb/stable/information-schema-tables/
                primaryKeyType:
                    type: string
                    description: |-
                        https://docs.pingcap.com/tidb/stable/clustered-indexes/#clustered-indexes
                         CLUSTERED or NONCLUSTERED.
                excludeConstraints:
                    type: array
                    items:
                        $ref: '#/components/schemas/ExcludeConstraintMetadata'
                    description: The exclude_constraints is the list of EXCLUDE constraints in a table (PostgreSQL specific).
            description: TableMetadata is the metadata for tables.
        TablePartitionMetadata:
            type: object
            properties:
                name:
                    type: string
                    description: The name of the table partition.
                type:
                    enum:
                        - TYPE_UNSPECIFIED
                        - RANGE
                        - RANGE_COLUMNS
                        - LIST
                        - LIST_COLUMNS
                        - HASH
                        - LINEAR_HASH
                        - KEY
                        - LINEAR_KEY
                    type: string
                    description: The type of a table partition.
                    format: enum
                expression:
                    type: string
                    description: |-
                        The expression is the expression of a table partition.
                         For PostgreSQL, the expression is the text of {FOR VALUES
                         partition_bound_spec}, see
                         https://www.postgresql.org/docs/current/sql-createtable.html. For MySQL,
                         the expression is the `expr` or `column_list` of the following syntax.
                         PARTITION BY
                            { [LINEAR] HASH(expr)
                            | [LINEAR] KEY [ALGORITHM={1 | 2}] (column_list)
                            | RANGE{(expr) | COLUMNS(column_list)}
                            | LIST{(expr) | COLUMNS(column_list)} }.
                value:
                    type: string
                    description: |-
                        The value is the value of a table partition.
                         For MySQL, the value is for RANGE and LIST partition types,
                         - For a RANGE partition, it contains the value set in the partition's
                         VALUES LESS THAN clause, which can be either an integer or MAXVALUE.
                         - For a LIST partition, this column contains the values defined in the
                         partition's VALUES IN clause, which is a list of comma-separated integer
                         values.
                         - For others, it's an empty string.
                useDefault:
                    type: string
                    description: |-
                        The use_default is whether the users use the default partition, it stores
                         the different value for different database engines. For MySQL, it's [INT]
                         type, 0 means not use default partition, otherwise, it's equals to number
                         in syntax [SUB]PARTITION {number}.
                subpartitions:
                    type: array
                    items:
                        $ref: '#/components/schemas/TablePartitionMetadata'
                    description: The subpartitions is the list of subpartitions in a table partition.
                indexes:
                    type: array
                    items:
                        $ref: '#/components/schemas/IndexMetadata'
                checkConstraints:
                    type: array
                    items:
                        $ref: '#/components/schemas/CheckConstraintMetadata'
                excludeConstraints:
                    type: array
                    items:
                        $ref: '#/components/schemas/ExcludeConstraintMetadata'
            description: TablePartitionMetadata is the metadata for table partitions.
        Transformation:
            type: object
            properties:
                operation:
                    type: string
                    description: |-
                        The transformation kind: DELETE, UNION, PROJECT, FUNCTION, AGGREGATE,
                         WINDOW, OPERATOR or CASE.
                expression:
                    type: string
                    description: The text representation of the expression (most kinds).
                functionName:
                    type: string
                    description: The function name (FUNCTION, AGGREGATE, WINDOW).
                arguments:
                    type: array
                    items:
                        type: string
                    description: The function arguments (FUNCTION).
                groupKeys:
                    type: array
                    items:
                        type: string
                    description: The GROUP BY keys (AGGREGATE).
                partitionBy:
                    type: array
                    items:
                        type: string
                    description: The PARTITION BY columns (WINDOW).
                orderBy:
                    type: array
                    items:
                        type: string
                    description: The ORDER BY columns (WINDOW).
                opType:
                    type: string
                    description: The operator type, e.g. "+", "=" (OPERATOR).
                condition:
                    type: string
                    description: The WHERE condition (DELETE).
            description: |-
                Transformation describes one step of how a source column becomes a target
                 column, derived from the view's SQL.
        TriggerMetadata:
            type: object
            properties:
                name:
                    type: string
                    description: The name of the trigger.
                event:
                    type: string
                    description: The event that triggers this action, such as INSERT, UPDATE, DELETE, or TRUNCATE.
                timing:
                    type: string
                    description: The timing of when the trigger fires, such as BEFORE or AFTER.
                body:
                    type: string
                    description: The body of the trigger.
                sqlMode:
                    type: string
                characterSetClient:
                    type: string
                collationConnection:
                    type: string
                comment:
                    type: string
                skipDump:
                    type: boolean
        UndeleteInstanceRequest:
            required:
                - name
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        The name of the deleted instance.
                         Format: instances/{instance}
        UndeleteUserRequest:
            required:
                - name
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        The name of the deleted user.
                         Format: users/{user}
        UpdateDebugConfigRequest:
            required:
                - enabled
            type: object
            properties:
                enabled:
                    type: boolean
                    description: Whether to enable runtime debug mode.
        UpdateDebugConfigResponse:
            type: object
            properties:
                enabled:
                    type: boolean
                    description: The resulting runtime debug mode.
        UpdateInstanceRequest:
            required:
                - instance
            type: object
            properties:
                instance:
                    allOf:
                        - $ref: '#/components/schemas/Instance'
                    description: |-
                        The instance to update.

                         The instance's `name` field is used to identify the instance to update.
                         Format: instances/{instance}
                updateMask:
                    type: string
                    description: The list of fields to update.
                    format: field-mask
        User:
            type: object
            properties:
                name:
                    readOnly: true
                    type: string
                    description: |-
                        The name of the user.
                         Format: users/{user}. {user} is a system-generated unique ID.
                state:
                    enum:
                        - STATE_UNSPECIFIED
                        - ACTIVE
                        - DELETED
                    type: string
                    format: enum
                email:
                    type: string
                title:
                    type: string
                userType:
                    enum:
                        - USER_TYPE_UNSPECIFIED
                        - END_USER
                        - SERVICE_ACCOUNT
                        - SYSTEM_BOT
                    type: string
                    format: enum
                password:
                    writeOnly: true
                    type: string
                serviceKey:
                    writeOnly: true
                    type: string
                phone:
                    type: string
                    description: |-
                        Should be a valid E.164 compliant phone number.
                         Could be empty.
                profile:
                    $ref: '#/components/schemas/UserProfile'
                groups:
                    readOnly: true
                    type: array
                    items:
                        type: string
                    description: |-
                        The groups for the user.
                         Format: groups/{email}
                permissions:
                    readOnly: true
                    type: array
                    items:
                        type: string
                    description: |-
                        The effective workspace permissions of the caller, as a list of
                         `metaxisdata.<resource>.<verb>` strings. Populated by GetCurrentUser only,
                         so the frontend can gate navigation and actions without probing each RPC.
        UserProfile:
            type: object
            properties:
                lastLoginTime:
                    type: string
                    format: date-time
                lastChangePasswordTime:
                    type: string
                    format: date-time
        ViewMetadata:
            type: object
            properties:
                name:
                    type: string
                    description: The name of the view.
                definition:
                    type: string
                    description: The definition is the definition of a view.
                comment:
                    type: string
                    description: The comment is the comment of a view.
                dependencyColumns:
                    type: array
                    items:
                        $ref: '#/components/schemas/DependencyColumn'
                    description: The list of dependency columns of a view.
                columns:
                    type: array
                    items:
                        $ref: '#/components/schemas/ColumnMetadata'
                    description: The ordered list of columns in the view.
                triggers:
                    type: array
                    items:
                        $ref: '#/components/schemas/TriggerMetadata'
                    description: The list of triggers in the view.
                skipDump:
                    type: boolean
                rules:
                    type: array
                    items:
                        $ref: '#/components/schemas/RuleMetadata'
                    description: The rules is the list of rules in a view (PostgreSQL specific).
            description: ViewMetadata is the metadata for views.
        WorkspaceProfileSetting:
            type: object
            properties:
                externalUrl:
                    type: string
                    description: The external URL is used for sso authentication callback.
                disallowSignup:
                    type: boolean
                    description: Disallow self-service signup, users can only be invited by the owner.
                domains:
                    type: array
                    items:
                        type: string
                    description: The workspace domain, e.g. example.com.
                enforceIdentityDomain:
                    type: boolean
                    description: Only user and group from the domains can be created and login.
                disallowPasswordSignin:
                    type: boolean
                    description: Whether to disallow password signin. (Except workspace admins)
                openlineageRetentionDays:
                    type: integer
                    description: |-
                        openlineage_retention_days bounds how long persisted OpenLineage runs are
                         kept. Zero (the default) keeps them forever: they are audit data.
                    format: int32
tags:
    - name: AuditLogService
    - name: AuthService
    - name: DatabaseService
    - name: ExplainSQLService
    - name: GroupService
      description: |-
        GroupService manages groups. A group is an IAM principal: the workspace IAM
         policy may bind roles to `groups/{email}`, which grants every member the
         role. Each RPC is gated by the IAM interceptor with the metaxisdata.groups.*
         permissions.
    - name: IamService
      description: |-
        IamService exposes the workspace IAM policy for management. Get reads the
         whole policy; Set replaces it whole, guarded by the etag. Both RPCs are gated
         by metaxisdata.iam.getPolicy / metaxisdata.iam.setPolicy.
    - name: InstanceService
    - name: LLMService
    - name: LineageService
    - name: OpenLineageService
    - name: RoleService
      description: |-
        RoleService manages custom roles. Predefined roles are read-only over this
         API: create/update/delete refuse a resource ID that collides with a
         predefined role. Each RPC is gated by the IAM interceptor with the
         metaxisdata.roles.* permissions.
    - name: SettingService
    - name: UserService
