    /v1/lineages:counts:
        post:
            tags:
                - LineageService
            description: |-
                GetLineageCounts returns how many distinct objects each requested object has
                 upstream and downstream. A node's degree cannot be read off its neighbours'
                 relations, so a graph that labels every node it draws would otherwise cost
                 one GetLineage per node; this answers a whole set from two aggregates.
                 Only the counts are returned, never the relations themselves.
            operationId: LineageService_GetLineageCounts
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/GetLineageCountsRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetLineageCountsResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/lineages:graph:
        get:
            tags:
                - LineageService
            description: |-
                GetLineageGraph returns the multi-level lineage graph around one metadata
                 object in a single call, instead of expanding it one hop at a time with
                 GetLineage.
            operationId: LineageService_GetLineageGraph
            parameters:
                - name: guid
                  in: query
                  description: |-
                    The global unique id for metadata
                     table: "instance_1;db2;schema3;table4"
                  schema:
                    type: string
                - name: metaType
                  in: query
                  schema:
                    enum:
                        - UNSPECIFIED
                        - INSTANCE
                        - DATABASE
                        - SCHEMA
                        - TABLE
                        - EXTERNAL_TABLE
                        - EXTERNAL_DATASET
                        - MANUAL_SQL
                        - APPLICATION_SQL
                        - VIEW
                        - MATERIALIZED_VIEW
                        - COLUMN
                        - INDEX
                        - FOREIGN_KEY
                        - PROCEDURE
                        - FUNCTION
                        - SEQUENCE
                        - OPENLINEAGE
                    type: string
                    format: enum
                - name: lineageType
                  in: query
                  description: |-
                    Which direction to walk: SOURCE looks upstream only, TARGET downstream
                     only, and leaving it unset walks both.
                  schema:
                    enum:
                        - LINEAGE_TYPE_UNSPECIFIED
                        - SOURCE
                        - TARGET
                    type: string
                    format: enum
                - name: depth
                  in: query
                  description: How many hops to expand, 1 to 10. Defaults to 3.
                  schema:
                    type: integer
                    format: int32
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetLineageGraphResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
