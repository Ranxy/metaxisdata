    /v1/workspaces/{workspace}/qualityRules:
        get:
            tags:
                - DataQualityService
            description: List rules, newest first.
            operationId: DataQualityService_ListQualityRules
            parameters:
                - name: workspace
                  in: path
                  description: The workspace id.
                  required: true
                  schema:
                    type: string
                - name: pageSize
                  in: query
                  description: |-
                    The maximum number of rules to return. If unspecified, at most 50 are
                     returned. The maximum value is 1000; values above 1000 are coerced to 1000.
                  schema:
                    type: integer
                    format: int32
                - name: pageToken
                  in: query
                  description: |-
                    A page token, received from a previous ListQualityRules call. Provide this
                     to retrieve the subsequent page.
                  schema:
                    type: string
                - name: instance
                  in: query
                  description: |-
                    The following four filters are GUID path prefixes, not name matches: a rule
                     matches when its target GUID starts with the given prefix. "instance_1"
                     therefore selects every rule in that instance, whatever database or table it
                     watches.
                  schema:
                    type: string
                - name: database
                  in: query
                  schema:
                    type: string
                - name: schema
                  in: query
                  schema:
                    type: string
                - name: table
                  in: query
                  schema:
                    type: string
                - name: targetGuid
                  in: query
                  description: The exact target GUID.
                  schema:
                    type: string
                - name: dimension
                  in: query
                  schema:
                    enum:
                        - QUALITY_DIMENSION_UNSPECIFIED
                        - QUALITY_DIMENSION_COMPLETENESS
                        - QUALITY_DIMENSION_VALIDITY
                        - QUALITY_DIMENSION_UNIQUENESS
                        - QUALITY_DIMENSION_CONSISTENCY
                        - QUALITY_DIMENSION_TIMELINESS
                        - QUALITY_DIMENSION_ACCURACY
                    type: string
                    format: enum
                - name: ruleType
                  in: query
                  schema:
                    enum:
                        - QUALITY_RULE_TYPE_UNSPECIFIED
                        - QUALITY_RULE_TYPE_ROW_COUNT
                        - QUALITY_RULE_TYPE_ROW_COUNT_CHANGE
                        - QUALITY_RULE_TYPE_NULL_PERCENT
                        - QUALITY_RULE_TYPE_UNIQUE
                        - QUALITY_RULE_TYPE_UNIQUE_COMBINATION
                        - QUALITY_RULE_TYPE_ACCEPTED_VALUES
                        - QUALITY_RULE_TYPE_RANGE
                        - QUALITY_RULE_TYPE_REGEX
                        - QUALITY_RULE_TYPE_STRING_LENGTH
                        - QUALITY_RULE_TYPE_REFERENTIAL_INTEGRITY
                        - QUALITY_RULE_TYPE_CROSS_COLUMN
                        - QUALITY_RULE_TYPE_FRESHNESS
                        - QUALITY_RULE_TYPE_CUSTOM_SQL
                        - QUALITY_RULE_TYPE_CEL_EXPRESSION
                        - QUALITY_RULE_TYPE_SCHEMA_DRIFT
                        - QUALITY_RULE_TYPE_GROUP_CHECK
                        - QUALITY_RULE_TYPE_AGGREGATE
                        - QUALITY_RULE_TYPE_CROSS_TABLE
                    type: string
                    format: enum
                - name: severity
                  in: query
                  schema:
                    enum:
                        - QUALITY_SEVERITY_UNSPECIFIED
                        - QUALITY_SEVERITY_WARNING
                        - QUALITY_SEVERITY_ERROR
                        - QUALITY_SEVERITY_CRITICAL
                    type: string
                    format: enum
                - name: state
                  in: query
                  schema:
                    enum:
                        - QUALITY_RULE_STATE_UNSPECIFIED
                        - QUALITY_RULE_STATE_ENABLED
                        - QUALITY_RULE_STATE_PAUSED
                        - QUALITY_RULE_STATE_ARCHIVED
                    type: string
                    format: enum
                - name: owner
                  in: query
                  description: 'Format: users/{user}.'
                  schema:
                    type: string
                - name: search
                  in: query
                  description: A substring match over the title and description.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListQualityRulesResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
