            properties:
                parent:
                    type: string
                    description: 'Format: workspaces/{workspace}. "workspaces/-" is the current workspace.'
                tableGuid:
                    type: string
                    description: The globally unique metadata GUID of the table.
                metaType:
                    enum:
                        - UNSPECIFIED
                        - INSTANCE
                        - DATABASE
                        - SCHEMA
                        - TABLE
                        - EXTERNAL_TABLE
                        - EXTERNAL_DATASET
                        - MANUAL_SQL
                        - APPLICATION_SQL
                        - VIEW
                        - MATERIALIZED_VIEW
                        - COLUMN
                        - INDEX
                        - FOREIGN_KEY
                        - PROCEDURE
                        - FUNCTION
                        - SEQUENCE
                        - OPENLINEAGE
                    type: string
                    format: enum
                columns:
                    type: array
                    items:
                        type: string
                    description: The columns to profile; empty means every column of the table. At most 50.
        ProfileColumnsResponse:
            type: object
            properties:
                columnProfiles:
                    type: array
