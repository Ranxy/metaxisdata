                referencedColumns:
                    type: array
                    items:
                        type: string
                    description: The target columns the compiled SQL reads.
                parameters:
                    type: array
                    items:
                        type: string
                    description: |-
                        The filter values the compiler bound, encoded for display, in the order the
                         placeholders appear in compiled_sql.
        ProcedureMetadata:
            type: object
            properties:
                name:
                    type: string
                    description: The name of the procedure.
                definition:
                    type: string
                    description: The definition is the definition of a procedure.
                signature:
                    type: string
                    description: |-
                        The signature is the name with the number and type of input arguments the
