                    items:
                        type: string
                    description: The GROUP BY keys (AGGREGATE).
                partitionBy:
                    type: array
                    items:
                        type: string
                    description: The PARTITION BY columns (WINDOW).
                orderBy:
                    type: array
                    items:
                        type: string
                    description: The ORDER BY columns (WINDOW).
                opType:
                    type: string
                    description: The operator type, e.g. "+", "=" (OPERATOR).
                condition:
                    type: string
                    description: The WHERE condition (DELETE).
                all:
                    type: boolean
                    description: |-
                        Whether a set operation keeps duplicate rows: true for UNION ALL, INTERSECT
                         ALL and EXCEPT ALL, false for their plain forms (UNION, INTERSECT, EXCEPT).
            description: |-
                Transformation describes one step of how a source column becomes a target
                 column, derived from the view's SQL.
        TriggerMetadata:
            type: object
