        get:
            tags:
                - DataQualityService
            description: Read one quality issue.
            operationId: DataQualityService_GetQualityIssue
            parameters:
                - name: workspace
                  in: path
                  description: The workspace id.
                  required: true
                  schema:
                    type: string
                - name: qualityIssue
                  in: path
                  description: The qualityIssue id.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/QualityIssue'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
        patch:
            tags:
                - DataQualityService
            description: Acknowledge, resolve or mute one quality issue.
            operationId: DataQualityService_UpdateQualityIssue
            parameters:
                - name: workspace
                  in: path
                  description: The workspace id.
                  required: true
                  schema:
                    type: string
                - name: qualityIssue
                  in: path
                  description: The qualityIssue id.
                  required: true
                  schema:
                    type: string
                - name: updateMask
                  in: query
                  description: |-
                    The fields to change: status (RESOLVED only), resolution_reason,
                     resolution_note, acknowledged or muted_until.
                  schema:
                    type: string
                    format: field-mask
                - name: acknowledged
                  in: query
                  description: |-
                    Whether to acknowledge the issue. Acknowledgement is an action rather than a
                     stored field of QualityIssue, so the update mask path "acknowledged" reads
                     this value; false is rejected because clearing an acknowledgement is not a
                     supported transition.
                  schema:
                    type: boolean
            requestBody:
                content:
                    application/json:
                        schema:
