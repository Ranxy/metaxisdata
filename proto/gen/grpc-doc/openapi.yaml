                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/oauthAuthorizationRequests/{oauthAuthorizationRequest}:approve:
        post:
            tags:
                - OAuthService
            description: |-
                ApproveOAuthAuthorizationRequest records the signed-in user's decision. The
                 approver becomes the identity the access token will be issued for. The
                 browser then goes to /oauth/authorize/complete, which mints the
                 authorization code and redirects it to the client, so the code never passes
                 through an RPC response or through the page's own JavaScript.
                 Permissions required: None
            operationId: OAuthService_ApproveOAuthAuthorizationRequest
            parameters:
                - name: oauthAuthorizationRequest
                  in: path
                  description: The oauthAuthorizationRequest id.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ApproveOAuthAuthorizationRequestRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content: {}
                default:
                    description: Default error response
                    content:
                        application/json:
