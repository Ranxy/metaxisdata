                  schema:
                    enum:
                        - QUALITY_RUN_STATUS_UNSPECIFIED
                        - QUALITY_RUN_STATUS_PENDING
                        - QUALITY_RUN_STATUS_RUNNING
                        - QUALITY_RUN_STATUS_COMPLETED
                        - QUALITY_RUN_STATUS_ABANDONED
                    type: string
                    format: enum
                - name: trigger
                  in: query
                  schema:
                    enum:
                        - QUALITY_RUN_TRIGGER_UNSPECIFIED
                        - QUALITY_RUN_TRIGGER_MANUAL
                        - QUALITY_RUN_TRIGGER_SCHEDULED
                    type: string
                    format: enum
                - name: instance
                  in: query
                  description: |-
                    Only the runs that executed rules of this instance.
                     Format: instances/{instance}
                  schema:
                    type: string
                - name: startTime
                  in: query
                  description: Only the runs started at or after this time.
                  schema:
                    type: string
                    format: date-time
                - name: endTime
                  in: query
                  description: Only the runs started before this time.
                  schema:
                    type: string
                    format: date-time
                - name: initiator
                  in: query
                  description: 'Format: users/{user}.'
                  schema:
                    type: string
                - name: outcome
                  in: query
                  description: |-
                    The quality rollup to filter by, e.g. only failed runs. Matches completed
                     runs only.
                  schema:
                    enum:
                        - QUALITY_STATUS_UNSPECIFIED
                        - QUALITY_STATUS_PASS
                        - QUALITY_STATUS_WARN
                        - QUALITY_STATUS_FAIL
                        - QUALITY_STATUS_ERROR
                        - QUALITY_STATUS_SKIPPED
                        - QUALITY_STATUS_NOT_EVALUATED
                    type: string
                    format: enum
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListQualityRunsResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/workspaces/{workspace}/qualityRuns/{qualityRun}:
        get:
            tags:
                - DataQualityService
            description: Read one run with its six-state tallies.
            operationId: DataQualityService_GetQualityRun
            parameters:
                - name: workspace
                  in: path
                  description: The workspace id.
                  required: true
                  schema:
                    type: string
                - name: qualityRun
                  in: path
                  description: The qualityRun id.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/QualityRun'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/workspaces/{workspace}/qualitySuggestions:
        get:
            tags:
                - DataQualityService
            description: |-
                List the review queue of model-proposed rule drafts and semantic labels,
                 newest first.
            operationId: DataQualityService_ListQualitySuggestions
            parameters:
                - name: workspace
                  in: path
                  description: The workspace id.
                  required: true
                  schema:
                    type: string
                - name: pageSize
                  in: query
                  description: |-
                    The maximum number of suggestions to return. If unspecified, at most 50 are
                     returned. The maximum value is 1000; values above 1000 are coerced to 1000.
                  schema:
                    type: integer
                    format: int32
                - name: pageToken
                  in: query
                  description: |-
                    A page token, received from a previous ListQualitySuggestions call. Provide
                     this to retrieve the subsequent page.
                  schema:
                    type: string
                - name: status
                  in: query
                  schema:
                    enum:
                        - QUALITY_SUGGESTION_STATUS_UNSPECIFIED
                        - QUALITY_SUGGESTION_STATUS_PENDING
                        - QUALITY_SUGGESTION_STATUS_ACCEPTED
                        - QUALITY_SUGGESTION_STATUS_REJECTED
                    type: string
                    format: enum
                - name: kind
                  in: query
                  schema:
                    enum:
                        - QUALITY_SUGGESTION_KIND_UNSPECIFIED
                        - QUALITY_SUGGESTION_KIND_RULE_DRAFT
                        - QUALITY_SUGGESTION_KIND_LABEL
                    type: string
                    format: enum
                - name: source
                  in: query
                  schema:
                    enum:
                        - QUALITY_SUGGESTION_SOURCE_UNSPECIFIED
                        - QUALITY_SUGGESTION_SOURCE_NATURAL_LANGUAGE
                        - QUALITY_SUGGESTION_SOURCE_PROFILE
                    type: string
                    format: enum
                - name: targetGuid
                  in: query
                  description: The exact target GUID.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListQualitySuggestionsResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/workspaces/{workspace}/qualitySuggestions/{qualitySuggestion}:decide:
        post:
            tags:
                - DataQualityService
            description: |-
                Accept or reject one queued suggestion. A decision is final: the store
                 refuses a second one.
            operationId: DataQualityService_UpdateQualitySuggestion
            parameters:
                - name: workspace
                  in: path
                  description: The workspace id.
                  required: true
                  schema:
                    type: string
                - name: qualitySuggestion
                  in: path
                  description: The qualitySuggestion id.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateQualitySuggestionRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/QualitySuggestion'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/workspaces/{workspace}/qualitySuggestions:suggestLabels:
        post:
            tags:
                - DataQualityService
            description: Propose semantic labels for up to 50 columns of one table.
            operationId: DataQualityService_SuggestColumnLabels
            parameters:
                - name: workspace
                  in: path
                  description: The workspace id.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SuggestColumnLabelsRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SuggestColumnLabelsResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/workspaces/{workspace}/qualitySuggestions:suggestRule:
        post:
            tags:
                - DataQualityService
            description: Turn a natural-language intent into queued rule drafts.
            operationId: DataQualityService_SuggestQualityRule
            parameters:
                - name: workspace
                  in: path
                  description: The workspace id.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SuggestQualityRuleRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SuggestQualityRuleResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
components:
    schemas:
        APIKey:
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        The name of the API key.
                         Format: openlineage/apiKeys/{api_key}
                maskedKey:
                    type: string
                description:
                    type: string
                createdBy:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                lastUsedAt:
                    type: string
                    format: date-time
                revokedAt:
                    type: string
                    description: Non-empty only when the key is revoked.
                    format: date-time
                scopeNamespace:
                    type: string
                    description: |-
                        The OpenLineage namespace this key may write to. Empty means the key is
                         unscoped and may submit events for any namespace. Ingestion rejects an
                         event whose job or dataset namespace differs from the scope.
        AcceptedValuesConfig:
            type: object
            properties:
                column:
                    type: string
                values:
                    type: array
                    items:
                        type: string
                    description: At most 200 values, encoded as strings and converted by the column's type.
                allowNull:
                    type: boolean
                    description: When false (the default), a NULL value is a violation.
                failThreshold:
                    type: number
                    format: double
                warnThreshold:
                    type: number
                    format: double
            description: AcceptedValuesConfig counts rows whose column value is outside a fixed set.
        AggregateConfig:
            type: object
            properties:
                column:
                    type: string
                function:
                    enum:
                        - QUALITY_AGGREGATE_FUNCTION_UNSPECIFIED
                        - QUALITY_AGGREGATE_FUNCTION_COUNT
                        - QUALITY_AGGREGATE_FUNCTION_SUM
                        - QUALITY_AGGREGATE_FUNCTION_AVG
                        - QUALITY_AGGREGATE_FUNCTION_MIN
                        - QUALITY_AGGREGATE_FUNCTION_MAX
                        - QUALITY_AGGREGATE_FUNCTION_STDDEV
                        - QUALITY_AGGREGATE_FUNCTION_PERCENTILE
                    type: string
                    format: enum
                percentile:
                    type: number
                    description: The percentile, 0-100, for QUALITY_AGGREGATE_FUNCTION_PERCENTILE.
                    format: double
                min:
                    type: number
                    description: |-
                        At least one fail bound is required; warn bounds are optional and must sit
                         inside the fail range.
                    format: double
                max:
                    type: number
                    format: double
                warnMin:
                    type: number
                    format: double
                warnMax:
                    type: number
                    format: double
                inclusive:
                    type: boolean
                    description: Whether the bounds are inclusive. Default false, i.e. open on both ends.
            description: AggregateConfig bounds the value one aggregate over one column produces.
        AnalysisScope:
            required:
                - guid
            type: object
            properties:
                name:
                    type: string
                guid:
                    type: string
                    description: |-
                        The metadata GUID of the database or schema the statement is resolved
                         against, e.g. "instance_1;db2" or "instance_1;db2;public". It only supplies
                         the default instance/database/schema for unqualified names; the existence
                         of the database or schema is not validated.
            description: |-
                AnalysisScope is one resolution context for a SQL statement: a named database
                 (MySQL family) or schema (PostgreSQL-like). `name` is an opaque
                 caller-supplied label that is echoed back so results can be attributed; the
                 server attaches no meaning to it.
        AnalyzeSQLDiagnostic:
            type: object
            properties:
                category:
                    enum:
                        - DIAGNOSTIC_CATEGORY_UNSPECIFIED
                        - DIAGNOSTIC_CATEGORY_NOT_MODELLED
                        - DIAGNOSTIC_CATEGORY_UNRESOLVED_REFERENCE
                        - DIAGNOSTIC_CATEGORY_AMBIGUOUS_REFERENCE
                        - DIAGNOSTIC_CATEGORY_CATALOG_UNAVAILABLE
                    type: string
                    format: enum
                subject:
                    type: string
                    description: |-
                        What the diagnostic is about, the way the analyzer names it: the statement
                         or clause shape it does not model ("MERGE", "WITH before INSERT"), or the
                         clause a reference was written in ("a CTE body").
                reference:
                    type: string
                    description: |-
                        The identifier a reference diagnostic could not resolve, written the way the
                         SQL writes it ("t.c", "t", "c"). Empty when the diagnostic is about a shape.
                detail:
                    type: string
                    description: |-
                        The cause, for a diagnostic that needs one: the parser defect behind a
                         skipped clause, or the catalog error behind a degraded lookup.
            description: AnalyzeSQLDiagnostic is one thing an analysis could not represent.
        AnalyzeSQLRelation:
            type: object
            properties:
                sourceGuid:
                    type: string
                    description: |-
                        The table-level GUID of the source column, with instance/database/schema
                         filled in from the scope. It is reported even when the object is not in the
                         metadata registry.
                sourceColumn:
                    type: string
                sourceType:
                    enum:
                        - UNSPECIFIED
                        - INSTANCE
                        - DATABASE
                        - SCHEMA
                        - TABLE
                        - EXTERNAL_TABLE
                        - EXTERNAL_DATASET
                        - MANUAL_SQL
                        - APPLICATION_SQL
                        - VIEW
                        - MATERIALIZED_VIEW
                        - COLUMN
                        - INDEX
                        - FOREIGN_KEY
                        - PROCEDURE
                        - FUNCTION
                        - SEQUENCE
                        - OPENLINEAGE
                    type: string
                    description: TABLE/VIEW/... when the object is found in the metadata registry.
                    format: enum
                targetGuid:
                    type: string
                    description: |-
                        Empty when the target is a synthetic object that only exists inside the
                         statement (the result of a bare SELECT, a CTE, a subquery). In that case
                         target_column is the output alias of the query and is_temp is true.
                targetColumn:
                    type: string
                targetType:
                    enum:
                        - UNSPECIFIED
                        - INSTANCE
                        - DATABASE
                        - SCHEMA
                        - TABLE
                        - EXTERNAL_TABLE
                        - EXTERNAL_DATASET
                        - MANUAL_SQL
                        - APPLICATION_SQL
                        - VIEW
                        - MATERIALIZED_VIEW
                        - COLUMN
                        - INDEX
                        - FOREIGN_KEY
                        - PROCEDURE
                        - FUNCTION
                        - SEQUENCE
                        - OPENLINEAGE
                    type: string
                    format: enum
                relationType:
                    enum:
                        - RELATION_TYPE_UNSPECIFIED
                        - DIRECT
                        - INDIRECT
                        - JOIN
                        - GROUP
                        - UNION
                        - INTERSECT
                        - EXCEPT
                        - UNKNOWN
                    type: string
                    format: enum
                transformations:
                    type: array
                    items:
                        $ref: '#/components/schemas/Transformation'
                isTemp:
                    type: boolean
        AnalyzeSQLRequest:
            required:
                - scopes
                - sqlText
            type: object
            properties:
                scopes:
                    type: array
                    items:
                        $ref: '#/components/schemas/AnalysisScope'
                    description: |-
                        The scopes to resolve the statement against, at most 10. The statement is
                         analyzed once per scope, independently: the scopes may live on different
                         instances and even different engines, and their results are not merged.
                         Selecting several scopes does not discover cross-scope relations that are
                         absent from the metadata.
                sqlText:
                    type: string
                    description: The SQL statement to analyze.
        AnalyzeSQLResponse:
            type: object
            properties:
                results:
                    type: array
                    items:
                        $ref: '#/components/schemas/AnalyzeSQLResult'
                    description: One result per requested scope, in the same order.
                warnings:
                    type: array
                    items:
                        type: string
                    description: Warnings that apply to the request as a whole.
        AnalyzeSQLResult:
            type: object
            properties:
                scopeName:
                    type: string
                    description: The scope name from the request, echoed back.
                scopeGuid:
                    type: string
                relations:
                    type: array
                    items:
                        $ref: '#/components/schemas/AnalyzeSQLRelation'
                warnings:
                    type: array
                    items:
                        type: string
                    description: |-
                        Warnings that only affect this scope, such as an engine without a lineage
                         analyzer. They never fail the whole request.
                diagnostics:
                    type: array
                    items:
                        $ref: '#/components/schemas/AnalyzeSQLDiagnostic'
                    description: |-
                        What the analysis could not represent. relations is everything it did
                         resolve; a diagnostic says why an edge may be missing, which the relations
                         alone cannot say. An analyzer that cannot parse the statement is not
                         reported here: that fails the scope instead.
                omittedDiagnosticCount:
                    type: integer
                    description: |-
                        How many diagnostics the server's per-analysis bound left out, so a caller
                         can tell a complete list from a truncated one.
                    format: int32
        Application:
            required:
                - displayName
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        The resource name.
                         Format: applications/{application_id}
                applicationId:
                    readOnly: true
                    type: string
                    description: The stable identifier, equal to the last segment of `name`.
                displayName:
                    type: string
                    description: 'The display name. It is unique: it is how a person names the application.'
                description:
                    type: string
                disabled:
                    type: boolean
                    description: |-
                        A stopped application keeps every row it ever reported, and none of its keys report
                         anything any more.
                createdAt:
                    readOnly: true
                    type: string
                    format: date-time
                updatedAt:
                    readOnly: true
                    type: string
                    format: date-time
            description: Application is one application whose statements are reported to the workspace.
        ApplicationAPIKey:
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        The resource name.
                         Format: applications/{application_id}/apiKeys/{api_key}
                apiKeyId:
                    readOnly: true
                    type: string
                maskedKey:
                    readOnly: true
                    type: string
                    description: The masked key, safe to display.
                description:
                    type: string
                createdAt:
                    readOnly: true
                    type: string
                    format: date-time
                lastUsedAt:
                    readOnly: true
                    type: string
                    description: The last request this key was used for, and how many it has made.
                    format: date-time
                requestCount:
                    readOnly: true
                    type: string
                    description: |-
                        Per-key counters. They stand in for one audit row per request: the audit ledger is kept
                         forever, so auditing machine traffic would grow it with request volume rather than with
                         distinct statements.
                statementAcceptedCount:
                    readOnly: true
                    type: string
                    description: |-
                        Statements rather than reports: a report whose entry carried a script counts once per
                         statement in it.
                statementRejectedCount:
                    readOnly: true
                    type: string
            description: |-
                ApplicationAPIKey is one reporting credential. Only its masked form is ever returned
                 after creation.
        ApplicationSQL:
            type: object
            properties:
                guid:
                    type: string
                    description: The globally unique metadata GUID.
                applicationSqlId:
                    readOnly: true
                    type: string
                instanceResourceId:
                    readOnly: true
                    type: string
                databaseName:
                    readOnly: true
                    type: string
                schemaName:
                    readOnly: true
                    type: string
                engine:
                    readOnly: true
                    enum:
                        - ENGINE_UNSPECIFIED
                        - MSSQL
                        - MYSQL
                        - POSTGRES
                        - TIDB
                        - MARIADB
                        - OCEANBASE
                        - STARROCKS
                        - DORIS
                    type: string
                    format: enum
                sqlText:
                    readOnly: true
                    type: string
                    description: The parameterized statement. This is the only form ever stored.
                kind:
                    readOnly: true
                    enum:
                        - APPLICATION_SQL_KIND_UNSPECIFIED
                        - APPLICATION_SQL_KIND_UNKNOWN
                        - APPLICATION_SQL_KIND_READ
                        - APPLICATION_SQL_KIND_WRITE
                    type: string
                    format: enum
                fingerprint:
                    readOnly: true
                    type: string
                    description: |-
                        The fingerprint that identifies the statement within its scope, and the version of the
                         rules that produced it.
                fingerprintVersion:
                    readOnly: true
                    type: integer
                    format: int32
                executionCount:
                    readOnly: true
                    type: string
                    description: How many times every application ran it, and when it was first and last seen.
                firstSeenAt:
                    readOnly: true
                    type: string
                    format: date-time
                lastSeenAt:
                    readOnly: true
                    type: string
                    format: date-time
                observations:
                    readOnly: true
                    type: array
                    items:
                        $ref: '#/components/schemas/ApplicationSQLObservation'
                    description: The applications that reported it, with each one's own history.
            description: |-
                ApplicationSQL is one distinct statement an application reported, with every literal
                 already replaced by `?`.
        ApplicationSQLMetadata:
            type: object
            properties:
                applicationSqlId:
                    type: string
                    description: |-
                        The stable identifier of the statement, generated when it is first received. It
                         survives a change to the fingerprint rules, which is what keeps the object's lineage
                         and history attached.
                name:
                    type: string
                    description: |-
                        A display label taken from the statement's first line. The full text is in
                         sql_text.
                sqlText:
                    type: string
                    description: |-
                        The parameterized statement. This is the only form ever stored: the text an
                         application sends is rewritten before it reaches this table.
                instanceResource:
                    type: string
                    description: 'The instance that reported it. Format: instances/{instance}'
                databaseName:
                    type: string
                    description: The database the statement ran against.
                schemaName:
                    type: string
                    description: The schema, empty for the MySQL family.
            description: |-
                ApplicationSQLMetadata is one statement an application reported, with every literal
                 already replaced by `?`. The row is per distinct statement, not per application: which
                 applications ran it is recorded in application_sql_observation.
        ApplicationSQLObservation:
            type: object
            properties:
                application:
                    type: string
                applicationDisplayName:
                    type: string
                executionCount:
                    type: string
                firstSeenAt:
                    type: string
                    format: date-time
                lastSeenAt:
                    type: string
                    format: date-time
            description: ApplicationSQLObservation is one application's own history with one statement.
        ApproveDeviceLoginRequest:
            required:
                - name
            type: object
            properties:
                name:
                    type: string
                    description: 'Format: deviceLogins/{user_code}'
                approve:
                    type: boolean
        ApproveOAuthAuthorizationRequestRequest:
            required:
                - name
            type: object
            properties:
                name:
                    type: string
                    description: 'Format: oauthAuthorizationRequests/{request_id}'
                approve:
                    type: boolean
                    description: approve records the decision; false denies the request.
        AuditLog:
            type: object
            properties:
                id:
                    type: string
                    description: |-
                        The audit_log row's primary key. The public v1 AuditLog exposes it as the
                         resource name "{parent}/auditLogs/{id}" instead, because audit rows are
                         identified by an opaque server-generated id.
                createTime:
                    type: string
                    format: date-time
                parent:
                    type: string
                method:
                    type: string
                resource:
                    type: string
                user:
                    type: string
                severity:
                    enum:
                        - AUDIT_SEVERITY_UNSPECIFIED
                        - INFO
                        - WARNING
                        - ERROR
                    type: string
                    format: enum
                request:
                    type: object
                response:
                    type: object
                status:
                    $ref: '#/components/schemas/AuditLogStatus'
                latencyMs:
                    type: string
                serviceData:
                    type: object
                requestMetadata:
                    $ref: '#/components/schemas/AuditRequestMetadata'
        AuditLogStatus:
            type: object
            properties:
                code:
                    type: integer
                    format: int32
                message:
                    type: string
        AuditRequestMetadata:
            type: object
            properties:
                ip:
                    type: string
                userAgent:
                    type: string
        BatchGetUsersResponse:
            type: object
            properties:
                users:
                    type: array
                    items:
                        $ref: '#/components/schemas/User'
                    description: The users from the specified request.
        BatchMarkNotificationsReadRequest:
            required:
                - parent
                - names
            type: object
            properties:
                parent:
                    type: string
                    description: 'Format: workspaces/{workspace}. "workspaces/-" is the current workspace.'
                names:
                    type: array
                    items:
                        type: string
                    description: 'Format: workspaces/{workspace}/notifications/{id}'
        BatchSyncInstanceResult:
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        The name of the instance.
                         Format: instances/{instance}
                databases:
                    type: array
                    items:
                        type: string
                    description: The names of the databases discovered by this sync.
                error:
                    type: string
                    description: |-
                        Empty when the sync succeeded; otherwise why this instance could not be
                         synced.
        BatchSyncInstancesRequest:
            required:
                - requests
            type: object
            properties:
                requests:
                    type: array
                    items:
                        $ref: '#/components/schemas/SyncInstanceRequest'
                    description: |-
                        The request message specifying the instances to sync.
                         A maximum of 1000 instances can be synced in a batch.
        BatchSyncInstancesResponse:
            type: object
            properties:
                results:
                    type: array
                    items:
                        $ref: '#/components/schemas/BatchSyncInstanceResult'
                    description: |-
                        One result per requested instance, in request order. Per-instance failures
                         are reported here and do not abort the remaining instances.
        BatchUpdateInstanceResult:
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        The name of the instance.
                         Format: instances/{instance}
                instance:
                    allOf:
                        - $ref: '#/components/schemas/Instance'
                    description: The updated instance; unset when the update failed.
                error:
                    type: string
                    description: |-
                        Empty when the update succeeded; otherwise why this instance could not be
                         updated.
        BatchUpdateInstancesRequest:
            required:
                - requests
            type: object
            properties:
                requests:
                    type: array
                    items:
                        $ref: '#/components/schemas/UpdateInstanceRequest'
                    description: |-
                        The request message specifying the resources to update.
                         A maximum of 1000 instances can be updated in a batch.
        BatchUpdateInstancesResponse:
            type: object
            properties:
                results:
                    type: array
                    items:
                        $ref: '#/components/schemas/BatchUpdateInstanceResult'
                    description: |-
                        One result per requested instance, in request order. Per-instance failures
                         are reported here and do not abort the remaining instances.
        Binding:
            type: object
            properties:
                role:
                    type: string
                    description: |-
                        The role that is assigned to the members.
                         Format: roles/{role}
                members:
                    type: array
                    items:
                        type: string
                    description: |-
                        The principals requesting access.
                         For users: users/{userUID}; for groups: groups/{email}; the pseudo-member
                         allUsers matches every authenticated principal, including the ones who
                         register later, so it is accepted only on the roles/workspaceMember
                         baseline binding. That binding is server-managed: it cannot be edited or
                         dropped, and a Set whose policy omits it is rejected.
                condition:
                    allOf:
                        - $ref: '#/components/schemas/Expr'
                    description: |-
                        The condition that is associated with this binding. When present the
                         binding applies only while the condition evaluates to true.
            description: |-
                Binding binds one role to a set of principals. It is the v1 view of the
                 stored IAM binding; the workspace IAM policy is written whole through
                 IamService.SetWorkspaceIamPolicy.
        BoundingBox:
            type: object
            properties:
                xmin:
                    type: number
                    format: double
                ymin:
                    type: number
                    format: double
                xmax:
                    type: number
                    format: double
                ymax:
                    type: number
                    format: double
            description: BoundingBox is the bounding box of a spatial index.
        CelExpressionConfig:
            type: object
            properties:
                expression:
                    type: string
                columns:
                    type: array
                    items:
                        type: string
                    description: The columns the expression reads. They must all exist on the target.
                sampleRows:
                    type: integer
                    format: int32
                failThreshold:
                    type: number
                    format: double
                warnThreshold:
                    type: number
                    format: double
            description: |-
                CelExpressionConfig evaluates an expression over a sample of rows in Go. It is
                 v1.1; the message exists so that the config shape does not change then.
        CheckConstraintMetadata:
            type: object
            properties:
                name:
                    type: string
                    description: The name of the check constraint.
                expression:
                    type: string
                    description: The expression is the expression of a check constraint.
        ColumnMetadata:
            type: object
            properties:
                name:
                    type: string
                    description: The name of the column.
                position:
                    type: integer
                    description: The position is the position in columns.
                    format: int32
                default:
                    type: string
                    description: The default value of the column.
                defaultOnNull:
                    type: boolean
                    description: |-
                        Oracle specific metadata.
                         The default_on_null is the default on null of a column.
                onUpdate:
                    type: string
                    description: |-
                        The on_update is the on update action of a column.
                         For MySQL like databases, it's only supported for TIMESTAMP columns with
                         CURRENT_TIMESTAMP as on update value.
                nullable:
                    type: boolean
                    description: The nullable is the nullable of a column.
                type:
                    type: string
                    description: The type is the type of a column.
                characterSet:
                    type: string
                    description: The character_set is the character_set of a column.
                collation:
                    type: string
                    description: The collation is the collation of a column.
                comment:
                    type: string
                    description: |-
                        The comment is the comment of a column.
                         classification and user_comment is parsed from the comment.
                userComment:
                    type: string
                    description: The user_comment is the user comment of a table parsed from the comment.
                generation:
                    allOf:
                        - $ref: '#/components/schemas/GenerationMetadata'
                    description: The generation is for generated columns.
                isIdentity:
                    type: boolean
                identityGeneration:
                    enum:
                        - IDENTITY_GENERATION_UNSPECIFIED
                        - ALWAYS
                        - BY_DEFAULT
                    type: string
                    description: The identity_generation is for identity columns, PG only.
                    format: enum
                identitySeed:
                    type: string
                    description: The identity_seed is for identity columns, MSSQL only.
                identityIncrement:
                    type: string
                    description: The identity_increment is for identity columns, MSSQL only.
                defaultConstraintName:
                    type: string
                    description: |-
                        The default_constraint_name is the name of the default constraint, MSSQL only.
                         In MSSQL, default values are implemented as named constraints. When modifying or
                         dropping a column's default value, you must reference the constraint by name.
                         This field stores the actual constraint name from the database.

                         Example: A column definition like:
                           CREATE TABLE employees (
                             status NVARCHAR(20) DEFAULT 'active'
                           )

                         Will create a constraint with an auto-generated name like 'DF__employees__statu__3B75D760'
                         or a user-defined name if specified:
                           ALTER TABLE employees ADD CONSTRAINT DF_employees_status DEFAULT 'active' FOR status

                         To modify the default, you must first drop the existing constraint by name:
                           ALTER TABLE employees DROP CONSTRAINT DF__employees__statu__3B75D760
                           ALTER TABLE employees ADD CONSTRAINT DF_employees_status DEFAULT 'inactive' FOR status

                         This field is populated when syncing from the database. When empty (e.g., when parsing
                         from SQL files), the system cannot automatically drop the constraint.
            description: ColumnMetadata is the metadata for columns.
        ColumnProfile:
            type: object
            properties:
                totalRows:
                    type: string
                nullCount:
                    type: string
                distinctCount:
                    type: string
                distinctEstimated:
                    type: boolean
                    description: |-
                        True when the database refused an exact distinct count and the value came
                         from a sample.
                minValue:
                    type: string
                    description: |-
                        Display forms of the observed extremes, truncated; empty when the column has
                         no comparable values.
                maxValue:
                    type: string
                minLength:
                    type: string
                    description: Unset for non-string columns.
                maxLength:
                    type: string
                topValues:
                    type: array
                    items:
                        $ref: '#/components/schemas/ProfileValue'
                    description: The most frequent values, at most ten, each truncated.
                patterns:
                    type: array
                    items:
                        type: string
                    description: Shape summaries such as "numeric", "alpha", "date-like", "mixed".
            description: |-
                ColumnProfile is the deterministic statistics of one column. It is computed
                 without a model and is the evidence a semantic label cites.
        ColumnSemanticLabel:
            type: object
            properties:
                tableGuid:
                    type: string
                    description: The globally unique metadata GUID of the table.
                metaType:
                    enum:
                        - UNSPECIFIED
                        - INSTANCE
                        - DATABASE
                        - SCHEMA
                        - TABLE
                        - EXTERNAL_TABLE
                        - EXTERNAL_DATASET
                        - MANUAL_SQL
                        - APPLICATION_SQL
                        - VIEW
                        - MATERIALIZED_VIEW
                        - COLUMN
                        - INDEX
                        - FOREIGN_KEY
                        - PROCEDURE
                        - FUNCTION
                        - SEQUENCE
                        - OPENLINEAGE
                    type: string
                    format: enum
                column:
                    type: string
                label:
                    enum:
                        - QUALITY_SEMANTIC_TYPE_UNSPECIFIED
                        - QUALITY_SEMANTIC_TYPE_EMAIL
                        - QUALITY_SEMANTIC_TYPE_PHONE
                        - QUALITY_SEMANTIC_TYPE_URL
                        - QUALITY_SEMANTIC_TYPE_UUID
                        - QUALITY_SEMANTIC_TYPE_IP
                        - QUALITY_SEMANTIC_TYPE_COUNTRY_CODE
                        - QUALITY_SEMANTIC_TYPE_CURRENCY
                        - QUALITY_SEMANTIC_TYPE_AMOUNT
                        - QUALITY_SEMANTIC_TYPE_QUANTITY
                        - QUALITY_SEMANTIC_TYPE_PERCENTAGE
                        - QUALITY_SEMANTIC_TYPE_ID
                        - QUALITY_SEMANTIC_TYPE_BUSINESS_KEY
                        - QUALITY_SEMANTIC_TYPE_TIMESTAMP
                        - QUALITY_SEMANTIC_TYPE_DATE
                        - QUALITY_SEMANTIC_TYPE_ENUM
                        - QUALITY_SEMANTIC_TYPE_FREE_TEXT
                        - QUALITY_SEMANTIC_TYPE_UNKNOWN
                    type: string
                    format: enum
                source:
                    enum:
                        - QUALITY_LABEL_SOURCE_UNSPECIFIED
                        - QUALITY_LABEL_SOURCE_MANUAL
                        - QUALITY_LABEL_SOURCE_LLM
                    type: string
                    format: enum
                status:
                    enum:
                        - QUALITY_LABEL_STATUS_UNSPECIFIED
                        - QUALITY_LABEL_STATUS_SUGGESTED
                        - QUALITY_LABEL_STATUS_ACCEPTED
                        - QUALITY_LABEL_STATUS_REJECTED
                    type: string
                    format: enum
                confidence:
                    type: number
                    format: double
                evidence:
                    $ref: '#/components/schemas/SemanticLabelEvidence'
                acceptedBy:
                    type: string
                    description: 'Who accepted it. Format: users/{user}. Empty for a suggestion.'
                acceptedTime:
                    type: string
                    format: date-time
                updateTime:
                    type: string
                    format: date-time
            description: |-
                ColumnSemanticLabel is the semantic type a column is asserted to hold, who
                 asserted it and the evidence behind it.
        ColumnValue:
            type: object
            properties:
                column:
                    type: string
                value:
                    type: string
            description: |-
                ColumnValue is one column of a sampled failed row. Values are truncated before
                 they are returned, so a wide text column cannot bloat the response.
        ConnectedApp:
            type: object
            properties:
                name:
                    type: string
                    description: The resource name of the connected app, in the form `connectedApps/{id}`.
                clientId:
                    type: string
                    description: The registered client identifier (RFC 7591). Opaque.
                clientName:
                    type: string
                    description: |-
                        The client's self-reported name at registration. It is not verified, so it is
                         display text only.
                user:
                    type: string
                    description: The user whose identity the client acts as, in the form `users/{id}`.
                userEmail:
                    type: string
                    description: |-
                        The user's email. It is filled only for the caller's own rows or when the
                         caller may read users; a connected-apps reader is not thereby a user reader.
                resource:
                    type: string
                    description: The MCP resource identifier the authorization was granted for.
                scopes:
                    type: array
                    items:
                        type: string
                    description: The OAuth scopes the user consented to.
                createTime:
                    type: string
                    description: When the authorization completed (the first token pair was issued).
                    format: date-time
                lastToolCallTime:
                    type: string
                    description: |-
                        The most recent tool call made with this connection. Empty when the client
                         has been authorized but has not called a tool yet.
                    format: date-time
                expireTime:
                    type: string
                    description: |-
                        When the refresh credential expires. A connection past this instant cannot
                         mint another access token.
                    format: date-time
                state:
                    enum:
                        - STATE_UNSPECIFIED
                        - ACTIVE
                        - REVOKED
                        - EXPIRED
                        - REAUTH_REQUIRED
                        - INACTIVE
                    type: string
                    description: The connection's current state.
                    format: enum
                revokeTime:
                    type: string
                    description: When the connection was revoked. Set only for REVOKED.
                    format: date-time
            description: |-
                ConnectedApp is one user's authorization of one MCP client. It is derived from
                 the grant record the OAuth token endpoint rotates in place, not from the
                 client registration: the same client may be authorized several times, and each
                 authorization is its own row.
        CreateAPIKeyRequest:
            required:
                - description
            type: object
            properties:
                description:
                    type: string
                scopeNamespace:
                    type: string
                    description: |-
                        Optional OpenLineage namespace to restrict the key to. Empty creates an
                         unscoped key, which is what the previous behavior always did.
        CreateAPIKeyResponse:
            type: object
            properties:
                key:
                    type: string
                    description: The plain-text API key. Only returned once at creation time.
                apiKey:
                    $ref: '#/components/schemas/APIKey'
        CreateApplicationAPIKeyRequest:
            required:
                - parent
            type: object
            properties:
                parent:
                    type: string
                    description: 'Format: applications/{application_id}'
                description:
                    type: string
        CreateApplicationAPIKeyResponse:
            type: object
            properties:
                apiKey:
                    type: string
                key:
                    $ref: '#/components/schemas/ApplicationAPIKey'
        CreateApplicationResponse:
            type: object
            properties:
                application:
                    $ref: '#/components/schemas/Application'
                apiKey:
                    type: string
                    description: The plaintext API key. It is returned once and never stored in a recoverable form.
                key:
                    $ref: '#/components/schemas/ApplicationAPIKey'
        CreateDeviceLoginRequest:
            type: object
            properties:
                clientName:
                    type: string
                    description: |-
                        A human-readable client name for the confirmation page, e.g. "mxd". It is
                         display only and never trusted.
                clientVersion:
                    type: string
        CreateDeviceLoginResponse:
            type: object
            properties:
                deviceCode:
                    type: string
                    description: |-
                        The polling secret. Only the client that created the request holds it, and
                         it never appears in a URL or in an audit record.
                userCode:
                    type: string
                    description: |-
                        The human-readable code the user types on the confirmation page, in
                         Crockford base32 with an "XXXX-XXXX" layout.
                verificationUri:
                    type: string
                    description: |-
                        The bare confirmation address, `{external_url}/device`. Empty when the
                         workspace has no external URL configured.
                verificationUriComplete:
                    type: string
                    description: |-
                        The confirmation address with the code prefilled. Clients should only use
                         it when the user explicitly asked to skip typing the code.
                expiresIn:
                    type: integer
                    description: Lifetime of this request in seconds.
                    format: int32
                interval:
                    type: integer
                    description: The minimum polling interval in seconds.
                    format: int32
        CreateSSOStateResponse:
            type: object
            properties:
                state:
                    type: string
        CrossColumnConfig:
            type: object
            properties:
                leftColumn:
                    type: string
                rightColumn:
                    type: string
                op:
                    enum:
                        - QUALITY_COMPARISON_OPERATOR_UNSPECIFIED
                        - QUALITY_COMPARISON_OPERATOR_EQ
                        - QUALITY_COMPARISON_OPERATOR_NE
                        - QUALITY_COMPARISON_OPERATOR_LT
                        - QUALITY_COMPARISON_OPERATOR_LTE
                        - QUALITY_COMPARISON_OPERATOR_GT
                        - QUALITY_COMPARISON_OPERATOR_GTE
                    type: string
                    format: enum
                tolerance:
                    type: number
                    description: |-
                        Tolerance subtracted/added to the comparison to absorb floating point noise.
                         Only meaningful for numeric columns.
                    format: double
                failThreshold:
                    type: number
                    format: double
                warnThreshold:
                    type: number
                    format: double
            description: |-
                CrossColumnConfig counts rows where two columns of the same row do not satisfy
                 the comparison.
        CrossTableConfig:
            type: object
            properties:
                rightTable:
                    type: string
                    description: |-
                        The other table as "schema.table" (PostgreSQL/MSSQL) or "database.table" /
                         "table" (MySQL family); it must live in the rule target's database.
                leftFunction:
                    enum:
                        - QUALITY_AGGREGATE_FUNCTION_UNSPECIFIED
                        - QUALITY_AGGREGATE_FUNCTION_COUNT
                        - QUALITY_AGGREGATE_FUNCTION_SUM
                        - QUALITY_AGGREGATE_FUNCTION_AVG
                        - QUALITY_AGGREGATE_FUNCTION_MIN
                        - QUALITY_AGGREGATE_FUNCTION_MAX
                        - QUALITY_AGGREGATE_FUNCTION_STDDEV
                        - QUALITY_AGGREGATE_FUNCTION_PERCENTILE
                    type: string
                    description: The left (target) aggregate; COUNT ignores left_column.
                    format: enum
                leftColumn:
                    type: string
                rightFunction:
                    enum:
                        - QUALITY_AGGREGATE_FUNCTION_UNSPECIFIED
                        - QUALITY_AGGREGATE_FUNCTION_COUNT
                        - QUALITY_AGGREGATE_FUNCTION_SUM
                        - QUALITY_AGGREGATE_FUNCTION_AVG
                        - QUALITY_AGGREGATE_FUNCTION_MIN
                        - QUALITY_AGGREGATE_FUNCTION_MAX
                        - QUALITY_AGGREGATE_FUNCTION_STDDEV
                        - QUALITY_AGGREGATE_FUNCTION_PERCENTILE
                    type: string
                    description: The right (reference) aggregate; COUNT ignores right_column.
                    format: enum
                rightColumn:
                    type: string
                tolerance:
                    type: number
                    description: |-
                        The absolute difference tolerated before the thresholds apply: the observed
                         value is max(0, |left - right| - tolerance).
                    format: double
                failThreshold:
                    type: number
                    description: |-
                        Difference beyond the tolerance that fails, and the warning level inside it.
                         The fail threshold defaults to zero.
                    format: double
                warnThreshold:
                    type: number
                    format: double
            description: |-
                CrossTableConfig reconciles one aggregate of the rule's table with one
                 aggregate of another table in the same instance and database.
        CustomSQLConfig:
            type: object
            properties:
                sql:
                    type: string
                failThreshold:
                    type: number
                    format: double
                warnThreshold:
                    type: number
                    format: double
            description: |-
                CustomSQLConfig counts the rows a read-only statement returns as failures. The
                 statement is single SELECT/WITH, at most 8 KiB, and is never rewritten.
        DataQualityDetail:
            type: object
            properties:
                kind:
                    enum:
                        - DATA_QUALITY_NOTIFICATION_KIND_UNSPECIFIED
                        - DATA_QUALITY_NOTIFICATION_KIND_ISSUE_OPENED
                        - DATA_QUALITY_NOTIFICATION_KIND_ISSUE_RECOVERED
                        - DATA_QUALITY_NOTIFICATION_KIND_EXECUTION_FAILED
                        - DATA_QUALITY_NOTIFICATION_KIND_STORM_SUMMARY
                    type: string
                    format: enum
                rule:
                    type: string
                    description: 'Format: workspaces/{workspace}/qualityRules/{quality_rule}'
                ruleTitle:
                    type: string
                targetGuid:
                    type: string
                    description: The registry GUID of the rule's target.
                targetPath:
                    type: string
                    description: 'The display path: instance/database/schema/table[.column].'
                fromStatus:
                    enum:
                        - QUALITY_STATUS_UNSPECIFIED
                        - QUALITY_STATUS_PASS
                        - QUALITY_STATUS_WARN
                        - QUALITY_STATUS_FAIL
                        - QUALITY_STATUS_ERROR
                        - QUALITY_STATUS_SKIPPED
                        - QUALITY_STATUS_NOT_EVALUATED
                    type: string
                    format: enum
                toStatus:
                    enum:
                        - QUALITY_STATUS_UNSPECIFIED
                        - QUALITY_STATUS_PASS
                        - QUALITY_STATUS_WARN
                        - QUALITY_STATUS_FAIL
                        - QUALITY_STATUS_ERROR
                        - QUALITY_STATUS_SKIPPED
                        - QUALITY_STATUS_NOT_EVALUATED
                    type: string
                    format: enum
                severity:
                    enum:
                        - QUALITY_SEVERITY_UNSPECIFIED
                        - QUALITY_SEVERITY_WARNING
                        - QUALITY_SEVERITY_ERROR
                        - QUALITY_SEVERITY_CRITICAL
                    type: string
                    format: enum
                observedValue:
                    type: number
                    description: The observed value and its unit ("rows", "%", "s", "timestamp").
                    format: double
                observedUnit:
                    type: string
                issue:
                    type: string
                    description: 'Format: workspaces/{workspace}/qualityIssues/{quality_issue}'
                run:
                    type: string
                    description: 'Format: workspaces/{workspace}/qualityRuns/{quality_run}'
                failedRows:
                    type: string
                totalRows:
                    type: string
                errorCode:
                    type: string
                    description: The machine-readable failure class for EXECUTION_FAILED.
                failedRuleCount:
                    type: integer
                    description: The tallies a STORM_SUMMARY merged.
                    format: int32
                totalRuleCount:
                    type: integer
                    format: int32
            description: |-
                DataQualityDetail reports one data quality event. The message carries facts
                 only; the client renders the localized sentence from the kind and these fields.
        DataQualitySetting:
            type: object
            properties:
                enableLlmAnalysis:
                    type: boolean
                llmProviderProfile:
                    type: string
                storeFailureSamples:
                    type: boolean
                failureSampleLimit:
                    type: integer
                    format: int32
                defaultScheduleInterval:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                dailyExecutionLimit:
                    type: integer
                    format: int32
                dailyColumnAnalysisLimit:
                    type: integer
                    format: int32
                maxColumnsPerAnalysis:
                    type: integer
                    format: int32
                sendSampleValuesToLlm:
                    type: boolean
            description: |-
                DataQualitySetting is the stored form of the data quality settings; it mirrors
                 metaxisdata.v1.DataQualitySetting.
        DataSource:
            type: object
            properties:
                id:
                    type: string
                type:
                    enum:
                        - DATA_SOURCE_UNSPECIFIED
                        - ADMIN
                        - READ_ONLY
                    type: string
                    format: enum
                username:
                    type: string
                password:
                    type: string
                passwordCiphertext:
                    type: string
                    description: |-
                        A credential is persisted only as its ciphertext: the *_ciphertext field of
                         a pair holds a v1 AES-256-GCM value (backend/common/crypto) and the
                         plaintext field beside it exists for the duration of a read or write, never
                         in the stored row.
                useSsl:
                    type: boolean
                    description: Use SSL to connect to the data source. By default, we use the system's SSL configuration.
                sslCa:
                    type: string
                sslCaCiphertext:
                    type: string
                sslCert:
                    type: string
                sslCertCiphertext:
                    type: string
                sslKey:
                    type: string
                sslKeyCiphertext:
                    type: string
                verifyTlsCertificate:
                    type: boolean
                    description: |-
                        verify_tls_certificate enables TLS certificate verification for SSL connections.
                         Default is false (no verification) for backward compatibility.
                         Set to true for secure connections (recommended for production).
                         Only set to false for development or when certificates cannot be properly
                         validated (e.g., self-signed certs, VPN environments).
                host:
                    type: string
                port:
                    type: string
                database:
                    type: string
                sshHost:
                    type: string
                    description: |-
                        SSH related
                         The hostname of the SSH server agent.
                sshPort:
                    type: string
                    description: The port of the SSH server agent. It's 22 typically.
                sshUser:
                    type: string
                    description: The user to login the server.
                sshPassword:
                    type: string
                    description: The password to login the server. If it's empty string, no password is required.
                sshPasswordCiphertext:
                    type: string
                sshPrivateKey:
                    type: string
                    description: The private key to login the server. If it's empty string, we will use the system default private key from os.Getenv("SSH_AUTH_SOCK").
                sshPrivateKeyCiphertext:
                    type: string
                sshHostKey:
                    type: string
                    description: |-
                        The trusted SSH host key(s) for ssh_host, one entry per line. An entry is
                         either a fingerprint (SHA256:... or MD5:...) or a known_hosts /
                         authorized_keys public key line, as printed by ssh-keyscan. Empty means the
                         SSH host is not trusted: the connection is refused instead of accepting
                         whatever host key answers.
                extraConnectionParameters:
                    type: object
                    additionalProperties:
                        type: string
                    description: |-
                        Extra connection parameters for the database connection.
                         For PostgreSQL HA, this can be used to set target_session_attrs=read-write
        Database:
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        The name of the database.
                         Format: instances/{instance}/databases/{database}
                         {database} is the database name in the instance.
                state:
                    readOnly: true
                    enum:
                        - STATE_UNSPECIFIED
                        - ACTIVE
                        - DELETED
                    type: string
                    description: The existence of a database.
                    format: enum
                successfulSyncTime:
                    readOnly: true
                    type: string
                    description: The latest synchronization time.
                    format: date-time
                schemaVersion:
                    readOnly: true
                    type: string
                    description: The version of database schema.
                environment:
                    type: string
                    description: |-
                        The environment resource.
                         Format: environments/prod where prod is the environment resource ID.
                effectiveEnvironment:
                    readOnly: true
                    type: string
                    description: |-
                        The effective environment based on environment tag above and environment
                         tag on the instance. Inheritance follows
                         https://cloud.google.com/resource-manager/docs/tags/tags-overview.
                labels:
                    type: object
                    additionalProperties:
                        type: string
                    description: Labels will be used for deployment and policy control.
                instanceResource:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/InstanceResource'
                    description: The instance resource.
                drifted:
                    readOnly: true
                    type: boolean
                    description: The schema is drifted from the source of truth.
                guid:
                    readOnly: true
                    type: string
                    description: |-
                        The globally unique metadata GUID of the database, e.g. "instance_1;db2".
                         It can be used directly as an analysis scope for AnalyzeSQL.
        DatabaseSchemaMetadata:
            type: object
            properties:
                name:
                    type: string
                schemas:
                    type: array
                    items:
                        $ref: '#/components/schemas/SchemaMetadata'
                    description: The list of schemas in a database.
                characterSet:
                    type: string
                    description: The character set of the database.
                collation:
                    type: string
                    description: The collation of the database.
                extensions:
                    type: array
                    items:
                        $ref: '#/components/schemas/ExtensionMetadata'
                    description: The list of extensions in a database.
                datashare:
                    type: boolean
                    description: The database belongs to a datashare.
                owner:
                    type: string
                searchPath:
                    type: string
                    description: The search_path is the search path of a PostgreSQL database.
                eventTriggers:
                    type: array
                    items:
                        $ref: '#/components/schemas/EventTriggerMetadata'
                    description: |-
                        The list of event triggers in a database (PostgreSQL specific).
                         Event triggers are database-level objects, not schema-scoped.
            description: DatabaseSchemaMetadata is the schema metadata for databases.
        DeleteIdentityProviderBindingRequest:
            required:
                - user
                - idp
                - subject
            type: object
            properties:
                user:
                    type: string
                    description: 'The account to unbind. Format: users/{user}'
                idp:
                    type: string
                    description: 'The identity provider to unbind from. Format: idps/{idp}'
                subject:
                    type: string
                    description: |-
                        The subject to unbind. The binding row is keyed by (idp, subject), so this
                         pins exactly one row: an account may in principle carry several subjects
                         from the same provider. It is a plain field rather than a segment of the
                         resource name because a subject is an opaque provider string that can
                         contain `/`, `@` and `:`.
        DependencyColumn:
            type: object
            properties:
                schema:
                    type: string
                    description: The schema is the schema of a reference column.
                table:
                    type: string
                    description: The table is the table of a reference column.
                column:
                    type: string
                    description: The column is the name of a reference column.
            description: DependencyColumn is the metadata for dependency columns.
        DependencyTable:
            type: object
            properties:
                schema:
                    type: string
                    description: The schema is the schema of a reference table.
                table:
                    type: string
                    description: The table is the name of a reference table.
        DeviceLogin:
            type: object
            properties:
                name:
                    type: string
                    description: 'Format: deviceLogins/{user_code}'
                state:
                    enum:
                        - DEVICE_LOGIN_STATE_UNSPECIFIED
                        - PENDING
                        - APPROVED
                        - DENIED
                        - EXPIRED
                    type: string
                    format: enum
                userCode:
                    type: string
                createTime:
                    type: string
                    format: date-time
                expireTime:
                    type: string
                    format: date-time
                clientName:
                    type: string
                clientVersion:
                    type: string
                requestIp:
                    type: string
                    description: |-
                        The source address the request came from, as the server sees it (it
                         follows the trusted-proxy rules).
                requestUserAgent:
                    type: string
                approvedBy:
                    allOf:
                        - $ref: '#/components/schemas/User'
                    description: The user who approved the request, once it is approved.
            description: |-
                DeviceLogin is a pending or resolved device authorization request. Its
                 resource name is derived from the human-readable code so the confirmation
                 page needs nothing else.
        DiffMetadataResponse:
            type: object
            properties:
                diffSummary:
                    type: string
                    description: A human-readable summary of the schema changes.
                ddl:
                    type: string
                    description: The full DDL migration SQL from source to target.
        DimensionalConfig:
            type: object
            properties:
                dimensions:
                    type: integer
                    description: The number of dimensions, 2 to 4, default 2.
                    format: int32
                dataType:
                    type: string
                    description: The spatial data type, such as GEOMETRY or GEOGRAPHY.
                operatorClass:
                    type: string
                    description: The operator class. (PostgreSQL specific).
                layerGtype:
                    type: string
                    description: The geometry type constraint. (Oracle specific).
                parallelBuild:
                    type: boolean
                    description: Whether the index is built in parallel.
            description: DimensionalConfig holds dimensional parameters of a spatial index.
        EnumTypeMetadata:
            type: object
            properties:
                name:
                    type: string
                    description: The name of the enum type.
                values:
                    type: array
                    items:
                        type: string
                    description: The enum values of the type.
                comment:
                    type: string
                skipDump:
                    type: boolean
        Environment:
            required:
                - title
            type: object
            properties:
                name:
                    readOnly: true
                    type: string
                    description: |-
                        The resource name. Format: environments/{id}. Output only: the id is
                         derived from the title on create and cannot be changed afterwards.
                title:
                    type: string
                    description: The display name, e.g. "Production".
                color:
                    type: string
                    description: |-
                        A preset palette key controlling the badge color. One of: slate, blue,
                         green, amber, orange, red, violet, pink. Empty on create lets the server
                         pick a stable default.
                tags:
                    type: object
                    additionalProperties:
                        type: string
                    description: Free-form labels attached to the environment.
                instanceCount:
                    readOnly: true
                    type: integer
                    description: |-
                        The number of live instances assigned to this environment. Output only, and
                         populated by ListEnvironments only. DeleteEnvironment is refused while it
                         is non-zero.
                    format: int32
        EventMetadata:
            type: object
            properties:
                name:
                    type: string
                    description: The name of the event.
                definition:
                    type: string
                    description: The schedule of the event.
                timeZone:
                    type: string
                    description: The time zone of the event.
                sqlMode:
                    type: string
                characterSetClient:
                    type: string
                collationConnection:
                    type: string
                comment:
                    type: string
        EventTriggerMetadata:
            type: object
            properties:
                name:
                    type: string
                    description: The name of the event trigger.
                event:
                    type: string
                    description: 'The event type: DDL_COMMAND_START, DDL_COMMAND_END, SQL_DROP, TABLE_REWRITE.'
                tags:
                    type: array
                    items:
                        type: string
                    description: The tags filter (e.g., ['CREATE TABLE', 'DROP TABLE']).
                functionSchema:
                    type: string
                    description: The schema of the function to execute.
                functionName:
                    type: string
                    description: The name of the function to execute.
                enabled:
                    type: boolean
                    description: Whether the trigger is enabled.
                definition:
                    type: string
                    description: |-
                        The full CREATE EVENT TRIGGER definition from pg_get_event_trigger_def().
                         SDL output should prefer using this field.
                comment:
                    type: string
                    description: The comment on the event trigger.
                skipDump:
                    type: boolean
                    description: Skip dump flag (for extension-owned triggers).
            description: |-
                EventTriggerMetadata is the metadata for PostgreSQL event triggers.
                 Event triggers are database-level objects that fire on DDL events.
        ExchangeDeviceLoginRequest:
            required:
                - deviceCode
            type: object
            properties:
                deviceCode:
                    type: string
        ExchangeDeviceLoginResponse:
            type: object
            properties:
                state:
                    enum:
                        - DEVICE_LOGIN_STATE_UNSPECIFIED
                        - PENDING
                        - APPROVED
                        - DENIED
                        - EXPIRED
                    type: string
                    format: enum
                token:
                    type: string
                    description: |-
                        The access token, returned only when the request was approved. The device
                         login is consumed at the same time, so a second exchange finds nothing.
                expiresIn:
                    type: string
                    description: The remaining lifetime of the token in seconds.
                user:
                    allOf:
                        - $ref: '#/components/schemas/User'
                    description: The user who approved the request.
        ExcludeConstraintMetadata:
            type: object
            properties:
                name:
                    type: string
                    description: The name of the EXCLUDE constraint.
                expression:
                    type: string
                    description: |-
                        The expression is the full EXCLUDE constraint definition including "EXCLUDE" keyword.
                         Example: "EXCLUDE USING gist (room_id WITH =, during WITH &&)"
        ExplainSQLMetadata:
            type: object
            properties:
                summary:
                    type: string
                provider:
                    type: string
                model:
                    type: string
                cacheKey:
                    type: string
                fromCache:
                    type: boolean
                cacheCreatedAt:
                    type: string
        ExplainSQLProgress:
            type: object
            properties:
                type:
                    type: string
                turn:
                    type: integer
                    format: int32
                toolName:
                    type: string
                toolInput:
                    type: string
                toolOutput:
                    type: string
                toolError:
                    type: string
        ExplainSQLRequest:
            type: object
            properties:
                metaGuid:
                    type: string
                sqlText:
                    type: string
                forceRegenerate:
                    type: boolean
                providerName:
                    type: string
                scopePrefix:
                    type: string
        ExplainSQLResponse:
            type: object
            properties:
                content:
                    type: string
                metadata:
                    $ref: '#/components/schemas/ExplainSQLMetadata'
                progress:
                    $ref: '#/components/schemas/ExplainSQLProgress'
        Expr:
            type: object
            properties:
                expression:
                    type: string
                    description: |-
                        Textual representation of an expression in Common Expression Language
                         syntax.
                title:
                    type: string
                    description: |-
                        Optional. Title for the expression, i.e. a short string describing
                         its purpose. This can be used e.g. in UIs which allow to enter the
                         expression.
                description:
                    type: string
                    description: |-
                        Optional. Description of the expression. This is a longer text which
                         describes the expression, e.g. when hovered over it in a UI.
                location:
                    type: string
                    description: |-
                        Optional. String indicating the location of the expression for error
                         reporting, e.g. a file name and a position in the file.
            description: |-
                Represents a textual expression in the Common Expression Language (CEL)
                 syntax. CEL is a C-like expression language. The syntax and semantics of CEL
                 are documented at https://github.com/google/cel-spec.

                 Example (Comparison):

                     title: "Summary size limit"
                     description: "Determines if a summary is less than 100 chars"
                     expression: "document.summary.size() < 100"

                 Example (Equality):

                     title: "Requestor is owner"
                     description: "Determines if requestor is the document owner"
                     expression: "document.owner == request.auth.claims.email"

                 Example (Logic):

                     title: "Public documents"
                     description: "Determine whether the document should be publicly visible"
                     expression: "document.type != 'private' && document.type != 'internal'"

                 Example (Data Manipulation):

                     title: "Notification string"
                     description: "Create a notification string with a timestamp."
                     expression: "'New message received at ' + string(document.create_time)"

                 The exact variables and functions that may be referenced within an expression
                 are determined by the service that evaluates it. See the service
                 documentation for additional information.
        ExtensionMetadata:
            type: object
            properties:
                name:
                    type: string
                    description: The name of the extension.
                schema:
                    type: string
                    description: |-
                        The schema where the extension is installed. However, the extension usage
                         is not limited to the schema.
                version:
                    type: string
                    description: The version is the version of an extension.
                description:
                    type: string
                    description: The description is the description of an extension.
            description: ExtensionMetadata is the metadata for extensions.
        ExternalDatasetInfo:
            type: object
            properties:
                guid:
                    type: string
                namespace:
                    type: string
                    description: The OpenLineage namespace, e.g. "postgres://host:5432".
                name:
                    type: string
                    description: The dataset name, e.g. "db.schema.table" or "s3://bucket/path".
                datasetType:
                    type: string
                    description: The dataset type, e.g. "s3", "kafka", "database".
            description: ExternalDatasetInfo provides metadata for a dataset outside of managed instances.
        ExternalTableMetadata:
            type: object
            properties:
                name:
                    type: string
                    description: The name of the external table.
                externalServerName:
                    type: string
                    description: The external_server_name is the name of the external server.
                externalDatabaseName:
                    type: string
                    description: The external_database_name is the name of the external database.
                columns:
                    type: array
                    items:
                        $ref: '#/components/schemas/ColumnMetadata'
                    description: The columns is the ordered list of columns in a foreign table.
        FailureSample:
            type: object
            properties:
                columns:
                    type: array
                    items:
                        $ref: '#/components/schemas/ColumnValue'
            description: FailureSample is one failed row, already truncated.
        FetchLLMModelsRequest:
            type: object
            properties:
                name:
                    type: string
                apiKey:
                    type: string
                providerType:
                    enum:
                        - LLM_PROVIDER_TYPE_UNSPECIFIED
                        - LLM_PROVIDER_TYPE_OPENAI
                        - LLM_PROVIDER_TYPE_DEEPSEEK
                        - LLM_PROVIDER_TYPE_OPENROUTER
                        - LLM_PROVIDER_TYPE_CUSTOM
                    type: string
                    format: enum
        FetchLLMModelsResponse:
            type: object
            properties:
                modelIds:
                    type: array
                    items:
                        type: string
        FieldMapping:
            type: object
            properties:
                identifier:
                    type: string
                    description: The claim holding the identifier, normally the address. Required.
                displayName:
                    type: string
                    description: The claim holding the display name. Optional; defaults to the identifier.
                phone:
                    type: string
                    description: The claim holding the phone number. Optional.
                subject:
                    type: string
                    description: |-
                        The claim holding the provider-assigned, immutable subject. Optional here
                         but required in effect: a login is bound to it, and the server refuses a
                         provider that maps no subject unless the workspace lists the provider as one
                         whose address claim may stand in for it (`sso_email_identity_idps`).
                groups:
                    type: string
                    description: |-
                        The claim holding group memberships. Optional. When set, each login syncs
                         the account's group membership to the matching workspace groups, which is
                         what lets an IAM policy grant roles by group.
            description: FieldMapping names the claims that carry each field of the identity.
        ForeignKeyMetadata:
            type: object
            properties:
                name:
                    type: string
                    description: The name of the foreign key.
                columns:
                    type: array
                    items:
                        type: string
                    description: The columns are the ordered referencing columns of a foreign key.
                referencedSchema:
                    type: string
                    description: |-
                        The referenced_schema is the referenced schema name of a foreign key.
                         It is an empty string for databases without such concept such as MySQL.
                referencedTable:
                    type: string
                    description: The referenced_table is the referenced table name of a foreign key.
                referencedColumns:
                    type: array
                    items:
                        type: string
                    description: The referenced_columns are the ordered referenced columns of a foreign key.
                onDelete:
                    type: string
                    description: The on_delete is the on delete action of a foreign key.
                onUpdate:
                    type: string
                    description: The on_update is the on update action of a foreign key.
                matchType:
                    type: string
                    description: |-
                        The match_type is the match type of a foreign key.
                         The match_type is the PostgreSQL specific field.
                         It's empty string for other databases.
            description: ForeignKeyMetadata is the metadata for foreign keys.
        FreshnessConfig:
            type: object
            properties:
                timestampColumn:
                    type: string
                maxLagSeconds:
                    type: integer
                    format: int32
                warnLagSeconds:
                    type: integer
                    format: int32
            description: |-
                FreshnessConfig measures how long ago the newest timestamp is. A NULL newest
                 timestamp follows on_empty.
        FunctionMetadata:
            type: object
            properties:
                name:
                    type: string
                    description: The name of the function.
                definition:
                    type: string
                    description: The definition is the definition of a function.
                signature:
                    type: string
                    description: |-
                        The signature is the name with the number and type of input arguments the
                         function takes.
                characterSetClient:
                    type: string
                    description: MySQL specific metadata.
                collationConnection:
                    type: string
                databaseCollation:
                    type: string
                sqlMode:
                    type: string
                comment:
                    type: string
                dependencyTables:
                    type: array
                    items:
                        $ref: '#/components/schemas/DependencyTable'
                    description: |-
                        The dependency_tables is the list of dependency tables of a function.
                         For PostgreSQL, it's the list of tables that the function depends on the return type definition.
                skipDump:
                    type: boolean
            description: FunctionMetadata is the metadata for functions.
        GenerationMetadata:
            type: object
            properties:
                type:
                    enum:
                        - TYPE_UNSPECIFIED
                        - TYPE_VIRTUAL
                        - TYPE_STORED
                    type: string
                    format: enum
                expression:
                    type: string
        GetDebugConfigResponse:
            type: object
            properties:
                enabled:
                    type: boolean
                    description: Whether runtime debug mode is currently enabled.
        GetLineageCountsRequest:
            required:
                - guids
            type: object
            properties:
                guids:
                    type: array
                    items:
                        type: string
                    description: |-
                        The metadata GUIDs to count for, at most 1000. A GUID the registry has no
                         relations for is reported with zero counts rather than failing the batch.
        GetLineageCountsResponse:
            type: object
            properties:
                counts:
                    type: array
                    items:
                        $ref: '#/components/schemas/LineageCount'
                    description: One entry per distinct requested GUID, in the order first requested.
        GetLineageForContextResponse:
            type: object
            properties:
                relations:
                    type: array
                    items:
                        $ref: '#/components/schemas/LineageRelation'
                    description: The list of lineage relations for the given metadata.
                nextPageToken:
                    type: string
                    description: |-
                        A token, which can be sent as `page_token` to retrieve the next page.
                         If this field is omitted, there are no subsequent pages.
        GetLineageGraphResponse:
            type: object
            properties:
                rootGuid:
                    type: string
                nodes:
                    type: array
                    items:
                        $ref: '#/components/schemas/LineageNode'
                    description: The table-, view- and dataset-level objects in the graph.
                edges:
                    type: array
                    items:
                        $ref: '#/components/schemas/LineageRelation'
                    description: The column-level edges between those objects.
                externalDatasets:
                    type: array
                    items:
                        $ref: '#/components/schemas/ExternalDatasetInfo'
                    description: Metadata for external datasets referenced in the edges.
                depthReached:
                    type: integer
                    description: The number of hops actually expanded.
                    format: int32
                truncated:
                    type: boolean
                    description: Whether a node, edge or time budget stopped the expansion early.
        GetLineageResponse:
            type: object
            properties:
                relationsSource:
                    type: array
                    items:
                        $ref: '#/components/schemas/LineageRelation'
                    description: The list of lineage relations for the given metadata.
                relationsTarget:
                    type: array
                    items:
                        $ref: '#/components/schemas/LineageRelation'
                externalDatasets:
                    type: array
                    items:
                        $ref: '#/components/schemas/ExternalDatasetInfo'
                    description: Metadata for external datasets referenced in the lineage relations.
                nextPageToken:
                    type: string
                    description: |-
                        A token, which can be sent as `page_token` to retrieve the next page.
                         If this field is omitted, there are no subsequent pages.
        GetMetadataResponse:
            type: object
            properties:
                metadata:
                    $ref: '#/components/schemas/StoredMetadata'
        GetUnreadNotificationCountResponse:
            type: object
            properties:
                unreadCount:
                    type: integer
                    format: int32
                unseenCount:
                    type: integer
                    description: |-
                        The subset of unread_count written after the caller last opened the inbox.
                         This is the number the badge shows: opening the inbox clears it without
                         marking anything read, so an unread message stays unread until it is
                         clicked.
                    format: int32
        GoogleProtobufAny:
            type: object
            properties:
                '@type':
                    type: string
                    description: The type of the serialized message.
            additionalProperties: true
            description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message.
        GridLevel:
            type: object
            properties:
                level:
                    type: integer
                    description: The level, 1 to 4 for SQL Server.
                    format: int32
                density:
                    type: string
                    description: The density, such as LOW, MEDIUM or HIGH.
            description: GridLevel is one grid level of a spatial tessellation.
        Group:
            required:
                - name
            type: object
            properties:
                name:
                    type: string
                    description: The resource name of the group, in the form `groups/{email}`.
                title:
                    type: string
                    description: Human-readable title.
                description:
                    type: string
                members:
                    type: array
                    items:
                        $ref: '#/components/schemas/GroupMember'
                    description: The group's members.
            description: |-
                Group is a set of users that can be bound to roles in the IAM policy as a
                 single principal (`groups/{email}`).
        GroupCheckConfig:
            type: object
            properties:
                columns:
                    type: array
                    items:
                        type: string
                    description: The grouping columns, 1-5 of them.
                minRowsPerGroup:
                    type: string
                    description: At least one bound is required.
                maxRowsPerGroup:
                    type: string
                failThreshold:
                    type: number
                    description: Groups outside the bounds tolerated, measured per threshold_metric.
                    format: double
                warnThreshold:
                    type: number
                    format: double
            description: GroupCheckConfig bounds the row count of each group a set of columns forms.
        GroupMember:
            type: object
            properties:
                member:
                    type: string
                    description: |-
                        Member is the principal who belong to this group.

                         Format: users/{userUID}.
                role:
                    enum:
                        - ROLE_UNSPECIFIED
                        - OWNER
                        - MEMBER
                    type: string
                    format: enum
        IamPolicy:
            type: object
            properties:
                bindings:
                    type: array
                    items:
                        $ref: '#/components/schemas/Binding'
                    description: |-
                        Collection of binding.
                         A binding binds one or more members or groups to a single role.
        IamPolicyView:
            type: object
            properties:
                policy:
                    $ref: '#/components/schemas/IamPolicy'
                etag:
                    type: string
            description: |-
                IamPolicyView is an IAM policy together with its etag. The etag is returned
                 by Get and must be supplied on Set for optimistic concurrency: a Set whose
                 etag does not match the stored policy's etag is rejected with
                 connect.CodeAborted so the caller can re-fetch and retry. An empty etag
                 skips the check (first write).
        IdentityProvider:
            required:
                - title
                - type
                - config
            type: object
            properties:
                name:
                    readOnly: true
                    type: string
                    description: |-
                        The resource name. Format: idps/{idp}. Output only: the id is set on create
                         and cannot change, because accounts are bound to (id, subject) pairs.
                title:
                    type: string
                    description: The display title, e.g. "Acme SSO". The login page shows it on the button.
                domain:
                    type: string
                    description: |-
                        The email domain whose users this provider serves, e.g. "example.com". Used
                         as a fallback when a provider reports an identifier that is not an address:
                         the login then tries "{identifier}@{domain}". Empty disables the fallback.
                type:
                    enum:
                        - IDENTITY_PROVIDER_TYPE_UNSPECIFIED
                        - OAUTH2
                    type: string
                    description: |-
                        The protocol. Only OAUTH2 is implemented; the login path rejects anything
                         else and no other value can be created.
                    format: enum
                config:
                    allOf:
                        - $ref: '#/components/schemas/IdentityProviderConfig'
                    description: The protocol configuration.
            description: IdentityProvider is a configured SSO provider.
        IdentityProviderBinding:
            type: object
            properties:
                user:
                    type: string
                    description: 'The account. Format: users/{user}'
                userEmail:
                    readOnly: true
                    type: string
                    description: The account's address, for display. Read-only.
                userTitle:
                    readOnly: true
                    type: string
                    description: The account's display name, for display. Read-only.
                idp:
                    type: string
                    description: 'The identity provider. Format: idps/{idp}'
                subject:
                    type: string
                    description: |-
                        The provider-assigned subject the account is bound to. This is the value a
                         login resolves against; it is not necessarily the address.
                createdAt:
                    readOnly: true
                    type: string
                    description: When the binding was written.
                    format: date-time
            description: IdentityProviderBinding is one account's way in through one identity provider.
        IdentityProviderConfig:
            type: object
            properties:
                oauth2Config:
                    $ref: '#/components/schemas/OAuth2IdentityProviderConfig'
        IdentityProviderContext:
            type: object
            properties:
                oauth2Context:
                    $ref: '#/components/schemas/OAuth2IdentityProviderContext'
        IdentityProviderUserInfo:
            type: object
            properties:
                identifier:
                    type: string
                    description: The identifier claim, normally the address.
                subject:
                    type: string
                    description: 'The subject claim: the value the account is bound to.'
                displayName:
                    type: string
                    description: The display name.
                phone:
                    type: string
                    description: The phone number.
                groups:
                    type: array
                    items:
                        type: string
                    description: The group claims.
                hasGroups:
                    type: boolean
                    description: |-
                        Whether the provider returned a group claim at all. Distinguishes "no
                         groups" from "groups not configured", so an empty list does not clear a
                         membership.
            description: IdentityProviderUserInfo is the identity a login resolved from the claims.
        IndexMetadata:
            type: object
            properties:
                name:
                    type: string
                    description: The name of the index.
                expressions:
                    type: array
                    items:
                        type: string
                    description: |-
                        The expressions are the ordered columns or expressions of an index.
                         This could refer to a column or an expression.
                keyLength:
                    type: array
                    items:
                        type: string
                    description: |-
                        The ordered list of key lengths for the index.
                         If the key length is not specified, it is -1.
                descending:
                    type: array
                    items:
                        type: boolean
                    description: The ordered list of descending flags for the index columns.
                type:
                    type: string
                    description: The type is the type of an index.
                unique:
                    type: boolean
                    description: The unique is whether the index is unique.
                primary:
                    type: boolean
                    description: The primary is whether the index is a primary key index.
                visible:
                    type: boolean
                    description: The visible is whether the index is visible.
                comment:
                    type: string
                    description: The comment is the comment of an index.
                definition:
                    type: string
                    description: The definition of an index.
                parentIndexSchema:
                    type: string
                    description: The schema name of the parent index.
                parentIndexName:
                    type: string
                    description: The index name of the parent index.
                isConstraint:
                    type: boolean
                    description: |-
                        It's a PostgreSQL specific field.
                         The unique constraint and unique index are not the same thing in PostgreSQL.
                opclassNames:
                    type: array
                    items:
                        type: string
                    description: |-
                        https://www.postgresql.org/docs/current/catalog-pg-opclass.html
                         Name of the operator class for each column. (PostgreSQL specific).
                opclassDefaults:
                    type: array
                    items:
                        type: boolean
                    description: True if the operator class is the default. (PostgreSQL specific).
                spatialConfig:
                    allOf:
                        - $ref: '#/components/schemas/SpatialIndexConfig'
                    description: The spatial index configuration. (SQL Server and other engines).
            description: IndexMetadata is the metadata for indexes.
        Instance:
            type: object
            properties:
                title:
                    type: string
                engine:
                    enum:
                        - ENGINE_UNSPECIFIED
                        - MSSQL
                        - MYSQL
                        - POSTGRES
                        - TIDB
                        - MARIADB
                        - OCEANBASE
                        - STARROCKS
                        - DORIS
                    type: string
                    format: enum
                activation:
                    type: boolean
                version:
                    type: string
                externalLink:
                    type: string
                dataSources:
                    type: array
                    items:
                        $ref: '#/components/schemas/DataSource'
                syncInterval:
