                 confirmation it mirrors.
                 Permissions required: None
            operationId: OAuthService_GetOAuthAuthorizationRequest
            parameters:
                - name: oauthAuthorizationRequest
                  in: path
                  description: The oauthAuthorizationRequest id.
                  required: true
                  schema:
                    type: string
