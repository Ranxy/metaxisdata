                        - QUALITY_SEMANTIC_TYPE_URL
                        - QUALITY_SEMANTIC_TYPE_UUID
                        - QUALITY_SEMANTIC_TYPE_IP
                        - QUALITY_SEMANTIC_TYPE_COUNTRY_CODE
                        - QUALITY_SEMANTIC_TYPE_CURRENCY
                        - QUALITY_SEMANTIC_TYPE_AMOUNT
                        - QUALITY_SEMANTIC_TYPE_QUANTITY
                        - QUALITY_SEMANTIC_TYPE_PERCENTAGE
                        - QUALITY_SEMANTIC_TYPE_ID
                        - QUALITY_SEMANTIC_TYPE_BUSINESS_KEY
                        - QUALITY_SEMANTIC_TYPE_TIMESTAMP
                        - QUALITY_SEMANTIC_TYPE_DATE
                        - QUALITY_SEMANTIC_TYPE_ENUM
                        - QUALITY_SEMANTIC_TYPE_FREE_TEXT
                        - QUALITY_SEMANTIC_TYPE_UNKNOWN
                    type: string
                    description: The label to accept. Required by ACCEPT and ignored by CLEAR.
                    format: enum
                action:
                    enum:
                        - COLUMN_LABEL_ACTION_UNSPECIFIED
                        - COLUMN_LABEL_ACTION_ACCEPT
                        - COLUMN_LABEL_ACTION_CLEAR
                    type: string
                    format: enum
        UpdateColumnLabelResponse:
            type: object
            properties:
                columnLabel:
                    allOf:
                        - $ref: '#/components/schemas/ColumnSemanticLabel'
                    description: The stored label, unset after CLEAR.
        UpdateDebugConfigRequest:
            required:
                - enabled
            type: object
            properties:
                enabled:
                    type: boolean
                    description: Whether to enable runtime debug mode.
        UpdateDebugConfigResponse:
            type: object
            properties:
                enabled:
                    type: boolean
                    description: The resulting runtime debug mode.
        UpdateInstanceRequest:
            required:
                - instance
            type: object
            properties:
                instance:
                    allOf:
                        - $ref: '#/components/schemas/Instance'
                    description: |-
                        The instance to update.

                         The instance's `name` field is used to identify the instance to update.
                         Format: instances/{instance}
                updateMask:
                    type: string
                    description: The list of fields to update.
                    format: field-mask
        UpdateQualitySuggestionRequest:
            required:
                - name
            type: object
            properties:
                name:
                    type: string
                    description: 'Format: workspaces/{workspace}/qualitySuggestions/{quality_suggestion}'
                decision:
                    enum:
                        - QUALITY_SUGGESTION_STATUS_UNSPECIFIED
                        - QUALITY_SUGGESTION_STATUS_PENDING
                        - QUALITY_SUGGESTION_STATUS_ACCEPTED
                        - QUALITY_SUGGESTION_STATUS_REJECTED
                    type: string
                    description: |-
                        The decision: ACCEPTED or REJECTED. A suggestion starts PENDING and a
                         decision is final.
                    format: enum
                decisionNote:
                    type: string
                    description: Why it was decided, shown in the review history.
        User:
            type: object
            properties:
                name:
                    readOnly: true
                    type: string
                    description: |-
                        The name of the user.
                         Format: users/{user}. {user} is a system-generated unique ID.
                state:
                    enum:
                        - STATE_UNSPECIFIED
                        - ACTIVE
                        - DELETED
                    type: string
                    format: enum
                email:
                    type: string
                    description: |-
                        The user's email address. It identifies the member to the outside world,
                         so only a caller with metaxisdata.users.update may set it, on their own
                         account or on someone else's.
                title:
                    type: string
                userType:
                    enum:
                        - USER_TYPE_UNSPECIFIED
                        - END_USER
                        - SERVICE_ACCOUNT
                        - SYSTEM_BOT
                    type: string
                    format: enum
                password:
                    writeOnly: true
                    type: string
                serviceKey:
                    writeOnly: true
                    type: string
                phone:
                    type: string
                    description: |-
                        Should be a valid E.164 compliant phone number.
                         Could be empty.
                profile:
                    $ref: '#/components/schemas/UserProfile'
                groups:
                    readOnly: true
                    type: array
                    items:
                        type: string
                    description: |-
                        The groups for the user.
                         Format: groups/{email}
                permissions:
                    readOnly: true
                    type: array
                    items:
                        type: string
                    description: |-
                        The effective workspace permissions of the caller, as a list of
                         `metaxisdata.<resource>.<verb>` strings. Populated by GetCurrentUser only,
                         so the frontend can gate navigation and actions without probing each RPC.
                language:
                    type: string
                    description: |-
                        The BCP-47 tag of the language the user reads the UI in, so server-side
                         prose — the Explain SQL answer — is written in the language the user
                         selected. The SPA records it when the user switches language; empty means
                         never chosen, and server-side prose then falls back to en-US.
        UserProfile:
            type: object
            properties:
                lastLoginTime:
                    type: string
                    format: date-time
                lastChangePasswordTime:
                    type: string
                    format: date-time
        ViewMetadata:
            type: object
            properties:
                name:
                    type: string
                    description: The name of the view.
                definition:
                    type: string
                    description: The definition is the definition of a view.
                comment:
                    type: string
                    description: The comment is the comment of a view.
                dependencyColumns:
                    type: array
                    items:
                        $ref: '#/components/schemas/DependencyColumn'
                    description: The list of dependency columns of a view.
                columns:
                    type: array
                    items:
                        $ref: '#/components/schemas/ColumnMetadata'
                    description: The ordered list of columns in the view.
                triggers:
                    type: array
                    items:
                        $ref: '#/components/schemas/TriggerMetadata'
                    description: The list of triggers in the view.
                skipDump:
                    type: boolean
                rules:
                    type: array
                    items:
                        $ref: '#/components/schemas/RuleMetadata'
                    description: The rules is the list of rules in a view (PostgreSQL specific).
            description: ViewMetadata is the metadata for views.
        WorkspaceProfileSetting:
            type: object
            properties:
                externalUrl:
                    type: string
                    description: The external URL is used for sso authentication callback.
                disallowSignup:
                    type: boolean
                    description: Disallow self-service signup, users can only be invited by the owner.
                domains:
                    type: array
                    items:
                        type: string
                    description: The workspace domain, e.g. example.com.
                enforceIdentityDomain:
                    type: boolean
                    description: Only user and group from the domains can be created and login.
                disallowPasswordSignin:
                    type: boolean
                    description: Whether to disallow password signin. (Except workspace admins)
                openlineageRetentionDays:
                    type: integer
                    description: |-
                        openlineage_retention_days bounds how long persisted OpenLineage runs are
                         kept. Zero (the default) keeps them forever: they are audit data.
                    format: int32
                allowedLlmProviderProfiles:
                    type: array
                    items:
                        type: string
                    description: |-
                        The LLM provider profiles ExplainSQL may use, as profile resource names.
                         Empty means every enabled profile is allowed.
                mcpEnabled:
                    type: boolean
                    description: |-
                        Whether the MCP endpoint and its OAuth 2.1 authorization server are served.
                         Off by default: the surface is new, and enabling it requires a configured
                         external_url, which is where its issuer and resource identifiers come from.
                ssoEmailIdentityIdps:
                    type: array
                    items:
                        type: string
                    description: |-
                        The identity providers whose email claim may stand in for a subject, by the
                         resource id that idps/{idp} names. The settings page picks them from
                         IdentityProviderService.ListIdentityProviders.

                         For those providers — and only those, because one workspace can configure
                         several, trusted to different degrees — an SSO login may be identified by the
                         address claim instead of a stable subject, and may make an existing account
                         with that address reachable through the provider. An account that had no
                         provider binding is adopted by doing so: its password is replaced with a
                         random one.

                         Empty (the default) turns the feature off everywhere. The address claim is
                         mutable, so listing a provider asserts that it verifies addresses — an
                         unverified claim lets whoever can set it sign in as the account it names —
                         and that its configuration, which only an administrator can write, is
                         trusted. For a listed provider, field_mapping.subject becomes optional and
                         falls back to the identifier claim.
                dataQuality:
                    allOf:
                        - $ref: '#/components/schemas/DataQualitySetting'
                    description: |-
                        Data quality settings. Every zero value means the server's default, so the
                         reader resolves defaults rather than trusting the stored value.
tags:
    - name: ApplicationService
      description: |-
        ApplicationService manages the applications that report the SQL they run, and the
         statements they have reported.

         An application is deliberately not a metadata resource: it has no schema, no columns and
         no lineage of its own. Creating one issues its first API key, which is the credential the
         reporting endpoint authenticates; the key names the application, so a report cannot claim
         to be another one.
    - name: AuditLogService
    - name: AuthService
    - name: ConnectedAppService
      description: |-
        ConnectedAppService manages the MCP OAuth connections a user established by
         authorizing a client against the deployment's MCP endpoint. One connected app
         is one authorization (one user, one client), not one transport session: the
         MCP endpoint itself is stateless.

         No method here carries a (metaxisdata.v1.permission) annotation, because the
         same call serves two audiences: a workspace administrator listing every
         connection and an ordinary user managing their own. Each handler therefore
         scopes its query and authorizes the widen itself, the way NotificationService
         and UserService's self-service paths do. The permission catalog still defines
         connectedApps.list and connectedApps.revoke, which are what the handler checks
         before returning another user's rows or revoking another user's connection.
    - name: DataQualityService
      description: |-
        DataQualityService manages the checks that watch the data itself: rules,
         their executions, and the per-rule results of those executions.

         A rule observes one target — a table, or one column of it — with a typed
         check (row count, null percent, uniqueness, accepted values, ...) on a
         schedule or on demand. A run groups the results of one instance; it is
         created asynchronously and polled until it finishes.
    - name: DatabaseService
    - name: EnvironmentService
      description: |-
        EnvironmentService manages the workspace's environments. An environment is a
         small, workspace-scoped resource ("environments/{id}") that instances are
         tagged with; databases inherit their instance's environment.

         Environments are stored in the ENVIRONMENT workspace setting, not in a table
         of their own. The id is derived from the title on create and is immutable:
         instances store the raw id, so renaming only changes the display title.
    - name: ExplainSQLService
    - name: GroupService
      description: |-
        GroupService manages groups. A group is an IAM principal: the workspace IAM
         policy may bind roles to `groups/{email}`, which grants every member the
         role. Each RPC is gated by the IAM interceptor with the metaxisdata.groups.*
         permissions.
    - name: IamService
      description: |-
        IamService exposes the workspace IAM policy for management. Get reads the
         whole policy; Set replaces it whole, guarded by the etag. Both RPCs are gated
         by metaxisdata.iam.getPolicy / metaxisdata.iam.setPolicy.
    - name: IdentityProviderService
      description: |-
        IdentityProviderService is the admin surface for SSO.

         It is the write path for the `idp` table: before it existed the only way to
         configure a provider was to insert SQL by hand, so the login page had nothing
         to point at and `client_secret` could not be encrypted on write.

         ListIdentityProviders is deliberately readable without credentials: the login
         page renders one button per configured provider before the visitor has a
         session. It never returns a secret, so a provider's non-secret half (auth URL,
         client id, scopes, mapping) is what an anonymous caller can see.
    - name: InstanceService
    - name: LLMService
    - name: LineageService
    - name: NotificationService
      description: |-
        NotificationService serves the caller's own in-app messages: the outcome of a
         sync operation they asked for, and the ingestion failures a workspace
         administrator needs to see.

         No method here carries a (metaxisdata.v1.permission) annotation, and none is
         reachable without credentials. An inbox belongs to one principal, which the
         workspace-scoped IAM catalog cannot express: every handler therefore scopes
         its query by the authenticated caller's id, the same way UserService's
         self-service paths do. Gating these methods on a permission instead would
         lock a custom role out of its own messages.
    - name: OAuthService
      description: |-
        OAuthService serves the browser-facing half of the OAuth 2.1 authorization
         server. The protocol endpoints themselves -- /oauth/authorize,
         /oauth/authorize/complete, /oauth/token and /oauth/register -- are plain HTTP,
         because OAuth clients do not speak ConnectRPC; this service carries only what
         the SPA consent page needs.
    - name: OpenLineageService
    - name: RoleService
      description: |-
        RoleService manages custom roles. Predefined roles are read-only over this
         API: create/update/delete refuse a resource ID that collides with a
         predefined role. Each RPC is gated by the IAM interceptor with the
         metaxisdata.roles.* permissions.
    - name: SettingService
    - name: UserService
