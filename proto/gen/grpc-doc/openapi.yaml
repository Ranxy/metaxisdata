                        - VIEW
                        - MATERIALIZED_VIEW
                        - COLUMN
                        - INDEX
                        - FOREIGN_KEY
                        - PROCEDURE
                        - FUNCTION
                        - SEQUENCE
                        - OPENLINEAGE
                    type: string
                    format: enum
                columns:
