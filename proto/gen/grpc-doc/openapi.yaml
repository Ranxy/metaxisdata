components:
    schemas:
        APIKeyResource:
            type: object
            properties:
                id:
                    type: string
                maskedKey:
                    type: string
                description:
                    type: string
                createdBy:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                lastUsedAt:
                    type: string
                    format: date-time
                revokedAt:
                    type: string
                    description: Non-empty only when the key is revoked.
                    format: date-time
        AddDataSourceRequest:
            required:
                - name
                - dataSource
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        The name of the instance to add a data source to.
                         Format: instances/{instance}
                dataSource:
                    allOf:
                        - $ref: '#/components/schemas/DataSource'
                    description: |-
                        Identified by data source ID.
                         Only READ_ONLY data source can be added.
                validateOnly:
                    type: boolean
                    description: Validate only also tests the data source connection.
        AuditLog:
            type: object
            properties:
                id:
                    type: string
                createTime:
                    type: string
                    format: date-time
                parent:
                    type: string
                method:
                    type: string
                resource:
                    type: string
                user:
                    type: string
                severity:
                    enum:
                        - AUDIT_SEVERITY_UNSPECIFIED
                        - INFO
                        - WARNING
                        - ERROR
                    type: string
                    format: enum
                request:
                    type: object
                response:
                    type: object
                status:
                    $ref: '#/components/schemas/AuditStatus'
                latencyMs:
                    type: string
                serviceData:
                    type: object
                requestMetadata:
                    $ref: '#/components/schemas/RequestMetadata'
        AuditStatus:
            type: object
            properties:
                code:
                    type: integer
                    format: int32
                message:
                    type: string
        BatchGetUsersResponse:
            type: object
            properties:
                users:
                    type: array
                    items:
                        $ref: '#/components/schemas/User'
                    description: The users from the specified request.
        BatchSyncInstancesRequest:
            required:
                - requests
            type: object
