                        - QUALITY_SEVERITY_WARNING
                        - QUALITY_SEVERITY_ERROR
                        - QUALITY_SEVERITY_CRITICAL
                    type: string
                    format: enum
                state:
                    enum:
                        - QUALITY_RULE_STATE_UNSPECIFIED
                        - QUALITY_RULE_STATE_ENABLED
                        - QUALITY_RULE_STATE_PAUSED
                        - QUALITY_RULE_STATE_ARCHIVED
                    type: string
                    format: enum
                owner:
                    type: string
                    description: 'Format: users/{user}. Empty when the rule has no owner.'
                scheduleInterval:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: |-
                        How often the rule runs, between 15m and 7d. Zero is rejected: pausing is
                         how scheduling stops, and a newly created rule first runs on its next
                         scheduled slot, not immediately.
                revision:
                    readOnly: true
                    type: integer
                    description: |-
                        The current revision. Every semantic edit increments it and appends a
                         revision row.
                    format: int32
                targetSchemaChanged:
                    readOnly: true
                    type: boolean
                    description: |-
                        True when the target's current metadata hash differs from the hash recorded
                         when the rule was saved, i.e. the target's schema changed underneath it.
                createTime:
                    readOnly: true
                    type: string
                    format: date-time
                updateTime:
                    readOnly: true
                    type: string
                    format: date-time
                lastResult:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/QualityResultSummary'
                    description: |-
                        The most recent result, for the list view. It is not part of the rule and
                         is only populated by reads, never persisted on write.
                orphanedReason:
                    readOnly: true
                    type: string
                    description: |-
                        Why the target can no longer be resolved, e.g. because the table was
                         dropped. Empty while the target is healthy.
                muteUntil:
                    type: string
                    description: |-
                        Rule-level mute. It only silences issue notifications; executions still run
                         and results are still recorded.
                    format: date-time
                tags:
                    type: array
                    items:
                        type: string
            description: QualityRule is one data quality check.
        QualityRuleConfig:
            type: object
            properties:
                rowCount:
                    $ref: '#/components/schemas/RowCountConfig'
                rowCountChange:
                    $ref: '#/components/schemas/RowCountChangeConfig'
                nullPercent:
                    $ref: '#/components/schemas/NullPercentConfig'
                unique:
                    $ref: '#/components/schemas/UniqueConfig'
                uniqueCombination:
                    $ref: '#/components/schemas/UniqueCombinationConfig'
                acceptedValues:
                    $ref: '#/components/schemas/AcceptedValuesConfig'
                range:
                    $ref: '#/components/schemas/RangeConfig'
                regex:
                    $ref: '#/components/schemas/RegexConfig'
                stringLength:
                    $ref: '#/components/schemas/StringLengthConfig'
                referentialIntegrity:
                    $ref: '#/components/schemas/ReferentialIntegrityConfig'
                crossColumn:
                    $ref: '#/components/schemas/CrossColumnConfig'
                freshness:
                    $ref: '#/components/schemas/FreshnessConfig'
                customSql:
                    $ref: '#/components/schemas/CustomSQLConfig'
                celExpression:
                    allOf:
                        - $ref: '#/components/schemas/CelExpressionConfig'
                    description: v1.1.
                schemaDrift:
                    allOf:
                        - $ref: '#/components/schemas/SchemaDriftConfig'
                    description: 'v1.1 first batch: metadata drift and grouped row-count bounds.'
                groupCheck:
                    $ref: '#/components/schemas/GroupCheckConfig'
                aggregate:
                    allOf:
                        - $ref: '#/components/schemas/AggregateConfig'
                    description: 'v1.1 second batch: aggregates and cross-table reconciliation.'
                crossTable:
                    $ref: '#/components/schemas/CrossTableConfig'
                thresholdMetric:
                    enum:
                        - QUALITY_THRESHOLD_METRIC_UNSPECIFIED
                        - QUALITY_THRESHOLD_METRIC_COUNT
                        - QUALITY_THRESHOLD_METRIC_PERCENT
                    type: string
                    format: enum
                filter:
                    $ref: '#/components/schemas/QualityFilter'
                onEmpty:
                    enum:
                        - QUALITY_EMPTY_BEHAVIOR_UNSPECIFIED
                        - QUALITY_EMPTY_BEHAVIOR_NOT_EVALUATED
                        - QUALITY_EMPTY_BEHAVIOR_PASS
                        - QUALITY_EMPTY_BEHAVIOR_FAIL
                    type: string
                    format: enum
            description: |-
                QualityRuleConfig is the typed parameters of one rule. Exactly one arm of the
                 oneof is set, and it must correspond to the rule's type; the filter, the empty
                 behavior and the count/percent metric are shared by every type.
        QualityRuleDraftConfig:
            type: object
            properties:
                config:
                    $ref: '#/components/schemas/QualityRuleConfig'
                severity:
                    enum:
                        - QUALITY_SEVERITY_UNSPECIFIED
                        - QUALITY_SEVERITY_WARNING
                        - QUALITY_SEVERITY_ERROR
                        - QUALITY_SEVERITY_CRITICAL
                    type: string
                    format: enum
                title:
                    type: string
                rationale:
                    type: string
                confidence:
                    type: number
                    format: double
            description: |-
                QualityRuleDraftConfig is one model-proposed rule, already validated into the
                 typed config. It is never executed without a human saving it as a rule.
        QualityRuleResult:
            type: object
            properties:
                name:
                    type: string
                    description: 'Format: workspaces/{workspace}/qualityRuleResults/{quality_rule_result}'
                run:
                    type: string
                    description: 'Format: workspaces/{workspace}/qualityRuns/{quality_run}'
                rule:
                    type: string
                    description: 'Format: workspaces/{workspace}/qualityRules/{quality_rule}'
                ruleRevision:
                    type: integer
                    description: The rule revision this result was judged with.
                    format: int32
                ruleEngineVersion:
                    type: string
                    description: |-
                        The engine version that produced it, so a changed judgment is traceable to a
                         changed implementation.
                target:
                    allOf:
                        - $ref: '#/components/schemas/QualityTarget'
                    description: The target as it was when the result was produced.
                status:
                    enum:
                        - QUALITY_STATUS_UNSPECIFIED
                        - QUALITY_STATUS_PASS
                        - QUALITY_STATUS_WARN
                        - QUALITY_STATUS_FAIL
                        - QUALITY_STATUS_ERROR
                        - QUALITY_STATUS_SKIPPED
                        - QUALITY_STATUS_NOT_EVALUATED
                    type: string
                    format: enum
                observedValue:
                    type: number
                    description: The observed value; its unit is observed_kind.
                    format: double
                observedKind:
                    enum:
                        - QUALITY_OBSERVED_KIND_UNSPECIFIED
                        - QUALITY_OBSERVED_KIND_COUNT
                        - QUALITY_OBSERVED_KIND_RATIO
                        - QUALITY_OBSERVED_KIND_SECONDS
                        - QUALITY_OBSERVED_KIND_TIMESTAMP
                        - QUALITY_OBSERVED_KIND_NUMBER
                    type: string
                    format: enum
                thresholds:
                    allOf:
                        - $ref: '#/components/schemas/QualityThresholds'
                    description: The thresholds that were applied, snapshotted.
                failedRows:
                    type: string
                totalRows:
                    type: string
                sampled:
                    type: boolean
                    description: True when the observation was made over a sample rather than every row.
                sampleRows:
                    type: string
                truncated:
                    type: boolean
                    description: True when the samples were cut off by the sample limit.
                samples:
                    type: array
                    items:
                        $ref: '#/components/schemas/FailureSample'
                    description: Failed rows kept as evidence, already truncated per value.
                executedSql:
                    type: string
                    description: The SQL that was executed. Kept so a result can be re-checked by hand.
                errorCode:
                    type: string
                    description: |-
                        A machine-readable failure class: CONNECTION, AUTH, TIMEOUT, PERMISSION,
                         UNSUPPORTED, SQL_SYNTAX, BAD_DATA, LIMIT_EXCEEDED or ORPHANED. Empty unless
                         status is ERROR.
                errorMessage:
                    type: string
                    description: A human-readable failure message. Empty unless status is ERROR.
                duration:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                startTime:
                    type: string
                    format: date-time
                finishTime:
                    type: string
                    format: date-time
            description: QualityRuleResult is one rule's outcome in one run.
        QualityRun:
            type: object
            properties:
                name:
                    type: string
                    description: 'Format: workspaces/{workspace}/qualityRuns/{quality_run}'
                trigger:
                    enum:
                        - QUALITY_RUN_TRIGGER_UNSPECIFIED
                        - QUALITY_RUN_TRIGGER_MANUAL
                        - QUALITY_RUN_TRIGGER_SCHEDULED
                    type: string
                    format: enum
                status:
                    enum:
                        - QUALITY_RUN_STATUS_UNSPECIFIED
                        - QUALITY_RUN_STATUS_PENDING
                        - QUALITY_RUN_STATUS_RUNNING
                        - QUALITY_RUN_STATUS_COMPLETED
                        - QUALITY_RUN_STATUS_ABANDONED
                    type: string
                    description: |-
                        The run's lifecycle. A queued or running run reports PENDING / RUNNING here;
                         its outcome is not known yet.
                    format: enum
                counts:
                    $ref: '#/components/schemas/QualityRunCounts'
                startTime:
                    type: string
                    format: date-time
                finishTime:
                    type: string
                    description: Unset while the run is queued or still executing.
                    format: date-time
                initiator:
                    type: string
                    description: |-
                        The principal that started the run. Format: users/{user}. Empty for a
                         scheduled run.
                instance:
                    type: string
                    description: 'The instance this batch belongs to. Format: instances/{instance}'
                outcome:
                    readOnly: true
                    enum:
                        - QUALITY_STATUS_UNSPECIFIED
                        - QUALITY_STATUS_PASS
                        - QUALITY_STATUS_WARN
                        - QUALITY_STATUS_FAIL
                        - QUALITY_STATUS_ERROR
                        - QUALITY_STATUS_SKIPPED
                        - QUALITY_STATUS_NOT_EVALUATED
                    type: string
                    description: |-
                        The rollup of the run's results: the worst status any result reported.
                         Unset until the run completes; ERROR and FAIL stay distinct.
                    format: enum
            description: |-
                QualityRun is one execution batch: manually selected rules, or the rules of one
                 instance that became due in one scheduler tick.
        QualityRunCounts:
            type: object
            properties:
                total:
                    type: integer
                    format: int32
                pass:
                    type: integer
                    format: int32
                warn:
                    type: integer
                    format: int32
                fail:
                    type: integer
                    format: int32
                error:
                    type: integer
                    format: int32
                skipped:
                    type: integer
                    format: int32
                notEvaluated:
                    type: integer
                    format: int32
            description: QualityRunCounts is the six-state tally of one run.
        QualitySuggestion:
            type: object
            properties:
                name:
                    type: string
                    description: 'Format: workspaces/{workspace}/qualitySuggestions/{quality_suggestion}'
                kind:
                    enum:
                        - QUALITY_SUGGESTION_KIND_UNSPECIFIED
                        - QUALITY_SUGGESTION_KIND_RULE_DRAFT
                        - QUALITY_SUGGESTION_KIND_LABEL
                    type: string
                    format: enum
                source:
                    enum:
                        - QUALITY_SUGGESTION_SOURCE_UNSPECIFIED
                        - QUALITY_SUGGESTION_SOURCE_NATURAL_LANGUAGE
                        - QUALITY_SUGGESTION_SOURCE_PROFILE
                    type: string
                    format: enum
                target:
                    allOf:
                        - $ref: '#/components/schemas/QualityTarget'
                    description: The target the suggestion is about.
                payload:
                    $ref: '#/components/schemas/QualitySuggestionPayload'
                status:
                    enum:
                        - QUALITY_SUGGESTION_STATUS_UNSPECIFIED
                        - QUALITY_SUGGESTION_STATUS_PENDING
                        - QUALITY_SUGGESTION_STATUS_ACCEPTED
                        - QUALITY_SUGGESTION_STATUS_REJECTED
                    type: string
                    format: enum
                provider:
                    type: string
                    description: The model that produced it.
                model:
                    type: string
                promptVersion:
                    type: string
                createTime:
                    type: string
                    format: date-time
                decidedBy:
                    type: string
                    description: 'Who decided it. Format: users/{user}. Empty while pending.'
                decideTime:
                    type: string
                    format: date-time
                decisionNote:
                    type: string
            description: |-
                QualitySuggestion is one model-proposed rule draft or semantic label waiting
                 for a reviewer. Nothing here is a rule: accepting a suggestion goes through the
                 normal rule or label path.
        QualitySuggestionPayload:
            type: object
            properties:
                rule:
                    $ref: '#/components/schemas/QualityRuleDraftConfig'
                label:
                    $ref: '#/components/schemas/SemanticLabelSuggestion'
            description: |-
                QualitySuggestionPayload is the review-queue payload: a rule draft the reviewer
                 can load into the editor, or a semantic label awaiting confirmation.
        QualityTarget:
            type: object
            properties:
                metaGuid:
                    type: string
                    description: The globally unique metadata GUID of the target table.
                metaType:
                    enum:
                        - UNSPECIFIED
                        - INSTANCE
                        - DATABASE
                        - SCHEMA
                        - TABLE
                        - EXTERNAL_TABLE
                        - EXTERNAL_DATASET
                        - MANUAL_SQL
                        - APPLICATION_SQL
                        - VIEW
                        - MATERIALIZED_VIEW
                        - COLUMN
                        - INDEX
                        - FOREIGN_KEY
                        - PROCEDURE
                        - FUNCTION
                        - SEQUENCE
                        - OPENLINEAGE
                    type: string
                    format: enum
                path:
                    allOf:
                        - $ref: '#/components/schemas/QualityTargetPath'
                    description: |-
                        Where the target lived when the rule was saved. It is display metadata, not
                         identity: the GUID and its meta type are the identity.
                columns:
                    type: array
                    items:
                        type: string
                    description: |-
                        The columns the rule reads, as a snapshot for display. The column named in
                         the config is authoritative; validation requires them to agree.
            description: QualityTarget is what a rule observes.
        QualityTargetPath:
            type: object
            properties:
                instance:
                    type: string
                database:
                    type: string
                schema:
                    type: string
                object:
                    type: string
                column:
                    type: string
                    description: Empty for a table-level rule.
            description: |-
                QualityTargetPath is the display snapshot of where a target lived when the
                 rule was saved.
        QualityThresholds:
            type: object
            properties:
                warnValue:
                    type: number
                    description: Unset means the rule has no warning level.
                    format: double
                failValue:
                    type: number
                    format: double
                warnValueUpper:
                    type: number
                    format: double
                failValueUpper:
                    type: number
                    format: double
                comparison:
                    enum:
                        - QUALITY_COMPARISON_UNSPECIFIED
                        - QUALITY_COMPARISON_GREATER_THAN
                        - QUALITY_COMPARISON_LESS_THAN
                        - QUALITY_COMPARISON_OUTSIDE_RANGE
                        - QUALITY_COMPARISON_INSIDE_RANGE
                    type: string
                    format: enum
                onEmpty:
                    enum:
                        - QUALITY_EMPTY_BEHAVIOR_UNSPECIFIED
                        - QUALITY_EMPTY_BEHAVIOR_NOT_EVALUATED
                        - QUALITY_EMPTY_BEHAVIOR_PASS
                        - QUALITY_EMPTY_BEHAVIOR_FAIL
                    type: string
                    format: enum
            description: |-
                QualityThresholds is the threshold snapshot a result records, so a historical
                 result can be explained after the rule's thresholds changed. For
                 GREATER_THAN / LESS_THAN only value fields are set; for the range comparisons
                 the lower and upper bounds are.
        QualityTrendPoint:
            type: object
            properties:
                date:
                    type: string
                    description: The day, as YYYY-MM-DD in UTC.
                pass:
                    type: integer
                    format: int32
                warn:
                    type: integer
                    format: int32
                fail:
                    type: integer
                    format: int32
                error:
                    type: integer
                    format: int32
                skipped:
                    type: integer
                    format: int32
                notEvaluated:
                    type: integer
                    format: int32
                total:
                    type: integer
                    format: int32
            description: QualityTrendPoint is one day of result tallies.
        RangeConfig:
            type: object
            properties:
                column:
                    type: string
                min:
                    type: string
                max:
                    type: string
                inclusive:
                    type: boolean
                    description: |-
                        Whether both bounds are inclusive. Default false, i.e. the interval is open
                         on both ends.
                failThreshold:
                    type: number
                    format: double
                warnThreshold:
                    type: number
                    format: double
            description: |-
                RangeConfig counts rows outside a bound pair. At least one bound is required;
                 the values are strings parsed with the column's type.
        ReferentialIntegrityConfig:
            type: object
            properties:
                childColumn:
                    type: string
                parentTable:
                    type: string
                    description: The parent table as "schema.table".
                parentColumn:
                    type: string
                allowNull:
                    type: boolean
                    description: When true, a NULL child value is not an orphan. Default false.
                failThreshold:
                    type: number
                    format: double
                warnThreshold:
                    type: number
                    format: double
            description: |-
                ReferentialIntegrityConfig counts child rows with no matching parent row. The
                 parent must live in the same instance, database and schema.
        RefreshRequest:
            type: object
            properties: {}
        RefreshResponse:
            type: object
            properties: {}
            description: |-
                RefreshResponse is empty: both credentials the refresh produces travel in
                 HttpOnly cookies, so no token ever reaches page JavaScript.
        RegexConfig:
            type: object
            properties:
                column:
                    type: string
                pattern:
                    type: string
                failThreshold:
                    type: number
                    format: double
                warnThreshold:
                    type: number
                    format: double
            description: |-
                RegexConfig counts rows whose column value does not match a regular
                 expression. The pattern is Go RE2 syntax and is also translated for the
                 engine's own regex operator.
        RevokeConnectedAppRequest:
            required:
                - name
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        The resource name of the connected app to revoke, in the form
                         `connectedApps/{id}`.
        Role:
            required:
                - name
            type: object
            properties:
                name:
                    type: string
                    description: The resource name of the role, in the form `roles/{role}`.
                title:
                    type: string
                    description: Human-readable title.
                description:
                    type: string
                    description: Longer description of what the role grants.
                permissions:
                    type: array
                    items:
                        type: string
                    description: |-
                        Permissions bundled into the role, each a `metaxisdata.<resource>.<verb>`
                         string from the permission catalog.
                predefined:
                    readOnly: true
                    type: boolean
                    description: Output only. Whether the role is predefined (defined in Go, read-only).
            description: |-
                Role is a named bundle of permissions. Predefined roles (workspaceAdmin,
                 workspaceMember) are defined in Go and never stored in the DB; custom roles
                 live in the role table. Both resolve identically in the IAM engine.
                 Predefined roles are read-only over this API.
        RowCountChangeConfig:
            type: object
            properties:
                maxIncreasePct:
                    type: number
                    format: double
                maxDecreasePct:
                    type: number
                    format: double
                warnIncreasePct:
                    type: number
                    format: double
                warnDecreasePct:
                    type: number
                    format: double
            description: |-
                RowCountChangeConfig bounds the change against the rule's last successful
                 observation. Without a recent baseline the result is NOT_EVALUATED.
        RowCountConfig:
            type: object
            properties:
                minRows:
                    type: string
                maxRows:
                    type: string
                exactRows:
                    type: string
                    description: When set, the row count must equal it exactly.
                warnMinRows:
                    type: string
                warnMaxRows:
                    type: string
            description: |-
                RowCountConfig bounds the number of rows. At least one bound is required; a
                 warn bound makes the rule report WARN before it reports FAIL.
        RuleMetadata:
            type: object
            properties:
                name:
                    type: string
                    description: The name of the rule.
                event:
                    type: string
                    description: 'The event type of the rule: SELECT, INSERT, UPDATE, or DELETE.'
                condition:
                    type: string
                    description: The WHERE condition of the rule (optional).
                action:
                    type: string
                    description: The command(s) to execute when the rule fires.
                isInstead:
                    type: boolean
                    description: The is_instead indicates whether this is an INSTEAD rule.
                isEnabled:
                    type: boolean
                    description: The is_enabled indicates whether the rule is enabled.
                definition:
                    type: string
                    description: The full CREATE RULE statement.
            description: RuleMetadata is the metadata for PostgreSQL rules.
        RunQualityRulesRequest:
            required:
                - parent
            type: object
            properties:
                parent:
                    type: string
                    description: 'Format: workspaces/{workspace}. "workspaces/-" is the current workspace.'
                rules:
                    type: array
                    items:
                        type: string
                    description: |-
                        The rules to run, at most 200. At least one of rules, instance and
                         target_guid must be set.
                instance:
                    type: string
                    description: |-
                        Restrict the selection to the enabled rules of one instance.
                         Format: instances/{instance}
                targetGuid:
                    type: string
                    description: Restrict the selection to the enabled rules that watch this table.
        RunQualityRulesResponse:
            type: object
            properties:
                runs:
                    type: array
                    items:
                        $ref: '#/components/schemas/QualityRun'
                    description: |-
                        One run per instance in the selection. All of them are queued and pending
                         when the response is returned; poll GetQualityRun for their outcome.
        SchemaDriftColumn:
            type: object
            properties:
                name:
                    type: string
                type:
                    type: string
                nullable:
                    type: boolean
            description: SchemaDriftColumn is one column of the snapshot a schema-drift rule expects.
        SchemaDriftConfig:
            type: object
            properties:
                expectedColumns:
                    type: array
                    items:
                        $ref: '#/components/schemas/SchemaDriftColumn'
                    description: |-
                        The snapshot. The API fills it from the current columns when a rule is
                         created without one, and the editor lets a user adjust it.
                checkTypes:
                    type: boolean
                    description: |-
                        Whether a changed column type is drift. Unset means true: a type change is
                         drift unless the rule author turns the check off.
                checkOrder:
                    type: boolean
                    description: Whether a changed column order is drift. Default false.
                allowExtraColumns:
                    type: boolean
                    description: Whether a column the snapshot does not name is drift. Default false.
                failThreshold:
                    type: number
                    description: Drift items tolerated. The metric is always COUNT here.
                    format: double
                warnThreshold:
                    type: number
                    format: double
            description: |-
                SchemaDriftConfig compares the live column list with the snapshot taken when
                 the rule was saved. The rule reads metadata only, so it costs the target
                 database nothing.
        SchemaMetadata:
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        The schema name.
                         It is an empty string for databases without such concept such as MySQL.
                tables:
                    type: array
                    items:
                        $ref: '#/components/schemas/TableMetadata'
                    description: The list of tables in a schema.
                externalTables:
                    type: array
                    items:
                        $ref: '#/components/schemas/ExternalTableMetadata'
                    description: The list of external tables in a schema.
                views:
                    type: array
                    items:
                        $ref: '#/components/schemas/ViewMetadata'
                    description: The list of views in a schema.
                functions:
                    type: array
                    items:
                        $ref: '#/components/schemas/FunctionMetadata'
                    description: The list of functions in a schema.
                procedures:
                    type: array
                    items:
                        $ref: '#/components/schemas/ProcedureMetadata'
                    description: The list of procedures in a schema.
                materializedViews:
                    type: array
                    items:
                        $ref: '#/components/schemas/MaterializedViewMetadata'
                    description: The list of materialized views in a schema.
                sequences:
                    type: array
                    items:
                        $ref: '#/components/schemas/SequenceMetadata'
                    description: The list of sequences in a schema.
                owner:
                    type: string
                comment:
                    type: string
                events:
                    type: array
                    items:
                        $ref: '#/components/schemas/EventMetadata'
                enumTypes:
                    type: array
                    items:
                        $ref: '#/components/schemas/EnumTypeMetadata'
                skipDump:
                    type: boolean
            description: |-
                SchemaMetadata is the metadata for schemas.
                 This is the concept of schema in Postgres, but it's a no-op for MySQL.
        SchemaSyncDetail:
            type: object
            properties:
                instance:
                    type: string
                    description: 'Format: instances/{instance}'
                instanceTitle:
                    type: string
                    description: |-
                        The instance's display name, so a client can render the message without a
                         second read.
                trigger:
                    enum:
                        - SYNC_TRIGGER_UNSPECIFIED
                        - SYNC_TRIGGER_MANUAL
                        - SYNC_TRIGGER_BACKGROUND
                    type: string
                    format: enum
                instanceError:
                    type: string
                    description: Why the instance metadata step failed. Empty when it succeeded.
                databases:
                    type: array
                    items:
                        $ref: '#/components/schemas/SyncDatabaseResult'
                    description: |-
                        The databases this message names, each with its outcome: the ones that failed
                         or never reported for an instance-wide sync, and the database itself for a sync
                         of one database. Successful databases are counted rather than listed, and the
                         list is capped; the counts below carry the whole picture.
                succeededCount:
                    type: integer
                    format: int32
                failedCount:
                    type: integer
                    format: int32
                unfinishedCount:
                    type: integer
                    format: int32
            description: |-
                SchemaSyncDetail reports one sync operation: the instance metadata step plus
                 every database that was queued by it.
        SearchManualSQLResponse:
            type: object
            properties:
                manualSqls:
                    type: array
                    items:
                        $ref: '#/components/schemas/ManualSQL'
                nextPageToken:
                    type: string
        SearchMetadataResponse:
            type: object
            properties:
                results:
                    type: array
                    items:
                        $ref: '#/components/schemas/SearchMetadataResult'
                    description: The search results.
                nextPageToken:
                    type: string
                    description: |-
