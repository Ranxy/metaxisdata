            type: object
            properties:
                guid:
                    type: string
                upstreamCount:
                    type: integer
                    format: int32
                downstreamCount:
                    type: integer
                    format: int32
            description: |-
                LineageCount is one object's degree in the stored graph, at table level: how
                 many distinct objects its column-level relations connect it to. The count is
                 of objects, not of relations, so two tables joined on five columns are one
                 upstream object rather than five.
        LineageNode:
            type: object
            properties:
                guid:
                    type: string
                metaType:
                    enum:
                        - UNSPECIFIED
                        - INSTANCE
                        - DATABASE
                        - SCHEMA
                        - TABLE
                        - EXTERNAL_TABLE
                        - EXTERNAL_DATASET
                        - MANUAL_SQL
                        - APPLICATION_SQL
                        - VIEW
                        - MATERIALIZED_VIEW
                        - COLUMN
                        - INDEX
                        - FOREIGN_KEY
                        - PROCEDURE
                        - FUNCTION
                        - SEQUENCE
                        - OPENLINEAGE
                    type: string
                    format: enum
                name:
                    type: string
                    description: The object name; the dataset name for an external dataset.
                database:
                    type: string
                schema:
                    type: string
                instanceId:
                    type: string
                distance:
                    type: integer
                    description: 'Hops from the root: negative upstream, positive downstream.'
                    format: int32
            description: |-
                LineageNode is one object in the multi-level graph. Only column-level edges
                 are stored, so the table-level relations are the collapse of those edges: an
                 object whose definition yields no column-level relation at all (for example a
                 bare `SELECT count(*)`, or an object that was never synced) does not appear.
