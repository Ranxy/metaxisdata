                name:
                    type: string
                    description: The name of the trigger.
                event:
                    type: string
                    description: The event that triggers this action, such as INSERT, UPDATE, DELETE, or TRUNCATE.
                timing:
                    type: string
                    description: The timing of when the trigger fires, such as BEFORE or AFTER.
                body:
                    type: string
                    description: The body of the trigger.
                sqlMode:
                    type: string
                characterSetClient:
                    type: string
                collationConnection:
                    type: string
                comment:
                    type: string
                skipDump:
                    type: boolean
        UndeleteInstanceRequest:
            required:
                - name
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        The name of the deleted instance.
                         Format: instances/{instance}
        UndeleteUserRequest:
            required:
                - name
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        The name of the deleted user.
                         Format: users/{user}
        UniqueCombinationConfig:
            type: object
            properties:
                columns:
                    type: array
                    items:
                        type: string
                allColumns:
                    type: boolean
                    description: |-
                        Use every column of the target table instead of the list above. That makes
                         the rule a whole-row duplicate check.
                countNulls:
                    type: boolean
                failThreshold:
                    type: number
                    format: double
                warnThreshold:
                    type: number
                    format: double
            description: |-
                UniqueCombinationConfig counts duplicated tuples across several columns, or
                 across every column of the table when all_columns is set.
        UniqueConfig:
            type: object
            properties:
                column:
                    type: string
                countNulls:
                    type: boolean
                    description: |-
                        When true, NULL values are treated as a value: more than one NULL is a
                         duplicate. The default is false, matching SQL uniqueness.
                failThreshold:
                    type: number
                    format: double
                warnThreshold:
                    type: number
                    format: double
            description: |-
                UniqueConfig counts duplicated non-NULL values in one column. The threshold is
                 measured per threshold_metric; the default fail threshold is zero.
