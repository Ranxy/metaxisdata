syntax = "proto3";

package metaxisdata.v1;

option go_package = "github.com/Ranxy/metaxisdata/backend/generated-go/v1";

enum State {
  STATE_UNSPECIFIED = 0;
  ACTIVE = 1;
  DELETED = 2;
}

// Engine is the database engine of an instance. Only the engines the product
// actually supports are kept: MySQL-compatible ones (MySQL, TiDB, MariaDB,
// OceanBase, StarRocks, Doris), PostgreSQL and SQL Server. The other removed
// values keep their numbers reserved so they can never be silently reused for
// something else.
enum Engine {
  ENGINE_UNSPECIFIED = 0;

  reserved 4 to 5, 7 to 12, 17 to 28;
  reserved "CLICKHOUSE", "SNOWFLAKE", "SQLITE", "MONGODB", "REDIS", "ORACLE", "SPANNER", "REDSHIFT", "HIVE", "ELASTICSEARCH", "BIGQUERY", "DYNAMODB", "DATABRICKS", "COCKROACHDB", "COSMOSDB", "TRINO", "CASSANDRA";

  MSSQL = 1;
  MYSQL = 2;
  POSTGRES = 3;
  TIDB = 6;
  MARIADB = 13;
  OCEANBASE = 14;
  STARROCKS = 15;
  DORIS = 16;
}
