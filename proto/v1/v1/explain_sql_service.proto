syntax = "proto3";

package metaxisdata.v1;

import "google/api/annotations.proto";
import "v1/annotation.proto";

option go_package = "github.com/Ranxy/metaxisdata/backend/generated-go/v1";

service ExplainSQLService {
  rpc ExplainSQL(ExplainSQLRequest) returns (stream ExplainSQLResponse) {
    option (google.api.http) = {
      post: "/v1/explain-sql"
      body: "*"
    };
    option (metaxisdata.v1.permission) = "metaxisdata.explainSql.explain";
  }
}

message ExplainSQLRequest {
  string meta_guid = 1;
  string sql_text = 3;
  bool force_regenerate = 4;
  string provider_name = 5;
  string scope_prefix = 6;

  reserved 2;
  reserved "meta_type";
}

message ExplainSQLResponse {
  oneof payload {
    string content = 1;
    ExplainSQLMetadata metadata = 2;
    ExplainSQLProgress progress = 4;
  }

  reserved 3;
  reserved "error";
}

message ExplainSQLProgress {
  string type = 1;
  int32 turn = 2;
  string tool_name = 3;
  string tool_input = 4;
  string tool_output = 5;
  string tool_error = 6;
}

message ExplainSQLMetadata {
  string summary = 1;
  string provider = 3;
  string model = 4;
  string cache_key = 5;
  bool from_cache = 7;
  string cache_created_at = 8;

  reserved 2, 6;
  reserved "sections_json", "expired";
}
