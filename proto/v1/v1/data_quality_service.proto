message GetQualityCodeTableRequest {
  // Format: workspaces/{workspace}/qualityCodeTables/{quality_code_table}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "metaxisdata/QualityCodeTable"}
  ];
}

message CreateQualityCodeTableRequest {
  // Format: workspaces/{workspace}. "workspaces/-" is the current workspace.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];

  // The table to create. Its name is assigned by the server.
  QualityCodeTable quality_code_table = 2 [(google.api.field_behavior) = REQUIRED];
}

message UpdateQualityCodeTableRequest {
  QualityCodeTable quality_code_table = 1 [(google.api.field_behavior) = REQUIRED];

  // The fields to replace: "title", "description", "values".
  google.protobuf.FieldMask update_mask = 2;
