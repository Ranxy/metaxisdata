syntax = "proto3";

package metaxisdata.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "v1/annotation.proto";
import "v1/database_service.proto";
import "v1/explain_sql_service.proto";

option go_package = "github.com/Ranxy/metaxisdata/backend/generated-go/v1";

// DataQualityService manages the checks that watch the data itself: rules and
// their executions.
//
// A rule observes one target — a table, or one column of it — with a typed
// check (row count, null percent, uniqueness, accepted values, ...). Scheduling
// belongs to the target: every enabled check on a target runs together when the
// target's schedule comes due, and a check can also run on demand. An execution
// is one rule checked once: it is planned asynchronously, executed by the
// runner, and polled until it reaches a state or an outcome. Batching rules for
// scheduling is an internal concern and is not exposed as a resource.
service DataQualityService {
  // List rules, newest first.
  rpc ListQualityRules(ListQualityRulesRequest) returns (ListQualityRulesResponse) {
    option (google.api.http) = {get: "/v1/{parent=workspaces/*}/qualityRules"};
    option (google.api.method_signature) = "parent";
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.rules.list";
  }

  // Read one rule, including its current revision and a summary of its most
  // recent result.
  rpc GetQualityRule(GetQualityRuleRequest) returns (QualityRule) {
    option (google.api.http) = {get: "/v1/{name=workspaces/*/qualityRules/*}"};
    option (google.api.method_signature) = "name";
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.rules.get";
  }

  // Create a rule. The rule is validated and compiled before it is stored; a
  // rejected rule is never persisted.
  rpc CreateQualityRule(CreateQualityRuleRequest) returns (QualityRule) {
    option (google.api.http) = {
      post: "/v1/{parent=workspaces/*}/qualityRules"
      body: "rule"
    };
    option (google.api.method_signature) = "parent,rule";
    option (metaxisdata.v1.audit) = true;
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.rules.create";
  }

  // Create a batch of rules in one call, optionally from the suggestions they
  // came from. Each item is validated and stored independently: a failure is
  // reported in its own result and does not abort the other items.
  rpc BatchCreateQualityRules(BatchCreateQualityRulesRequest) returns (BatchCreateQualityRulesResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=workspaces/*}/qualityRules:batchCreate"
      body: "*"
    };
    option (metaxisdata.v1.audit) = true;
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.rules.create";
  }

  // Update a batch of rules in one call. Each item is applied independently:
  // a failure is reported in its own result and does not abort the other items.
  // An item that names a stale revision fails on its own rather than
  // overwriting a concurrent edit.
  rpc BatchUpdateQualityRules(BatchUpdateQualityRulesRequest) returns (BatchUpdateQualityRulesResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=workspaces/*}/qualityRules:batchUpdate"
      body: "*"
    };
    option (metaxisdata.v1.audit) = true;
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.rules.update";
  }

  // Update a rule. Every semantic edit appends a revision, so a historical
  // result always stays explainable by the definition that produced it.
  rpc UpdateQualityRule(UpdateQualityRuleRequest) returns (QualityRule) {
    option (google.api.http) = {
      patch: "/v1/{rule.name=workspaces/*/qualityRules/*}"
      body: "rule"
    };
    option (google.api.method_signature) = "rule,update_mask";
    option (metaxisdata.v1.audit) = true;
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.rules.update";
  }

  // Delete a rule. The rule, its revisions and results are only archived, never
  // physically removed, so history stays readable.
  rpc DeleteQualityRule(DeleteQualityRuleRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/{name=workspaces/*/qualityRules/*}"};
    option (google.api.method_signature) = "name";
    option (metaxisdata.v1.audit) = true;
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.rules.delete";
  }

  // List the workspace's custom rule templates, newest first. Built-in templates
  // are served by the client catalogue and are not part of this resource.
  rpc ListQualityRuleTemplates(ListQualityRuleTemplatesRequest) returns (ListQualityRuleTemplatesResponse) {
    option (google.api.http) = {get: "/v1/{parent=workspaces/*}/qualityRuleTemplates"};
    option (google.api.method_signature) = "parent";
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.templates.list";
  }

  // Read one custom rule template.
  rpc GetQualityRuleTemplate(GetQualityRuleTemplateRequest) returns (QualityRuleTemplate) {
    option (google.api.http) = {get: "/v1/{name=workspaces/*/qualityRuleTemplates/*}"};
    option (google.api.method_signature) = "name";
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.templates.list";
  }

  // Create a custom rule template. A template is a check type and its parameters:
  // target-bound fields (columns, filter) are cleared by the server before it is
  // stored.
  rpc CreateQualityRuleTemplate(CreateQualityRuleTemplateRequest) returns (QualityRuleTemplate) {
    option (google.api.http) = {
      post: "/v1/{parent=workspaces/*}/qualityRuleTemplates"
      body: "quality_rule_template"
    };
    option (google.api.method_signature) = "parent,quality_rule_template";
    option (metaxisdata.v1.audit) = true;
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.templates.create";
  }

  // Update a custom rule template's title, description, severity, dimension or
  // parameters. The same target-bound fields are cleared.
  rpc UpdateQualityRuleTemplate(UpdateQualityRuleTemplateRequest) returns (QualityRuleTemplate) {
    option (google.api.http) = {
      patch: "/v1/{quality_rule_template.name=workspaces/*/qualityRuleTemplates/*}"
      body: "quality_rule_template"
    };
    option (google.api.method_signature) = "quality_rule_template,update_mask";
    option (metaxisdata.v1.audit) = true;
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.templates.update";
  }

  // Delete a custom rule template. Checks already created from it are unaffected.
  rpc DeleteQualityRuleTemplate(DeleteQualityRuleTemplateRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/{name=workspaces/*/qualityRuleTemplates/*}"};
    option (google.api.method_signature) = "name";
    option (metaxisdata.v1.audit) = true;
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.templates.delete";
  }

  // List the workspace's code tables. A list response carries each table's value
  // count but not its values; read one table with GetQualityCodeTable.
  rpc ListQualityCodeTables(ListQualityCodeTablesRequest) returns (ListQualityCodeTablesResponse) {
    option (google.api.http) = {get: "/v1/{parent=workspaces/*}/qualityCodeTables"};
    option (google.api.method_signature) = "parent";
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.codeTables.list";
  }

  // Read one code table including its values.
  rpc GetQualityCodeTable(GetQualityCodeTableRequest) returns (QualityCodeTable) {
    option (google.api.http) = {get: "/v1/{name=workspaces/*/qualityCodeTables/*}"};
    option (google.api.method_signature) = "name";
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.codeTables.list";
  }

  // Create a workspace code table. Values are sorted, de-duplicated and capped by
  // the server, so an import is idempotent.
  rpc CreateQualityCodeTable(CreateQualityCodeTableRequest) returns (QualityCodeTable) {
    option (google.api.http) = {
      post: "/v1/{parent=workspaces/*}/qualityCodeTables"
      body: "quality_code_table"
    };
    option (google.api.method_signature) = "parent,quality_code_table";
    option (metaxisdata.v1.audit) = true;
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.codeTables.create";
  }

  // Update a code table's title, description or values. Replacing the values is the
  // import path.
  rpc UpdateQualityCodeTable(UpdateQualityCodeTableRequest) returns (QualityCodeTable) {
    option (google.api.http) = {
      patch: "/v1/{quality_code_table.name=workspaces/*/qualityCodeTables/*}"
      body: "quality_code_table"
    };
    option (google.api.method_signature) = "quality_code_table,update_mask";
    option (metaxisdata.v1.audit) = true;
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.codeTables.update";
  }

  // Delete a code table. A table still referenced by a rule or a template is
  // refused with FailedPrecondition rather than silently breaking those checks.
  rpc DeleteQualityCodeTable(DeleteQualityCodeTableRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/{name=workspaces/*/qualityCodeTables/*}"};
    option (google.api.method_signature) = "name";
    option (metaxisdata.v1.audit) = true;
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.codeTables.delete";
  }

  // Validate and compile a rule without saving it: config validation, filter
  // validation and a `LIMIT 0` probe against the target's read-only data
  // source. It writes nothing and creates no run.
  rpc PreviewQualityRule(PreviewQualityRuleRequest) returns (PreviewQualityRuleResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=workspaces/*}/qualityRules:preview"
      body: "*"
    };
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.rules.run";
  }

  // Execute rules now. One execution is planned per selected rule; the call
  // returns them all as PENDING after queueing them. Clients poll
  // GetQualityExecution for each execution's state and outcome.
  rpc RunQualityRules(RunQualityRulesRequest) returns (RunQualityRulesResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=workspaces/*}/qualityRules:run"
      body: "*"
    };
    option (metaxisdata.v1.audit) = true;
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.rules.run";
  }

  // List executions, newest first.
  rpc ListQualityExecutions(ListQualityExecutionsRequest) returns (ListQualityExecutionsResponse) {
    option (google.api.http) = {get: "/v1/{parent=workspaces/*}/qualityExecutions"};
    option (google.api.method_signature) = "parent";
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.executions.list";
  }

  // Read one execution: its state, verdict, and the evidence behind it.
  rpc GetQualityExecution(GetQualityExecutionRequest) returns (QualityExecution) {
    option (google.api.http) = {get: "/v1/{name=workspaces/*/qualityExecutions/*}"};
    option (google.api.method_signature) = "name";
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.executions.get";
  }

  // Read one check's judged values over its recent executions, the band its
  // current thresholds draw, and a threshold suggestion derived from that
  // history. It is a read model over the stored executions: nothing is written,
  // audited or measured against the target database.
  //
  // Only executions that reached a judged verdict (PASS, WARN or FAIL) carry a
  // value, so only those appear as points; a check that has never been judged has
  // no trend rather than a fabricated flat line.
  rpc GetQualityRuleTrend(GetQualityRuleTrendRequest) returns (QualityRuleTrend) {
    option (google.api.http) = {get: "/v1/{name=workspaces/*/qualityRules/*}:trend"};
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.executions.list";
  }

  // Export the executions the same filters select as ListQualityExecutions as one
  // CSV document, streamed in slices. This is a file download, not a list: it
  // stops at max_rows and reports the running row count on every slice.
  //
  // Rows are read page by page, so the file is not a consistent snapshot: a row
  // written while the export runs may fall in this file or the next. A stream
  // error means the file is incomplete and must be discarded — only a completed
  // stream is a document.
  //
  // No (google.api.http) annotation: this is a server-streaming method, and the
  // REST gateway cannot carry one. The browser reaches the Connect endpoint
  // directly, the way it does for ExplainSQL.
  rpc ExportQualityExecutions(ExportQualityExecutionsRequest) returns (stream ExportQualityDataChunk) {
    option (metaxisdata.v1.audit) = true;
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.executions.list";
  }

  // List runs, newest first. A run is one dispatch batch that belongs to one
  // target: the executions one scheduler tick or one manual request planned for
  // that target. Runs are the batch-level read model the execution directory
  // groups by target; the run itself carries the target and its counts.
  rpc ListQualityRuns(ListQualityRunsRequest) returns (ListQualityRunsResponse) {
    option (google.api.http) = {get: "/v1/{parent=workspaces/*}/qualityRuns"};
    option (google.api.method_signature) = "parent";
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.executions.list";
  }

  // Read one run: its target, state, verdict and counts.
  rpc GetQualityRun(GetQualityRunRequest) returns (QualityRun) {
    option (google.api.http) = {get: "/v1/{name=workspaces/*/qualityRuns/*}"};
    option (google.api.method_signature) = "name";
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.executions.list";
  }

  // List quality issues, newest first.
  rpc ListQualityIssues(ListQualityIssuesRequest) returns (ListQualityIssuesResponse) {
    option (google.api.http) = {get: "/v1/{parent=workspaces/*}/qualityIssues"};
    option (google.api.method_signature) = "parent";
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.issues.list";
  }

  // Read one quality issue.
  rpc GetQualityIssue(GetQualityIssueRequest) returns (QualityIssue) {
    option (google.api.http) = {get: "/v1/{name=workspaces/*/qualityIssues/*}"};
    option (google.api.method_signature) = "name";
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.issues.get";
  }

  // Export the issues the same filters select as ListQualityIssues as one CSV
  // document, streamed in slices. This is a file download, not a list: it stops
  // at max_rows and reports the running row count on every slice.
  //
  // Rows are read page by page, so the file is not a consistent snapshot: a row
  // written while the export runs may fall in this file or the next. A stream
  // error means the file is incomplete and must be discarded — only a completed
  // stream is a document.
  //
  // No (google.api.http) annotation, for the same reason as
  // ExportQualityExecutions.
  rpc ExportQualityIssues(ExportQualityIssuesRequest) returns (stream ExportQualityDataChunk) {
    option (metaxisdata.v1.audit) = true;
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.issues.list";
  }

  // Acknowledge, resolve or mute one quality issue.
  rpc UpdateQualityIssue(UpdateQualityIssueRequest) returns (QualityIssue) {
    option (google.api.http) = {
      patch: "/v1/{issue.name=workspaces/*/qualityIssues/*}"
      body: "issue"
    };
    option (google.api.method_signature) = "issue,update_mask";
    option (metaxisdata.v1.audit) = true;
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.issues.update";
  }

  // List the review queue of model-proposed rule drafts and semantic labels,
  // newest first.
  rpc ListQualitySuggestions(ListQualitySuggestionsRequest) returns (ListQualitySuggestionsResponse) {
    option (google.api.http) = {get: "/v1/{parent=workspaces/*}/qualitySuggestions"};
    option (google.api.method_signature) = "parent";
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.suggest";
  }

  // Read one queued suggestion. The queue is paged with ListQualitySuggestions;
  // this exists so a deep link can open one draft without reading the pages.
  rpc GetQualitySuggestion(GetQualitySuggestionRequest) returns (QualitySuggestion) {
    option (google.api.http) = {get: "/v1/{name=workspaces/*/qualitySuggestions/*}"};
    option (google.api.method_signature) = "name";
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.suggest";
  }

  // Accept or reject one queued suggestion. A decision is final: the store
  // refuses a second one.
  rpc UpdateQualitySuggestion(UpdateQualitySuggestionRequest) returns (QualitySuggestion) {
    option (google.api.http) = {
      post: "/v1/{name=workspaces/*/qualitySuggestions/*}:decide"
      body: "*"
    };
    option (metaxisdata.v1.audit) = true;
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.suggest";
  }

  // Accept or reject many queued suggestions in one call. Each decision is
  // independent: a failure is reported in its own result and does not abort the
  // rest.
  rpc BatchUpdateQualitySuggestions(BatchUpdateQualitySuggestionsRequest) returns (BatchUpdateQualitySuggestionsResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=workspaces/*}/qualitySuggestions:batchDecide"
      body: "*"
    };
    option (metaxisdata.v1.audit) = true;
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.suggest";
  }

  // Start a background AI drafting job over one or more tables. The call returns
  // as soon as the job is queued: the runner asks the model for each target in
  // turn, and clients poll GetQualitySuggestionJob (or list the jobs) for
  // progress. Queued suggestions appear in the review queue like any other.
  rpc CreateQualitySuggestionJob(CreateQualitySuggestionJobRequest) returns (QualitySuggestionJob) {
    option (google.api.http) = {
      post: "/v1/{parent=workspaces/*}/qualitySuggestionJobs"
      body: "*"
    };
    option (metaxisdata.v1.audit) = true;
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.suggest";
  }

  // Read one drafting job, including per-target progress and the suggestions it
  // queued so far.
  rpc GetQualitySuggestionJob(GetQualitySuggestionJobRequest) returns (QualitySuggestionJob) {
    option (google.api.http) = {get: "/v1/{name=workspaces/*/qualitySuggestionJobs/*}"};
    option (google.api.method_signature) = "name";
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.suggest";
  }

  // List drafting jobs, newest first.
  rpc ListQualitySuggestionJobs(ListQualitySuggestionJobsRequest) returns (ListQualitySuggestionJobsResponse) {
    option (google.api.http) = {get: "/v1/{parent=workspaces/*}/qualitySuggestionJobs"};
    option (google.api.method_signature) = "parent";
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.suggest";
  }

  // Ask a drafting job to stop. A pending job is canceled immediately; a running
  // job finishes its current target, marks the rest skipped and ends CANCELED.
  // Suggestions already queued are kept.
  rpc CancelQualitySuggestionJob(CancelQualitySuggestionJobRequest) returns (QualitySuggestionJob) {
    option (google.api.http) = {
      post: "/v1/{name=workspaces/*/qualitySuggestionJobs/*}:cancel"
      body: "*"
    };
    option (metaxisdata.v1.audit) = true;
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.suggest";
  }

  // Read the raw request and response bodies of one failed target when runtime
  // debug mode captured them. The target's diagnostic carries the correlation id
  // and says whether a body is available; llm_debug_log keeps it for seven days.
  rpc GetQualitySuggestionJobTargetDebug(GetQualitySuggestionJobTargetDebugRequest) returns (GetQualitySuggestionJobTargetDebugResponse) {
    option (google.api.http) = {get: "/v1/{name=workspaces/*/qualitySuggestionJobs/*}:debug"};
    option (metaxisdata.v1.audit) = true;
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.suggest";
  }

  // List the cached deterministic profiles of columns. Profiles are read-only
  // measurements; there is no get or update.
  rpc ListColumnProfiles(ListColumnProfilesRequest) returns (ListColumnProfilesResponse) {
    option (google.api.http) = {get: "/v1/{parent=workspaces/*}/columnProfiles"};
    option (google.api.method_signature) = "parent";
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.rules.list";
  }

  // List the semantic labels asserted on columns.
  rpc ListColumnLabels(ListColumnLabelsRequest) returns (ListColumnLabelsResponse) {
    option (google.api.http) = {get: "/v1/{parent=workspaces/*}/columnLabels"};
    option (google.api.method_signature) = "parent";
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.rules.list";
  }

  // Accept a proposed semantic label or clear the label of one column.
  rpc UpdateColumnLabel(UpdateColumnLabelRequest) returns (UpdateColumnLabelResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=workspaces/*}/columnLabels:update"
      body: "*"
    };
    option (metaxisdata.v1.audit) = true;
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.labels.update";
  }

  // Measure the deterministic statistics of up to 50 columns of one table.
  rpc ProfileColumns(ProfileColumnsRequest) returns (ProfileColumnsResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=workspaces/*}/columnProfiles:profile"
      body: "*"
    };
    option (metaxisdata.v1.audit) = true;
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.profile.run";
  }

  // Turn a natural-language intent into queued rule drafts.
  rpc SuggestQualityRule(SuggestQualityRuleRequest) returns (SuggestQualityRuleResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=workspaces/*}/qualitySuggestions:suggestRule"
      body: "*"
    };
    option (metaxisdata.v1.audit) = true;
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.suggest";
  }

  // Propose semantic labels for up to 50 columns of one table.
  rpc SuggestColumnLabels(SuggestColumnLabelsRequest) returns (SuggestColumnLabelsResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=workspaces/*}/qualitySuggestions:suggestLabels"
      body: "*"
    };
    option (metaxisdata.v1.audit) = true;
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.suggest";
  }

  // Recommend checks for one table from its stored column profiles. The pass is
  // deterministic: it needs no model, no provider configuration and no connection
  // to the target database. Like every other generation pass it queues PENDING
  // rule drafts only; a reviewer still decides which drafts become checks. The
  // request refuses columns without a fresh profile, pointing at ProfileColumns.
  rpc RecommendQualityChecks(RecommendQualityChecksRequest) returns (RecommendQualityChecksResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=workspaces/*}/qualitySuggestions:recommendChecks"
      body: "*"
    };
    option (metaxisdata.v1.audit) = true;
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.suggest";
  }

  // Explain one failed execution as a stream of hypotheses.
  //
  // No (google.api.http) annotation: this is a server-streaming method, and the
  // REST gateway cannot carry one. The browser reaches the Connect endpoint
  // directly, the way it does for ExplainSQL.
  rpc ExplainQualityExecution(ExplainQualityExecutionRequest) returns (stream ExplainQualityExecutionResponse) {
    option (metaxisdata.v1.audit) = true;
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.explain";
  }

  // Read the workspace's quality summary: how many rules and issues exist, how
  // the last day went, and the per-day tallies the overview chart draws.
  rpc GetQualityOverview(GetQualityOverviewRequest) returns (QualityOverview) {
    option (google.api.http) = {get: "/v1/{parent=workspaces/*}/qualityOverview"};
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.rules.list";
  }

  // Read how much of the data other assets consume is watched. Unlike the
  // overview's coverage, whose denominator is every monitorable registry object,
  // this answers a consumption question: of the assets whose lineage shows
  // another object reading them, how many have an enabled check? The two ratios
  // have different denominators and are deliberately not combined.
  //
  // It is a separate read because answering it costs one grouped scan of the
  // lineage table, which the overview must not pay on every load.
  rpc GetQualityConsumptionCoverage(GetQualityConsumptionCoverageRequest) returns (GetQualityConsumptionCoverageResponse) {
    option (google.api.http) = {get: "/v1/{parent=workspaces/*}/qualityConsumptionCoverage"};
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.rules.list";
  }

  // List the targets (tables or views) that have quality rules, one row per
  // target. The counts, the worst latest result and the pending draft tally are
  // aggregated by the database, so the directory does not page through every
  // rule to answer "which table needs attention?".
  rpc ListQualityTargets(ListQualityTargetsRequest) returns (ListQualityTargetsResponse) {
    option (google.api.http) = {get: "/v1/{parent=workspaces/*}/qualityTargets"};
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.rules.list";
  }

  // Export the targets the same filters select as ListQualityTargets as one CSV
  // document, streamed in slices. This is a file download, not a list: it stops
  // at max_rows and reports the running row count on every slice.
  //
  // Rows are read page by page, so the file is not a consistent snapshot: a row
  // written while the export runs may fall in this file or the next. A stream
  // error means the file is incomplete and must be discarded — only a completed
  // stream is a document.
  //
  // No (google.api.http) annotation, for the same reason as
  // ExportQualityExecutions.
  rpc ExportQualityTargets(ExportQualityTargetsRequest) returns (stream ExportQualityDataChunk) {
    option (metaxisdata.v1.audit) = true;
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.rules.list";
  }

  // Read one target's workspace: its rules (with their latest results), the
  // unresolved issues and the target's columns, in one call. AI drafts are not
  // part of the response (reading them needs the suggest permission). The target
  // is named by GUID because a target is not a resource of its own.
  rpc GetQualityTarget(GetQualityTargetRequest) returns (GetQualityTargetResponse) {
    option (google.api.http) = {get: "/v1/{parent=workspaces/*}/qualityTargets:get"};
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.rules.list";
  }

  // Explain a target's quality state by its lineage: the assets its data
  // reaches downstream, and the upstream targets whose checks failed or whose
  // structure changed in the window before a reference instant. Both lists are
  // bounded walks over the recorded lineage, so a target with no recorded edges
  // has no impact to report — which is not the same as having no consumers.
  rpc GetQualityTargetImpact(GetQualityTargetImpactRequest) returns (GetQualityTargetImpactResponse) {
    option (google.api.http) = {get: "/v1/{parent=workspaces/*}/qualityTargets:impact"};
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.rules.list";
  }

  // Acknowledge that a target's structure changed and re-baseline its checks.
  // Every non-archived check whose saved structure snapshot differs from the
  // target's current fingerprint gets the current fingerprint, which clears the
  // schema-changed signal. The checks themselves are untouched: re-baselining is
  // a fact about which shape the checks were reviewed against, not a change to
  // their definition, so it does not write a rule revision. Idempotent: a second
  // call with nothing to do returns zero.
  rpc AcknowledgeQualityTargetSchema(AcknowledgeQualityTargetSchemaRequest) returns (AcknowledgeQualityTargetSchemaResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=workspaces/*}/qualityTargets:acknowledgeSchemaChange"
      body: "*"
    };
    option (metaxisdata.v1.audit) = true;
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.rules.update";
  }

  // Render one target's quality report as a self-contained HTML document: the
  // current state, the recent trend, the checks, the unresolved problems, a
  // capped sample summary and the monitoring basis. The document carries its own
  // styles and chart and loads nothing external, so it can be forwarded as a
  // file. The export is audited because it is a bulk read of quality evidence.
  //
  // The report includes real sample values from failed checks (capped), so it is
  // a wider disclosure than the rules.list permission usually implies; the
  // document itself warns about forwarding it. Its HTML body never enters the
  // audit ledger (see ExportQualityReportResponse.html_content).
  rpc ExportQualityReport(ExportQualityReportRequest) returns (ExportQualityReportResponse) {
    option (google.api.http) = {get: "/v1/{parent=workspaces/*}/qualityTargets:exportReport"};
    option (metaxisdata.v1.audit) = true;
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.rules.list";
  }

  // Update one target's schedule: how often its enabled checks run. Scheduling
  // is per target, so this replaces the per-check schedule; a change takes
  // effect from the next slot and never runs the target immediately.
  rpc UpdateQualityTargetSchedule(UpdateQualityTargetScheduleRequest) returns (QualityTargetSchedule) {
    option (google.api.http) = {
      post: "/v1/{parent=workspaces/*}/qualityTargets:updateSchedule"
      body: "*"
    };
    option (metaxisdata.v1.audit) = true;
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.rules.update";
  }

  // Read one target's schedule without the target's rules, results and issues.
  // A rule lifecycle change can move the target's next run; the workspace re-reads
  // just this instead of the whole target after every check edit.
  rpc GetQualityTargetSchedule(GetQualityTargetScheduleRequest) returns (QualityTargetSchedule) {
    option (google.api.http) = {get: "/v1/{parent=workspaces/*}/qualityTargets:getSchedule"};
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.rules.list";
  }

  // Read one target's contract: its target-level defaults, the published version,
  // and whether the live rules differ from that snapshot.
  rpc GetQualityContract(GetQualityContractRequest) returns (QualityContract) {
    option (google.api.http) = {get: "/v1/{parent=workspaces/*}/qualityContracts:get"};
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.rules.list";
  }

  // ListQualityPlans lists the read-only monitoring plan projection for every
  // target with live rules. It is the directory the plan write path will grow
  // from; it does not write anything.
  rpc ListQualityPlans(ListQualityPlansRequest) returns (ListQualityPlansResponse) {
    option (google.api.http) = {get: "/v1/{parent=workspaces/*}/qualityPlans"};
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.rules.list";
  }

  // ListQualityCoverageGaps flattens the plan projection to the unsatisfied
  // declared coverage: one row per target property that a live rule does not
  // implement. Read-only, like ListQualityPlans.
  rpc ListQualityCoverageGaps(ListQualityCoverageGapsRequest) returns (ListQualityCoverageGapsResponse) {
    option (google.api.http) = {get: "/v1/{parent=workspaces/*}/qualityCoverageGaps"};
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.rules.list";
  }

  // Update the target-level defaults. The filter is ANDed into every rule on the
  // target at compile time; the default severity only seeds newly authored rules
  // and never rewrites an existing rule. The target's schedule is updated through
  // UpdateQualityTargetSchedule.
  rpc UpdateQualityContract(UpdateQualityContractRequest) returns (QualityContract) {
    option (google.api.http) = {
      post: "/v1/{parent=workspaces/*}/qualityContracts:update"
      body: "*"
    };
    option (metaxisdata.v1.audit) = true;
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.rules.update";
  }

  // Publish the live rules and settings as the target's next contract version.
  // Republishing an unchanged contract is a no-op that returns the existing
  // version (no_changes=true).
  rpc PublishQualityContract(PublishQualityContractRequest) returns (PublishQualityContractResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=workspaces/*}/qualityContracts:publish"
      body: "*"
    };
    option (metaxisdata.v1.audit) = true;
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.contracts.publish";
  }

  // Create a batch of typed changes against one target. It stays PROPOSED until a
  // person decides; creating it changes nothing on the target.
  rpc CreateQualityChangeRequest(CreateQualityChangeRequestRequest) returns (QualityChangeRequest) {
    option (google.api.http) = {
      post: "/v1/{parent=workspaces/*}/qualityChangeRequests"
      body: "*"
    };
    option (metaxisdata.v1.audit) = true;
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.rules.update";
  }

  // Read one change request, with its items and per-item results.
  rpc GetQualityChangeRequest(GetQualityChangeRequestRequest) returns (QualityChangeRequest) {
    option (google.api.http) = {get: "/v1/{name=workspaces/*/qualityChangeRequests/*}"};
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.rules.list";
  }

  // List change requests, newest first.
  rpc ListQualityChangeRequests(ListQualityChangeRequestsRequest) returns (ListQualityChangeRequestsResponse) {
    option (google.api.http) = {get: "/v1/{parent=workspaces/*}/qualityChangeRequests"};
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.rules.list";
  }

  // Approve or reject a change request. Approving applies each item through its
  // existing path and returns a result per item; rejecting records the structured
  // reasons. A stale base version expires the request instead of rebasing it.
  rpc DecideQualityChangeRequest(DecideQualityChangeRequestRequest) returns (QualityChangeRequest) {
    option (google.api.http) = {
      post: "/v1/{name=workspaces/*/qualityChangeRequests/*}:decide"
      body: "*"
    };
    option (metaxisdata.v1.audit) = true;
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.changeRequests.decide";
  }

  // List the target's published contract versions, newest first.
  rpc ListQualityContractRevisions(ListQualityContractRevisionsRequest) returns (ListQualityContractRevisionsResponse) {
    option (google.api.http) = {get: "/v1/{parent=workspaces/*}/qualityContractRevisions"};
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.rules.list";
  }

  // Read one published contract version with its ordered checks, so a client can
  // show a diff without downloading every version.
  rpc GetQualityContractRevision(GetQualityContractRevisionRequest) returns (GetQualityContractRevisionResponse) {
    option (google.api.http) = {get: "/v1/{parent=workspaces/*}/qualityContractRevisions:get"};
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.rules.list";
  }

  // Read today's data quality LLM usage and the effective limits (the workspace
  // settings, with server defaults resolved). The counters are process state: a
  // restart resets them and they roll over at 00:00 UTC.
  rpc GetQualityLLMUsage(GetQualityLLMUsageRequest) returns (QualityLLMUsage) {
    option (google.api.http) = {get: "/v1/{parent=workspaces/*}/qualityLLMUsage"};
    option (google.api.method_signature) = "parent";
    option (metaxisdata.v1.permission) = "metaxisdata.dataQuality.suggest";
  }
}

// QualityRuleType is the observation a rule makes. The value is immutable for a
// rule: changing the type is a different rule and a new revision.
enum QualityRuleType {
  QUALITY_RULE_TYPE_UNSPECIFIED = 0;
  QUALITY_RULE_TYPE_ROW_COUNT = 1;
  QUALITY_RULE_TYPE_ROW_COUNT_CHANGE = 2;
  QUALITY_RULE_TYPE_NULL_PERCENT = 3;
  QUALITY_RULE_TYPE_UNIQUE = 4;
  QUALITY_RULE_TYPE_UNIQUE_COMBINATION = 5;
  QUALITY_RULE_TYPE_ACCEPTED_VALUES = 6;
  QUALITY_RULE_TYPE_RANGE = 7;
  QUALITY_RULE_TYPE_REGEX = 8;
  QUALITY_RULE_TYPE_STRING_LENGTH = 9;
  QUALITY_RULE_TYPE_REFERENTIAL_INTEGRITY = 10;
  QUALITY_RULE_TYPE_CROSS_COLUMN = 11;
  QUALITY_RULE_TYPE_FRESHNESS = 12;
  QUALITY_RULE_TYPE_CUSTOM_SQL = 13;
  // v1.1. The value is reserved so that the v1 and store enum definitions stay
  // value-compatible; this API never accepts it yet.
  QUALITY_RULE_TYPE_CEL_EXPRESSION = 14;
  // v1.1: compares the live column list with a snapshot taken when the rule was
  // saved. It reads metadata only and never queries the target database.
  QUALITY_RULE_TYPE_SCHEMA_DRIFT = 15;
  // v1.1: groups rows and bounds each group's row count.
  QUALITY_RULE_TYPE_GROUP_CHECK = 16;
  // v1.1: aggregates one column and bounds the value.
  QUALITY_RULE_TYPE_AGGREGATE = 17;
  // v1.1: reconciles one aggregate of this table with one of another table in
  // the same instance and database.
  QUALITY_RULE_TYPE_CROSS_TABLE = 18;
  // v1.2: validates a column against a national or industry standard code. The
  // rule reads a bounded sample of the column and checks the values in process.
  QUALITY_RULE_TYPE_STANDARD_CODE = 19;
  // v1.2: tracks the distinct segments of one or more columns and fails when a
  // segment the previous executions observed is missing from the current one.
  QUALITY_RULE_TYPE_SEGMENT_CHECK = 20;
}

// QualityStandardCode is the standard a standard-code rule validates against.
// Each value fixes the value shape, the check digit (where the standard defines
// one) and whether membership in a built-in code table applies.
enum QualityStandardCode {
  QUALITY_STANDARD_CODE_UNSPECIFIED = 0;
  // GB 32100-2015: 18 characters, MOD 31 check digit.
  QUALITY_STANDARD_CODE_UNIFIED_SOCIAL_CREDIT_CODE = 1;
  // GB/T 11714-1997: 8 characters plus a MOD 11 check digit; one hyphen before
  // the check digit is accepted.
  QUALITY_STANDARD_CODE_ORGANIZATION_CODE = 2;
  // GB 11643-1999: 18 digits, MOD 11 check digit, a real birth date and a valid
  // administrative-division prefix.
  QUALITY_STANDARD_CODE_RESIDENT_ID_CARD = 3;
  // GB/T 2260: a 6-digit code that exists in the built-in division table.
  QUALITY_STANDARD_CODE_ADMINISTRATIVE_DIVISION = 4;
  // GB/T 4754-2017: a section letter plus 2 to 4 digits that exists in the
  // built-in classification table.
  QUALITY_STANDARD_CODE_INDUSTRY_CLASSIFICATION = 5;
  // A workspace-defined code table: the value must exist in the referenced
  // quality code table. Use it for standard code sets that are not bundled with
  // the server (for example an industry or municipal code set).
  QUALITY_STANDARD_CODE_CUSTOM_CODE_TABLE = 6;
}

// QualityDimension is the data quality dimension a rule measures. It is display
// metadata and is used for grouping.
enum QualityDimension {
  QUALITY_DIMENSION_UNSPECIFIED = 0;
  QUALITY_DIMENSION_COMPLETENESS = 1;
  QUALITY_DIMENSION_VALIDITY = 2;
  QUALITY_DIMENSION_UNIQUENESS = 3;
  QUALITY_DIMENSION_CONSISTENCY = 4;
  QUALITY_DIMENSION_TIMELINESS = 5;
  QUALITY_DIMENSION_ACCURACY = 6;
}

// QualitySeverity is how much an issue on this rule matters.
enum QualitySeverity {
  QUALITY_SEVERITY_UNSPECIFIED = 0;
  QUALITY_SEVERITY_WARNING = 1;
  QUALITY_SEVERITY_ERROR = 2;
  QUALITY_SEVERITY_CRITICAL = 3;
}

// QualityStatus is the outcome of one rule execution. ERROR is not FAIL: ERROR
// means the check could not be evaluated at all, FAIL means the data failed it.
enum QualityStatus {
  QUALITY_STATUS_UNSPECIFIED = 0;
  QUALITY_STATUS_PASS = 1;
  QUALITY_STATUS_WARN = 2;
  QUALITY_STATUS_FAIL = 3;
  QUALITY_STATUS_ERROR = 4;
  QUALITY_STATUS_SKIPPED = 5;
  QUALITY_STATUS_NOT_EVALUATED = 6;
}

// QualityExecutionTrigger is what started one execution.
enum QualityExecutionTrigger {
  QUALITY_EXECUTION_TRIGGER_UNSPECIFIED = 0;
  QUALITY_EXECUTION_TRIGGER_MANUAL = 1;
  QUALITY_EXECUTION_TRIGGER_SCHEDULED = 2;
}

// QualityExecutionState is the lifecycle of one execution. It is separate from
// the quality outcome, which is only known once the check finishes.
enum QualityExecutionState {
  QUALITY_EXECUTION_STATE_UNSPECIFIED = 0;
  // Planned and waiting for the runner.
  QUALITY_EXECUTION_STATE_PENDING = 1;
  // The runner is executing the rule.
  QUALITY_EXECUTION_STATE_RUNNING = 2;
  // The check reached a verdict; outcome holds it.
  QUALITY_EXECUTION_STATE_COMPLETED = 3;
  // A restart discarded the execution before it finished. It is not retried.
  QUALITY_EXECUTION_STATE_ABANDONED = 4;
}

// QualityRuleState is whether a rule is scheduled. ARCHIVED is the soft-delete
// state: the rule, its revisions and results stay readable.
enum QualityRuleState {
  QUALITY_RULE_STATE_UNSPECIFIED = 0;
  QUALITY_RULE_STATE_ENABLED = 1;
  QUALITY_RULE_STATE_PAUSED = 2;
  QUALITY_RULE_STATE_ARCHIVED = 3;
}

// QualityFrequencyTier is how often one check needs to run inside its target's
// schedule. The target's own cadence is the floor: a check never runs more often
// than its target, and a tier denser than the target is a no-op. The tier bounds
// scheduled runs only; a manual run always runs the check.
enum QualityFrequencyTier {
  // Follow the target: the check runs in every target cycle.
  QUALITY_FREQUENCY_TIER_UNSPECIFIED = 0;
  // At most once an hour.
  QUALITY_FREQUENCY_TIER_HOURLY = 1;
  // At most once a day.
  QUALITY_FREQUENCY_TIER_DAILY = 2;
  // At most once a week.
  QUALITY_FREQUENCY_TIER_WEEKLY = 3;
}

// QualityIssueStatus is the lifecycle of a persistent problem behind a rule's
// failures. RESOLVED is terminal: the next failing run opens a new issue rather
// than reopening one.
enum QualityIssueStatus {
  QUALITY_ISSUE_STATUS_UNSPECIFIED = 0;
  QUALITY_ISSUE_STATUS_OPEN = 1;
  QUALITY_ISSUE_STATUS_ACKNOWLEDGED = 2;
  QUALITY_ISSUE_STATUS_RESOLVED = 3;
}

// QualityResolutionReason is why an issue was closed.
enum QualityResolutionReason {
  QUALITY_RESOLUTION_REASON_UNSPECIFIED = 0;
  QUALITY_RESOLUTION_REASON_FIXED = 1;
  QUALITY_RESOLUTION_REASON_EXPECTED = 2;
  QUALITY_RESOLUTION_REASON_NO_ACTION_NEEDED = 3;
  QUALITY_RESOLUTION_REASON_DUPLICATE = 4;
  QUALITY_RESOLUTION_REASON_AUTO_RECOVERED = 5;
}

// QualitySemanticType is the closed vocabulary a column may be labeled with. It
// is the input to the deterministic semantic-type-to-rule mapping, so a model may
// only choose from these values.
enum QualitySemanticType {
  QUALITY_SEMANTIC_TYPE_UNSPECIFIED = 0;
  QUALITY_SEMANTIC_TYPE_EMAIL = 1;
  QUALITY_SEMANTIC_TYPE_PHONE = 2;
  QUALITY_SEMANTIC_TYPE_URL = 3;
  QUALITY_SEMANTIC_TYPE_UUID = 4;
  QUALITY_SEMANTIC_TYPE_IP = 5;
  QUALITY_SEMANTIC_TYPE_COUNTRY_CODE = 6;
  QUALITY_SEMANTIC_TYPE_CURRENCY = 7;
  QUALITY_SEMANTIC_TYPE_AMOUNT = 8;
  QUALITY_SEMANTIC_TYPE_QUANTITY = 9;
  QUALITY_SEMANTIC_TYPE_PERCENTAGE = 10;
  QUALITY_SEMANTIC_TYPE_ID = 11;
  QUALITY_SEMANTIC_TYPE_BUSINESS_KEY = 12;
  QUALITY_SEMANTIC_TYPE_TIMESTAMP = 13;
  QUALITY_SEMANTIC_TYPE_DATE = 14;
  QUALITY_SEMANTIC_TYPE_ENUM = 15;
  QUALITY_SEMANTIC_TYPE_FREE_TEXT = 16;
  QUALITY_SEMANTIC_TYPE_UNKNOWN = 17;
  QUALITY_SEMANTIC_TYPE_UNIFIED_SOCIAL_CREDIT_CODE = 18;
  QUALITY_SEMANTIC_TYPE_ORGANIZATION_CODE = 19;
  QUALITY_SEMANTIC_TYPE_RESIDENT_ID_CARD = 20;
  QUALITY_SEMANTIC_TYPE_ADMINISTRATIVE_DIVISION = 21;
  QUALITY_SEMANTIC_TYPE_INDUSTRY_CLASSIFICATION = 22;
}

// QualitySuggestionKind is what a suggestion proposes.
enum QualitySuggestionKind {
  QUALITY_SUGGESTION_KIND_UNSPECIFIED = 0;
  QUALITY_SUGGESTION_KIND_RULE_DRAFT = 1;
  QUALITY_SUGGESTION_KIND_LABEL = 2;
}

// QualitySuggestionStatus is where a suggestion is in the review queue.
//
// PENDING is the one live state. ACCEPTED and REJECTED are human decisions and
// final. SUPERSEDED means the server closed the proposal because its fact already
// exists (the column now has a label, or a rule with the same identity exists) or
// the target changed; it was never decided, and the same proposal may be queued
// again later.
enum QualitySuggestionStatus {
  QUALITY_SUGGESTION_STATUS_UNSPECIFIED = 0;
  QUALITY_SUGGESTION_STATUS_PENDING = 1;
  QUALITY_SUGGESTION_STATUS_ACCEPTED = 2;
  QUALITY_SUGGESTION_STATUS_REJECTED = 3;
  QUALITY_SUGGESTION_STATUS_SUPERSEDED = 4;
}

// QualitySuggestionSource is what produced a suggestion.
//
// PROFILE is the model-assisted label pass, which reads profiles and asks the
// model for semantic types; RECOMMENDATION is the deterministic pass that derives
// checks and thresholds from the profile alone. They are separate values because a
// generation pass may only refresh a pending proposal it produced itself (unless
// it is forced), and because the review queue shows the source to the reviewer.
enum QualitySuggestionSource {
  QUALITY_SUGGESTION_SOURCE_UNSPECIFIED = 0;
  QUALITY_SUGGESTION_SOURCE_NATURAL_LANGUAGE = 1;
  QUALITY_SUGGESTION_SOURCE_PROFILE = 2;
  QUALITY_SUGGESTION_SOURCE_RECOMMENDATION = 3;
}

// QualityLabelSource is who asserted a column's semantic label.
enum QualityLabelSource {
  QUALITY_LABEL_SOURCE_UNSPECIFIED = 0;
  QUALITY_LABEL_SOURCE_MANUAL = 1;
  QUALITY_LABEL_SOURCE_LLM = 2;
}

// QualityLabelStatus is whether a semantic label is in effect.
enum QualityLabelStatus {
  QUALITY_LABEL_STATUS_UNSPECIFIED = 0;
  QUALITY_LABEL_STATUS_SUGGESTED = 1;
  QUALITY_LABEL_STATUS_ACCEPTED = 2;
  QUALITY_LABEL_STATUS_REJECTED = 3;
}

// ColumnLabelAction is what UpdateColumnLabel does with one column's label.
enum ColumnLabelAction {
  COLUMN_LABEL_ACTION_UNSPECIFIED = 0;
  // Store the given semantic label as a manually accepted one.
  COLUMN_LABEL_ACTION_ACCEPT = 1;
  // Remove the column's label.
  COLUMN_LABEL_ACTION_CLEAR = 2;
}

// QualityObservedKind is the unit of the observed value a result records.
enum QualityObservedKind {
  QUALITY_OBSERVED_KIND_UNSPECIFIED = 0;
  QUALITY_OBSERVED_KIND_COUNT = 1;
  QUALITY_OBSERVED_KIND_RATIO = 2;
  QUALITY_OBSERVED_KIND_SECONDS = 3;
  QUALITY_OBSERVED_KIND_TIMESTAMP = 4;
  QUALITY_OBSERVED_KIND_NUMBER = 5;
}

// QualityThresholdMetric selects what a count-type rule's threshold is compared
// against: the number of failed rows, or failed rows divided by total rows.
enum QualityThresholdMetric {
  QUALITY_THRESHOLD_METRIC_UNSPECIFIED = 0;
  QUALITY_THRESHOLD_METRIC_COUNT = 1;
  QUALITY_THRESHOLD_METRIC_PERCENT = 2;
}

// QualityEmptyBehavior is what a rule does when the query succeeded but produced
// nothing to judge: no rows at all, a NULL timestamp, no baseline to compare
// with. The default is NOT_EVALUATED so an empty table never looks like a pass.
enum QualityEmptyBehavior {
  QUALITY_EMPTY_BEHAVIOR_UNSPECIFIED = 0;
  QUALITY_EMPTY_BEHAVIOR_NOT_EVALUATED = 1;
  QUALITY_EMPTY_BEHAVIOR_PASS = 2;
  QUALITY_EMPTY_BEHAVIOR_FAIL = 3;
}

// QualityComparison is how the observed value is compared with a threshold.
enum QualityComparison {
  QUALITY_COMPARISON_UNSPECIFIED = 0;
  // The rule fails when the observed value is greater than the threshold:
  // counts of invalid rows, ratios, and freshness lag.
  QUALITY_COMPARISON_GREATER_THAN = 1;
  // The rule fails when the observed value is less than the threshold.
  QUALITY_COMPARISON_LESS_THAN = 2;
  // The rule fails when the observed value falls outside [lower, upper]: row
  // count bounds.
  QUALITY_COMPARISON_OUTSIDE_RANGE = 3;
  // The rule fails when the observed value falls inside [lower, upper]: an
  // accepted range expressed as a pass band.
  QUALITY_COMPARISON_INSIDE_RANGE = 4;
}

// QualityFilterOperator is one comparison in a rule's AND filter.
enum QualityFilterOperator {
  QUALITY_FILTER_OPERATOR_UNSPECIFIED = 0;
  QUALITY_FILTER_OPERATOR_EQ = 1;
  QUALITY_FILTER_OPERATOR_NE = 2;
  QUALITY_FILTER_OPERATOR_LT = 3;
  QUALITY_FILTER_OPERATOR_LTE = 4;
  QUALITY_FILTER_OPERATOR_GT = 5;
  QUALITY_FILTER_OPERATOR_GTE = 6;
  QUALITY_FILTER_OPERATOR_IN = 7;
  QUALITY_FILTER_OPERATOR_NOT_IN = 8;
  QUALITY_FILTER_OPERATOR_IS_NULL = 9;
  QUALITY_FILTER_OPERATOR_IS_NOT_NULL = 10;
}

// QualityComparisonOperator is the SQL comparison a cross-column rule applies
// between two columns of the same row.
enum QualityComparisonOperator {
  QUALITY_COMPARISON_OPERATOR_UNSPECIFIED = 0;
  QUALITY_COMPARISON_OPERATOR_EQ = 1;
  QUALITY_COMPARISON_OPERATOR_NE = 2;
  QUALITY_COMPARISON_OPERATOR_LT = 3;
  QUALITY_COMPARISON_OPERATOR_LTE = 4;
  QUALITY_COMPARISON_OPERATOR_GT = 5;
  QUALITY_COMPARISON_OPERATOR_GTE = 6;
}

// QualityRule is one data quality check.
message QualityRule {
  option (google.api.resource) = {
    type: "metaxisdata/QualityRule"
    pattern: "workspaces/{workspace}/qualityRules/{quality_rule}"
  };

  // Format: workspaces/{workspace}/qualityRules/{quality_rule}
  string name = 1;

  // The human-readable title, shown in lists and notifications.
  string title = 2;

  string description = 3;

  QualityDimension dimension = 4;

  QualityRuleType rule_type = 5;

  QualityTarget target = 6;

  QualityRuleConfig config = 7;

  QualitySeverity severity = 8;

  QualityRuleState state = 9;

  // Format: users/{user}. Empty when the rule has no owner.
  string owner = 10 [(google.api.resource_reference) = {type: "metaxisdata/User"}];

  // The current revision. Every semantic edit increments it and appends a
  // revision row.
  int32 revision = 12 [(google.api.field_behavior) = OUTPUT_ONLY];

  // True when the target's current structure fingerprint differs from the one
  // recorded when the rule was saved, i.e. the target's schema changed underneath
  // it.
  bool target_schema_changed = 13 [(google.api.field_behavior) = OUTPUT_ONLY];

  google.protobuf.Timestamp create_time = 14 [(google.api.field_behavior) = OUTPUT_ONLY];

  google.protobuf.Timestamp update_time = 15 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The most recent execution, for the list view. It is not part of the rule and
  // is only populated by reads, never persisted on write.
  QualityExecutionSummary last_result = 16 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Why the target can no longer be resolved, e.g. because the table was
  // dropped. Empty while the target is healthy.
  string orphaned_reason = 17 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Rule-level mute. It only silences issue notifications; executions still run
  // and results are still recorded.
  google.protobuf.Timestamp mute_until = 18;

  repeated string tags = 19;

  // How often this check needs to run inside the target's schedule. The target
  // tick is the floor, so a tier denser than the target is a no-op; a manual run
  // is not affected. It is scheduling metadata, not part of the rule definition:
  // editing it does not append a revision.
  QualityFrequencyTier frequency_tier = 20;

  // Scheduling is a property of the target, not of one rule: see
  // QualityTargetSchedule and UpdateQualityTargetSchedule.
  reserved 11;
  reserved "schedule_interval";
}

// QualityTarget is what a rule observes.
message QualityTarget {
  // The globally unique metadata GUID of the target table.
  string meta_guid = 1;

  MetaType meta_type = 2;

  // Where the target lived when the rule was saved. It is display metadata, not
  // identity: the GUID and its meta type are the identity.
  QualityTargetPath path = 3;

  // The columns the rule reads, as a snapshot for display. The column named in
  // the config is authoritative; validation requires them to agree.
  repeated string columns = 4;
}

// QualityTargetPath is the display snapshot of where a target lived when the
// rule was saved.
message QualityTargetPath {
  string instance = 1;
  string database = 2;
  string schema = 3;
  string object = 4;
  // Display snapshot only. The checked column is the one named in the rule's
  // typed config; this field may be empty for rules written before it was
  // populated, and is empty for a table-level rule.
  string column = 5;
}

// QualityRuleConfig is the typed parameters of one rule. Exactly one arm of the
// oneof is set, and it must correspond to the rule's type; the filter, the empty
// behavior and the count/percent metric are shared by every type.
message QualityRuleConfig {
  oneof config {
    RowCountConfig row_count = 1;
    RowCountChangeConfig row_count_change = 2;
    NullPercentConfig null_percent = 3;
    UniqueConfig unique = 4;
    UniqueCombinationConfig unique_combination = 5;
    AcceptedValuesConfig accepted_values = 6;
    RangeConfig range = 7;
    RegexConfig regex = 8;
    StringLengthConfig string_length = 9;
    ReferentialIntegrityConfig referential_integrity = 10;
    CrossColumnConfig cross_column = 11;
    FreshnessConfig freshness = 12;
    CustomSQLConfig custom_sql = 13;
    // v1.1.
    CelExpressionConfig cel_expression = 14;
    // v1.1 first batch: metadata drift and grouped row-count bounds.
    SchemaDriftConfig schema_drift = 15;
    GroupCheckConfig group_check = 16;
    // v1.1 second batch: aggregates and cross-table reconciliation.
    AggregateConfig aggregate = 17;
    CrossTableConfig cross_table = 18;
    // v1.2: national and industry standard codes.
    StandardCodeConfig standard_code = 19;
    // v1.2: segment identity tracking across executions.
    SegmentCheckConfig segment_check = 20;
  }
  // How a count-type rule's thresholds are measured: failed rows, or failed rows
  // divided by total rows. Ignored by types whose config already names the unit.
  // Numbers 21-27 are reserved for future rule configs, matching the store
  // message so the two definitions stay structurally identical.
  reserved 21 to 27;
  QualityThresholdMetric threshold_metric = 28;
  QualityFilter filter = 29;
  QualityEmptyBehavior on_empty = 30;
  // How long one query of this check may run, in seconds. Zero means the server
  // default (60); the accepted range is 1-300. A scheduled check still ends with
  // its batch, so a long limit can be cut short by the batch's own deadline.
  int32 timeout_seconds = 31;
  // How much of the target the check reads. Absent means every row the filter
  // selects. This is the only sampling knob: which SQL mechanism implements a
  // method depends on the target engine.
  QualityRuleSampling sampling = 32;
}

// QualityRuleSampling bounds how much of the target one execution reads. The two
// methods are user intents: "read a share of the rows" and "read at most this
// many rows". The editor only offers the methods the target engine can express,
// and the server refuses one it cannot, so a check never silently degrades to a
// different sample.
message QualityRuleSampling {
  oneof method {
    // Read at most this many rows of the filtered relation. Every engine can
    // express it, and the read cost is bounded; the rows are an arbitrary
    // prefix, so the sample is not random.
    int64 max_rows = 1;
    // Read approximately this percent (1-99) of the relation. The engine's own
    // sampling clause decides the exact behavior; it is approximately random,
    // and its cost depends on the engine.
    double percent = 2;
  }
}

// RowCountConfig bounds the number of rows. At least one bound is required; a
// warn bound makes the rule report WARN before it reports FAIL.
message RowCountConfig {
  optional int64 min_rows = 1;
  optional int64 max_rows = 2;
  // When set, the row count must equal it exactly.
  optional int64 exact_rows = 3;
  optional int64 warn_min_rows = 4;
  optional int64 warn_max_rows = 5;
}

// RowCountChangeConfig bounds the change against the rule's last successful
// observation. Without a recent baseline the result is NOT_EVALUATED.
message RowCountChangeConfig {
  optional double max_increase_pct = 1;
  optional double max_decrease_pct = 2;
  optional double warn_increase_pct = 3;
  optional double warn_decrease_pct = 4;
}

// NullPercentConfig bounds a column's nulls. Exactly one of the count pair and
// the percentage pair carries the fail threshold; each pair's warn field is
// optional and must not exceed the fail threshold.
message NullPercentConfig {
  string column = 1;
  optional int64 max_null_count = 2;
  optional int64 warn_null_count = 3;
  optional double max_null_pct = 4;
  optional double warn_null_pct = 5;
  // Values that also count as missing, besides SQL NULL. Encoded as strings and
  // converted with the column's type; at most 20.
  repeated string null_values = 6;
}

// UniqueConfig counts duplicated non-NULL values in one column. The threshold is
// measured per threshold_metric; the default fail threshold is zero.
message UniqueConfig {
  string column = 1;
  // When true, NULL values are treated as a value: more than one NULL is a
  // duplicate. The default is false, matching SQL uniqueness.
  bool count_nulls = 2;
  optional double fail_threshold = 3;
  optional double warn_threshold = 4;
}

// UniqueCombinationConfig counts duplicated tuples across several columns, or
// across every column of the table when all_columns is set.
message UniqueCombinationConfig {
  repeated string columns = 1;
  // Use every column of the target table instead of the list above. That makes
  // the rule a whole-row duplicate check.
  bool all_columns = 2;
  bool count_nulls = 3;
  optional double fail_threshold = 4;
  optional double warn_threshold = 5;
}

// AcceptedValuesConfig counts rows whose column value is outside the accepted
// set. The set comes from exactly one source: the fixed list, another column of
// the same target, or a single-column query.
message AcceptedValuesConfig {
  string column = 1;
  // At most 200 values, encoded as strings and converted by the column's type.
  repeated string values = 2;
  // When false (the default), a NULL value is a violation.
  bool allow_null = 3;
  optional double fail_threshold = 4;
  optional double warn_threshold = 5;
  // A column of the same target whose distinct values are the accepted set.
  // Mutually exclusive with values and query.
  string field = 6;
  // A query whose values are the accepted set. Mutually exclusive with values
  // and field. The reference side is read over the target's own read-only data
  // source, so it may name another database or schema of that instance but not
  // another instance.
  AcceptedValuesQuery query = 7;
}

// AcceptedValuesQuery is the accepted set a single-column query returns.
message AcceptedValuesQuery {
  // One SELECT or WITH statement of at most 8 KiB. It is parsed before it runs;
  // time variables are rendered the same way a custom SQL check renders them.
  string sql = 1;
  // The column the query returns. Named explicitly because the server tests it
  // for NULL (a NULL in the set would make NOT IN unknown for every row).
  string value_column = 2;
}

// RangeConfig counts rows outside a bound pair. At least one bound is required;
// the values are strings parsed with the column's type.
message RangeConfig {
  string column = 1;
  optional string min = 2;
  optional string max = 3;
  // Whether both bounds are inclusive. Default false, i.e. the interval is open
  // on both ends.
  bool inclusive = 4;
  optional double fail_threshold = 5;
  optional double warn_threshold = 6;
}

// RegexConfig counts rows whose column value does not match a regular
// expression. The pattern is Go RE2 syntax and is also translated for the
// engine's own regex operator.
message RegexConfig {
  string column = 1;
  string pattern = 2;
  optional double fail_threshold = 3;
  optional double warn_threshold = 4;
}

// StringLengthConfig counts rows whose string length is outside the bounds.
message StringLengthConfig {
  string column = 1;
  optional int64 min_len = 2;
  optional int64 max_len = 3;
  optional double fail_threshold = 4;
  optional double warn_threshold = 5;
}

// ReferentialIntegrityConfig counts child rows with no matching parent row. The
// parent must live in the same instance, database and schema.
message ReferentialIntegrityConfig {
  string child_column = 1;
  // The parent table as "schema.table".
  string parent_table = 2;
  string parent_column = 3;
  // When true, a NULL child value is not an orphan. Default false.
  bool allow_null = 4;
  optional double fail_threshold = 5;
  optional double warn_threshold = 6;
}

// CrossColumnConfig counts rows where two columns of the same row do not satisfy
// the comparison.
message CrossColumnConfig {
  string left_column = 1;
  string right_column = 2;
  QualityComparisonOperator op = 3;
  // Tolerance subtracted/added to the comparison to absorb floating point noise.
  // Only meaningful for numeric columns.
  optional double tolerance = 4;
  optional double fail_threshold = 5;
  optional double warn_threshold = 6;
}

// FreshnessConfig measures how long ago the newest timestamp is. A NULL newest
// timestamp follows on_empty.
message FreshnessConfig {
  string timestamp_column = 1;
  int32 max_lag_seconds = 2;
  optional int32 warn_lag_seconds = 3;
}

// CustomSQLConfig counts the rows a read-only statement returns as failures. The
// statement is single SELECT/WITH, at most 8 KiB, and is never rewritten.
message CustomSQLConfig {
  string sql = 1;
  optional double fail_threshold = 2;
  optional double warn_threshold = 3;
}

// CelExpressionConfig evaluates an expression over a sample of rows in Go. It is
// v1.1; the message exists so that the config shape does not change then.
message CelExpressionConfig {
  string expression = 1;
  // The columns the expression reads. They must all exist on the target.
  repeated string columns = 2;
  int32 sample_rows = 3;
  optional double fail_threshold = 4;
  optional double warn_threshold = 5;
}

// StandardCodeConfig validates one column against a national or industry
// standard code. The standard fixes the value shape, the check digit where one
// exists, and whether the value must exist in the standard's built-in code
// table. The rule reads a bounded sample of the column and validates every row
// in process, so its verdict is a sample verdict like cel_expression's.
message StandardCodeConfig {
  string column = 1;
  QualityStandardCode standard = 2;
  // When false (the default), a NULL value is a violation.
  bool allow_null = 3;
  // How many rows of the filtered relation one execution reads. 0 means the
  // default (10000); the accepted range is 1-100000.
  int32 sample_rows = 4;
  optional double fail_threshold = 5;
  optional double warn_threshold = 6;
  // Optional workspace code table the value must also exist in, as a
  // "workspaces/{workspace}/qualityCodeTables/{quality_code_table}" resource name.
  // Required for QUALITY_STANDARD_CODE_CUSTOM_CODE_TABLE; for a built-in standard it
  // narrows the accepted values (for example a customer's current division list).
  string code_table = 7;
}

// SegmentCheckConfig fails when a segment that the check's recent executions
// observed is missing from the current one. A segment is the distinct
// combination of the grouping columns.
message SegmentCheckConfig {
  // The columns that identify a segment (1-5).
  repeated string columns = 1;
  // How many previous judged executions form the baseline. 0 means the default
  // (3); the accepted range is 1-10. Executions judged against another target,
  // or recorded before segment evidence existed, are skipped.
  int32 baseline_runs = 2;
  // How many of the baseline executions a segment must appear in to be expected
  // in the current one. 0 means the default (2). It is clamped to the number of
  // baseline runs actually available, so the second execution already judges.
  int32 min_occurrences = 3;
  optional double fail_threshold = 4;
  optional double warn_threshold = 5;
}

// SchemaDriftColumn is one column of the snapshot a schema-drift rule expects.
message SchemaDriftColumn {
  string name = 1;
  string type = 2;
  // Whether the column is nullable. Unset means the rule does not judge
  // nullability for this column: a snapshot written before nullability was
  // compared stays usable and does not report a false drift. The editor and the
  // API's fill-from-target path always set it.
  optional bool nullable = 3;
}

// SchemaDriftConfig compares the live column list with the snapshot taken when
// the rule was saved. The rule reads metadata only, so it costs the target
// database nothing.
message SchemaDriftConfig {
  // The snapshot. The API fills it from the current columns when a rule is
  // created without one, and the editor lets a user adjust it.
  repeated SchemaDriftColumn expected_columns = 1;
  // Whether a changed column type or nullability is drift. Unset means true:
  // either change is drift unless the rule author turns the check off.
  optional bool check_types = 2;
  // Whether a changed column order is drift. Default false.
  bool check_order = 3;
  // Whether a column the snapshot does not name is drift. Default false.
  bool allow_extra_columns = 4;
  // Drift items tolerated. The metric is always COUNT here.
  optional double fail_threshold = 5;
  optional double warn_threshold = 6;
}

// GroupCheckConfig bounds the row count of each group a set of columns forms.
message GroupCheckConfig {
  // The grouping columns, 1-5 of them.
  repeated string columns = 1;
  // At least one bound is required.
  optional int64 min_rows_per_group = 2;
  optional int64 max_rows_per_group = 3;
  // Groups outside the bounds tolerated, measured per threshold_metric.
  optional double fail_threshold = 4;
  optional double warn_threshold = 5;
}

// QualityAggregateFunction is the aggregate an aggregate or reconciliation rule
// computes. COUNT is only meaningful for a cross-table reconciliation, and
// PERCENTILE only for an aggregate rule.
enum QualityAggregateFunction {
  QUALITY_AGGREGATE_FUNCTION_UNSPECIFIED = 0;
  QUALITY_AGGREGATE_FUNCTION_COUNT = 1;
  QUALITY_AGGREGATE_FUNCTION_SUM = 2;
  QUALITY_AGGREGATE_FUNCTION_AVG = 3;
  QUALITY_AGGREGATE_FUNCTION_MIN = 4;
  QUALITY_AGGREGATE_FUNCTION_MAX = 5;
  QUALITY_AGGREGATE_FUNCTION_STDDEV = 6;
  QUALITY_AGGREGATE_FUNCTION_PERCENTILE = 7;
}

// AggregateConfig bounds the value one aggregate over one column produces.
message AggregateConfig {
  string column = 1;
  QualityAggregateFunction function = 2;
  // The percentile, 0-100, for QUALITY_AGGREGATE_FUNCTION_PERCENTILE.
  optional double percentile = 3;
  // At least one fail bound is required; warn bounds are optional and must sit
  // inside the fail range.
  optional double min = 4;
  optional double max = 5;
  optional double warn_min = 6;
  optional double warn_max = 7;
  // Whether the bounds are inclusive. Default false, i.e. open on both ends.
  bool inclusive = 8;
}

// CrossTableReference names the relation a reconciliation compares against, as
// a registry target. Unlike a table name it can point at any database and
// instance of the workspace.
message CrossTableReference {
  // The registry GUID of the reference relation.
  string meta_guid = 1;

  MetaType meta_type = 2;

  // Where the reference lived when the rule was saved: display metadata, not
  // identity. The GUID and its meta type are the identity.
  QualityTargetPath path = 3;
}

// CrossTableConfig reconciles one aggregate of the rule's table with one
// aggregate of a reference relation, which may live in another database or
// another instance. A reference in the target's own database is read in the
// same statement as the target side; anything else is read over its own
// read-only connection.
message CrossTableConfig {
  reserved 1;
  reserved "right_table";

  // The left (target) aggregate; COUNT ignores left_column.
  QualityAggregateFunction left_function = 2;
  string left_column = 3;
  // The right (reference) aggregate; COUNT ignores right_column.
  QualityAggregateFunction right_function = 4;
  string right_column = 5;
  // The absolute difference tolerated before the thresholds apply: the observed
  // value is max(0, |left - right| - tolerance).
  optional double tolerance = 6;
  // Difference beyond the tolerance that fails, and the warning level inside it.
  // The fail threshold defaults to zero.
  optional double fail_threshold = 7;
  optional double warn_threshold = 8;
  // The reference relation; required.
  CrossTableReference reference = 9;
  // Rows the reference side reads, bounded like the rule's own filter. The
  // rule's filter and the target contract's filter never apply to the reference
  // side; this is the only filter it sees.
  QualityFilter right_filter = 10;
}

// QualityFilter is the AND filter a rule applies before observing. Values are
// encoded as strings and converted by the compiler using the column's type; no
// user text reaches SQL unparameterized.
message QualityFilter {
  repeated QualityFilterClause clauses = 1;
}

// QualityFilterClause is one comparison in a QualityFilter.
message QualityFilterClause {
  string column = 1;
  QualityFilterOperator op = 2;
  // Unused by IS_NULL / IS_NOT_NULL, at most 100 values for IN / NOT_IN.
  repeated string values = 3;
}

// QualityThresholds is the threshold snapshot a result records, so a historical
// result can be explained after the rule's thresholds changed. For
// GREATER_THAN / LESS_THAN only value fields are set; for the range comparisons
// the lower and upper bounds are.
message QualityThresholds {
  // Unset means the rule has no warning level.
  optional double warn_value = 1;
  optional double fail_value = 2;
  optional double warn_value_upper = 3;
  optional double fail_value_upper = 4;
  QualityComparison comparison = 5;
  QualityEmptyBehavior on_empty = 6;
}

// QualityStatusCounts is the six-state tally of a set of executions.
message QualityStatusCounts {
  int32 total = 1;
  int32 pass = 2;
  int32 warn = 3;
  int32 fail = 4;
  int32 error = 5;
  int32 skipped = 6;
  int32 not_evaluated = 7;
}

// QualityExecution is one rule checked once: the durable unit of the data
// quality engine. A scheduled tick or a manual request plans one execution per
// rule; the runner then executes it and records the verdict and its evidence on
// the same row.
message QualityExecution {
  option (google.api.resource) = {
    type: "metaxisdata/QualityExecution"
    pattern: "workspaces/{workspace}/qualityExecutions/{quality_execution}"
  };

  // Format: workspaces/{workspace}/qualityExecutions/{quality_execution}. The
  // last segment is the row id, which is immutable for the row's lifetime.
  string name = 1;

  // Format: workspaces/{workspace}/qualityRules/{quality_rule}
  string rule = 2 [(google.api.resource_reference) = {type: "metaxisdata/QualityRule"}];

  // The rule revision the check was judged with.
  int32 rule_revision = 3;

  // The engine version that produced the verdict, so a changed judgment is
  // traceable to a changed implementation.
  string rule_engine_version = 4;

  // The target as it was when the execution was planned.
  QualityTarget target = 5;

  QualityExecutionState state = 6;

  // The quality verdict: PASS, WARN, FAIL, ERROR, SKIPPED or NOT_EVALUATED.
  // Unset while the execution is PENDING or RUNNING; an ABANDONED execution
  // never produced one.
  QualityStatus outcome = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  QualityExecutionTrigger trigger = 8;

  // The principal that asked for the execution. Format: users/{user}. Empty for
  // a scheduled execution.
  string initiator = 9 [(google.api.resource_reference) = {type: "metaxisdata/User"}];

  // The instance the target lives in. Format: instances/{instance}
  string instance = 10 [(google.api.resource_reference) = {type: "metaxisdata/Instance"}];

  // The observed value; its unit is observed_kind.
  double observed_value = 11;

  QualityObservedKind observed_kind = 12;

  // The thresholds that were applied, snapshotted.
  QualityThresholds thresholds = 13;

  int64 failed_rows = 14;
  int64 total_rows = 15;

  // True when the observation was made over a sample rather than every row.
  bool sampled = 16;
  int64 sample_rows = 17;
  // True when the samples were cut off by the sample limit.
  bool truncated = 18;

  // Failed rows kept as evidence, already truncated per value.
  repeated FailureSample samples = 19;

  // The SQL that was executed. Kept so an execution can be re-checked by hand.
  string executed_sql = 20;

  // A machine-readable failure class: CONNECTION, AUTH, TIMEOUT, PERMISSION,
  // UNSUPPORTED, SQL_SYNTAX, BAD_DATA, LIMIT_EXCEEDED or ORPHANED. Empty unless
  // outcome is ERROR.
  string error_code = 21;

  // A human-readable failure message. Empty unless outcome is ERROR.
  string error_message = 22;

  google.protobuf.Duration duration = 23;

  google.protobuf.Timestamp start_time = 24;
  // Unset while the execution is PENDING or RUNNING.
  google.protobuf.Timestamp finish_time = 25;

  // The dispatch batch that planned this execution, so the execution directory
  // can group checks by the run that produced them.
  // Format: workspaces/{workspace}/qualityRuns/{quality_run}
  string run = 26 [(google.api.resource_reference) = {type: "metaxisdata/QualityRun"}];

  // The scheduled attempt number in the target's current due cycle: 1 for the
  // first attempt, 2+ for a retry after an abandoned attempt. Manual executions
  // always use 1. A retry is planned only while the attempt budget lasts.
  int32 attempt = 27;

  // The row count a row_count_change check compared against. Unset for every
  // other type, and for a first observation that had no recent baseline to
  // compare with; the verdict then follows on_empty, which a new count-change
  // check defaults to PASS so the first run only records the baseline.
  optional double baseline_value = 28;

  // When that baseline was measured. Unset whenever baseline_value is.
  google.protobuf.Timestamp baseline_time = 29;

  // The statement that read a reconciliation's reference side, when the
  // reference needed its own connection. Empty for every other execution and
  // for a reconciliation whose two sides share the target's connection.
  string reference_executed_sql = 30;

  // Rows that passed the same check, kept beside the failed rows so a reviewer
  // can compare the two populations. Only the row-level check types whose
  // passing rows are a row predicate keep them, and only when the verdict was
  // WARN or FAIL (a passing verdict has no failed rows to compare against).
  repeated FailureSample passing_samples = 31;

  // The segment set a segment check observed, compared with its baseline.
  // Unset for every other check type.
  SegmentObservation segment_evidence = 32;
}

// QualityExecutionSummary is the compact projection of the latest execution
// that a rule list shows. It is not a stored entity.
message QualityExecutionSummary {
  QualityStatus status = 1;
  double observed_value = 2;
  QualityObservedKind observed_kind = 3;
  int64 failed_rows = 4;
  int64 total_rows = 5;
  // Format: workspaces/{workspace}/qualityExecutions/{quality_execution}
  string execution = 6 [(google.api.resource_reference) = {type: "metaxisdata/QualityExecution"}];
  google.protobuf.Timestamp finish_time = 7;
}

// QualityRun is one dispatch batch that belongs to one target: the executions a
// scheduler tick or a manual request planned for that target together. It is a
// projection over quality_run and the executions it planned, not a second source
// of truth; the execution remains the per-check unit and the evidence. The batch
// counts and outcome are therefore the target's counts and outcome.
message QualityRun {
  option (google.api.resource) = {
    type: "metaxisdata/QualityRun"
    pattern: "workspaces/{workspace}/qualityRuns/{quality_run}"
  };

  // Format: workspaces/{workspace}/qualityRuns/{quality_run}. The last segment is
  // the row id, which is immutable for the row's lifetime.
  string name = 1;

  // The instance whose connection budget admitted the batch.
  // Format: instances/{instance}
  string instance = 2 [(google.api.resource_reference) = {type: "metaxisdata/Instance"}];

  QualityExecutionTrigger trigger = 3;

  // The batch lifecycle: PENDING, RUNNING, COMPLETED or ABANDONED. A COMPLETED
  // batch may still have failed checks; outcome carries what it found.
  QualityExecutionState state = 4;

  // The worst verdict among the batch's terminal executions. Unset while the
  // batch is queued or running, and on an abandoned batch.
  QualityStatus outcome = 5;

  // The batch-wide tally. total counts every planned execution; the per-verdict
  // fields count only the ones that reached that verdict.
  QualityStatusCounts counts = 6;

  // The principal that started a manual batch. Empty for a scheduled batch.
  // Format: users/{user}
  string initiator = 7 [(google.api.resource_reference) = {type: "metaxisdata/User"}];

  google.protobuf.Timestamp start_time = 8;
  // Unset while the batch is PENDING or RUNNING.
  google.protobuf.Timestamp finish_time = 9;

  // Scheduling is a property of the target, so each batch belongs to exactly one
  // target; a manual selection that spans targets is split into one batch per
  // target.
  QualityTarget target = 11;

  // The range of rule revisions the batch's executions actually judged, so two
  // batches are only compared when they ran the same definitions. Zero while no
  // execution has run.
  int32 rule_revision_min = 12 [(google.api.field_behavior) = OUTPUT_ONLY];
  int32 rule_revision_max = 13 [(google.api.field_behavior) = OUTPUT_ONLY];

  // How many scheduled attempts in this batch were retries, i.e. executions whose
  // attempt number is greater than one. Zero for a batch whose checks all ran on
  // their first attempt and for manual batches.
  int32 retry_count = 14 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The former per-target slices: a batch now names its target directly.
  reserved 10;
  reserved "targets";
}

message ListQualityRunsRequest {
  // Format: workspaces/{workspace}. "workspaces/-" is the current workspace.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];

  // The maximum number of runs to return. If unspecified, at most 50 are
  // returned. The maximum value is 1000; values above 1000 are coerced to 1000.
  int32 page_size = 2;

  // A page token, received from a previous ListQualityRuns call.
  string page_token = 3;

  // Only runs that belong to this target GUID.
  string target_guid = 4;

  // The target's object type. Optional when the caller only knows the GUID; the
  // target workspace passes it because a GUID is not unique across object types.
  MetaType meta_type = 11;

  // Only runs admitted against this instance.
  // Format: instances/{instance}
  string instance = 5 [(google.api.resource_reference) = {type: "metaxisdata/Instance"}];

  QualityExecutionTrigger trigger = 6;
  QualityExecutionState state = 7;
  QualityStatus outcome = 8;

  // Only runs started at or after this time.
  google.protobuf.Timestamp start_time = 9;
  // Only runs started before this time.
  google.protobuf.Timestamp end_time = 10;
}

message ListQualityRunsResponse {
  repeated QualityRun quality_runs = 1;
  string next_page_token = 2;
}

message GetQualityRunRequest {
  // Format: workspaces/{workspace}/qualityRuns/{quality_run}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "metaxisdata/QualityRun"}
  ];
}

// QualityIssue is the durable problem behind a rule's failures. A rule has at
// most one unresolved issue; a later failing run touches it instead of opening
// another, and a resolved issue is never reopened.
message QualityIssue {
  option (google.api.resource) = {
    type: "metaxisdata/QualityIssue"
    pattern: "workspaces/{workspace}/qualityIssues/{quality_issue}"
  };

  // Format: workspaces/{workspace}/qualityIssues/{quality_issue}
  string name = 1;

  // Format: workspaces/{workspace}/qualityRules/{quality_rule}
  string rule = 2 [(google.api.resource_reference) = {type: "metaxisdata/QualityRule"}];

  // The target as it was when the issue was opened.
  QualityTarget target = 3;

  QualityIssueStatus status = 4;

  QualitySeverity severity = 5;

  // The execution that opened the issue. Unset when it was opened without one.
  string first_seen_execution = 6 [(google.api.resource_reference) = {type: "metaxisdata/QualityExecution"}];

  // The newest execution that observed the problem again.
  string last_seen_execution = 7 [(google.api.resource_reference) = {type: "metaxisdata/QualityExecution"}];

  google.protobuf.Timestamp first_seen_time = 8;
  google.protobuf.Timestamp last_seen_time = 9;

  // When the issue was resolved. Unset while it is open or acknowledged.
  google.protobuf.Timestamp resolved_time = 10;

  QualityResolutionReason resolution_reason = 11;

  // The note recorded with the resolution.
  string resolution_note = 12;

  // Who acknowledged it. Format: users/{user}. Empty when never acknowledged.
  string acknowledged_by = 13 [(google.api.resource_reference) = {type: "metaxisdata/User"}];

  google.protobuf.Timestamp acknowledged_time = 14;

  // Issue-level mute: notifications are suppressed until it passes, while the
  // rule keeps running and results keep being recorded.
  google.protobuf.Timestamp muted_until = 15;

  // How many runs observed the problem while the issue was unresolved.
  int32 occurrence_count = 16;
}

// ProfileValue is one frequent value of a low-cardinality column.
message ProfileValue {
  string value = 1;
  int64 count = 2;
}

// ColumnProfileStats is the deterministic statistics of one column, measured
// without a model. It is the evidence a semantic label cites.
message ColumnProfileStats {
  int64 total_rows = 1;
  int64 null_count = 2;
  int64 distinct_count = 3;
  // True when an exact distinct count was unavailable — the column's type has no
  // SQL equality for one, or the database refused it — and the value came from a
  // sample.
  bool distinct_estimated = 4;
  // Display forms of the observed extremes, truncated; empty when the column has
  // no comparable values.
  string min_value = 5;
  string max_value = 6;
  // Unset for non-string columns.
  optional int64 min_length = 7;
  optional int64 max_length = 8;
  // The most frequent values, at most ten, each truncated.
  repeated ProfileValue top_values = 9;
  // Shape summaries such as "numeric", "alpha", "date-like", "mixed".
  repeated string patterns = 10;
}

// SemanticLabelEvidence is why a label was assigned. It cites the inputs the
// labeler saw so a reviewer can check the reasoning without re-running it.
message SemanticLabelEvidence {
  // Columns whose values or context the label derives from.
  repeated string columns = 1;
  // Profile facts such as "null_rate=0.02" or "distinct=12".
  repeated string metrics = 2;
  // Lineage relations that motivated the label, e.g. "join key of orders".
  repeated string lineage = 3;
  string rationale = 4;
}

// QualityRuleDraftConfig is one model-proposed rule, already validated into the
// typed config. It is never executed without a human saving it as a rule.
message QualityRuleDraftConfig {
  QualityRuleConfig config = 1;
  QualitySeverity severity = 2;
  string title = 3;
  string rationale = 4;
  double confidence = 5;
}

// SemanticLabelSuggestion is a model-proposed semantic label for one column.
message SemanticLabelSuggestion {
  string column = 1;
  QualitySemanticType label = 2;
  double confidence = 3;
  SemanticLabelEvidence evidence = 4;
  // The rule types the deterministic mapping would suggest for this label, in
  // display order. The model may rank types but may not invent one.
  repeated QualityRuleType suggested_rule_types = 5;
}

// QualitySuggestionPayload is the review-queue payload: a rule draft the reviewer
// can load into the editor, or a semantic label awaiting confirmation.
message QualitySuggestionPayload {
  oneof payload {
    QualityRuleDraftConfig rule = 1;
    SemanticLabelSuggestion label = 2;
  }
}

// QualitySuggestion is one model-proposed rule draft or semantic label waiting
// for a reviewer. Nothing here is a rule: accepting a suggestion goes through the
// normal rule or label path.
message QualitySuggestion {
  option (google.api.resource) = {
    type: "metaxisdata/QualitySuggestion"
    pattern: "workspaces/{workspace}/qualitySuggestions/{quality_suggestion}"
  };

  // Format: workspaces/{workspace}/qualitySuggestions/{quality_suggestion}
  string name = 1;

  QualitySuggestionKind kind = 2;
  QualitySuggestionSource source = 3;

  // The target the suggestion is about.
  QualityTarget target = 4;

  QualitySuggestionPayload payload = 5;

  QualitySuggestionStatus status = 6;

  // The model that produced it.
  string provider = 7;
  string model = 8;
  string prompt_version = 9;

  google.protobuf.Timestamp create_time = 10;

  // Who decided it. Format: users/{user}. Empty while pending.
  string decided_by = 11 [(google.api.resource_reference) = {type: "metaxisdata/User"}];

  google.protobuf.Timestamp decide_time = 12;

  string decision_note = 13;

  // When a later generation pass refreshed this pending proposal's payload.
  // Unset when the proposal has not been refreshed.
  google.protobuf.Timestamp refresh_time = 14;
}

// QualitySuggestionQueueSummary is what one generation pass did to the review
// queue. Generation reconciles proposals with the facts and with the live queue
// instead of appending rows, so a pass can create, refresh, close or skip
// proposals; these counts let the client explain the result.
message QualitySuggestionQueueSummary {
  // Proposals that did not exist before this pass.
  int32 created = 1;
  // Pending proposals whose payload this pass updated.
  int32 refreshed = 2;
  // Pending proposals the pass closed because their fact now exists.
  int32 superseded = 3;
  // Skipped because the fact already exists: the column has a label, or a rule
  // with the same identity exists.
  int32 skipped_existing_fact = 4;
  // Skipped because an equivalent proposal is already pending; the default mode
  // leaves it untouched instead of spending another analysis.
  int32 skipped_pending = 5;
  // Skipped because the same proposal was already accepted or rejected and the
  // request did not force regeneration.
  int32 skipped_decided = 6;
  // The columns a generation pass derived no proposal for, so the client can name
  // them. A label pass lists columns it left out because they already had a label or
  // a live proposal; a deterministic recommendation lists columns no check could be
  // derived for. A column whose candidate lost the pass's per-type budget is not
  // listed, because a proposal for it was derived.
  repeated string skipped_columns = 7;
}

// ColumnProfile is the cached deterministic statistics of one column plus how
// they were measured.
message ColumnProfile {
  // The globally unique metadata GUID of the profiled table.
  string table_guid = 1;

  MetaType meta_type = 2;

  string column = 3;

  ColumnProfileStats profile = 4;

  // How the values were sampled, e.g. "full" or "sample".
  string sample_method = 5;
  int64 sample_rows = 6;
  bool truncated = 7;
  // The engine version that measured it, so a changed measurement is traceable.
  string engine_version = 8;
  google.protobuf.Timestamp profiled_at = 9;
}

// ColumnSemanticLabel is the semantic type a column is asserted to hold, who
// asserted it and the evidence behind it.
message ColumnSemanticLabel {
  // The globally unique metadata GUID of the table.
  string table_guid = 1;

  MetaType meta_type = 2;

  string column = 3;

  QualitySemanticType label = 4;
  QualityLabelSource source = 5;
  QualityLabelStatus status = 6;
  double confidence = 7;
  SemanticLabelEvidence evidence = 8;

  // Who accepted it. Format: users/{user}. Empty for a suggestion.
  string accepted_by = 9 [(google.api.resource_reference) = {type: "metaxisdata/User"}];

  google.protobuf.Timestamp accepted_time = 10;
  google.protobuf.Timestamp update_time = 11;
}

// FailureSample is one failed row, already truncated.
message FailureSample {
  repeated ColumnValue columns = 1;
}

// SegmentObservation is the segment set one segment-check execution observed,
// kept as the baseline the following executions are judged against.
message SegmentObservation {
  // The segments this execution saw, largest first. Bounded by a fixed cap, so a
  // truncated observation carries only the largest segments.
  repeated SegmentRecord observed = 1;
  // The observed segments the baseline did not have. They are evidence only: a
  // new segment does not fail the check.
  repeated SegmentRecord new_segments = 2;
  // True when the observed set was cut off by the segment cap.
  bool truncated = 3;
  // How many previous executions formed the baseline; 0 means there was none.
  int32 baseline_runs = 4;
  // How many segments the baseline expected.
  int64 expected_count = 5;
  // The expected segments the current execution did not observe: the ones that
  // failed the check. Each carries the last baseline run that saw it and its row
  // count then. Empty when the check passed.
  repeated SegmentRecord disappeared = 6;
}

// SegmentRecord is one segment: its key values and row count.
message SegmentRecord {
  // One display-rendered value per grouping column, in the rule's column order.
  repeated string values = 1;
  int64 row_count = 2;
  // When the baseline last observed the segment. Unset for a segment this
  // execution observed.
  google.protobuf.Timestamp last_seen = 3;
  // Whether the matching value in values is SQL NULL. The list is parallel to
  // values; a missing entry reads as not null.
  repeated bool is_null = 4;
  // Whether the matching value in values was redacted before storage. The list
  // is parallel to values; a missing entry reads as not redacted.
  repeated bool masked = 5;
  // A digest of the full value behind each entry of values, hex encoded. Values
  // are truncated for display; the digest is what tells two segments with the
  // same 128-byte prefix apart across executions. The list is parallel to
  // values; a missing entry reads as empty (fall back to the value).
  repeated string value_digests = 6;
}

// ColumnValue is one column of a sampled failed row. Values are truncated before
// they are returned, so a wide text column cannot bloat the response.
message ColumnValue {
  string column = 1;

  // The value rendered as display text. Empty for a SQL NULL and for an empty
  // string; is_null tells the two apart.
  string value = 2;

  // Whether the value was SQL NULL. A sample recorded before this field existed
  // has no marker, and its NULLs are indistinguishable from empty strings.
  optional bool is_null = 3;

  // Whether the server redacted the value before returning it. A masked value is a
  // display form only: for a resident ID card number the division prefix and the
  // last four characters stay visible while the birth date and sequence digits are
  // replaced. The raw value is never returned.
  optional bool masked = 4;
}

message ListQualityRulesRequest {
  // Format: workspaces/{workspace}. "workspaces/-" is the current workspace.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];

  // The maximum number of rules to return. If unspecified, at most 50 are
  // returned. The maximum value is 1000; values above 1000 are coerced to 1000.
  int32 page_size = 2;

  // A page token, received from a previous ListQualityRules call. Provide this
  // to retrieve the subsequent page.
  string page_token = 3;

  // The following four filters are GUID path prefixes, not name matches: a rule
  // matches when its target GUID starts with the given prefix. "instance_1"
  // therefore selects every rule in that instance, whatever database or table it
  // watches.
  string instance = 4;
  string database = 5;
  string schema = 6;
  string table = 7;

  // The exact target GUID.
  string target_guid = 8;

  QualityDimension dimension = 9;
  QualityRuleType rule_type = 10;
  QualitySeverity severity = 11;
  QualityRuleState state = 12;

  // Format: users/{user}. Empty means every owner.
  string owner = 13;

  // A substring match over the title and description.
  string search = 14;

  // When true, only rules with no owner are returned. It cannot be combined
  // with a non-empty owner.
  bool owner_unassigned = 15;
}

message ListQualityRulesResponse {
  repeated QualityRule quality_rules = 1;
  string next_page_token = 2;
}

message GetQualityRuleRequest {
  // Format: workspaces/{workspace}/qualityRules/{quality_rule}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "metaxisdata/QualityRule"}
  ];
}

message CreateQualityRuleRequest {
  // Format: workspaces/{workspace}. "workspaces/-" is the current workspace.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];

  // The rule to create. Its name is assigned by the server.
  QualityRule rule = 2 [(google.api.field_behavior) = REQUIRED];

  // The suggestion this rule is created from, if any. When set, the rule's
  // target is taken from the suggestion: a request target that names a
  // different target is rejected rather than silently ignored, so a caller
  // cannot create a rule for one table while accepting another table's draft.
  // The suggestion is marked accepted once the rule exists. A decision that
  // cannot be written does not roll the created rule back; it is logged and the
  // suggestion can be decided explicitly.
  string suggestion = 3 [(google.api.resource_reference) = {type: "metaxisdata/QualitySuggestion"}];
}

message BatchCreateQualityRulesRequest {
  // Format: workspaces/{workspace}. "workspaces/-" is the current workspace.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];

  // The rules to create, at most 200, in submission order. Each item is created
  // independently, so one rejected rule does not block the others.
  repeated CreateQualityRuleRequest requests = 2 [(google.api.field_behavior) = REQUIRED];
}

message BatchCreateQualityRulesResponse {
  // One result per request, in request order.
  repeated BatchCreateQualityRuleResult results = 1;
}

message BatchCreateQualityRuleResult {
  // The created rule; unset when this item failed.
  QualityRule rule = 1;

  // Empty on success; otherwise why this rule could not be created.
  string error = 2;

  // The suggestion named by the request item, echoed so a client does not have
  // to trust the index alone. Empty for an item that named no suggestion.
  // Format: workspaces/{workspace}/qualitySuggestions/{quality_suggestion}
  string suggestion = 3;
}

message BatchUpdateQualityRulesRequest {
  // Format: workspaces/{workspace}. "workspaces/-" is the current workspace.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];

  // The updates to apply, at most 200, in submission order. Each item names one
  // rule and is applied independently, so one rejected update does not block
  // the others.
  repeated UpdateQualityRuleRequest requests = 2 [(google.api.field_behavior) = REQUIRED];
}

message BatchUpdateQualityRulesResponse {
  // One result per request, in request order.
  repeated BatchUpdateQualityRuleResult results = 1;
}

message BatchUpdateQualityRuleResult {
  // The updated rule; unset when this item failed.
  QualityRule rule = 1;

  // Empty on success; otherwise why this rule could not be updated.
  string error = 2;

  // The rule name named by the request item, echoed so a client does not have
  // to trust the index alone.
  // Format: workspaces/{workspace}/qualityRules/{quality_rule}
  string name = 3;
}

message UpdateQualityRuleRequest {
  // The rule to update. Its name identifies it; only the fields named by
  // update_mask are written.
  QualityRule rule = 1 [(google.api.field_behavior) = REQUIRED];

  google.protobuf.FieldMask update_mask = 2;
}

message DeleteQualityRuleRequest {
  // Format: workspaces/{workspace}/qualityRules/{quality_rule}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "metaxisdata/QualityRule"}
  ];
}

message PreviewQualityRuleRequest {
  // Format: workspaces/{workspace}. "workspaces/-" is the current workspace.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];

  // The rule to validate, typically one that has not been saved yet.
  QualityRule rule = 2 [(google.api.field_behavior) = REQUIRED];
}

message PreviewQualityRuleResponse {
  // The SQL the rule compiles to, for the editor's query preview.
  string compiled_sql = 1;

  // The target columns the compiled SQL reads.
  repeated string referenced_columns = 2;

  // The filter values the compiler bound, encoded for display, in the order the
  // placeholders appear in compiled_sql.
  repeated string parameters = 3;

  // The statement that reads a reconciliation's reference side alone, when the
  // reference needs its own connection. Empty when both sides compile to
  // compiled_sql, which is the case whenever they share a connection.
  string reference_sql = 4;

  // The values bound to reference_sql, in placeholder order.
  repeated string reference_parameters = 5;
}

message RunQualityRulesRequest {
  // Format: workspaces/{workspace}. "workspaces/-" is the current workspace.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];

  // The rules to run, at most 200. At least one of rules, instance and
  // target_guid must be set.
  repeated string rules = 2 [(google.api.resource_reference) = {type: "metaxisdata/QualityRule"}];

  // Restrict the selection to the enabled rules of one instance.
  // Format: instances/{instance}
  string instance = 3 [(google.api.resource_reference) = {type: "metaxisdata/Instance"}];

  // Restrict the selection to the enabled rules that watch this table.
  string target_guid = 4;
}

message RunQualityRulesResponse {
  // One execution per selected rule, planned and queued for the runner. All of
  // them are PENDING when the response is returned; poll GetQualityExecution.
  repeated QualityExecution executions = 1;
}

message ListQualityExecutionsRequest {
  // Format: workspaces/{workspace}. "workspaces/-" is the current workspace.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];

  // The maximum number of executions to return. If unspecified, at most 50 are
  // returned. The maximum value is 1000; values above 1000 are coerced to 1000.
  int32 page_size = 2;

  // A page token, received from a previous ListQualityExecutions call. Provide
  // this to retrieve the subsequent page.
  string page_token = 3;

  // The execution lifecycle to filter by, e.g. only PENDING executions.
  QualityExecutionState state = 4;

  // The quality outcome to filter by, e.g. only failed executions. Matches
  // completed executions only.
  QualityStatus outcome = 5;

  QualityExecutionTrigger trigger = 6;

  // Only the executions of this rule.
  // Format: workspaces/{workspace}/qualityRules/{quality_rule}
  string rule = 7 [(google.api.resource_reference) = {type: "metaxisdata/QualityRule"}];

  // The exact target GUID.
  string target_guid = 8;

  // Only the executions of rules of this instance.
  // Format: instances/{instance}
  string instance = 9 [(google.api.resource_reference) = {type: "metaxisdata/Instance"}];

  // Only the executions this principal started. Format: users/{user}.
  string initiator = 10;

  // Only the executions started at or after this time.
  google.protobuf.Timestamp start_time = 11;

  // Only the executions started before this time.
  google.protobuf.Timestamp end_time = 12;

  // Only the executions planned by this run.
  // Format: workspaces/{workspace}/qualityRuns/{quality_run}
  string run = 13 [(google.api.resource_reference) = {type: "metaxisdata/QualityRun"}];
}

message ListQualityExecutionsResponse {
  repeated QualityExecution quality_executions = 1;
  string next_page_token = 2;
}

message GetQualityExecutionRequest {
  // Format: workspaces/{workspace}/qualityExecutions/{quality_execution}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "metaxisdata/QualityExecution"}
  ];
}

message GetQualityRuleTrendRequest {
  // Format: workspaces/{workspace}/qualityRules/{quality_rule}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "metaxisdata/QualityRule"}
  ];

  // How many of the check's most recent judged executions to read. Omitted or
  // non-positive means the default of 30; values above 90 are coerced to 90, the
  // execution retention window in days.
  int32 limit = 2;
}

// QualityRuleTrend is one check's measured history, oldest point first so a chart
// draws left to right. Points come from the check's executions against its
// current target: executions of an earlier rule definition that had a different
// rule type are not comparable and are left out.
message QualityRuleTrend {
  // Format: workspaces/{workspace}/qualityRules/{quality_rule}
  string rule = 1 [(google.api.resource_reference) = {type: "metaxisdata/QualityRule"}];

  // The unit the points and both threshold bounds are expressed in.
  QualityTrendUnit unit = 2;

  repeated QualityRuleTrendPoint points = 3;

  // The band the check judges against now. It is set only when the newest point
  // was judged with the rule's current revision, so the drawn band always
  // describes the rule this trend was read with; a check edited since its last
  // run draws no band and explains why in band_notice.
  QualityThresholds thresholds = 4;
  QualityTrendNotice band_notice = 5;

  // A threshold derived from the same history, offered to the editor. Nothing is
  // applied by reading it; a person fills the form and saves the check.
  QualityThresholdSuggestion suggestion = 6;

  // True when executions from an earlier rule type were left out, i.e. the drawn
  // history starts at a type change. The window is then shorter than the
  // requested limit even when older judged executions exist.
  bool history_restarted = 7;
}

// QualityTrendUnit is the unit of a trend's values and threshold bounds.
enum QualityTrendUnit {
  QUALITY_TREND_UNIT_UNSPECIFIED = 0;
  // A number of rows: failed rows, a row count, a group count.
  QUALITY_TREND_UNIT_COUNT = 1;
  // Already a percentage in 0-100, never a 0-1 ratio: a PERCENT threshold
  // metric's failed rows over total rows, or a null percentage.
  QUALITY_TREND_UNIT_PERCENT = 2;
  // A lag in seconds.
  QUALITY_TREND_UNIT_SECONDS = 3;
  // An aggregate value or a table-to-table difference.
  QUALITY_TREND_UNIT_NUMBER = 4;
}

// QualityRuleTrendPoint is one judged execution of the check.
message QualityRuleTrendPoint {
  // Format: workspaces/{workspace}/qualityExecutions/{quality_execution}
  string execution = 1 [(google.api.resource_reference) = {type: "metaxisdata/QualityExecution"}];

  google.protobuf.Timestamp start_time = 2;

  QualityStatus status = 3;

  // The quantity the check judged, in the trend's unit. For a PERCENT check this
  // is failed rows over total rows; a row_count_change check plots its row count.
  double value = 4;

  int64 failed_rows = 5;
  int64 total_rows = 6;

  // True when the observation was made over a sample rather than every row.
  bool sampled = 7;

  // The rule revision the execution was judged with.
  int32 rule_revision = 8;
}

// QualityThresholdSuggestion is a threshold derived from the check's history. It
// is a starting point for the editor, never a verdict: the values are rounded for
// display, the method is stated, and nothing is written until the check is saved.
message QualityThresholdSuggestion {
  // The suggested bounds, in the trend's unit and shaped like the snapshot the
  // check itself records: fail_value/warn_value for a single upper bound, and the
  // fail/warn pairs for the two-sided row-count bounds. Unset when no suggestion
  // could be derived; notice then says why.
  QualityThresholds thresholds = 1;

  // How many judged executions the suggestion was derived from.
  int32 sample_size = 2;

  QualityThresholdSuggestionMethod method = 3;

  QualityTrendNotice notice = 4;
}

// QualityThresholdSuggestionMethod names the arithmetic behind a suggestion, so
// the editor can say how the number was reached.
enum QualityThresholdSuggestionMethod {
  QUALITY_THRESHOLD_SUGGESTION_METHOD_UNSPECIFIED = 0;
  // A single upper bound: warn = p95 and fail = p99 of the judged values.
  QUALITY_THRESHOLD_SUGGESTION_METHOD_P95_P99 = 1;
  // Two-sided row-count bounds: the observed range widened by a margin, with the
  // warn bounds at the observed extremes.
  QUALITY_THRESHOLD_SUGGESTION_METHOD_OBSERVED_RANGE = 2;
}

// QualityTrendNotice explains why a trend has no threshold band or no suggestion.
enum QualityTrendNotice {
  QUALITY_TREND_NOTICE_UNSPECIFIED = 0;
  // The check has no judged execution in the window.
  QUALITY_TREND_NOTICE_NO_JUDGED_EXECUTION = 1;
  // The check was edited after its newest judged execution, so its current
  // thresholds never judged any of the drawn points.
  QUALITY_TREND_NOTICE_EDITED_SINCE_LAST_RUN = 2;
  // The plotted value is not the quantity the thresholds bound: a row count
  // against percent-change bounds.
  QUALITY_TREND_NOTICE_UNIT_NOT_COMPARABLE = 3;
  // The rule type has no numeric observation or no threshold shape this read
  // model can suggest.
  QUALITY_TREND_NOTICE_UNSUPPORTED_RULE_TYPE = 4;
  // Fewer judged executions than the suggestion needs (five).
  QUALITY_TREND_NOTICE_INSUFFICIENT_HISTORY = 5;
  // The rule type could be suggested, but its current config has no bound to
  // fill in.
  QUALITY_TREND_NOTICE_UNSUPPORTED_CONFIG = 6;
}

message ListQualityIssuesRequest {
  // Format: workspaces/{workspace}. "workspaces/-" is the current workspace.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];

  // The maximum number of issues to return. If unspecified, at most 50 are
  // returned. The maximum value is 1000; values above 1000 are coerced to 1000.
  int32 page_size = 2;

  // A page token, received from a previous ListQualityIssues call. Provide this
  // to retrieve the subsequent page.
  string page_token = 3;

  QualityIssueStatus status = 4;
  QualitySeverity severity = 5;

  // Format: workspaces/{workspace}/qualityRules/{quality_rule}
  string rule = 6 [(google.api.resource_reference) = {type: "metaxisdata/QualityRule"}];

  // The exact target GUID.
  string target_guid = 7;

  // Only issues of rules owned by this principal. Format: users/{user}
  string owner = 8 [(google.api.resource_reference) = {type: "metaxisdata/User"}];

  // Only issues first seen at or after this time.
  google.protobuf.Timestamp start_time = 9;

  // Only issues first seen at or before this time.
  google.protobuf.Timestamp end_time = 10;
}

message ListQualityIssuesResponse {
  repeated QualityIssue quality_issues = 1;
  string next_page_token = 2;
}

message GetQualityIssueRequest {
  // Format: workspaces/{workspace}/qualityIssues/{quality_issue}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "metaxisdata/QualityIssue"}
  ];
}

message UpdateQualityIssueRequest {
  // The issue to update. Its name identifies it.
  QualityIssue issue = 1 [(google.api.field_behavior) = REQUIRED];

  // The fields to change: status (RESOLVED only), resolution_reason,
  // resolution_note, acknowledged or muted_until.
  google.protobuf.FieldMask update_mask = 2;

  // Whether to acknowledge the issue. Acknowledgement is an action rather than a
  // stored field of QualityIssue, so the update mask path "acknowledged" reads
  // this value; false is rejected because clearing an acknowledgement is not a
  // supported transition.
  bool acknowledged = 3 [(google.api.field_behavior) = INPUT_ONLY];
}

message ListQualitySuggestionsRequest {
  // Format: workspaces/{workspace}. "workspaces/-" is the current workspace.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];

  // The maximum number of suggestions to return. If unspecified, at most 50 are
  // returned. The maximum value is 1000; values above 1000 are coerced to 1000.
  int32 page_size = 2;

  // A page token, received from a previous ListQualitySuggestions call. Provide
  // this to retrieve the subsequent page.
  string page_token = 3;

  QualitySuggestionStatus status = 4;
  QualitySuggestionKind kind = 5;
  QualitySuggestionSource source = 6;

  // The exact target GUID.
  string target_guid = 7;

  // The following four filters are GUID path prefixes, the same shape as
  // ListQualityRules: a suggestion matches when its target GUID starts with the
  // given prefix, so "instance_1" selects every suggestion for that instance.
  string instance = 8;
  string database = 9;
  string schema = 10;
  string table = 11;
}

message ListQualitySuggestionsResponse {
  repeated QualitySuggestion quality_suggestions = 1;
  string next_page_token = 2;
}

message UpdateQualitySuggestionRequest {
  // Format: workspaces/{workspace}/qualitySuggestions/{quality_suggestion}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "metaxisdata/QualitySuggestion"}
  ];

  // The decision: ACCEPTED or REJECTED. A suggestion starts PENDING and a
  // decision is final.
  QualitySuggestionStatus decision = 2;

  // Why it was decided, shown in the review history.
  string decision_note = 3;
}

message GetQualitySuggestionRequest {
  // Format: workspaces/{workspace}/qualitySuggestions/{quality_suggestion}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "metaxisdata/QualitySuggestion"}
  ];
}

message BatchUpdateQualitySuggestionsRequest {
  // Format: workspaces/{workspace}. "workspaces/-" is the current workspace.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];

  // The decisions to apply, at most 200, in submission order. Each request
  // names one suggestion and is applied independently.
  repeated UpdateQualitySuggestionRequest requests = 2 [(google.api.field_behavior) = REQUIRED];
}

message BatchUpdateQualitySuggestionsResponse {
  // One result per request, in request order.
  repeated BatchUpdateQualitySuggestionResult results = 1;
}

message BatchUpdateQualitySuggestionResult {
  // The decided suggestion; unset when this decision failed.
  QualitySuggestion suggestion = 1;

  // Empty on success; otherwise why this suggestion could not be decided.
  string error = 2;

  // The suggestion name named by the request item, echoed so a client does not
  // have to trust the index alone.
  // Format: workspaces/{workspace}/qualitySuggestions/{quality_suggestion}
  string name = 3;
}

// QualitySuggestionJobStatus is the lifecycle of a background AI drafting job.
enum QualitySuggestionJobStatus {
  QUALITY_SUGGESTION_JOB_STATUS_UNSPECIFIED = 0;
  QUALITY_SUGGESTION_JOB_STATUS_PENDING = 1;
  QUALITY_SUGGESTION_JOB_STATUS_RUNNING = 2;
  QUALITY_SUGGESTION_JOB_STATUS_COMPLETED = 3;
  QUALITY_SUGGESTION_JOB_STATUS_FAILED = 4;
  QUALITY_SUGGESTION_JOB_STATUS_CANCELED = 5;
}

// QualitySuggestionJobTargetState is where one target of a drafting job stands.
// SKIPPED means the job stopped before asking the model for that target; FAILED
// means the model was asked and the target could not produce suggestions.
enum QualitySuggestionJobTargetState {
  QUALITY_SUGGESTION_JOB_TARGET_STATE_UNSPECIFIED = 0;
  QUALITY_SUGGESTION_JOB_TARGET_STATE_PENDING = 1;
  QUALITY_SUGGESTION_JOB_TARGET_STATE_RUNNING = 2;
  QUALITY_SUGGESTION_JOB_TARGET_STATE_DONE = 3;
  QUALITY_SUGGESTION_JOB_TARGET_STATE_FAILED = 4;
  QUALITY_SUGGESTION_JOB_TARGET_STATE_SKIPPED = 5;
}

// QualitySuggestionJobTarget is one target of a drafting job and what happened
// to it. `suggestions` names the queued suggestions this target produced.
message QualitySuggestionJobTarget {
  QualityTarget target = 1;

  QualitySuggestionJobTargetState state = 2;

  // The suggestions queued from this target so far.
  // Format: workspaces/{workspace}/qualitySuggestions/{quality_suggestion}
  repeated string suggestions = 3;

  // Empty unless this target failed; then why.
  string error = 4;

  google.protobuf.Timestamp start_time = 5;
  google.protobuf.Timestamp finish_time = 6;

  // Set when the target failed in the model call: the classifier, provider
  // facts, stop reason and usage behind the error, plus the correlation id that
  // ties it to the server log and the debug log.
  QualityLLMDiagnostic diagnostic = 7;

  // What this target's pass did to the review queue. Set on success.
  QualitySuggestionQueueSummary summary = 8;
}

// QualityLLMDiagnostic explains why one LLM analysis failed, in a form a person
// can act on and an operator can correlate with logs. It never includes the
// prompt or the model response; those are available on demand when runtime debug
// mode captured them (see GetQualitySuggestionJobTargetDebug).
message QualityLLMDiagnostic {
  // A stable machine-readable classifier, e.g. TRUNCATED (finish_reason=length),
  // STREAM_INCOMPLETE, PROVIDER_STATUS, PROVIDER_REQUEST, RESPONSE_TOO_LARGE,
  // TIMEOUT, PARSE, UNKNOWN.
  string error_code = 1;
  string provider = 2;
  string model = 3;
  string prompt_version = 4;
  // The output-token budget the call asked for; TRUNCATED points at this.
  int32 max_output_tokens = 5;
  string finish_reason = 6;
  int64 prompt_tokens = 7;
  int64 completion_tokens = 8;
  int64 total_tokens = 9;
  // How large the prompt was, so a context/usage problem is visible.
  int64 prompt_chars = 10;
  // Copy this into server logs or the debug log lookup.
  string correlation_id = 11;
  int32 provider_status = 12;
  // Whether GetQualitySuggestionJobTargetDebug can return the raw bodies.
  bool debug_payload_available = 13;
}

// QualitySuggestionJob is one background AI drafting run over a set of targets.
// It is the durable unit of the asynchronous drafting flow: it outlives the
// browser tab that submitted it and is safe to poll.
message QualitySuggestionJob {
  option (google.api.resource) = {
    type: "metaxisdata/QualitySuggestionJob"
    pattern: "workspaces/{workspace}/qualitySuggestionJobs/{quality_suggestion_job}"
  };

  // Format: workspaces/{workspace}/qualitySuggestionJobs/{quality_suggestion_job}
  string name = 1;

  QualitySuggestionJobStatus status = 2;

  // The natural-language intent the job drafts for, shared by every target.
  string intent = 3;

  // The language the intent and drafts are written in, e.g. "en" or "zh-CN".
  string language = 4;

  repeated QualitySuggestionJobTarget targets = 5;

  // Total targets, targets no longer PENDING/RUNNING, and queued suggestions.
  int32 target_count = 6;
  int32 completed_target_count = 7;
  int32 suggestion_count = 8;

  // The provider facts of the analysis; set when the runner starts the job.
  string provider = 9;
  string model = 10;
  string prompt_version = 11;

  google.protobuf.Timestamp create_time = 12;
  google.protobuf.Timestamp start_time = 13;
  google.protobuf.Timestamp finish_time = 14;

  // Empty unless the whole job failed; per-target failures live on the targets.
  string error = 15;

  // Format: users/{user}.
  string created_by = 16 [(google.api.resource_reference) = {type: "metaxisdata/User"}];

  // True when this response returns a job that was already PENDING or RUNNING for
  // the same intent, targets and columns. Re-submitting an identical request is
  // idempotent: no second job or analysis is started.
  bool deduplicated = 17 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message CreateQualitySuggestionJobRequest {
  // Format: workspaces/{workspace}. "workspaces/-" is the current workspace.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];

  // The natural-language intent, e.g. "email must not be empty". At most 2000
  // characters.
  string intent = 2 [(google.api.field_behavior) = REQUIRED];

  // The language the intent and drafts are written in, e.g. "en" or "zh-CN".
  string language = 3;

  // The tables or views to draft for, at most 20. Set meta_guid, meta_type and
  // optionally columns; the path and columns are snapshotted for progress. The
  // job visits them in order.
  repeated QualityTarget targets = 4 [(google.api.field_behavior) = REQUIRED];

  // Re-propose drafts that were already accepted or rejected, and re-analyze
  // columns that already have a fact. The queue is still deduplicated by identity:
  // regeneration refreshes a pending proposal instead of appending a duplicate.
  bool force_regenerate = 5;
}

message GetQualitySuggestionJobRequest {
  // Format: workspaces/{workspace}/qualitySuggestionJobs/{quality_suggestion_job}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "metaxisdata/QualitySuggestionJob"}
  ];
}

message ListQualitySuggestionJobsRequest {
  // Format: workspaces/{workspace}. "workspaces/-" is the current workspace.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];

  // The maximum number of jobs to return. If unspecified, at most 20 are
  // returned. The maximum value is 1000; values above 1000 are coerced to 1000.
  int32 page_size = 2;

  // A page token, received from a previous ListQualitySuggestionJobs call.
  string page_token = 3;

  QualitySuggestionJobStatus status = 4;
}

message ListQualitySuggestionJobsResponse {
  repeated QualitySuggestionJob quality_suggestion_jobs = 1;
  string next_page_token = 2;
}

message CancelQualitySuggestionJobRequest {
  // Format: workspaces/{workspace}/qualitySuggestionJobs/{quality_suggestion_job}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "metaxisdata/QualitySuggestionJob"}
  ];
}

message GetQualitySuggestionJobTargetDebugRequest {
  // Format: workspaces/{workspace}/qualitySuggestionJobs/{quality_suggestion_job}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "metaxisdata/QualitySuggestionJob"}
  ];

  // The zero-based index of the target in the job's target list.
  int32 target_index = 2;
}

message GetQualitySuggestionJobTargetDebugResponse {
  // False when runtime debug was off, the write failed, or the seven-day debug
  // log retention already pruned the row.
  bool available = 1;
  string correlation_id = 2;
  string request_body = 3;
  string response_body = 4;
  // The classifier code of the failure, so the client can show its hint even
  // when the raw bodies are gone.
  string error_code = 5;
}

message ListColumnProfilesRequest {
  // Format: workspaces/{workspace}. "workspaces/-" is the current workspace.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];

  // The maximum number of profiles to return. If unspecified, at most 50 are
  // returned. The maximum value is 1000; values above 1000 are coerced to 1000.
  int32 page_size = 2;

  // A page token, received from a previous ListColumnProfiles call. Provide this
  // to retrieve the subsequent page.
  string page_token = 3;

  // The globally unique metadata GUID of the table.
  string table_guid = 4;
  MetaType meta_type = 5;
  // The columns to read; empty means every profiled column.
  repeated string columns = 6;
}

message ListColumnProfilesResponse {
  repeated ColumnProfile column_profiles = 1;
  string next_page_token = 2;
}

message ListColumnLabelsRequest {
  // Format: workspaces/{workspace}. "workspaces/-" is the current workspace.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];

  // The maximum number of labels to return. If unspecified, at most 50 are
  // returned. The maximum value is 1000; values above 1000 are coerced to 1000.
  int32 page_size = 2;

  // A page token, received from a previous ListColumnLabels call. Provide this to
  // retrieve the subsequent page.
  string page_token = 3;

  // The globally unique metadata GUID of the table.
  string table_guid = 4;
  MetaType meta_type = 5;
  // The columns to read; empty means every labeled column.
  repeated string columns = 6;
}

message ListColumnLabelsResponse {
  repeated ColumnSemanticLabel column_labels = 1;
  string next_page_token = 2;
}

message UpdateColumnLabelRequest {
  // Format: workspaces/{workspace}. "workspaces/-" is the current workspace.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];

  // The globally unique metadata GUID of the table.
  string table_guid = 2;
  MetaType meta_type = 3;
  string column = 4;

  // The label to accept. Required by ACCEPT and ignored by CLEAR.
  QualitySemanticType label = 5;

  ColumnLabelAction action = 6;
}

message UpdateColumnLabelResponse {
  // The stored label, unset after CLEAR.
  ColumnSemanticLabel column_label = 1;
}

message ProfileColumnsRequest {
  // Format: workspaces/{workspace}. "workspaces/-" is the current workspace.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];

  // The globally unique metadata GUID of the table.
  string table_guid = 2;
  MetaType meta_type = 3;
  // The columns to profile; empty means every column of the table. At most 50.
  repeated string columns = 4;
}

message ProfileColumnsResponse {
  repeated ColumnProfile column_profiles = 1;
}

message SuggestQualityRuleRequest {
  // Format: workspaces/{workspace}. "workspaces/-" is the current workspace.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];

  // The globally unique metadata GUID of the table.
  string table_guid = 2;
  MetaType meta_type = 3;
  // The columns the intent is about; empty means the rule may use any column.
  repeated string columns = 4;

  // The natural-language intent, e.g. "email must not be empty".
  string intent = 5;

  // The language the intent and the draft are written in, e.g. "en" or "zh-CN".
  string language = 6;

  // Re-propose drafts that were already accepted or rejected, and re-analyze
  // columns that already have a fact. The queue is still deduplicated by identity:
  // regeneration refreshes an existing pending proposal instead of appending a
  // duplicate.
  bool force_regenerate = 7;
}

message SuggestQualityRuleResponse {
  // The drafts this pass queued, created or refreshed. Empty when every draft was
  // already covered by a fact, was already decided, or failed validation.
  repeated QualitySuggestion quality_suggestions = 1;

  // What the pass did to the queue.
  QualitySuggestionQueueSummary summary = 2;
}

message SuggestColumnLabelsRequest {
  // Format: workspaces/{workspace}. "workspaces/-" is the current workspace.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];

  // The globally unique metadata GUID of the table.
  string table_guid = 2;
  MetaType meta_type = 3;
  // The columns to label; empty means every column of the table. At most 50.
  repeated string columns = 4;

  // The language the evidence and rationale are written in, e.g. "en" or
  // "zh-CN".
  string language = 5;

  // Re-analyze columns that are already labeled, already have a pending proposal,
  // or were already decided. Regeneration still never duplicates: it refreshes the
  // one pending proposal per column.
  bool force_regenerate = 6;
}

message SuggestColumnLabelsResponse {
  // The label and rule-draft proposals this pass queued, created or refreshed.
  repeated QualitySuggestion quality_suggestions = 1;

  // What the pass did to the queue, including the columns it left out.
  QualitySuggestionQueueSummary summary = 2;
}

message RecommendQualityChecksRequest {
  // Format: workspaces/{workspace}. "workspaces/-" is the current workspace.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];

  // The globally unique metadata GUID of the table.
  string table_guid = 2;
  MetaType meta_type = 3;
  // The columns to consider for column-level checks; empty means every column of
  // the table. At most 50. Table-level checks (row count, freshness) describe the
  // relation as a whole, so they are considered regardless of this list.
  repeated string columns = 4;

  // The language the draft titles and rationales are written in, e.g. "en" or
  // "zh-CN".
  string language = 5;

  // Regenerate proposals that already have a pending proposal, or were already
  // decided. Regeneration still never duplicates: it refreshes the one pending
  // proposal per identity.
  bool force_regenerate = 6;
}

message RecommendQualityChecksResponse {
  // The rule drafts this pass queued, created or refreshed.
  repeated QualitySuggestion quality_suggestions = 1;

  // What the pass did to the queue, including the columns no check was derived
  // for.
  QualitySuggestionQueueSummary summary = 2;
}

message ExplainQualityExecutionRequest {
  // Format: workspaces/{workspace}/qualityExecutions/{quality_execution}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "metaxisdata/QualityExecution"}
  ];

  // The language the explanation is written in, e.g. "en" or "zh-CN".
  string language = 2;

  // Regenerate even when a cached explanation exists.
  bool force_regenerate = 3;
}

message ExplainQualityExecutionResponse {
  // The stream reuses ExplainSQL's event messages: content is a markdown
  // fragment, progress reports one agent step, and metadata is the final frame.
  oneof payload {
    string content = 1;
    ExplainSQLProgress progress = 2;
    ExplainSQLMetadata metadata = 3;
  }
}

message GetQualityOverviewRequest {
  // Format: workspaces/{workspace}. "workspaces/-" is the current workspace.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];

  // How many days the trend covers, 1-30. Zero means seven.
  int32 trend_days = 2;
}

message GetQualityLLMUsageRequest {
  // Format: workspaces/{workspace}. "workspaces/-" is the current workspace.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];
}

// QualityLLMUsage is one process's view of the data quality LLM budget: today's
// counters, the effective limits from the workspace settings, and the in-flight
// analyses. A restart resets the counters.
message QualityLLMUsage {
  int32 daily_analysis_used = 1;
  int32 daily_analysis_limit = 2;
  int32 daily_column_analysis_used = 3;
  int32 daily_column_analysis_limit = 4;
  int32 in_flight = 5;
  int32 concurrency_limit = 6;
  // When the daily counters roll over (the next 00:00 UTC).
  google.protobuf.Timestamp resets_at = 7;
}

// QualityOverview is the workspace-level summary the overview page renders. It
// aggregates the tables instead of listing rows, so the page costs a handful of
// queries rather than paging through every result.
message QualityOverview {
  // Rules by lifecycle state.
  int32 rule_count = 1;
  int32 enabled_rule_count = 2;
  int32 paused_rule_count = 3;

  // Coverage. The denominator is every registry object this workspace can
  // monitor — a table, external table, view or materialized view under a live
  // instance. The numerator is the distinct target at least one enabled rule
  // watches and whose target still resolves; a covered column only counts when
  // it still exists in the target's current registry column list. The formula is
  // documented in docs/data-quality.md.
  int32 monitored_table_count = 4;
  int32 total_table_count = 13;
  int32 covered_column_count = 14;
  int32 total_column_count = 15;

  // Monitored targets with at least one judged result (PASS, WARN or FAIL)
  // among their latest execution per enabled rule. A target whose checks never
  // ran is monitored but not judged: no checks is never a 100% score.
  int32 judged_table_count = 16;

  // The workspace quality score, 0-100. Unset when no enabled rule has a judged
  // result; see docs/data-quality.md for the formula.
  optional double quality_score = 17;
  // Enabled rules whose latest result is judged / not judged. They partition the
  // enabled rules the score covers; a rule whose target no longer resolves is in
  // neither.
  int32 scored_rule_count = 18;
  int32 unscored_rule_count = 19;

  // Coverage and score by instance, environment, dimension and owner. Rows with
  // no objects are absent; unassigned environment/owner is a row with an empty
  // key.
  repeated QualityCoverageBreakdown coverage_by_instance = 20;
  repeated QualityCoverageBreakdown coverage_by_environment = 21;
  repeated QualityDimensionScore score_by_dimension = 22;
  repeated QualityOwnerScore score_by_owner = 23;

  // Issues currently open (status OPEN or ACKNOWLEDGED) by severity.
  int32 open_warning_count = 5;
  int32 open_error_count = 6;
  int32 open_critical_count = 7;

  // The last 24 hours: how many rules failed at least once, how many executions
  // were planned (any lifecycle state), and how the completed ones tallied.
  int32 failing_rule_count = 8;
  int32 execution_count = 9;
  QualityStatusCounts last_day_counts = 10;

  // The per-day tallies of the trend window, oldest first.
  repeated QualityTrendPoint trend = 11;
  // How many days the trend covers.
  int32 trend_days = 12;

  // Enabled rules whose latest completed execution is ERROR: the check could not
  // run, so its data was not judged. These are not failing rules and are not
  // scored; the UI shows them as their own "cannot run" count so a broken check
  // is visible without being mistaken for bad data.
  int32 cannot_run_rule_count = 24;
}

// QualityCoverageBreakdown is one instance's or one environment's share of the
// workspace coverage. The key/title pair names the row; the counts use the same
// denominator as QualityOverview.
message QualityCoverageBreakdown {
  // The instance resource id, or the environment id. Empty when the environment
  // is unassigned.
  string key = 1;
  // The instance or environment title. Empty when the environment is unassigned
  // or the id no longer resolves.
  string title = 2;
  int32 total_table_count = 3;
  int32 monitored_table_count = 4;
  int32 total_column_count = 5;
  int32 covered_column_count = 6;
}

// QualityDimensionScore is the quality score rolled up by quality dimension.
message QualityDimensionScore {
  QualityDimension dimension = 1;
  // Enabled rules of this dimension that still resolve to a registry row.
  int32 rule_count = 2;
  // Of those, rules whose latest result is judged / FAIL.
  int32 scored_rule_count = 3;
  int32 failing_rule_count = 4;
  // 0-100; unset when no rule of this dimension has a judged result.
  optional double quality_score = 5;
}

// QualityOwnerScore is the quality score rolled up by rule owner.
message QualityOwnerScore {
  // Format: users/{user}. Empty for rules with no owner.
  string owner = 1;
  // Enabled rules of this owner that still resolve to a registry row.
  int32 rule_count = 2;
  int32 scored_rule_count = 3;
  int32 failing_rule_count = 4;
  // 0-100; unset when none of the owner's rules has a judged result.
  optional double quality_score = 5;
}

// QualityTrendPoint is one day of result tallies.
message QualityTrendPoint {
  // The day, as YYYY-MM-DD in UTC.
  string date = 1;
  int32 pass = 2;
  int32 warn = 3;
  int32 fail = 4;
  int32 error = 5;
  int32 skipped = 6;
  int32 not_evaluated = 7;
  int32 total = 8;
}

// QualityTargetOrder is how the target directory is ordered.
enum QualityTargetOrder {
  QUALITY_TARGET_ORDER_UNSPECIFIED = 0;
  // Worst latest result first, then open issues, then pending drafts.
  QUALITY_TARGET_ORDER_ATTENTION = 1;
  // The target's object name, ascending.
  QUALITY_TARGET_ORDER_NAME = 2;
  // Most rules first.
  QUALITY_TARGET_ORDER_RULE_COUNT = 3;
  // Most recent run first; targets that never ran come last.
  QUALITY_TARGET_ORDER_LAST_RUN = 4;
}

// QualityTargetKey names one target by the only pair that identifies it: the
// metadata GUID and the object type. It is an address, not a snapshot — the
// metadata browser sends the objects it is showing so one call returns their
// trust signals.
message QualityTargetKey {
  // The target's metadata GUID. Required.
  string target_guid = 1 [(google.api.field_behavior) = REQUIRED];

  // The target's object type. Required, because a GUID alone does not identify a
  // registry row across object types.
  MetaType meta_type = 2 [(google.api.field_behavior) = REQUIRED];
}

message ListQualityTargetsRequest {
  // Format: workspaces/{workspace}. "workspaces/-" is the current workspace.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];

  // The maximum number of targets to return. If unspecified, at most 50 are
  // returned. The maximum value is 1000; values above 1000 are coerced to 1000.
  int32 page_size = 2;

  // A page token, received from a previous ListQualityTargets call.
  string page_token = 3;

  // The following four filters are GUID path prefixes, the same shape as
  // ListQualityRules: a target matches when its GUID starts with the prefix.
  string instance = 4;
  string database = 5;
  string schema = 6;
  string table = 7;

  // A case-insensitive substring over the target's path and GUID.
  string search = 8;

  // Only targets whose worst latest result is this status. UNSPECIFIED keeps
  // every target, including those whose rules have not run yet.
  QualityStatus worst_status = 9;

  // Only targets with at least one unresolved issue.
  bool has_open_issue = 10;

  // Only targets with at least one pending AI draft.
  bool has_pending_draft = 11;

  QualityTargetOrder order_by = 12;

  // The exact targets to return, in addition to the filters above. It is how the
  // metadata browser reads the trust signals of the objects it lists in one call.
  // At most 200 keys are accepted. A selection is not paged: page_size, page_token
  // and order_by are ignored, the response keeps the request order, and a key with
  // no non-archived check is absent — that target is not monitored. A target whose
  // checks are all paused is still returned, with enabled_rule_count = 0.
  repeated QualityTargetKey targets = 13;
}

message ListQualityTargetsResponse {
  repeated QualityTargetSummary quality_targets = 1;
  string next_page_token = 2;
}

// QualityTargetSchedule is a target's one schedule: the cadence every enabled
// check of the target runs at, and when the target next comes due. Scheduling is
// per target, so all of its checks are planned and executed together. A target
// runs either on a fixed interval or on a cron expression, never both.
message QualityTargetSchedule {
  // How often the target's enabled checks run, between 15 minutes and 7 days. A
  // cron target keeps the expression's nominal gap here as the cadence it falls
  // back to when the expression is cleared, so the editor can seed interval mode
  // from it; cron decides the actual occurrence.
  google.protobuf.Duration schedule_interval = 1;

  // When the scheduler next considers the target due. Unset while the target has
  // no enabled check.
  google.protobuf.Timestamp next_run_time = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // A standard five-field cron expression evaluated in timezone, for example
  // "0 2 * * *" for every day at 02:00. Empty when the target runs on
  // schedule_interval instead.
  string cron = 3;

  // The IANA time zone the cron expression is evaluated in, for example
  // "Asia/Shanghai". Empty for an interval schedule. When a request leaves it
  // empty, the server resolves it to the workspace's check time zone at save
  // time and stores the resolved zone.
  string timezone = 4;
}

// QualityTargetSummary is one row of the target directory: the target identity
// plus the counts and health the row and the workspace header render.
message QualityTargetSummary {
  // The target, named by GUID and object type. Its path is the snapshot stored
  // with the rules; the column list is empty here.
  QualityTarget target = 1;

  // Live rules only; archived rules are excluded.
  int32 rule_count = 2;
  int32 enabled_rule_count = 3;
  int32 paused_rule_count = 4;

  // Distinct columns the target's rules read.
  int32 column_count = 5;

  int32 open_issue_count = 6;
  int32 pending_draft_count = 7;
  int32 pending_label_count = 8;

  // The worst latest result across the target's rules; UNSPECIFIED when no rule
  // has run yet. ERROR outranks FAIL: a check that could not run needs attention
  // more than one whose data failed.
  QualityStatus worst_status = 9;
  google.protobuf.Timestamp last_run_time = 10;

  // Whether at least one rule was saved against a different target structure
  // fingerprint than the registry currently records.
  bool schema_changed = 11;

  // Whether the target can no longer be resolved (the registry row, instance or
  // database is gone). The rows stay readable because their target path is a
  // snapshot, but runs are skipped.
  bool orphaned = 12;

  // The target's most recent run. A run belongs to one target, so it is the
  // per-target batch summary the directory and the workspace show; unset when the
  // target has never run.
  QualityRun latest_run = 13;

  // How many dispatch batches belong to this target.
  int32 run_count = 14;

  // The target's schedule and next run. A target with rules always has a
  // schedule; a target whose checks are all paused has an interval but no next
  // run.
  QualityTargetSchedule schedule = 15;

  // The target's quality score, 0-100, over its enabled rules' latest judged
  // results. Unset when no enabled rule has been judged. The formula is the
  // workspace's; see docs/data-quality.md.
  optional double quality_score = 16;
  int32 scored_rule_count = 17;

  // The pass share of the target's most recent completed executions (at most
  // 20): PASS / (PASS + WARN + FAIL). ERROR, SKIPPED and NOT_EVALUATED are
  // excluded because they are not verdicts. Unset when none of them is judged;
  // recent_execution_count is how many were.
  optional double recent_pass_rate = 18;
  int32 recent_execution_count = 19;

  // Column coverage: how many of the target's current registry columns at least
  // one ENABLED check reads, and the target's current registry column count. A
  // check that names no column, a paused check and a column that no longer exists
  // in the registry cover nothing, so covered_column_count never exceeds
  // total_column_count; both come from one registry read, which is what keeps that
  // true while schema sync is rewriting the column list. A target whose registry
  // row no longer resolves reports 0/0. The formula is the workspace coverage's;
  // see docs/data-quality.md.
  int32 covered_column_count = 20;
  int32 total_column_count = 21;
}

// QualityImpactAsset is one asset downstream of a target, with its monitoring
// state.
message QualityImpactAsset {
  // The asset. Its path is built from the GUID, so it names where the object
  // lives now rather than a value a rule once saved.
  QualityTarget target = 1;

  // How many lineage hops downstream of the target it sits: 1 is a direct
  // dependent, 2 a dependent of a dependent.
  int32 distance = 2;

  // The asset's quality state, read through the same exact-target selection the
  // metadata browser uses. Unset when the asset has no non-archived check, which
  // is "unmonitored", not "healthy"; a target whose checks are all paused is
  // present with enabled_rule_count = 0.
  QualityTargetSummary summary = 3;
}

// QualityRootCauseCandidate is one upstream target that may explain a failure.
message QualityRootCauseCandidate {
  // The upstream target.
  QualityTarget target = 1;

  // How many lineage hops upstream: -1 is a direct source, -2 a source of a
  // source.
  int32 distance = 2;

  // The target's checks that completed with a FAIL verdict inside the window.
  int32 failing_rule_count = 3;
  int32 failing_execution_count = 4;

  // The newest failing executions inside the window, newest first, at most
  // three. Format: workspaces/{workspace}/qualityExecutions/{quality_execution}
  repeated string recent_failing_executions = 5 [(google.api.resource_reference) = {type: "metaxisdata/QualityExecution"}];

  // When the newest of those failures started. Unset when no check of the
  // target failed in the window.
  google.protobuf.Timestamp latest_failure_time = 6;

  // When the target's structure fingerprint last changed, inside the window.
  // Unset when its shape did not change in the window; an object created inside
  // the window is a new object rather than a structure change, and is not
  // reported here.
  google.protobuf.Timestamp structure_changed_time = 7;
}

message GetQualityTargetImpactRequest {
  // Format: workspaces/{workspace}. "workspaces/-" is the current workspace.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];

  // The target whose impact to read. The target does not have to be monitored
  // or to still resolve: lineage recorded before it disappeared is still walked.
  QualityTargetKey target = 2 [(google.api.field_behavior) = REQUIRED];

  // How many lineage levels downstream to walk, 0-3. Zero means two; a larger
  // value is coerced to three. The upstream walk behind the root causes is always
  // two levels.
  int32 depth = 3;

  // The instant the root-cause window ends: the start of the failure being
  // explained. Zero means now; a value in the future is read as now.
  google.protobuf.Timestamp as_of = 4;

  // How far back root-cause evidence is looked for, in hours 0-168. Zero means
  // 24; a larger value is coerced to 168.
  int32 window_hours = 5;
}

message GetQualityTargetImpactResponse {
  // The assets the target's data reaches downstream, nearest first. Only the
  // object types a check can watch are listed; a reported statement, an external
  // dataset or an object that no longer exists is walked through but counted in
  // omitted_downstream_count instead.
  repeated QualityImpactAsset downstream_assets = 1;

  // Upstream targets with root-cause evidence inside the window, strongest
  // first: a target with failing checks outranks one whose structure changed,
  // then the nearer one wins, then the more recent evidence.
  repeated QualityRootCauseCandidate root_causes = 2;

  // The largest distance a downstream asset was found at; 0 when nothing is
  // recorded downstream.
  int32 depth_reached = 3;

  // Whether the node or time budget cut the downstream walk short.
  bool downstream_truncated = 4;

  // How many walked downstream objects are not listed as assets. A floor when
  // downstream_truncated is true.
  int32 omitted_downstream_count = 5;

  // Whether the two-level upstream walk was cut short by its node budget.
  bool upstream_truncated = 6;

  // How many root-cause candidates were found beyond the twenty returned.
  int32 omitted_root_cause_count = 7;

  // The window the root causes were read from: [window_start, window_end].
  google.protobuf.Timestamp window_start = 8;
  google.protobuf.Timestamp window_end = 9;
}

// QualityConsumptionGap is an asset another asset's lineage reads with no
// enabled check watching it.
message QualityConsumptionGap {
  // The unwatched asset.
  QualityTarget target = 1;

  // How many distinct assets its lineage reaches directly. It ranks how much
  // depends on the asset, not how important the asset is.
  int32 downstream_asset_count = 2;
}

message GetQualityConsumptionCoverageRequest {
  // Format: workspaces/{workspace}. "workspaces/-" is the current workspace.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];

  // How many gaps to return, 0-100. Zero means 20; a larger value is coerced to
  // 100. The counts always cover the whole workspace.
  int32 page_size = 2;
}

message GetQualityConsumptionCoverageResponse {
  // Registry assets that at least one other object's lineage reads, under a live
  // instance and of the four object types a check can watch. This denominator is
  // not the overview's: there, every monitorable object counts.
  int32 consumed_asset_count = 1;

  // Of those, assets with at least one enabled check.
  int32 monitored_asset_count = 2;

  // How many consumed assets have no enabled check.
  int32 gap_count = 3;

  // The gaps with the most direct readers, highest first, at most page_size.
  repeated QualityConsumptionGap gaps = 4;
}

message UpdateQualityTargetScheduleRequest {
  // Format: workspaces/{workspace}. "workspaces/-" is the current workspace.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];

  // The target's metadata GUID. Required.
  string target_guid = 2 [(google.api.field_behavior) = REQUIRED];

  // The target's object type. Optional when rules already exist, because their
  // own target carries it.
  MetaType meta_type = 3;

  // How often the target's enabled checks run. Exactly one of schedule_interval
  // and cron is set: a fixed interval between 15 minutes and 7 days, or a cron
  // expression.
  google.protobuf.Duration schedule_interval = 4;

  // A standard five-field cron expression ("minute hour day-of-month month
  // day-of-week") evaluated in timezone, for example "0 2 * * *" for every day at
  // 02:00. The gap between two of its occurrences must be at least 15 minutes;
  // there is no upper bound.
  string cron = 5;

  // The IANA time zone the cron expression is evaluated in, for example
  // "Asia/Shanghai". Empty resolves to the workspace's check time zone, and the
  // resolved zone is what the target stores and what reads return.
  string timezone = 6;
}

message GetQualityTargetScheduleRequest {
  // Format: workspaces/{workspace}. "workspaces/-" is the current workspace.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];

  // The target's metadata GUID. Required.
  string target_guid = 2 [(google.api.field_behavior) = REQUIRED];

  // The target's object type. Optional when rules already exist, because their
  // own target carries it; required to resolve a target that has no rules yet.
  MetaType meta_type = 3;
}

message GetQualityTargetRequest {
  // Format: workspaces/{workspace}. "workspaces/-" is the current workspace.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];

  // The target's metadata GUID. Required.
  string target_guid = 2 [(google.api.field_behavior) = REQUIRED];

  // The target's object type. Optional when rules already exist, because their
  // own target carries it; required to resolve a target that has no rules yet.
  MetaType meta_type = 3;
}

message GetQualityTargetResponse {
  // The target's health summary, the same shape the directory lists.
  QualityTargetSummary summary = 1;

  // Every live rule on the target, with its latest result.
  repeated QualityRule quality_rules = 2;

  // Unresolved issues (OPEN or ACKNOWLEDGED) opened by the target's rules.
  //
  // AI drafts are deliberately absent: reading them needs the suggest
  // permission, which this RPC does not require, so the client reads the queue
  // separately when it holds it.
  repeated QualityIssue open_issues = 3;

  // Why the target no longer resolves; empty while healthy. The rules stay
  // readable when it is set, because their target path is a snapshot.
  string orphaned_reason = 4;

  // Each rule's recent completed executions, newest first, so the workspace can
  // draw a per-rule history strip without one request per rule. Rules with no
  // completed execution are absent.
  repeated QualityRuleHistory rule_history = 5;

  // The target's current columns, from the resolved metadata. The workspace uses
  // them for the coverage card and the check dialog's column fields; unlike
  // ListMetadata(COLUMN) this also covers views and external tables.
  repeated QualityTargetColumn target_columns = 6;
}

// QualityTargetColumn is one column of a resolved target.
message QualityTargetColumn {
  string name = 1;
  string type = 2;
  bool nullable = 3;
}

// QualityRuleHistory is one rule's recent completed executions.
message QualityRuleHistory {
  // Format: workspaces/{workspace}/qualityRules/{quality_rule}
  string rule = 1 [(google.api.resource_reference) = {type: "metaxisdata/QualityRule"}];
  // Newest first. At most 20 are returned.
  repeated QualityExecutionSummary executions = 2;
}

message AcknowledgeQualityTargetSchemaRequest {
  // Format: workspaces/{workspace}. "workspaces/-" is the current workspace.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];

  // The target's metadata GUID. Required.
  string target_guid = 2 [(google.api.field_behavior) = REQUIRED];

  // The target's object type. Optional when the target has rules: they carry it.
  MetaType meta_type = 3;
}

message AcknowledgeQualityTargetSchemaResponse {
  // How many checks were re-baselined. Zero means they were already current.
  int32 baselined_rule_count = 1;
}

// QualityContract is the target-level layer above the rules: defaults, the
// published version and whether the live rules have drifted from it. It is a
// projection, not a second source of truth: editing a rule changes the live
// contract immediately, and publishing records that state as a version.
message QualityContract {
  QualityTarget target = 1;
  QualityContractSettings settings = 2;

  // The newest published version; 0 means the target has never been published.
  int32 published_version = 3;
  google.protobuf.Timestamp published_at = 4;
  // Format: users/{user}. Empty when the publisher is unknown.
  string published_by = 5;
  string publish_note = 6;

  // How many live (non-archived) rules the target has.
  int32 check_count = 7;

  // The live rules compared with the published snapshot. Zero counts when the
  // target has never been published.
  QualityContractChangeSummary change_summary = 8;

  // True when the live rules or settings differ from the published snapshot (or
  // nothing has been published yet and the target has content).
  bool has_unpublished_changes = 9;

  // The target's monitoring plan as derived from the live rules and the
  // contract.
  QualityPlan plan = 10;

  // The plan declaration the target currently holds, published or not. Absent when
  // the target has none; an empty declaration clears it and returns the target to
  // the projection derived from the intent and the live rules.
  QualityPlan staged_plan = 11;

  // The newest published version the declaration is aligned to. It always equals
  // published_version after a publish, so a client echoes it back as the base of its
  // next declaration edit.
  int32 staged_base_version = 12;

  // How the working state (the draft when one exists, otherwise the live
  // projection) differs from the newest published version.
  QualityContractDiff diff = 13;
}

// QualityPlanChange is one declaration added, removed or modified by the working
// plan (the staged declaration, or the projection derived from the intent and the
// live rules when nothing is staged).
message QualityPlanChange {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_ADDED = 1;
    KIND_REMOVED = 2;
    KIND_MODIFIED = 3;
  }
  Kind kind = 1;
  QualityPlanCoverage coverage = 2;
}

// QualityContractDiff compares the working state with the newest published version.
// The check diff is QualityContract.change_summary; this message carries the two
// sections the version's plan payload made comparable.
message QualityContractDiff {
  // True when the live intent differs from the published version's.
  bool intent_changed = 1;
  // The declaration changes the working plan would publish.
  repeated QualityPlanChange plan_changes = 2;
  // True when the newest published version predates the plan payload, so a plan
  // diff cannot be shown. It is not the same as "no plan changes".
  bool plan_not_recorded = 3;
}

// QualityContractSettings is the target-level layer's mutable configuration.
message QualityContractSettings {
  // Applied to every rule on the target, ANDed with the rule's own filter.
  QualityFilter filter = 1;
  // The severity a newly authored rule starts with; UNSPECIFIED means no default.
  QualitySeverity default_severity = 3;
  // What the target promises above its checks.
  QualityContractIntent intent = 4;

  // The per-rule default schedule was replaced by the target's schedule; see
  // UpdateQualityTargetSchedule.
  reserved 2;
  reserved "default_schedule_interval_seconds";
}

// QualityContractIntentSource records who wrote the intent.
enum QualityContractIntentSource {
  QUALITY_CONTRACT_INTENT_SOURCE_UNSPECIFIED = 0;
  QUALITY_CONTRACT_INTENT_SOURCE_HUMAN = 1;
  QUALITY_CONTRACT_INTENT_SOURCE_AGENT_DRAFT = 2;
  QUALITY_CONTRACT_INTENT_SOURCE_IMPORTED = 3;
}

// QualityContractIntentStatement is one property the target promises for a scope.
message QualityContractIntentStatement {
  QualityCoverageProperty property = 1;
  // The column the promise is scoped to; empty means the whole table.
  string column = 2;
  // A free-text tolerance kept for reviewers. It is not evaluated yet.
  string tolerance = 3;
}

// QualityContractIntentExemption waives one declared requirement: the requirement
// stays visible, produces no gap, and never counts as satisfied.
message QualityContractIntentExemption {
  QualityCoverageProperty property = 1;
  string column = 2;
  string reason = 3;
  // Format: users/{user}. Empty when the editor is unknown.
  string approved_by = 4;
  // 0 means the exemption never expires.
  google.protobuf.Timestamp expires_at = 5;
}

// QualityContractIntent is the target's declaration above the checks: its
// criticality, the properties it commits to, its dependents and the requirements
// it explicitly waived. Editing it is part of UpdateQualityContract, and it is
// versioned with the contract on every publish.
message QualityContractIntent {
  QualityAssetCriticality criticality = 1;
  repeated QualityContractIntentStatement statements = 2;
  // Downstream assets or external tags that depend on this one. Recorded only;
  // they feed impact and criticality derivation later.
  repeated string dependents = 3;
  repeated QualityContractIntentExemption exemptions = 4;
  // When the declaration is meant to take effect; unset means unset. Recorded
  // only: plan derivation does not evaluate it yet.
  google.protobuf.Timestamp effective_from = 5;
  QualityContractIntentSource source = 6;
  // Reserved for domain-level intent; stored, not resolved in this phase.
  string domain_ref = 7;
}

// QualityContractChangeSummary counts how the live rules differ from the
// published snapshot.
message QualityContractChangeSummary {
  int32 added = 1;
  int32 modified = 2;
  int32 removed = 3;
}

// QualityPlanState says whether a target has a plan at all. A target with rules
// but no contract row is UNPLANNED: its checks are real, but nothing records
// what it promised.
enum QualityPlanState {
  QUALITY_PLAN_STATE_UNSPECIFIED = 0;
  QUALITY_PLAN_STATE_PLANNED = 1;
  QUALITY_PLAN_STATE_UNPLANNED = 2;
}

// QualityAssetCriticality ranks a target for the autonomy policy. Derived
// criticality is a display/policy input, never written back to the contract.
enum QualityAssetCriticality {
  QUALITY_ASSET_CRITICALITY_UNSPECIFIED = 0;
  QUALITY_ASSET_CRITICALITY_EXPERIMENTAL = 1;
  QUALITY_ASSET_CRITICALITY_IMPORTANT = 2;
  QUALITY_ASSET_CRITICALITY_CRITICAL = 3;
}

// QualityCoverageProperty is one kind of monitoring an intent promise or a plan
// declaration can require.
enum QualityCoverageProperty {
  QUALITY_COVERAGE_PROPERTY_UNSPECIFIED = 0;
  QUALITY_COVERAGE_PROPERTY_VOLUME = 1;
  QUALITY_COVERAGE_PROPERTY_FRESHNESS = 2;
  QUALITY_COVERAGE_PROPERTY_UNIQUENESS = 3;
  QUALITY_COVERAGE_PROPERTY_SCHEMA_STABILITY = 4;
  QUALITY_COVERAGE_PROPERTY_NULL_RATE = 5;
  QUALITY_COVERAGE_PROPERTY_ACCEPTED_VALUES = 6;
  QUALITY_COVERAGE_PROPERTY_FORMAT = 7;
  QUALITY_COVERAGE_PROPERTY_RANGE = 8;
}

// QualityCoverageSource says where a requirement came from: the criticality
// template or an explicit intent statement.
enum QualityCoverageSource {
  QUALITY_COVERAGE_SOURCE_UNSPECIFIED = 0;
  QUALITY_COVERAGE_SOURCE_TEMPLATE = 1;
  QUALITY_COVERAGE_SOURCE_INTENT = 2;
}

// QualityCoverageRequirement is one required property and whether a live rule
// currently satisfies it. Gap = required, not satisfied and not exempted.
message QualityCoverageRequirement {
  QualityCoverageProperty property = 1;
  bool satisfied = 2;
  // The scope column; empty means the whole table.
  string column = 3;
  QualityCoverageSource source = 4;
  // A declared exemption waives the gap without counting the requirement as
  // satisfied.
  bool exempted = 5;
}

// QualityPlanCoverage is one required property at one scope, as a published plan
// records it.
message QualityPlanCoverage {
  QualityCoverageProperty property = 1;
  // The scope column; empty means the whole table.
  string column = 2;
  // How many checks the declaration needs; 0 reads as one.
  int32 min_checks = 3;
  QualityCoverageSource source = 4;
}

// QualityPlanCadence is the target schedule a plan version recorded. It is a
// projection of the target's schedule; editing the schedule is still the only
// way to change it.
message QualityPlanCadence {
  // Seconds between runs; 0 only when the target has no schedule. A cron target
  // records the expression's nominal gap here and its expression in cron.
  int64 interval_seconds = 1;
  string cron = 2;
  string timezone = 3;
}

// QualityPlan is the read-only projection of a target's monitoring plan: its
// state, derived criticality, the checks that implement it and the declared
// coverage it currently satisfies.
message QualityPlan {
  QualityTarget target = 1;
  QualityPlanState state = 2;
  QualityAssetCriticality criticality = 3;
  int32 check_count = 4;
  repeated QualityCoverageRequirement requirements = 5;
  int32 gap_count = 6;
  // The declarations the plan is built from (template plus intent statements), as
  // a published version records them.
  repeated QualityPlanCoverage coverage = 7;
  // The cadence a published version recorded. Absent in the live projection,
  // which reads the target's current schedule instead.
  QualityPlanCadence cadence = 8;
}

message ListQualityPlansRequest {
  // Format: workspaces/{workspace}. "workspaces/-" is the current workspace.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];
  int32 page_size = 2;
  string page_token = 3;
  string instance = 4;
  string database = 5;
  string schema = 6;
  string table = 7;
  string search = 8;
}

message ListQualityPlansResponse {
  repeated QualityPlan plans = 1;
  string next_page_token = 2;
  int32 total_size = 3;
}

// QualityChangeRequestState is the lifecycle of one change request.
enum QualityChangeRequestState {
  QUALITY_CHANGE_REQUEST_STATE_UNSPECIFIED = 0;
  QUALITY_CHANGE_REQUEST_STATE_PROPOSED = 1;
  QUALITY_CHANGE_REQUEST_STATE_APPROVED = 2;
  QUALITY_CHANGE_REQUEST_STATE_APPLIED = 3;
  QUALITY_CHANGE_REQUEST_STATE_REJECTED = 4;
  QUALITY_CHANGE_REQUEST_STATE_EXPIRED = 5;
}

// QualityChangeRequestSource records who wrote the request.
enum QualityChangeRequestSource {
  QUALITY_CHANGE_REQUEST_SOURCE_UNSPECIFIED = 0;
  QUALITY_CHANGE_REQUEST_SOURCE_HUMAN = 1;
  QUALITY_CHANGE_REQUEST_SOURCE_AGENT = 2;
}

// QualityChangeRequestItemKind is one typed change a request carries.
enum QualityChangeRequestItemKind {
  QUALITY_CHANGE_REQUEST_ITEM_KIND_UNSPECIFIED = 0;
  QUALITY_CHANGE_REQUEST_ITEM_KIND_SUGGESTION_REF = 1;
  QUALITY_CHANGE_REQUEST_ITEM_KIND_COVERAGE_CHANGE = 2;
}

// QualityChangeRejectionReason is the structured reason a person rejected a
// request.
enum QualityChangeRejectionReason {
  QUALITY_CHANGE_REJECTION_REASON_UNSPECIFIED = 0;
  QUALITY_CHANGE_REJECTION_REASON_NOT_IMPORTANT = 1;
  QUALITY_CHANGE_REJECTION_REASON_TOO_TIGHT = 2;
  QUALITY_CHANGE_REJECTION_REASON_NOISE = 3;
  QUALITY_CHANGE_REJECTION_REASON_COVERED_UPSTREAM = 4;
  QUALITY_CHANGE_REJECTION_REASON_WRONG_COLUMN = 5;
  QUALITY_CHANGE_REJECTION_REASON_DEFER = 6;
  QUALITY_CHANGE_REJECTION_REASON_OTHER = 7;
}

// QualityChangeRequestItem is one typed change.
message QualityChangeRequestItem {
  QualityChangeRequestItemKind kind = 1;
  // SUGGESTION_REF: Format: workspaces/{workspace}/qualitySuggestions/{id}
  string suggestion = 2 [(google.api.resource_reference) = {type: "metaxisdata/QualitySuggestion"}];
  QualityCoverageProperty property = 3;
  string column = 4;
  int32 min_checks = 5;
  // COVERAGE_CHANGE: remove the declaration instead of adding or changing it.
  bool remove = 6;
  // SUGGESTION_REF: the dimension the created rule carries; required because a
  // rule draft has no dimension and a rule needs one.
  QualityDimension dimension = 7;
}

// QualityChangeRequestItemResult is one item's outcome.
message QualityChangeRequestItemResult {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_APPLIED = 1;
    STATUS_FAILED = 2;
    STATUS_SKIPPED = 3;
  }
  int32 index = 1;
  Status status = 2;
  string detail = 3;
  string applied_resource_id = 4;
}

// QualityChangeRequest is one approve-or-reject batch of typed changes against one
// target. Approving applies each item independently and returns a result per item.
message QualityChangeRequest {
  // Format: workspaces/{workspace}/qualityChangeRequests/{quality_change_request}
  string name = 1;
  QualityTarget target = 2;
  QualityChangeRequestState state = 3;
  // The published version the request was written against; a decision on a stale
  // base expires the request instead of rebasing it.
  int32 base_version = 4;
  QualityChangeRequestSource source = 5;
  repeated QualityChangeRequestItem items = 6;
  repeated QualityChangeRequestItemResult item_results = 7;
  repeated QualityChangeRejectionReason rejection_reasons = 8;
  string decision_note = 9;
  // Format: users/{user}. Empty when unknown.
  string created_by = 10;
  google.protobuf.Timestamp created_at = 11;
  string decided_by = 12;
  google.protobuf.Timestamp decided_at = 13;
}

message CreateQualityChangeRequestRequest {
  // Format: workspaces/{workspace}. "workspaces/-" is the current workspace.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];
  string target_guid = 2 [(google.api.field_behavior) = REQUIRED];
  MetaType meta_type = 3;
  // The newest published version the request is written against. Required, but 0
  // is a valid value for a target that has never been published.
  int32 base_version = 4 [(google.api.field_behavior) = REQUIRED];
  // At most 20 items.
  repeated QualityChangeRequestItem items = 5 [(google.api.field_behavior) = REQUIRED];
}

message GetQualityChangeRequestRequest {
  // Format: workspaces/{workspace}/qualityChangeRequests/{quality_change_request}
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}

message ListQualityChangeRequestsRequest {
  // Format: workspaces/{workspace}. "workspaces/-" is the current workspace.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];
  string target_guid = 2;
  QualityChangeRequestState state = 3;
  int32 page_size = 4;
  string page_token = 5;
}

message ListQualityChangeRequestsResponse {
  repeated QualityChangeRequest quality_change_requests = 1;
  string next_page_token = 2;
}

message DecideQualityChangeRequestRequest {
  // Format: workspaces/{workspace}/qualityChangeRequests/{quality_change_request}
  string name = 1 [(google.api.field_behavior) = REQUIRED];
  // APPROVE applies the request's items; REJECT records the refusal.
  enum Decision {
    DECISION_UNSPECIFIED = 0;
    DECISION_APPROVE = 1;
    DECISION_REJECT = 2;
  }
  Decision decision = 2 [(google.api.field_behavior) = REQUIRED];
  // Why the request was rejected; required for REJECT.
  repeated QualityChangeRejectionReason rejection_reasons = 3;
  string decision_note = 4;
}

// QualityCoverageGap is one required property a target's plan does not satisfy.
message QualityCoverageGap {
  QualityTarget target = 1;
  QualityCoverageProperty property = 2;
  QualityAssetCriticality criticality = 3;
  // The scope column; empty means the whole table.
  string column = 4;
}

message ListQualityCoverageGapsRequest {
  // Format: workspaces/{workspace}. "workspaces/-" is the current workspace.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];
  int32 page_size = 2;
  string page_token = 3;
  string instance = 4;
  string database = 5;
  string schema = 6;
  string table = 7;
  string search = 8;
}

message ListQualityCoverageGapsResponse {
  repeated QualityCoverageGap gaps = 1;
  string next_page_token = 2;
  int32 total_size = 3;
}

// QualityContractRevision is one published version's metadata.
message QualityContractRevision {
  int32 version = 1;
  google.protobuf.Timestamp published_at = 2;
  // Format: users/{user}.
  string published_by = 3;
  string note = 4;
  int32 check_count = 5;
  QualityContractChangeSummary change_summary = 6;
  // The intent this version recorded. Absent when the version recorded none,
  // including every version published before intent existed; this conversion
  // cannot tell the two apart.
  QualityContractIntent intent = 7;
  // Which sections of this version changed against its predecessor.
  QualityContractChangeKind change_kind = 8;
  // The plan this version recorded. Absent on a version published before plan
  // payloads existed.
  QualityPlan plan = 9;
}

// QualityContractChangeKind says which sections of a version changed against its
// predecessor.
enum QualityContractChangeKind {
  QUALITY_CONTRACT_CHANGE_KIND_UNSPECIFIED = 0;
  QUALITY_CONTRACT_CHANGE_KIND_INTENT = 1;
  QUALITY_CONTRACT_CHANGE_KIND_PLAN = 2;
  QUALITY_CONTRACT_CHANGE_KIND_CHECKS = 3;
  // More than one section changed.
  QUALITY_CONTRACT_CHANGE_KIND_BOTH = 4;
}

// QualityContractCheck is one rule as a published version records it.
message QualityContractCheck {
  // Format: workspaces/{workspace}/qualityRules/{quality_rule}
  string rule = 1 [(google.api.resource_reference) = {type: "metaxisdata/QualityRule"}];
  int32 rule_revision = 2;
  string title = 3;
  QualityRuleType rule_type = 4;
  QualitySeverity severity = 5;
  // The column the rule watches; empty for a table-level rule.
  string column = 6;
}

message GetQualityContractRequest {
  // Format: workspaces/{workspace}. "workspaces/-" is the current workspace.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];
  string target_guid = 2 [(google.api.field_behavior) = REQUIRED];
  // The target's object type. Optional when rules already exist.
  MetaType meta_type = 3;
}

message UpdateQualityContractRequest {
  // Format: workspaces/{workspace}. "workspaces/-" is the current workspace.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];
  string target_guid = 2 [(google.api.field_behavior) = REQUIRED];
  MetaType meta_type = 3;
  // The complete settings; the update replaces them rather than patching fields.
  QualityContractSettings settings = 4 [(google.api.field_behavior) = REQUIRED];

  // The complete plan draft, when the caller is editing the plan. Absent leaves
  // the staged draft untouched; an empty draft clears it. A draft only changes the
  // staged state: publishing is still PublishQualityContract.
  QualityPlan draft = 5;

  // The published version the draft was written against. Required when draft is
  // set; a stale value is refused with Aborted instead of rebasing silently.
  int32 staged_base_version = 6;
}

message PublishQualityContractRequest {
  // Format: workspaces/{workspace}. "workspaces/-" is the current workspace.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];
  string target_guid = 2 [(google.api.field_behavior) = REQUIRED];
  MetaType meta_type = 3;
  // Why this version exists; shown in the history.
  string note = 4;
}

message PublishQualityContractResponse {
  QualityContract contract = 1;
  QualityContractRevision revision = 2;
  // True when the live state already matched the newest published version, so no
  // new version was created.
  bool no_changes = 3;
}

message ListQualityContractRevisionsRequest {
  // Format: workspaces/{workspace}. "workspaces/-" is the current workspace.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];
  string target_guid = 2 [(google.api.field_behavior) = REQUIRED];
  MetaType meta_type = 3;
  int32 page_size = 4;
  string page_token = 5;
}

message ListQualityContractRevisionsResponse {
  repeated QualityContractRevision revisions = 1;
  string next_page_token = 2;
}

message GetQualityContractRevisionRequest {
  // Format: workspaces/{workspace}. "workspaces/-" is the current workspace.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];
  string target_guid = 2 [(google.api.field_behavior) = REQUIRED];
  MetaType meta_type = 3;
  int32 version = 4;
}

message GetQualityContractRevisionResponse {
  QualityContractRevision revision = 1;
  repeated QualityContractCheck checks = 2;
}

// ExportQualityDataChunk is one slice of a streamed CSV export. A client
// concatenates the slices into a file: the first slice starts with a UTF-8 BOM
// and the header row, so the file opens cleanly in a spreadsheet without a
// manual encoding choice.
message ExportQualityDataChunk {
  // A slice of the CSV bytes. A slice may end in the middle of a value's UTF-8
  // sequence; the document is only meaningful once every slice is concatenated.
  bytes data = 1;

  // The total number of data rows written so far, across all slices. It is
  // monotonic and the last value is the export's row count, which lets a client
  // report progress without counting the document.
  int64 row_count = 2;

  // Whether max_rows cut the export short: the document is complete as a CSV
  // file, but it does not hold the whole selection. Set on the final slice only.
  bool truncated = 3;
}

// ExportQualityExecutionsRequest selects the executions to export. The filters
// carry the same meaning as their ListQualityExecutions counterparts.
message ExportQualityExecutionsRequest {
  // Format: workspaces/{workspace}. "workspaces/-" is the current workspace.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];

  QualityExecutionState state = 2;

  QualityStatus outcome = 3;

  QualityExecutionTrigger trigger = 4;

  // Format: workspaces/{workspace}/qualityRules/{quality_rule}
  string rule = 5 [(google.api.resource_reference) = {type: "metaxisdata/QualityRule"}];

  // The exact target GUID.
  string target_guid = 6;

  // Format: instances/{instance}
  string instance = 7 [(google.api.resource_reference) = {type: "metaxisdata/Instance"}];

  // Format: users/{user}
  string initiator = 8 [(google.api.resource_reference) = {type: "metaxisdata/User"}];

  // Only executions started at or after this time.
  google.protobuf.Timestamp start_time = 9;

  // Only executions started before this time.
  google.protobuf.Timestamp end_time = 10;

  // Format: workspaces/{workspace}/qualityRuns/{quality_run}
  string run = 11 [(google.api.resource_reference) = {type: "metaxisdata/QualityRun"}];

  // The row ceiling. Zero or negative means the server default (100000); values
  // above that maximum are coerced to it.
  int32 max_rows = 12;
}

// ExportQualityIssuesRequest selects the issues to export. The filters carry the
// same meaning as their ListQualityIssues counterparts.
message ExportQualityIssuesRequest {
  // Format: workspaces/{workspace}. "workspaces/-" is the current workspace.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];

  QualityIssueStatus status = 2;

  QualitySeverity severity = 3;

  // Format: workspaces/{workspace}/qualityRules/{quality_rule}
  string rule = 4 [(google.api.resource_reference) = {type: "metaxisdata/QualityRule"}];

  // The exact target GUID.
  string target_guid = 5;

  // Format: users/{user}
  string owner = 6 [(google.api.resource_reference) = {type: "metaxisdata/User"}];

  // Only issues first seen at or after this time.
  google.protobuf.Timestamp start_time = 7;

  // Only issues first seen at or before this time.
  google.protobuf.Timestamp end_time = 8;

  // The row ceiling. Zero or negative means the server default (100000); values
  // above that maximum are coerced to it.
  int32 max_rows = 9;
}

// ExportQualityTargetsRequest selects the targets to export. The filters carry
// the same meaning as their ListQualityTargets counterparts.
message ExportQualityTargetsRequest {
  // Format: workspaces/{workspace}. "workspaces/-" is the current workspace.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];

  // The following four filters are GUID path prefixes, the same shape as
  // ListQualityTargets.
  string instance = 2;
  string database = 3;
  string schema = 4;
  string table = 5;

  // A case-insensitive substring over the target's path and GUID.
  string search = 6;

  // Only targets whose worst latest result is this status. UNSPECIFIED keeps
  // every target, including those whose rules have not run yet.
  QualityStatus worst_status = 7;

  // Only targets with at least one unresolved issue.
  bool has_open_issue = 8;

  // Only targets with at least one pending AI draft.
  bool has_pending_draft = 9;

  // The order the exported rows are written in, matching the directory's sort.
  QualityTargetOrder order_by = 10;

  // The row ceiling. Zero or negative means the server default (100000); values
  // above that maximum are coerced to it.
  int32 max_rows = 11;

  // Only targets that are failing, i.e. whose worst latest result is FAIL or
  // ERROR. The directory offers this as one switch while worst_status filters a
  // single state, so the export has to express the pair itself. It must not be
  // combined with worst_status.
  bool failing_only = 12;
}

// ExportQualityReportRequest asks for one target's report.
message ExportQualityReportRequest {
  // Format: workspaces/{workspace}. "workspaces/-" is the current workspace.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];

  // The target's metadata GUID. Required.
  string target_guid = 2 [(google.api.field_behavior) = REQUIRED];

  // The target's object type. Optional when rules already exist, because their
  // own target carries it.
  MetaType meta_type = 3;

  // How many days of execution history the report covers. Zero means 30; the
  // report is capped at the 90-day execution retention.
  int32 trend_days = 4;

  // The language the report text is written in: "zh-CN" or "en-US". Empty means
  // "en-US".
  string language = 5;
}

// ExportQualityReportResponse is the finished report file.
message ExportQualityReportResponse {
  // The download name, for example
  // "quality-report-20261031T120000Z.html".
  string file_name = 1;

  // The complete self-contained HTML document.
  //
  // Named html_content rather than content on purpose: the audit interceptor
  // stores a response payload, and the audit layer redacts this field by name.
  // A report carries failed-sample-derived data, so it must never enter the
  // permanent ledger.
  string html_content = 2;
}

// QualityRuleTemplate is a reusable check definition: a check type with its
// parameters, without a target or the columns a target owns. Applying one
// prefills a check editor; the check still has to be saved.
message QualityRuleTemplate {
  option (google.api.resource) = {
    type: "metaxisdata/QualityRuleTemplate"
    pattern: "workspaces/{workspace}/qualityRuleTemplates/{quality_rule_template}"
  };

  // Format: workspaces/{workspace}/qualityRuleTemplates/{quality_rule_template}
  string name = 1;

  string title = 2;

  string description = 3;

  QualityRuleType rule_type = 4;

  // The parameters to prefill. Target-bound fields (the checked column or columns,
  // the filter, a schema-drift snapshot) are empty: a template names no table and no
  // column. The config's oneof arm must match rule_type.
  QualityRuleConfig config = 5;

  QualitySeverity severity = 6;

  QualityDimension dimension = 7;

  google.protobuf.Timestamp create_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  google.protobuf.Timestamp update_time = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Format: users/{user}. Empty when the author is unknown.
  string created_by = 10 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference) = {type: "metaxisdata/User"}
  ];

  // Format: users/{user}. Empty when the last editor is unknown.
  string updated_by = 11 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference) = {type: "metaxisdata/User"}
  ];
}

message ListQualityRuleTemplatesRequest {
  // Format: workspaces/{workspace}. "workspaces/-" is the current workspace.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];

  // The maximum number of templates to return. If unspecified, at most 50 are
  // returned. The maximum value is 1000; values above 1000 are coerced to 1000.
  int32 page_size = 2;

  string page_token = 3;
}

message ListQualityRuleTemplatesResponse {
  repeated QualityRuleTemplate quality_rule_templates = 1;
  string next_page_token = 2;
}

message GetQualityRuleTemplateRequest {
  // Format: workspaces/{workspace}/qualityRuleTemplates/{quality_rule_template}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "metaxisdata/QualityRuleTemplate"}
  ];
}

message CreateQualityRuleTemplateRequest {
  // Format: workspaces/{workspace}. "workspaces/-" is the current workspace.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];

  // The template to create. Its name is assigned by the server.
  QualityRuleTemplate quality_rule_template = 2 [(google.api.field_behavior) = REQUIRED];
}

message UpdateQualityRuleTemplateRequest {
  QualityRuleTemplate quality_rule_template = 1 [(google.api.field_behavior) = REQUIRED];

  // The fields to replace: "title", "description", "severity", "dimension", "config".
  google.protobuf.FieldMask update_mask = 2;
}

message DeleteQualityRuleTemplateRequest {
  // Format: workspaces/{workspace}/qualityRuleTemplates/{quality_rule_template}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "metaxisdata/QualityRuleTemplate"}
  ];
}

// QualityCodeTable is a workspace-defined list of accepted codes used by a
// standard-code check, for example an industry-standard code set that is not
// bundled with the server.
message QualityCodeTable {
  option (google.api.resource) = {
    type: "metaxisdata/QualityCodeTable"
    pattern: "workspaces/{workspace}/qualityCodeTables/{quality_code_table}"
  };

  // Format: workspaces/{workspace}/qualityCodeTables/{quality_code_table}
  string name = 1;

  string title = 2;

  string description = 3;

  // The accepted codes, sorted and de-duplicated by the server. Empty in a list
  // response, which carries value_count instead. At most 5000 values, each at most
  // 256 bytes.
  repeated string values = 4;

  int32 value_count = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  google.protobuf.Timestamp create_time = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  google.protobuf.Timestamp update_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Format: users/{user}. Empty when the author is unknown.
  string created_by = 8 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference) = {type: "metaxisdata/User"}
  ];

  // Format: users/{user}. Empty when the last editor is unknown.
  string updated_by = 9 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference) = {type: "metaxisdata/User"}
  ];
}

message ListQualityCodeTablesRequest {
  // Format: workspaces/{workspace}. "workspaces/-" is the current workspace.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];

  // The maximum number of tables to return. If unspecified, at most 50 are
  // returned. The maximum value is 1000; values above 1000 are coerced to 1000.
  int32 page_size = 2;

  string page_token = 3;
}

message ListQualityCodeTablesResponse {
  repeated QualityCodeTable quality_code_tables = 1;
  string next_page_token = 2;
