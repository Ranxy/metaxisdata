syntax = "proto3";

package metaxisdata.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "v1/annotation.proto";

option go_package = "github.com/Ranxy/metaxisdata/backend/generated-go/v1";

// IdentityProviderService is the admin surface for SSO.
//
// It is the write path for the `idp` table: before it existed the only way to
// configure a provider was to insert SQL by hand, so the login page had nothing
// to point at and `client_secret` could not be encrypted on write.
//
// ListIdentityProviders is deliberately readable without credentials: the login
// page renders one button per configured provider before the visitor has a
// session. It never returns a secret, so a provider's non-secret half (auth URL,
// client id, scopes, mapping) is what an anonymous caller can see.
service IdentityProviderService {
  // Get an identity provider, including the non-secret half of its config.
  rpc GetIdentityProvider(GetIdentityProviderRequest) returns (IdentityProvider) {
    option (google.api.http) = {get: "/v1/{name=idps/*}"};
    option (google.api.method_signature) = "name";
    option (metaxisdata.v1.permission) = "metaxisdata.identityProviders.get";
  }

  // List every configured identity provider. Public so the login page can render
  // the enabled SSO targets without credentials.
  //
  // The `permission` annotation is kept beside `allow_without_credential`, as on
  // `SettingService.GetWorkspaceProfileSetting`: the latter wins in the
  // interceptor, and the annotation is what records the permission this read
  // belongs to in the catalog.
  rpc ListIdentityProviders(ListIdentityProvidersRequest) returns (ListIdentityProvidersResponse) {
    option (google.api.http) = {get: "/v1/idps"};
    option (google.api.method_signature) = "";
    option (metaxisdata.v1.allow_without_credential) = true;
    option (metaxisdata.v1.permission) = "metaxisdata.identityProviders.list";
  }

  // Create an identity provider. The id becomes the final segment of the
  // resource name and is immutable, so it is derived from the title by the
  // client and checked here.
  rpc CreateIdentityProvider(CreateIdentityProviderRequest) returns (IdentityProvider) {
    option (google.api.http) = {
      post: "/v1/idps"
      body: "identity_provider"
    };
    option (google.api.method_signature) = "identity_provider,identity_provider_id";
    option (metaxisdata.v1.permission) = "metaxisdata.identityProviders.create";
    option (metaxisdata.v1.audit) = true;
  }

  // Update an identity provider. Only title, domain and config are mutable; the
  // resource name is not. An empty secret in the config means "keep the stored
  // one", because the read path never hands the stored secret back.
  rpc UpdateIdentityProvider(UpdateIdentityProviderRequest) returns (IdentityProvider) {
    option (google.api.http) = {
      patch: "/v1/{identity_provider.name=idps/*}"
      body: "identity_provider"
    };
    option (google.api.method_signature) = "identity_provider,update_mask";
    option (metaxisdata.v1.permission) = "metaxisdata.identityProviders.update";
    option (metaxisdata.v1.audit) = true;
  }

  // Delete an identity provider.
  //
  // Accounts bound to it keep their binding rows but can no longer sign in
  // through it: the binding records the subject the provider assigned, which no
  // longer resolves to a configured provider. Re-creating the provider with the
  // same id makes those accounts reachable again, which is why the id matters.
  rpc DeleteIdentityProvider(DeleteIdentityProviderRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/{name=idps/*}"};
    option (google.api.method_signature) = "name";
    option (metaxisdata.v1.permission) = "metaxisdata.identityProviders.update";
    option (metaxisdata.v1.audit) = true;
  }

  // TestIdentityProvider completes a real authorization-code exchange against a
  // stored provider and reports the identity it resolves.
  //
  // The provider has to be saved first: the exchange needs the stored client
  // secret, and the browser is never given it. The caller obtains an
  // authorization code by sending an administrator's browser to the provider's
  // authorization endpoint with `{external_url}/oauth/callback` as the redirect
  // URI — the same URI a login uses — so no extra callback has to be registered
  // with the provider. The client marks that state record as a test so the
  // callback page tests instead of signing the administrator in.
  //
  // This verifies the client id and secret end to end, which endpoint
  // reachability alone cannot.
  rpc TestIdentityProvider(TestIdentityProviderRequest) returns (TestIdentityProviderResponse) {
    option (google.api.http) = {
      post: "/v1/{name=idps/*}:test"
      body: "*"
    };
    option (metaxisdata.v1.permission) = "metaxisdata.identityProviders.update";
  }

  // List the accounts bound to an identity provider subject.
  //
  // A binding is what a login resolves against, so this is the read an
  // administrator needs before moving or deleting an account: without it the
  // only way to see why a login lands on an account is SQL.
  rpc ListIdentityProviderBindings(ListIdentityProviderBindingsRequest) returns (ListIdentityProviderBindingsResponse) {
    option (google.api.http) = {get: "/v1/identityProviderBindings"};
    option (google.api.method_signature) = "";
    option (metaxisdata.v1.permission) = "metaxisdata.identityProviders.get";
  }

  // DeleteIdentityProviderBinding unbinds one account from one provider subject.
  //
  // The account loses that way in but keeps every other one; nothing else about
  // it changes. Deleting the last binding of an account whose password was
  // replaced on adoption leaves it reachable only by an administrator resetting
  // the password, so the caller is expected to confirm before doing it.
  rpc DeleteIdentityProviderBinding(DeleteIdentityProviderBindingRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/identityProviderBindings:delete"
      body: "*"
    };
    option (metaxisdata.v1.permission) = "metaxisdata.identityProviders.update";
    option (metaxisdata.v1.audit) = true;
  }
}

message GetIdentityProviderRequest {
  // The name of the identity provider to get.
  // Format: idps/{idp}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "metaxisdata/IdentityProvider"}
  ];
}

message ListIdentityProvidersRequest {}

message ListIdentityProvidersResponse {
  repeated IdentityProvider identity_providers = 1;
}

message CreateIdentityProviderRequest {
  // The identity provider to create.
  IdentityProvider identity_provider = 1 [(google.api.field_behavior) = REQUIRED];

  // The id to use, which becomes the final segment of the resource name.
  // Format: a lower-case letter followed by up to 62 lower-case letters, digits
  // or hyphens.
  string identity_provider_id = 2 [(google.api.field_behavior) = REQUIRED];
}

message UpdateIdentityProviderRequest {
  // The identity provider to update. Its `name` field identifies the row.
  IdentityProvider identity_provider = 1 [(google.api.field_behavior) = REQUIRED];

  // The fields to update. Only `title`, `domain` and `config` are mutable.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = REQUIRED];
}

message DeleteIdentityProviderRequest {
  // The name of the identity provider to delete.
  // Format: idps/{idp}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "metaxisdata/IdentityProvider"}
  ];
}

message TestIdentityProviderRequest {
  // The name of the stored identity provider to test.
  // Format: idps/{idp}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "metaxisdata/IdentityProvider"}
  ];

  oneof context {
    OAuth2IdentityProviderTestRequestContext oauth2_context = 2;
  }
}

message OAuth2IdentityProviderTestRequestContext {
  // The authorization code the provider returned to the callback.
  string code = 1;

  // The code_verifier matching the code_challenge sent to the provider.
  string code_verifier = 2;
}

message TestIdentityProviderResponse {
  // The identity the provider resolved. Field mapping is applied, so a claim
  // that did not resolve is visible as an empty field here.
  IdentityProviderUserInfo user_info = 1;
}

message ListIdentityProviderBindingsRequest {
  // Optional. Restrict the answer to one identity provider.
  // Format: idps/{idp}
  string idp = 1 [(google.api.resource_reference) = {type: "metaxisdata/IdentityProvider"}];

  // Optional. Restrict the answer to one account.
  // Format: users/{user}
  string user = 2 [(google.api.resource_reference) = {type: "metaxisdata/User"}];
}

message ListIdentityProviderBindingsResponse {
  repeated IdentityProviderBinding identity_provider_bindings = 1;
}

// IdentityProviderBinding is one account's way in through one identity provider.
message IdentityProviderBinding {
  // The account. Format: users/{user}
  string user = 1;

  // The account's address, for display. Read-only.
  string user_email = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The account's display name, for display. Read-only.
  string user_title = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The identity provider. Format: idps/{idp}
  string idp = 4;

  // The provider-assigned subject the account is bound to. This is the value a
  // login resolves against; it is not necessarily the address.
  string subject = 5;

  // When the binding was written.
  google.protobuf.Timestamp created_at = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message DeleteIdentityProviderBindingRequest {
  // The account to unbind. Format: users/{user}
  string user = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "metaxisdata/User"}
  ];

  // The identity provider to unbind from. Format: idps/{idp}
  string idp = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "metaxisdata/IdentityProvider"}
  ];

  // The subject to unbind. The binding row is keyed by (idp, subject), so this
  // pins exactly one row: an account may in principle carry several subjects
  // from the same provider. It is a plain field rather than a segment of the
  // resource name because a subject is an opaque provider string that can
  // contain `/`, `@` and `:`.
  string subject = 3 [(google.api.field_behavior) = REQUIRED];
}

// IdentityProvider is a configured SSO provider.
message IdentityProvider {
  option (google.api.resource) = {
    type: "metaxisdata/IdentityProvider"
    pattern: "idps/{idp}"
  };

  // The resource name. Format: idps/{idp}. Output only: the id is set on create
  // and cannot change, because accounts are bound to (id, subject) pairs.
  string name = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The display title, e.g. "Acme SSO". The login page shows it on the button.
  string title = 2 [(google.api.field_behavior) = REQUIRED];

  // The email domain whose users this provider serves, e.g. "example.com". Used
  // as a fallback when a provider reports an identifier that is not an address:
  // the login then tries "{identifier}@{domain}". Empty disables the fallback.
  string domain = 3 [(google.api.field_behavior) = OPTIONAL];

  // The protocol. Only OAUTH2 is implemented; the login path rejects anything
  // else and no other value can be created.
  IdentityProviderType type = 4 [(google.api.field_behavior) = REQUIRED];

  // The protocol configuration.
  IdentityProviderConfig config = 5 [(google.api.field_behavior) = REQUIRED];
}

enum IdentityProviderType {
  IDENTITY_PROVIDER_TYPE_UNSPECIFIED = 0;

  // OAuth 2.0 authorization-code flow.
  OAUTH2 = 1;

  reserved 2, 3;
  reserved "OIDC", "LDAP";
}

message IdentityProviderConfig {
  oneof config {
    OAuth2IdentityProviderConfig oauth2_config = 1;
  }

  reserved 2, 3;
  reserved "oidc_config", "ldap_config";
}

// OAuth2IdentityProviderConfig is an OAuth2 provider's configuration.
message OAuth2IdentityProviderConfig {
  // The authorization endpoint the browser is sent to. Not used by the server:
  // the client builds the authorize URL from it.
  string auth_url = 1;

  // The token endpoint. Required.
  string token_url = 2;

  // The userinfo endpoint. Required: the login reads the claims from here.
  string user_info_url = 3;

  // The client id. Required. Not a secret; it travels in the authorize URL.
  string client_id = 4;

  // The client secret. Required on create. Never returned by a read, and an
  // empty value on update keeps the stored one.
  //
  // It is stored encrypted with the deployment's data key (see
  // `backend/common/crypto`), so a database reader without the key cannot
  // authenticate as this application to the provider.
  string client_secret = 5 [(google.api.field_behavior) = INPUT_ONLY];

  // The scopes to request.
  repeated string scopes = 6;

  // The claim mapping.
  FieldMapping field_mapping = 7 [(google.api.field_behavior) = REQUIRED];

  // Whether to skip TLS certificate verification on the provider's endpoints.
  //
  // Off by default and off is the only safe setting: with it on, anyone able to
  // intercept the connection can forge the userinfo response and take over every
  // account bound to this provider. The settings page warns when it is enabled.
  bool skip_tls_verify = 8;

  // How the client id and secret are sent to the token endpoint.
  OAuth2AuthStyle auth_style = 9;
}

// FieldMapping names the claims that carry each field of the identity.
message FieldMapping {
  reserved 3;

  // The claim holding the identifier, normally the address. Required.
  string identifier = 1;

  // The claim holding the display name. Optional; defaults to the identifier.
  string display_name = 2;

  // The claim holding the phone number. Optional.
  string phone = 4;

  // The claim holding the provider-assigned, immutable subject. Optional here
  // but required in effect: a login is bound to it, and the server refuses a
  // provider that maps no subject unless the workspace lists the provider as one
  // whose address claim may stand in for it (`sso_email_identity_idps`).
  string subject = 6;

  // The claim holding group memberships. Optional. When set, each login syncs
  // the account's group membership to the matching workspace groups, which is
  // what lets an IAM policy grant roles by group.
  string groups = 5;
}

// IdentityProviderUserInfo is the identity a login resolved from the claims.
message IdentityProviderUserInfo {
  reserved 3;

  // The identifier claim, normally the address.
  string identifier = 1;

  // The subject claim: the value the account is bound to.
  string subject = 7;

  // The display name.
  string display_name = 2;

  // The phone number.
  string phone = 4;

  // The group claims.
  repeated string groups = 5;

  // Whether the provider returned a group claim at all. Distinguishes "no
  // groups" from "groups not configured", so an empty list does not clear a
  // membership.
  bool has_groups = 6;
}

enum OAuth2AuthStyle {
  OAUTH2_AUTH_STYLE_UNSPECIFIED = 0;

  // IN_PARAMS sends the "client_id" and "client_secret" in the POST body as
  // application/x-www-form-urlencoded parameters.
  IN_PARAMS = 1;

  // IN_HEADER sends the client_id and client_secret using HTTP Basic
  // Authorization, as described in the OAuth2 RFC 6749 section 2.3.1.
  IN_HEADER = 2;
}
