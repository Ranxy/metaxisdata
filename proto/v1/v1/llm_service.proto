syntax = "proto3";

package metaxisdata.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "v1/annotation.proto";

option go_package = "github.com/Ranxy/metaxisdata/backend/generated-go/v1";

service LLMService {
  rpc ListLLMProviderProfiles(ListLLMProviderProfilesRequest) returns (ListLLMProviderProfilesResponse) {
    option (google.api.http) = {get: "/v1/llm-provider-profiles"};
    option (google.api.method_signature) = "";
    option (metaxisdata.v1.permission) = "metaxisdata.llm.profiles.list";
  }

  rpc CreateLLMProviderProfile(CreateLLMProviderProfileRequest) returns (LlmProviderProfile) {
    option (google.api.http) = {
      post: "/v1/llm-provider-profiles"
      body: "profile"
    };
    option (google.api.method_signature) = "profile";
    option (metaxisdata.v1.permission) = "metaxisdata.llm.profiles.create";
    option (metaxisdata.v1.audit) = true;
  }

  rpc UpdateLLMProviderProfile(UpdateLLMProviderProfileRequest) returns (LlmProviderProfile) {
    option (google.api.http) = {
      patch: "/v1/{profile.name=llm-provider-profiles/*}"
      body: "profile"
    };
    option (google.api.method_signature) = "profile,update_mask";
    option (metaxisdata.v1.permission) = "metaxisdata.llm.profiles.update";
    option (metaxisdata.v1.audit) = true;
  }

  rpc DeleteLLMProviderProfile(DeleteLLMProviderProfileRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/{name=llm-provider-profiles/*}"};
    option (google.api.method_signature) = "name";
    option (metaxisdata.v1.permission) = "metaxisdata.llm.profiles.delete";
    option (metaxisdata.v1.audit) = true;
  }

  rpc FetchLLMModels(FetchLLMModelsRequest) returns (FetchLLMModelsResponse) {
    option (google.api.http) = {
      post: "/v1/llm-provider-profiles:fetchModels"
      body: "*"
    };
    option (metaxisdata.v1.permission) = "metaxisdata.llm.profiles.fetchModels";
  }
}

enum LLMProviderType {
  LLM_PROVIDER_TYPE_UNSPECIFIED = 0;
  LLM_PROVIDER_TYPE_OPENAI = 1;
  LLM_PROVIDER_TYPE_DEEPSEEK = 2;
  LLM_PROVIDER_TYPE_OPENROUTER = 3;
  LLM_PROVIDER_TYPE_CUSTOM = 4;
}

message LlmProviderDefinition {
  string id = 1;
  string label = 2;
  string description = 3;
  string default_base_url = 4;
}

message LlmProviderModel {
  string name = 1;
  bool enabled = 2;
  // The largest combined request and response context this model accepts, in
  // tokens. Zero means the server default; an explicit value must be a positive
  // integer. The quality agent derives its compaction trigger from this value.
  int32 context_window = 3;
  // The answer budget one model call requests from this model, in output tokens.
  // Zero means the server default; an explicit value must be between 256 and
  // 131072 and leave a positive message budget inside the context window.
  int32 max_output_tokens = 4;
}

message LlmProviderProfile {
  string name = 1;
  string title = 2;
  LLMProviderType type = 3;
  string base_url = 4;
  string api_key = 5 [(google.api.field_behavior) = INPUT_ONLY];
  repeated LlmProviderModel models = 6;
  google.protobuf.Timestamp create_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp update_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  string masked_api_key = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The profile-level output budget was replaced by LlmProviderModel.max_output_tokens.
  reserved 10;
  reserved "max_output_tokens";
}

// The server-owned capacity contract the provider settings page renders:
// defaults and bounds for the per-model fields. It is output-only.
message LlmProviderLimits {
  int32 default_max_output_tokens = 1;
  int32 min_max_output_tokens = 2;
  int32 max_max_output_tokens = 3;
  int32 default_context_window = 4;
  // Positive-integer floor; the server imposes no larger product minimum.
  int32 min_context_window = 5;
  // Sanity ceiling for the int32 config and the UI; not a model claim.
  int32 max_context_window = 6;
}

message ListLLMProviderProfilesRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListLLMProviderProfilesResponse {
  repeated LlmProviderProfile profiles = 1;
  repeated LlmProviderDefinition definitions = 2;
  string next_page_token = 3;
  LlmProviderLimits limits = 4;
}

message CreateLLMProviderProfileRequest {
  LlmProviderProfile profile = 1 [(google.api.field_behavior) = REQUIRED];
}

message UpdateLLMProviderProfileRequest {
  LlmProviderProfile profile = 1 [(google.api.field_behavior) = REQUIRED];
  google.protobuf.FieldMask update_mask = 2;
}

message DeleteLLMProviderProfileRequest {
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}

message FetchLLMModelsRequest {
  // An existing profile whose stored base URL and API key are used when the
  // request does not carry its own.
  string name = 1;
  // Overrides the API key stored on the named profile.
  string api_key = 2;
  LLMProviderType provider_type = 3;
  // Overrides the profile's stored base URL. A custom provider has no default,
  // so the request must carry one when no profile is named.
  string base_url = 4;
}

// One model an endpoint disclosed. The capacity fields are advisory: an
// endpoint that lists no capacities leaves them zero.
message LlmDiscoveredModel {
  string name = 1;
  int32 context_window = 2;
  int32 max_output_tokens = 3;
}

message FetchLLMModelsResponse {
  reserved 1;
  reserved "model_ids";
  repeated LlmDiscoveredModel models = 2;
}
