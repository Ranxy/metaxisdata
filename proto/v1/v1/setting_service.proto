syntax = "proto3";

package metaxisdata.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "v1/annotation.proto";

option go_package = "github.com/Ranxy/metaxisdata/backend/generated-go/v1";

service SettingService {
  // Get the workspace profile setting.
  // Permissions required: None
  //
  // This method is readable without credentials because the login page needs
  // to know whether self-service signup is enabled.
  rpc GetWorkspaceProfileSetting(GetWorkspaceProfileSettingRequest) returns (WorkspaceProfileSetting) {
    option (google.api.http) = {get: "/v1/settings/workspaceProfile"};
    option (metaxisdata.v1.allow_without_credential) = true;
    option (metaxisdata.v1.permission) = "metaxisdata.settings.get";
  }

  // Update the workspace profile setting.
  rpc UpdateWorkspaceProfileSetting(UpdateWorkspaceProfileSettingRequest) returns (WorkspaceProfileSetting) {
    option (google.api.http) = {
      patch: "/v1/settings/workspaceProfile"
      body: "setting"
    };
    option (google.api.method_signature) = "setting,update_mask";
    option (metaxisdata.v1.permission) = "metaxisdata.settings.update";
    option (metaxisdata.v1.audit) = true;
  }

  // Get the workspace runtime debug config.
  rpc GetDebugConfig(GetDebugConfigRequest) returns (GetDebugConfigResponse) {
    option (google.api.http) = {get: "/v1/settings/debugConfig"};
    option (metaxisdata.v1.permission) = "metaxisdata.settings.get";
  }

  // Update the workspace runtime debug config.
  //
  // Enabling it switches the process-wide log level to debug, gates the
  // verbose request logging emitted by the debug interceptor, exposes
  // /debug/pprof, and allows panic handlers to return stack traces to the
  // caller. Disabling it restores info-level logging and generic panic errors.
  rpc UpdateDebugConfig(UpdateDebugConfigRequest) returns (UpdateDebugConfigResponse) {
    option (google.api.http) = {
      patch: "/v1/settings/debugConfig"
      body: "*"
    };
    option (google.api.method_signature) = "enabled";
    option (metaxisdata.v1.permission) = "metaxisdata.settings.update";
    option (metaxisdata.v1.audit) = true;
  }

  // Get the workspace email setting. It is returned empty when email delivery
  // is not configured, so the settings page can render one form either way.
  rpc GetEmailSetting(GetEmailSettingRequest) returns (EmailSetting) {
    option (google.api.http) = {get: "/v1/settings/email"};
    option (metaxisdata.v1.permission) = "metaxisdata.settings.get";
  }

  // Update the workspace email setting. The password is write-only: an empty
  // one on update keeps the stored password, and no read returns it.
  rpc UpdateEmailSetting(UpdateEmailSettingRequest) returns (EmailSetting) {
    option (google.api.http) = {
      patch: "/v1/settings/email"
      body: "setting"
    };
    option (google.api.method_signature) = "setting,update_mask";
    option (metaxisdata.v1.permission) = "metaxisdata.settings.update";
    option (metaxisdata.v1.audit) = true;
  }

  // Send a test email to the caller's own address through the configured SMTP
  // server. It is not audited: it changes nothing, and it is a diagnostic probe
  // the settings page can repeat while an administrator types the server in.
  rpc SendTestEmail(SendTestEmailRequest) returns (SendTestEmailResponse) {
    option (google.api.http) = {
      post: "/v1/settings/email:sendTestEmail"
      body: "*"
    };
    option (metaxisdata.v1.permission) = "metaxisdata.settings.update";
  }
  // Get the workspace quiet-hours schedule for outbound notifications.
  rpc GetQuietHoursSetting(GetQuietHoursSettingRequest) returns (QuietHoursSetting) {
    option (google.api.http) = {get: "/v1/settings/quietHours"};
    option (metaxisdata.v1.permission) = "metaxisdata.settings.get";
  }

  // Update the workspace quiet-hours schedule. Any update releases the deliveries
  // the previous schedule was holding, so shortening or disabling it takes effect
  // immediately; held rows are then re-evaluated by the next dispatcher tick.
  rpc UpdateQuietHoursSetting(UpdateQuietHoursSettingRequest) returns (QuietHoursSetting) {
    option (google.api.http) = {
      patch: "/v1/settings/quietHours"
      body: "setting"
    };
    option (google.api.method_signature) = "setting,update_mask";
    option (metaxisdata.v1.permission) = "metaxisdata.settings.update";
    option (metaxisdata.v1.audit) = true;
  }
}

message WorkspaceProfileSetting {
  // The external URL used for the SSO authentication callback.
  string external_url = 1;

  // Disallow self-service signup. When enabled, only a workspace admin can
  // create users.
  bool disallow_signup = 2;

  // Disallow password signin. Workspace admins are exempt.
  bool disallow_password_signin = 3;

  // The number of days persisted OpenLineage runs are kept. Zero (the default)
  // keeps them forever.
  int32 openlineage_retention_days = 4;

  // The email domains (for example "example.com") whose users may sign up and
  // sign in. Only enforced when enforce_identity_domain is on; an empty list
  // disables the restriction.
  repeated string domains = 5;

  // Whether to restrict signup and signin to the domains above.
  bool enforce_identity_domain = 6;

  // The LLM provider profiles ExplainSQL may use, as profile resource names
  // ("llm-provider-profiles/{id}"). Empty means every enabled profile is
  // allowed.
  repeated string allowed_llm_provider_profiles = 7;

  // Whether the MCP endpoint and its OAuth 2.1 authorization server are served.
  // Off by default, and only usable once external_url is configured.
  bool mcp_enabled = 8;

  // The identity providers, as idps/{idp} resource names, whose email claim may
  // stand in for a stable subject. For a listed provider, field_mapping.subject
  // becomes optional and a login whose address claim matches an existing account
  // makes that account reachable through the provider — adopting it (its password
  // is replaced with a random one) when it had no provider binding at all.
  //
  // Empty (the default) turns the feature off for every provider. The address
  // claim is mutable, so listing a provider asserts that it verifies addresses and
  // that its configuration, which only an administrator can write, is trusted:
  // whoever can set an address there can sign in as the account it names.
  repeated string sso_email_identity_idps = 10;

  reserved 9;
  reserved "allow_sso_email_identity";

  // Data quality settings. They are read by the quality subsystem and written on
  // the data quality settings page; every zero value means the server's default,
  // which is why the reader resolves defaults instead of trusting the wire value.
  DataQualitySetting data_quality = 11;
}

// DataQualitySetting configures the data quality subsystem for the workspace.
message DataQualitySetting {
  // Whether the LLM-assisted entries (rule draft, failure explanation, column
  // labels) are enabled. Off by default: the rule engine is fully offline.
  bool enable_llm_analysis = 1;

  // The LLM provider profile the quality analyses use, as a profile resource
  // name. Empty means the first allowed profile.
  string llm_provider_profile = 2;

  // Whether failed checks keep the sampled rows as evidence. Off means a result
  // records its counts but no values.
  bool store_failure_samples = 3;

  // How many failed rows a result keeps. Zero means the server default (20);
  // capped at 100.
  int32 failure_sample_limit = 4;

  // The schedule interval a target starts with when it gets its first rule.
  // Zero means the server default (one hour). Existing targets keep their own
  // schedule.
  google.protobuf.Duration default_schedule_interval = 5;

  // The workspace's daily execution ceiling; 0 means the server default (10000).
  int32 daily_execution_limit = 6;

  // The workspace's daily column-analysis ceiling; 0 means the server default.
  int32 daily_column_analysis_limit = 7;

  // The maximum number of columns one analysis may cover; 0 means the server
  // default (50).
  int32 max_columns_per_analysis = 8;

  // Whether raw sample values may be sent to the LLM. Off by default: only
  // aggregate profiles leave the deployment.
  bool send_sample_values_to_llm = 9;

  // The workspace's daily L1+L2 LLM analysis ceiling (rule drafts and failure
  // explanations). Zero means the server default (10000); capped at 1000000.
  int32 daily_llm_analysis_limit = 10;

  // How many data quality LLM analyses may run at once in this process. Zero
  // means the server default (8); accepted range 1-64.
  int32 llm_concurrency_limit = 11;
}

message GetWorkspaceProfileSettingRequest {}

message UpdateWorkspaceProfileSettingRequest {
  // The setting to update.
  WorkspaceProfileSetting setting = 1 [(google.api.field_behavior) = REQUIRED];

  // The list of fields to update.
  google.protobuf.FieldMask update_mask = 2;
}

message GetDebugConfigRequest {}

message GetDebugConfigResponse {
  // Whether runtime debug mode is currently enabled.
  bool enabled = 1;
}

message UpdateDebugConfigRequest {
  // Whether to enable runtime debug mode.
  bool enabled = 1 [(google.api.field_behavior) = REQUIRED];
}

message UpdateDebugConfigResponse {
  // The resulting runtime debug mode.
  bool enabled = 1;
}

// EmailSetting configures the SMTP server workspace notifications are emailed
// through. There is one per workspace: a channel of kind EMAIL delivers through
// it, and an email channel fails while it is unset.
message EmailSetting {
  // The From address. It must be an address the SMTP server is allowed to send
  // as. Empty means email delivery is not configured.
  string from = 1;

  // The display name shown beside the From address.
  string from_name = 2;

  // The SMTP server.
  SMTPConfig smtp = 3;

  // Whether a password is stored. The password itself is never returned.
  bool password_set = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message SMTPConfig {
  // The SMTP server host name.
  string host = 1;

  // The SMTP server port: usually 587 for STARTTLS, 465 for implicit TLS, or 25
  // on a trusted network.
  int32 port = 2;

  SMTPEncryption encryption = 3;

  SMTPAuthentication authentication = 4;

  // The user name the login authenticates as. Required unless authentication is
  // NONE.
  string username = 5;

  // The login password. It is write-only: an empty value on update keeps the
  // stored password, and no read returns it.
  string password = 6 [(google.api.field_behavior) = INPUT_ONLY];
}

// SMTPEncryption is the transport security of the SMTP connection.
enum SMTPEncryption {
  SMTP_ENCRYPTION_UNSPECIFIED = 0;
  // No transport encryption. Only for a server on a trusted network.
  SMTP_ENCRYPTION_NONE = 1;
  // Upgrade the connection with STARTTLS after the greeting.
  SMTP_ENCRYPTION_STARTTLS = 2;
  // Implicit TLS from the first byte, usually port 465.
  SMTP_ENCRYPTION_SSL_TLS = 3;
}

// SMTPAuthentication is the login mechanism of the SMTP connection.
enum SMTPAuthentication {
  SMTP_AUTHENTICATION_UNSPECIFIED = 0;
  // No login; only for a server that accepts mail from trusted hosts.
  SMTP_AUTHENTICATION_NONE = 1;
  SMTP_AUTHENTICATION_PLAIN = 2;
  SMTP_AUTHENTICATION_LOGIN = 3;
  SMTP_AUTHENTICATION_CRAM_MD5 = 4;
}

message GetEmailSettingRequest {}

message UpdateEmailSettingRequest {
  // The setting to update.
  EmailSetting setting = 1 [(google.api.field_behavior) = REQUIRED];

  // The list of fields to update: from, from_name, smtp, or one of
  // smtp.host, smtp.port, smtp.encryption, smtp.authentication, smtp.username,
  // smtp.password.
  google.protobuf.FieldMask update_mask = 2;
}

message SendTestEmailRequest {}

message SendTestEmailResponse {}

// DayOfWeek is an ISO 8601 weekday: 1 is Monday and 7 is Sunday.
enum DayOfWeek {
  DAY_OF_WEEK_UNSPECIFIED = 0;
  DAY_OF_WEEK_MONDAY = 1;
  DAY_OF_WEEK_TUESDAY = 2;
  DAY_OF_WEEK_WEDNESDAY = 3;
  DAY_OF_WEEK_THURSDAY = 4;
  DAY_OF_WEEK_FRIDAY = 5;
  DAY_OF_WEEK_SATURDAY = 6;
  DAY_OF_WEEK_SUNDAY = 7;
}

// QuietHoursSetting is the workspace schedule during which outbound
// notifications are held rather than delivered. Held deliveries keep their
// place and are sent once the window ends; a channel that sets bypass_quiet_hours
// keeps delivering during the window.
message QuietHoursSetting {
  // Whether quiet hours are on. A disabled schedule is kept but selects nothing.
  bool enabled = 1;

  // The IANA time zone the windows are evaluated in, for example
  // "Asia/Shanghai". Required while enabled.
  string timezone = 2;

  // Recurring weekly windows. At least one window or maintenance window is
  // required while enabled.
  repeated QuietWindow windows = 3;

  // One-off absolute windows for planned maintenance. A window whose end has
  // passed is inert and can be removed.
  repeated MaintenanceWindow maintenance_windows = 4;
}

// QuietWindow is one recurring weekly quiet window.
message QuietWindow {
  // The days the window starts on. A window whose end is at or before its start
  // crosses midnight into the following day.
  repeated DayOfWeek days = 1;

  // "HH:MM" in the setting's time zone.
  string start = 2;

  // "HH:MM" in the setting's time zone.
  string end = 3;
}

// MaintenanceWindow is one absolute quiet window, for planned maintenance.
message MaintenanceWindow {
  google.protobuf.Timestamp start = 1;
  google.protobuf.Timestamp end = 2;
}

message GetQuietHoursSettingRequest {}

message UpdateQuietHoursSettingRequest {
  // The schedule to update.
  QuietHoursSetting setting = 1 [(google.api.field_behavior) = REQUIRED];

  // The list of fields to update: enabled, timezone, windows or
  // maintenance_windows.
  google.protobuf.FieldMask update_mask = 2;
}
