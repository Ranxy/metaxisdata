syntax = "proto3";

package metaxisdata.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "v1/annotation.proto";
import "v1/data_quality_service.proto";

option go_package = "github.com/Ranxy/metaxisdata/backend/generated-go/v1";

// NotificationService serves the caller's own in-app messages — the outcome of
// a sync operation they asked for, and the ingestion failures a workspace
// administrator needs to see — and the workspace's outbound delivery channels,
// which administrators configure.
//
// The inbox methods carry no (metaxisdata.v1.permission) annotation and none is
// reachable without credentials: an inbox belongs to one principal, which the
// workspace-scoped IAM catalog cannot express, so every handler scopes its query
// by the authenticated caller's id, the same way UserService's self-service
// paths do. The outbound methods are workspace configuration and carry the
// settings permissions: reads use settings.get, writes, the test send and the
// delivery retry use settings.update.
service NotificationService {
  // List the caller's notifications, newest first.
  rpc ListNotifications(ListNotificationsRequest) returns (ListNotificationsResponse) {
    option (google.api.http) = {get: "/v1/{parent=workspaces/*}/notifications"};
    option (google.api.method_signature) = "parent";
  }

  // Count the caller's unread notifications, and the subset of them written
  // since the caller last opened the inbox.
  rpc GetUnreadNotificationCount(GetUnreadNotificationCountRequest) returns (GetUnreadNotificationCountResponse) {
    option (google.api.http) = {get: "/v1/{parent=workspaces/*}/notifications:unreadCount"};
  }

  // Record that the caller has opened the inbox, which clears the badge. No
  // notification is marked read: a message stays unread until it is clicked or
  // the caller marks everything read.
  rpc MarkNotificationsSeen(MarkNotificationsSeenRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/{parent=workspaces/*}/notifications:markSeen"
      body: "*"
    };
  }

  // Mark the named notifications read. Already-read notifications are left
  // alone, so the call is idempotent.
  rpc BatchMarkNotificationsRead(BatchMarkNotificationsReadRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/{parent=workspaces/*}/notifications:batchMarkRead"
      body: "*"
    };
  }

  // Mark every unread notification of the caller read.
  rpc MarkAllNotificationsRead(MarkAllNotificationsReadRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/{parent=workspaces/*}/notifications:markAllRead"
      body: "*"
    };
  }

  // Delete one of the caller's notifications.
  rpc DeleteNotification(DeleteNotificationRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/{name=workspaces/*/notifications/*}"};
    option (google.api.method_signature) = "name";
  }

  // Stream the caller's notifications as they are written, until the connection
  // ends or the server ends it.
  //
  // No (google.api.http) annotation: this is a server-streaming method, and the
  // REST gateway cannot carry one — it answers "streaming calls are not yet
  // supported in the in-process transport", as the generated ExplainSQL gateway
  // route does. The browser reaches the Connect endpoint directly, the way it does
  // for ExplainSQL.
  rpc SubscribeNotifications(SubscribeNotificationsRequest) returns (stream SubscribeNotificationsResponse) {}

  // List the outbound channels administrators have configured. The list is not
  // paginated: a workspace configures a handful of destinations, and the delivery
  // path reads the whole set anyway.
  rpc ListNotificationChannels(ListNotificationChannelsRequest) returns (ListNotificationChannelsResponse) {
    option (google.api.http) = {get: "/v1/{parent=workspaces/*}/notificationChannels"};
    option (google.api.method_signature) = "parent";
    option (metaxisdata.v1.permission) = "metaxisdata.settings.get";
  }

  // Read one outbound channel. The credential is never returned.
  rpc GetNotificationChannel(GetNotificationChannelRequest) returns (NotificationChannel) {
    option (google.api.http) = {get: "/v1/{name=workspaces/*/notificationChannels/*}"};
    option (google.api.method_signature) = "name";
    option (metaxisdata.v1.permission) = "metaxisdata.settings.get";
  }

  // Create one outbound channel. The secret is write-only: it is encrypted
  // before it is stored and is never returned.
  rpc CreateNotificationChannel(CreateNotificationChannelRequest) returns (NotificationChannel) {
    option (google.api.http) = {
      post: "/v1/{parent=workspaces/*}/notificationChannels"
      body: "channel"
    };
    option (google.api.method_signature) = "parent,channel,secret";
    option (metaxisdata.v1.permission) = "metaxisdata.settings.update";
    option (metaxisdata.v1.audit) = true;
  }

  // Update one outbound channel. An omitted secret keeps the stored one; a
  // present secret replaces it.
  rpc UpdateNotificationChannel(UpdateNotificationChannelRequest) returns (NotificationChannel) {
    option (google.api.http) = {
      patch: "/v1/{channel.name=workspaces/*/notificationChannels/*}"
      body: "channel"
    };
    option (google.api.method_signature) = "channel,secret,update_mask";
    option (metaxisdata.v1.permission) = "metaxisdata.settings.update";
    option (metaxisdata.v1.audit) = true;
  }

  // Delete one outbound channel and the deliveries still queued for it.
  rpc DeleteNotificationChannel(DeleteNotificationChannelRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/{name=workspaces/*/notificationChannels/*}"};
    option (google.api.method_signature) = "name";
    option (metaxisdata.v1.permission) = "metaxisdata.settings.update";
    option (metaxisdata.v1.audit) = true;
  }

  // Post a test message through one stored channel and report what the endpoint
  // answered. An email channel sends the message through the workspace SMTP
  // setting instead, and its answer is empty. It queues no delivery and is not
  // audited: it is a diagnostic probe that changes nothing, and the endpoint's
  // answer is third-party text that does not belong in the permanent ledger.
  rpc TestNotificationChannel(TestNotificationChannelRequest) returns (TestNotificationChannelResponse) {
    option (google.api.http) = {
      post: "/v1/{name=workspaces/*/notificationChannels/*}:test"
      body: "*"
    };
    option (google.api.method_signature) = "name";
    option (metaxisdata.v1.permission) = "metaxisdata.settings.update";
  }

  // List outbound deliveries, newest first, for administrators to diagnose a
  // channel.
  rpc ListNotificationDeliveries(ListNotificationDeliveriesRequest) returns (ListNotificationDeliveriesResponse) {
    option (google.api.http) = {get: "/v1/{parent=workspaces/*}/notificationDeliveries"};
    option (google.api.method_signature) = "parent";
    option (metaxisdata.v1.permission) = "metaxisdata.settings.get";
  }

  // Requeue one delivery: a DEAD delivery becomes PENDING again and a delivered
  // or waiting one is left as it is.
  rpc RetryNotificationDelivery(RetryNotificationDeliveryRequest) returns (NotificationDelivery) {
    option (google.api.http) = {
      post: "/v1/{name=workspaces/*/notificationDeliveries/*}:retry"
      body: "*"
    };
    option (google.api.method_signature) = "name";
    option (metaxisdata.v1.permission) = "metaxisdata.settings.update";
    option (metaxisdata.v1.audit) = true;
  }
}

// NotificationType is what a notification is about. It selects which detail
// message the notification carries.
enum NotificationType {
  NOTIFICATION_TYPE_UNSPECIFIED = 0;
  // The outcome of one schema sync operation.
  NOTIFICATION_TYPE_SCHEMA_SYNC = 1;
  // An OpenLineage ingestion failure, or a dataset that could not be matched
  // to a registered instance.
  NOTIFICATION_TYPE_OPENLINEAGE = 2;
  // A data quality rule opened, recovered, failed to execute, or failed in a
  // storm that was merged into one summary.
  NOTIFICATION_TYPE_DATA_QUALITY = 3;
}

// NotificationSeverity ranks a notification for its recipient.
enum NotificationSeverity {
  NOTIFICATION_SEVERITY_UNSPECIFIED = 0;
  NOTIFICATION_SEVERITY_INFO = 1;
  NOTIFICATION_SEVERITY_WARNING = 2;
  NOTIFICATION_SEVERITY_ERROR = 3;
}

// SyncTrigger is what started the sync operation a notification reports.
enum SyncTrigger {
  SYNC_TRIGGER_UNSPECIFIED = 0;
  // A user asked for it. The initiator is the recipient.
  SYNC_TRIGGER_MANUAL = 1;
  // The periodic scan asked for it, so there is no initiator and the workspace
  // administrators are the recipients.
  SYNC_TRIGGER_BACKGROUND = 2;
}

// SyncDatabaseState is one database's outcome within a sync operation.
enum SyncDatabaseState {
  SYNC_DATABASE_STATE_UNSPECIFIED = 0;
  SYNC_DATABASE_STATE_SUCCEEDED = 1;
  SYNC_DATABASE_STATE_FAILED = 2;
  // The operation ended before this database produced a result, because its
  // deadline passed or its instance disappeared.
  SYNC_DATABASE_STATE_UNFINISHED = 3;
}

// OpenLineageFailureKind is why an OpenLineage request produced no lineage.
enum OpenLineageFailureKind {
  OPENLINEAGE_FAILURE_KIND_UNSPECIFIED = 0;
  // The event could not be parsed, or crossed a per-event limit.
  OPENLINEAGE_FAILURE_KIND_INVALID_EVENT = 1;
  // The request body or the batch crossed a transport limit.
  OPENLINEAGE_FAILURE_KIND_LIMIT_EXCEEDED = 2;
  // The event's namespace is not the one the ingestion key is scoped to.
  OPENLINEAGE_FAILURE_KIND_SCOPE_MISMATCH = 3;
  // The event could not be persisted.
  OPENLINEAGE_FAILURE_KIND_PERSIST_FAILED = 4;
  // The event was persisted but its lineage could not be derived.
  OPENLINEAGE_FAILURE_KIND_PROCESS_FAILED = 5;
  // The dataset matched no registered instance and was stored as an external
  // dataset, so any lineage naming it points at something the registry does not
  // describe. Check the instance's data source host and port, or add a
  // namespace mapping.
  OPENLINEAGE_FAILURE_KIND_NAMESPACE_UNMAPPED = 6;
}

// Notification is one in-app message for one recipient.
message Notification {
  // Format: workspaces/{workspace}/notifications/{id}
  string name = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp create_time = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  NotificationType type = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  NotificationSeverity severity = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // When the recipient read it. Unset means unread.
  google.protobuf.Timestamp read_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The body, interpreted by type. The server stores no prose: the client
  // renders the localized text from the detail and its own catalogs, so a
  // message reads in the user's language and an unknown type degrades to a
  // generic sentence instead of an empty row.
  oneof detail {
    SchemaSyncDetail schema_sync = 6;
    OpenLineageDetail openlineage = 7;
    DataQualityDetail data_quality = 8;
  }
}

// SchemaSyncDetail reports one sync operation: the instance metadata step plus
// every database that operation queued.
message SchemaSyncDetail {
  // Format: instances/{instance}
  string instance = 1;
  // The instance's display name, so the client can render the message without a
  // second read.
  string instance_title = 2;
  SyncTrigger trigger = 3;
  // Why the instance metadata step failed. Empty when it succeeded.
  string instance_error = 4;
  // The databases this message names, each with its outcome: the ones that failed
  // or never reported for an instance-wide sync, and the database itself for a sync
  // of one database. Successful databases are counted rather than listed.
  repeated SyncDatabaseResult databases = 5;
  int32 succeeded_count = 6;
  int32 failed_count = 7;
  int32 unfinished_count = 8;
}

// SyncDatabaseResult is one database's outcome in a schema sync operation.
message SyncDatabaseResult {
  // Format: instances/{instance}/databases/{database}
  string database = 1;
  SyncDatabaseState state = 2;
  // The sync error. Empty for UNFINISHED.
  string error = 3;
}

// OpenLineageDetail reports an OpenLineage ingestion failure, or a dataset that
// fell through to an external dataset.
message OpenLineageDetail {
  OpenLineageFailureKind kind = 1;
  // The namespace named by the event. Empty when the event did not parse.
  string namespace = 2;
  string job = 3;
  string run_id = 4;
  // The dataset that did not resolve. Only set for NAMESPACE_UNMAPPED.
  string dataset = 5;
  // The masked identifier of the ingestion key that submitted the request,
  // never the key itself.
  string api_key = 6;
  // How many events the request carried and how many of them failed.
  int32 received_count = 7;
  int32 failed_count = 8;
  string error = 9;
}

message ListNotificationsRequest {
  // Format: workspaces/{workspace}. "workspaces/-" is the current workspace.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];

  // The maximum number of notifications to return. If unspecified, at most 50
  // are returned. The maximum value is 1000; values above 1000 are coerced to
  // 1000.
  int32 page_size = 2;

  // A page token, received from a previous ListNotifications call. Provide this
  // to retrieve the subsequent page.
  string page_token = 3;

  // Return only unread notifications.
  bool unread_only = 4;
}

message ListNotificationsResponse {
  repeated Notification notifications = 1;
  string next_page_token = 2;
}

message GetUnreadNotificationCountRequest {
  // Format: workspaces/{workspace}. "workspaces/-" is the current workspace.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetUnreadNotificationCountResponse {
  int32 unread_count = 1;

  // The subset of unread_count written after the caller last opened the inbox.
  // This is the number the badge shows: opening the inbox clears it without
  // marking anything read, so an unread message stays unread until it is
  // clicked.
  int32 unseen_count = 2;
}

message MarkNotificationsSeenRequest {
  // Format: workspaces/{workspace}. "workspaces/-" is the current workspace.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];
}

message BatchMarkNotificationsReadRequest {
  // Format: workspaces/{workspace}. "workspaces/-" is the current workspace.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];

  // Format: workspaces/{workspace}/notifications/{id}
  repeated string names = 2 [(google.api.field_behavior) = REQUIRED];
}

message MarkAllNotificationsReadRequest {
  // Format: workspaces/{workspace}. "workspaces/-" is the current workspace.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];
}

message DeleteNotificationRequest {
  // Format: workspaces/{workspace}/notifications/{id}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "metaxisdata/Notification"}
  ];
}

message SubscribeNotificationsRequest {
  // Format: workspaces/{workspace}. "workspaces/-" is the current workspace.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];
}

message SubscribeNotificationsResponse {
  oneof event {
    // A notification written while the caller was connected.
    NotificationEvent notification = 1;
    // An empty message sent while nothing happens, so a proxy does not end an idle
    // stream — nginx would after proxy_read_timeout, which is 60 seconds by
    // default. The client ignores it.
    KeepAlive keep_alive = 2;
  }
}

message NotificationEvent {
  Notification notification = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The recipient's unread count after this notification was written. Absent when
  // it could not be read, in which case the client asks for the count itself
  // rather than showing a wrong number.
  optional int32 unread_count = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The recipient's unseen count after this notification was written — see
  // GetUnreadNotificationCountResponse.unseen_count. Absent under the same
  // condition as unread_count.
  optional int32 unseen_count = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// KeepAlive is the notification stream's heartbeat. It carries no data.
message KeepAlive {}

// DataQualityNotificationKind is the event a data quality notification reports.
enum DataQualityNotificationKind {
  DATA_QUALITY_NOTIFICATION_KIND_UNSPECIFIED = 0;
  // A rule started failing: an issue was opened.
  DATA_QUALITY_NOTIFICATION_KIND_ISSUE_OPENED = 1;
  // A previously failing rule passes again: its issue resolved itself.
  DATA_QUALITY_NOTIFICATION_KIND_ISSUE_RECOVERED = 2;
  // A rule could not be executed at all. This is not a data failure.
  DATA_QUALITY_NOTIFICATION_KIND_EXECUTION_FAILED = 3;
  // One run failed so many rules that the individual messages were merged.
  DATA_QUALITY_NOTIFICATION_KIND_STORM_SUMMARY = 4;
}

// DataQualityDetail reports one data quality event. The message carries facts
// only; the client renders the localized sentence from the kind and these fields.
message DataQualityDetail {
  DataQualityNotificationKind kind = 1;
  // Format: workspaces/{workspace}/qualityRules/{quality_rule}
  string rule = 2;
  string rule_title = 3;
  // The registry GUID of the rule's target.
  string target_guid = 4;
  // The display path: instance/database/schema/table[.column].
  string target_path = 5;
  QualityStatus from_status = 6;
  QualityStatus to_status = 7;
  QualitySeverity severity = 8;
  // The observed value and its unit ("rows", "%", "s", "timestamp").
  double observed_value = 9;
  string observed_unit = 10;
  // Format: workspaces/{workspace}/qualityIssues/{quality_issue}
  string issue = 11;
  // Format: workspaces/{workspace}/qualityExecutions/{quality_execution}
  string execution = 12;
  int64 failed_rows = 13;
  int64 total_rows = 14;
  // The machine-readable failure class for EXECUTION_FAILED.
  string error_code = 15;
  // The tallies a STORM_SUMMARY merged.
  int32 failed_rule_count = 16;
  int32 total_rule_count = 17;
  // The instance whose dispatch batch the summary describes. Format:
  // instances/{instance}. Empty for the per-execution kinds.
  string instance = 18;
}

// NotificationChannelKind is the protocol one outbound channel speaks. The kind
// decides the config shape and which credential fields are required.
enum NotificationChannelKind {
  NOTIFICATION_CHANNEL_KIND_UNSPECIFIED = 0;
  // A generic HTTP endpoint that receives the delivery JSON, optionally signed.
  NOTIFICATION_CHANNEL_KIND_WEBHOOK = 1;
  // A DingTalk group robot, optionally signed.
  NOTIFICATION_CHANNEL_KIND_DINGTALK = 2;
  // A WeCom group robot. Its bot key is part of the endpoint.
  NOTIFICATION_CHANNEL_KIND_WECOM = 3;
  // A Feishu custom bot, optionally signed.
  NOTIFICATION_CHANNEL_KIND_FEISHU = 4;
  // An email sent through the workspace email setting.
  NOTIFICATION_CHANNEL_KIND_EMAIL = 5;
}

// NotificationChannel is one configured outbound destination. The credential is
// write-only: reads report only whether one is stored.
message NotificationChannel {
  option (google.api.resource) = {
    type: "metaxisdata/NotificationChannel"
    pattern: "workspaces/{workspace}/notificationChannels/{notification_channel}"
  };

  // Format: workspaces/{workspace}/notificationChannels/{notification_channel}
  string name = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The administrator-facing name, for example "Data quality on-call".
  string display_name = 2 [(google.api.field_behavior) = REQUIRED];

  NotificationChannelKind kind = 3 [(google.api.field_behavior) = IMMUTABLE];

  // A disabled channel is kept but receives no new deliveries.
  bool enabled = 4;

  // The notification types this channel subscribes to. Empty means every type.
  repeated NotificationType event_types = 5;

  // The lowest severity this channel delivers. UNSPECIFIED means every severity.
  NotificationSeverity min_severity = 6;

  // BCP-47 tag the outbound text is written in. Empty means the server default.
  string language = 7;

  // The kind's configuration. The oneof case must match kind and cannot change:
  // the kind is immutable, and a config of another case has no delivery path.
  NotificationChannelConfig config = 8;

  // Whether a credential is stored. The credential itself is never returned.
  bool secret_set = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  google.protobuf.Timestamp create_time = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp update_time = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message NotificationChannelConfig {
  oneof config {
    WebhookChannelConfig webhook = 1;
    DingTalkChannelConfig dingtalk = 2;
    WeComChannelConfig wecom = 3;
    FeishuChannelConfig feishu = 4;
    EmailChannelConfig email = 5;
  }
}

message WebhookChannelConfig {
  // Whether the delivery body is signed with the channel's signing secret.
  bool sign = 1;
}

message DingTalkChannelConfig {
  // Whether the robot request is signed with the channel's signing secret.
  bool sign = 1;
}

// WeComChannelConfig has no options: the robot key is the endpoint's query.
message WeComChannelConfig {}

message FeishuChannelConfig {
  // Whether the bot request is signed with the channel's signing secret.
  bool sign = 1;
}

// EmailChannelConfig decides who receives the email for an event.
message EmailChannelConfig {
  // Addresses that receive every event the channel subscribes to, for example a
  // team or on-call list.
  repeated string addresses = 1;

  // Whether the people the event concerns also receive the email: the rule's
  // owner, the initiator of a sync operation, or the workspace administrators
  // for an event that concerns nobody in particular. At least one address or
  // this flag is required.
  bool include_audience = 2;
}

// NotificationChannelSecret is the write-only credential of a channel.
message NotificationChannelSecret {
  // The endpoint to POST to. Required when creating a webhook-like channel
  // (webhook, DingTalk, WeCom or Feishu); an unset secret on update keeps the
  // stored one.
  string endpoint = 1;

  // The signing key: the HMAC-SHA256 key of a webhook body, or the robot's
  // signing secret. Required when the channel's config signs, and ignored
  // otherwise.
  string signing_secret = 2;
}

// NotificationDeliveryState is the lifecycle of one outbound delivery.
enum NotificationDeliveryState {
  NOTIFICATION_DELIVERY_STATE_UNSPECIFIED = 0;
  // Waiting for its next attempt, or for a retry an administrator asked for.
  NOTIFICATION_DELIVERY_STATE_PENDING = 1;
  // Leased by a dispatcher.
  NOTIFICATION_DELIVERY_STATE_SENDING = 2;
  // Delivered. Terminal.
  NOTIFICATION_DELIVERY_STATE_SENT = 3;
  // Out of automatic attempts; an administrator can retry it.
  NOTIFICATION_DELIVERY_STATE_DEAD = 4;
}

// NotificationDelivery is one outbound attempt at one notification event for one
// channel. A failing event fans out to as many deliveries as channels it matched.
message NotificationDelivery {
  option (google.api.resource) = {
    type: "metaxisdata/NotificationDelivery"
    pattern: "workspaces/{workspace}/notificationDeliveries/{notification_delivery}"
  };

  // Format: workspaces/{workspace}/notificationDeliveries/{notification_delivery}.
  // The last segment is the row id.
  string name = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Format: workspaces/{workspace}/notificationChannels/{notification_channel}
  string channel = 2 [(google.api.resource_reference) = {type: "metaxisdata/NotificationChannel"}];

  // The channel display name as it was when the delivery was queued.
  string channel_name = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  NotificationType event_type = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  NotificationSeverity severity = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  NotificationDeliveryState state = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // How many automatic attempts were made.
  int32 attempts = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Why the last attempt failed. Empty unless it did.
  string last_error = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  google.protobuf.Timestamp create_time = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the next automatic attempt is due. Set while the delivery is PENDING or
  // SENDING (where it is the lease deadline); unset for SENT and DEAD.
  google.protobuf.Timestamp next_attempt_time = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When it was delivered. Unset unless it was.
  google.protobuf.Timestamp sent_time = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ListNotificationChannelsRequest {
  // Format: workspaces/{workspace}
  string parent = 1 [(google.api.field_behavior) = REQUIRED];
}

message ListNotificationChannelsResponse {
  repeated NotificationChannel notification_channels = 1;
}

message GetNotificationChannelRequest {
  // Format: workspaces/{workspace}/notificationChannels/{notification_channel}
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}

message CreateNotificationChannelRequest {
  // Format: workspaces/{workspace}
  string parent = 1 [(google.api.field_behavior) = REQUIRED];

  NotificationChannel channel = 2 [(google.api.field_behavior) = REQUIRED];

  NotificationChannelSecret secret = 3;
}

message UpdateNotificationChannelRequest {
  NotificationChannel channel = 1 [(google.api.field_behavior) = REQUIRED];

  NotificationChannelSecret secret = 2;

  google.protobuf.FieldMask update_mask = 3;
}

message DeleteNotificationChannelRequest {
  // Format: workspaces/{workspace}/notificationChannels/{notification_channel}
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}

message TestNotificationChannelRequest {
  // Format: workspaces/{workspace}/notificationChannels/{notification_channel}
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}

message TestNotificationChannelResponse {
  // The endpoint's answer, trimmed for display.
  string response = 1;
}

message ListNotificationDeliveriesRequest {
  // Format: workspaces/{workspace}
  string parent = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional channel filter.
  // Format: workspaces/{workspace}/notificationChannels/{notification_channel}
  string channel = 2 [(google.api.resource_reference) = {type: "metaxisdata/NotificationChannel"}];

  NotificationDeliveryState state = 3;

  // Default 50, maximum 1000.
  int32 page_size = 4;
  // The token from the previous response; a follow-up keeps the page size the
  // token was issued with when page_size is unset.
  string page_token = 5;
}

message ListNotificationDeliveriesResponse {
  repeated NotificationDelivery notification_deliveries = 1;
  string next_page_token = 2;
}

message RetryNotificationDeliveryRequest {
  // Format: workspaces/{workspace}/notificationDeliveries/{notification_delivery}
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}
