syntax = "proto3";

package metaxisdata.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/type/expr.proto";
import "v1/annotation.proto";

option go_package = "github.com/Ranxy/metaxisdata/backend/generated-go/v1";

// Binding binds one role to a set of principals. It is the v1 view of the
// stored IAM binding; the workspace IAM policy is written whole through
// IamService.SetWorkspaceIamPolicy.
message Binding {
  // The role that is assigned to the members.
  // Format: roles/{role}
  string role = 1;

  // The principals requesting access.
  // For users: users/{userUID}; for groups: groups/{email}; the pseudo-member
  // allUsers matches every authenticated principal, including the ones who
  // register later, so it is accepted only on the roles/workspaceMember
  // baseline binding. That binding is server-managed: it cannot be edited or
  // dropped, and a Set whose policy omits it is rejected.
  repeated string members = 2;

  // The condition that is associated with this binding. When present the
  // binding applies only while the condition evaluates to true.
  google.type.Expr condition = 3;
}

message IamPolicy {
  // A binding binds one role to one or more members.
  repeated Binding bindings = 1;
}

// IamPolicyView is an IAM policy together with its etag. The etag is returned
// by Get and must be supplied on Set for optimistic concurrency: a Set whose
// etag does not match the stored policy's etag is rejected with
// connect.CodeAborted so the caller can re-fetch and retry. An empty etag
// skips the check (first write).
message IamPolicyView {
  IamPolicy policy = 1;
  string etag = 2;
}

// IamGrant binds one role to one member at one resource scope. The workspace
// policy remains the root; a grant is additive over the resource subtree.
message IamGrant {
  // Format: iamGrants/{iam_grant}
  string name = 1;

  // The scoped resource: instances/{instance} or
  // instances/{instance}/databases/{database}. The server maps it to the
  // resource type and id the ledger stores.
  string resource = 2 [(google.api.field_behavior) = REQUIRED];

  // Format: roles/{role}
  string role = 3 [(google.api.field_behavior) = REQUIRED];

  // Format: users/{id} or groups/{email}. allUsers is the workspace read
  // baseline and is not accepted as a scoped grant member.
  string member = 4 [(google.api.field_behavior) = REQUIRED];

  // The condition associated with this grant. When present the grant applies
  // only while the condition evaluates to true; only request.time is bound.
  google.type.Expr condition = 5;

  google.protobuf.Timestamp create_time = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Format: users/{user}. Empty when the creator is no longer resolvable.
  string created_by = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ListIamGrantsRequest {
  // Restrict to one scope; empty lists every scoped grant.
  string resource = 1;

  int32 page_size = 2;
  string page_token = 3;
}

message ListIamGrantsResponse {
  repeated IamGrant grants = 1;
  string next_page_token = 2;
}

message CreateIamGrantRequest {
  IamGrant grant = 1 [(google.api.field_behavior) = REQUIRED];
}

message DeleteIamGrantRequest {
  // Format: iamGrants/{iam_grant}
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetWorkspaceIamPolicyRequest {}

message SetWorkspaceIamPolicyRequest {
  IamPolicy policy = 1 [(google.api.field_behavior) = REQUIRED];

  // The etag from the last GetWorkspaceIamPolicy. Empty means "do not check".
  string etag = 2;
}

// IamService exposes the workspace IAM policy for management. Get reads the
// whole policy; Set replaces it whole, guarded by the etag. Both RPCs are gated
// by metaxisdata.iam.getPolicy / metaxisdata.iam.setPolicy.
service IamService {
  // Get the workspace IAM policy.
  rpc GetWorkspaceIamPolicy(GetWorkspaceIamPolicyRequest) returns (IamPolicyView) {
    option (google.api.http) = {get: "/v1/iamPolicy"};
    option (metaxisdata.v1.permission) = "metaxisdata.iam.getPolicy";
  }

  // Set the workspace IAM policy (full replace, etag-guarded).
  rpc SetWorkspaceIamPolicy(SetWorkspaceIamPolicyRequest) returns (IamPolicyView) {
    option (google.api.http) = {
      put: "/v1/iamPolicy"
      body: "*"
    };
    option (metaxisdata.v1.permission) = "metaxisdata.iam.setPolicy";
    option (metaxisdata.v1.audit) = true;
  }

  // List the scoped grants, optionally narrowed to one resource.
  rpc ListIamGrants(ListIamGrantsRequest) returns (ListIamGrantsResponse) {
    option (google.api.http) = {get: "/v1/iamGrants"};
    option (metaxisdata.v1.permission) = "metaxisdata.iam.getPolicy";
  }

  // Add one scoped grant. Additive to the workspace policy.
  rpc CreateIamGrant(CreateIamGrantRequest) returns (IamGrant) {
    option (google.api.http) = {
      post: "/v1/iamGrants"
      body: "grant"
    };
    option (metaxisdata.v1.permission) = "metaxisdata.iam.setPolicy";
    option (metaxisdata.v1.audit) = true;
  }

  // Delete one scoped grant.
  rpc DeleteIamGrant(DeleteIamGrantRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/{name=iamGrants/*}"};
    option (metaxisdata.v1.permission) = "metaxisdata.iam.setPolicy";
    option (metaxisdata.v1.audit) = true;
  }
}
