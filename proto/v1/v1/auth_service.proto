syntax = "proto3";

package metaxisdata.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "v1/annotation.proto";
import "v1/user_service.proto";

option go_package = "github.com/Ranxy/metaxisdata/backend/generated-go/v1";

service AuthService {
  // Permissions required: None
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/v1/auth/login"
      body: "*"
    };
    option (metaxisdata.v1.allow_without_credential) = true;
    option (metaxisdata.v1.audit) = true;
  }

  // Permissions required: None
  rpc Logout(LogoutRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/auth/logout"
      body: "*"
    };
    option (metaxisdata.v1.allow_without_credential) = true;
    option (metaxisdata.v1.audit) = true;
  }

  // CreateSSOState issues a one-time OAuth2 state value. A client must fetch it
  // before redirecting to the identity provider, pass it back to the provider
  // and then send it with the login request; the server consumes it there.
  // Without it an attacker can complete an authorization-code flow in a
  // victim's browser and bind the victim's session to the attacker's identity.
  // Permissions required: None
  rpc CreateSSOState(google.protobuf.Empty) returns (CreateSSOStateResponse) {
    option (google.api.http) = {
      post: "/v1/auth/ssoState"
      body: "*"
    };
    option (metaxisdata.v1.allow_without_credential) = true;
  }
}

message CreateSSOStateResponse {
  string state = 1;
}

message LoginRequest {
  string email = 1;

  string password = 2;

  // If web is set, we will set access token, refresh token, and user to the cookie.
  bool web = 3;

  // The name of the identity provider.
  // Format: idps/{idp}
  string idp_name = 4;

  // The idp_context is using to get the user information from identity provider.
  IdentityProviderContext idp_context = 5;
}

message IdentityProviderContext {
  oneof context {
    OAuth2IdentityProviderContext oauth2_context = 1;
  }
}

message OAuth2IdentityProviderContext {
  string code = 1;

  // The state issued by CreateSSOState. Required: the server rejects a login
  // whose state is missing, unknown or already used.
  string state = 2;

  // code_verifier is the PKCE verifier matching the code_challenge sent to the
  // identity provider. Optional; providers that do not use PKCE ignore it.
  string code_verifier = 3;
}

message LoginResponse {
  string token = 1;

  bool require_reset_password = 3;

  // The user of successful login.
  User user = 4;
}

message LogoutRequest {}
