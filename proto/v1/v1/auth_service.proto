syntax = "proto3";

package metaxisdata.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "v1/annotation.proto";
import "v1/user_service.proto";

option go_package = "github.com/Ranxy/metaxisdata/backend/generated-go/v1";

service AuthService {
  // Permissions required: None
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/v1/auth/login"
      body: "*"
    };
    option (metaxisdata.v1.allow_without_credential) = true;
    option (metaxisdata.v1.audit) = true;
  }

  // Permissions required: None
  rpc Logout(LogoutRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/auth/logout"
      body: "*"
    };
    option (metaxisdata.v1.allow_without_credential) = true;
    option (metaxisdata.v1.audit) = true;
  }

  // CreateSSOState issues a one-time OAuth2 state value. A client must fetch it
  // before redirecting to the identity provider, pass it back to the provider
  // and then send it with the login request; the server consumes it there.
  // Without it an attacker can complete an authorization-code flow in a
  // victim's browser and bind the victim's session to the attacker's identity.
  // Permissions required: None
  rpc CreateSSOState(google.protobuf.Empty) returns (CreateSSOStateResponse) {
    option (google.api.http) = {
      post: "/v1/auth/ssoState"
      body: "*"
    };
    option (metaxisdata.v1.allow_without_credential) = true;
  }

  // CreateDeviceLogin starts a device login (RFC 8628 style). The caller gets a
  // polling secret plus a short human-readable code; a signed-in user approves
  // the request from the web confirmation page and the CLI then exchanges the
  // secret for an access token bound to that user.
  // Permissions required: None
  rpc CreateDeviceLogin(CreateDeviceLoginRequest) returns (CreateDeviceLoginResponse) {
    option (google.api.http) = {
      post: "/v1/auth/deviceLogins"
      body: "*"
    };
    option (metaxisdata.v1.allow_without_credential) = true;
    option (metaxisdata.v1.audit) = true;
  }

  // GetDeviceLogin returns one pending device login so the confirmation page can
  // show what is being approved.
  // Permissions required: None
  rpc GetDeviceLogin(GetDeviceLoginRequest) returns (DeviceLogin) {
    option (google.api.http) = {get: "/v1/{name=deviceLogins/*}"};
  }

  // ApproveDeviceLogin approves or denies a pending device login. The approver
  // becomes the identity the access token is issued for.
  // Permissions required: None
  rpc ApproveDeviceLogin(ApproveDeviceLoginRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/{name=deviceLogins/*}:approve"
      body: "*"
    };
    option (metaxisdata.v1.audit) = true;
  }

  // ExchangeDeviceLogin polls a device login. An approved request is consumed
  // and answered with the token; every other state is reported as-is.
  // Permissions required: None
  rpc ExchangeDeviceLogin(ExchangeDeviceLoginRequest) returns (ExchangeDeviceLoginResponse) {
    option (google.api.http) = {
      post: "/v1/auth/deviceLogins:exchange"
      body: "*"
    };
    option (metaxisdata.v1.allow_without_credential) = true;
  }
}

message CreateSSOStateResponse {
  string state = 1;
}

message LoginRequest {
  string email = 1;

  string password = 2;

  // If web is set, we will set access token, refresh token, and user to the cookie.
  bool web = 3;

  // The name of the identity provider.
  // Format: idps/{idp}
  string idp_name = 4;

  // The idp_context is using to get the user information from identity provider.
  IdentityProviderContext idp_context = 5;
}

message IdentityProviderContext {
  oneof context {
    OAuth2IdentityProviderContext oauth2_context = 1;
  }
}

message OAuth2IdentityProviderContext {
  string code = 1;

  // The state issued by CreateSSOState. Required: the server rejects a login
  // whose state is missing, unknown or already used.
  string state = 2;

  // code_verifier is the PKCE verifier matching the code_challenge sent to the
  // identity provider. Optional; providers that do not use PKCE ignore it.
  string code_verifier = 3;
}

message LoginResponse {
  // The access token. Empty for a web login, which carries the token in an
  // HttpOnly cookie instead.
  string token = 1;

  // Whether the workspace password policy requires the user to rotate their
  // password before doing anything else. When true, the issued token is
  // restricted to changing the user's own password (and logging out).
  bool require_reset_password = 3;

  // The user of successful login.
  User user = 4;
}

message LogoutRequest {}

message CreateDeviceLoginRequest {
  // A human-readable client name for the confirmation page, e.g. "mxd". It is
  // display only and never trusted.
  string client_name = 1;

  string client_version = 2;
}

message CreateDeviceLoginResponse {
  // The polling secret. Only the client that created the request holds it, and
  // it never appears in a URL or in an audit record.
  string device_code = 1;

  // The human-readable code the user types on the confirmation page, in
  // Crockford base32 with an "XXXX-XXXX" layout.
  string user_code = 2;

  // The bare confirmation address, `{external_url}/device`. Empty when the
  // workspace has no external URL configured.
  string verification_uri = 3;

  // The confirmation address with the code prefilled. Clients should only use
  // it when the user explicitly asked to skip typing the code.
  string verification_uri_complete = 4;

  // Lifetime of this request in seconds.
  int32 expires_in = 5;

  // The minimum polling interval in seconds.
  int32 interval = 6;
}

message GetDeviceLoginRequest {
  // The name of the device login to read.
  // Format: deviceLogins/{user_code}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "metaxisdata/DeviceLogin"}
  ];
}

// DeviceLogin is a pending or resolved device authorization request. Its
// resource name is derived from the human-readable code so the confirmation
// page needs nothing else.
message DeviceLogin {
  option (google.api.resource) = {
    type: "metaxisdata/DeviceLogin"
    pattern: "deviceLogins/{device_login}"
  };

  // Format: deviceLogins/{user_code}
  string name = 1;

  DeviceLoginState state = 2;

  string user_code = 3;

  google.protobuf.Timestamp create_time = 4;

  google.protobuf.Timestamp expire_time = 5;

  string client_name = 6;

  string client_version = 7;

  // The source address the request came from, as the server sees it (it
  // follows the trusted-proxy rules).
  string request_ip = 8;

  string request_user_agent = 9;

  // The user who approved the request, once it is approved.
  User approved_by = 10;
}

enum DeviceLoginState {
  DEVICE_LOGIN_STATE_UNSPECIFIED = 0;
  PENDING = 1;
  APPROVED = 2;
  DENIED = 3;
  EXPIRED = 4;
}

message ApproveDeviceLoginRequest {
  // Format: deviceLogins/{user_code}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "metaxisdata/DeviceLogin"}
  ];

  bool approve = 2;
}

message ExchangeDeviceLoginRequest {
  string device_code = 1 [(google.api.field_behavior) = REQUIRED];
}

message ExchangeDeviceLoginResponse {
  DeviceLoginState state = 1;

  // The access token, returned only when the request was approved. The device
  // login is consumed at the same time, so a second exchange finds nothing.
  string token = 2;

  // The remaining lifetime of the token in seconds.
  int64 expires_in = 3;

  // The user who approved the request.
  User user = 4;
}
