syntax = "proto3";

package metaxisdata.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "v1/annotation.proto";
import "v1/database_service.proto";

option go_package = "github.com/Ranxy/metaxisdata/backend/generated-go/v1";

service LineageService {
  // GetLineage returns the lineage relations for the given metadata.
  // The lineage relations can be either source lineage or target lineage,
  // depending on the lineage_type specified in the request.
  // If lineage_type is not specified, both source and target lineage will be returned.
  rpc GetLineage(GetLineageRequest) returns (GetLineageResponse) {
    option (google.api.http) = {get: "/v1/lineages"};
    option (metaxisdata.v1.permission) = "metaxisdata.lineage.get";
  }

  // GetLineageForContext retrieves the field-level lineage graph derived from a specific SQL context (e.g., view, stored procedure).
  rpc GetLineageForContext(GetLineageForContextRequest) returns (GetLineageForContextResponse) {
    option (google.api.http) = {get: "/v1/lineages:context"};
    option (metaxisdata.v1.permission) = "metaxisdata.lineage.get";
  }

  // AnalyzeSQL parses an arbitrary SQL statement and returns its column-level
  // relations, resolved against one or more analysis scopes. The analysis is
  // stateless: nothing is persisted and no lineage runner is triggered, so the
  // result describes this statement only and is not part of the stored graph.
  rpc AnalyzeSQL(AnalyzeSQLRequest) returns (AnalyzeSQLResponse) {
    option (google.api.http) = {
      post: "/v1/lineages:analyzeSql"
      body: "*"
    };
    option (metaxisdata.v1.permission) = "metaxisdata.lineage.get";
  }

  // GetLineageGraph returns the multi-level lineage graph around one metadata
  // object in a single call, instead of expanding it one hop at a time with
  // GetLineage.
  rpc GetLineageGraph(GetLineageGraphRequest) returns (GetLineageGraphResponse) {
    option (google.api.http) = {get: "/v1/lineages:graph"};
    option (metaxisdata.v1.permission) = "metaxisdata.lineage.get";
  }
}

enum LineageType {
  LINEAGE_TYPE_UNSPECIFIED = 0;
  SOURCE = 1;
  TARGET = 2;
}

enum RelationType {
  RELATION_TYPE_UNSPECIFIED = 0;
  // DIRECT means the source column is directly used in the target column without transformation. For example: select source_column as target_column from table.
  DIRECT = 1;
  // INDIRECT means the source column is used in the target column with transformation. For example: select concat(source_column, 'abc') as target_column
  INDIRECT = 2;
}

message LineageRelation {
  int64 id = 1;
  string meta_guid = 2;
  MetaType meta_type = 3;
  string source_guid = 4;
  string source_column = 5;
  MetaType source_type = 6;
  string target_guid = 7;
  string target_column = 8;
  MetaType target_type = 9;
  RelationType relation_type = 10;
  repeated Transformation transformations = 11;
  google.protobuf.Timestamp updated_at = 12;
}

// Transformation describes one step of how a source column becomes a target
// column, derived from the view's SQL.
message Transformation {
  // The transformation kind: DELETE, UNION, PROJECT, FUNCTION, AGGREGATE,
  // WINDOW, OPERATOR or CASE.
  string operation = 1;
  // The text representation of the expression (most kinds).
  string expression = 2;
  // The function name (FUNCTION, AGGREGATE, WINDOW).
  string function_name = 3;
  // The function arguments (FUNCTION).
  repeated string arguments = 4;
  // The GROUP BY keys (AGGREGATE).
  repeated string group_keys = 5;
  // The PARTITION BY columns (WINDOW).
  repeated string partition_by = 6;
  // The ORDER BY columns (WINDOW).
  repeated string order_by = 7;
  // The operator type, e.g. "+", "=" (OPERATOR).
  string op_type = 8;
  // The WHERE condition (DELETE).
  string condition = 9;
}

message GetLineageRequest {
  // The global unique id for metadata
  // table: "instance_1;db2;schema3;table4"
  string guid = 1 [(google.api.field_behavior) = REQUIRED];
  MetaType meta_type = 2;
  // The lineage type to query, source or target. If not specified, both source and target lineage will be returned.
  LineageType lineage_type = 3;

  // The maximum number of relations to return. The service may return fewer
  // than this value. page_size applies to relations_source and relations_target
  // separately.
  // If unspecified, at most 500 relations are returned per list. The maximum
  // value is 5000; values above 5000 will be coerced to 5000.
  int32 page_size = 4;

  // A page token, received from a previous `GetLineage` call.
  // Provide this to retrieve the subsequent page.
  //
  // When paginating, all other parameters provided to `GetLineage` must match
  // the call that provided the page token.
  string page_token = 5;
}

message GetLineageResponse {
  // The list of lineage relations for the given metadata.
  repeated LineageRelation relations_source = 1;
  repeated LineageRelation relations_target = 2;
  // Metadata for external datasets referenced in the lineage relations.
  repeated ExternalDatasetInfo external_datasets = 3;

  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 4;
}

// ExternalDatasetInfo provides metadata for a dataset outside of managed instances.
message ExternalDatasetInfo {
  string guid = 1;
  // The OpenLineage namespace, e.g. "postgres://host:5432".
  string namespace = 2;
  // The dataset name, e.g. "db.schema.table" or "s3://bucket/path".
  string name = 3;
  // The dataset type, e.g. "s3", "kafka", "database".
  string dataset_type = 4;
}

message GetLineageForContextRequest {
  // The global unique id for metadata
  // view: "instance_1;db2;schema3;view1"
  string guid = 1 [(google.api.field_behavior) = REQUIRED];
  MetaType meta_type = 2;

  // The maximum number of relations to return. The service may return fewer
  // than this value.
  // If unspecified, at most 500 relations are returned. The maximum value is
  // 5000; values above 5000 will be coerced to 5000.
  int32 page_size = 3;

  // A page token, received from a previous `GetLineageForContext` call.
  // Provide this to retrieve the subsequent page.
  //
  // When paginating, all other parameters provided to `GetLineageForContext`
  // must match the call that provided the page token.
  string page_token = 4;
}

message GetLineageForContextResponse {
  // The list of lineage relations for the given metadata.
  repeated LineageRelation relations = 1;

  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// AnalysisScope is one resolution context for a SQL statement: a named database
// (MySQL family) or schema (PostgreSQL-like). `name` is an opaque
// caller-supplied label that is echoed back so results can be attributed; the
// server attaches no meaning to it.
message AnalysisScope {
  string name = 1;

  // The metadata GUID of the database or schema the statement is resolved
  // against, e.g. "instance_1;db2" or "instance_1;db2;public". It only supplies
  // the default instance/database/schema for unqualified names; the existence
  // of the database or schema is not validated.
  string guid = 2 [(google.api.field_behavior) = REQUIRED];
}

message AnalyzeSQLRequest {
  // The scopes to resolve the statement against, at most 10. The statement is
  // analyzed once per scope, independently: the scopes may live on different
  // instances and even different engines, and their results are not merged.
  // Selecting several scopes does not discover cross-scope relations that are
  // absent from the metadata.
  repeated AnalysisScope scopes = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = NON_EMPTY_DEFAULT
  ];

  // The SQL statement to analyze.
  string sql_text = 2 [(google.api.field_behavior) = REQUIRED];
}

message AnalyzeSQLResponse {
  // One result per requested scope, in the same order.
  repeated AnalyzeSQLResult results = 1;

  // Warnings that apply to the request as a whole.
  repeated string warnings = 2;
}

message AnalyzeSQLResult {
  // The scope name from the request, echoed back.
  string scope_name = 1;

  string scope_guid = 2;

  repeated AnalyzeSQLRelation relations = 3;

  // Warnings that only affect this scope, such as an engine without a lineage
  // analyzer. They never fail the whole request.
  repeated string warnings = 4;
}

message AnalyzeSQLRelation {
  // The table-level GUID of the source column, with instance/database/schema
  // filled in from the scope. It is reported even when the object is not in the
  // metadata registry.
  string source_guid = 1;

  string source_column = 2;

  // TABLE/VIEW/... when the object is found in the metadata registry.
  MetaType source_type = 3;

  // Empty when the target is a synthetic object that only exists inside the
  // statement (the result of a bare SELECT, a CTE, a subquery). In that case
  // target_column is the output alias of the query and is_temp is true.
  string target_guid = 4;

  string target_column = 5;

  MetaType target_type = 6;

  RelationType relation_type = 7;

  repeated Transformation transformations = 8;

  bool is_temp = 9;
}

message GetLineageGraphRequest {
  // The global unique id for metadata
  // table: "instance_1;db2;schema3;table4"
  string guid = 1 [(google.api.field_behavior) = REQUIRED];

  MetaType meta_type = 2;

  // Which direction to walk: SOURCE looks upstream only, TARGET downstream
  // only, and leaving it unset walks both.
  LineageType lineage_type = 3;

  // How many hops to expand, 1 to 10. Defaults to 3.
  int32 depth = 4;
}

message GetLineageGraphResponse {
  string root_guid = 1;

  // The table-, view- and dataset-level objects in the graph.
  repeated LineageNode nodes = 2;

  // The column-level edges between those objects.
  repeated LineageRelation edges = 3;

  // Metadata for external datasets referenced in the edges.
  repeated ExternalDatasetInfo external_datasets = 4;

  // The number of hops actually expanded.
  int32 depth_reached = 5;

  // Whether a node, edge or time budget stopped the expansion early.
  bool truncated = 6;
}

// LineageNode is one object in the multi-level graph. Only column-level edges
// are stored, so the table-level relations are the collapse of those edges: an
// object whose definition yields no column-level relation at all (for example a
// bare `SELECT count(*)`, or an object that was never synced) does not appear.
message LineageNode {
  string guid = 1;

  MetaType meta_type = 2;

  // The object name; the dataset name for an external dataset.
  string name = 3;

  string database = 4;

  string schema = 5;

  string instance_id = 6;

  // Hops from the root: negative upstream, positive downstream.
  int32 distance = 7;
}
