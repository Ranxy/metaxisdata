syntax = "proto3";

package metaxisdata.store;

import "google/protobuf/timestamp.proto";

option go_package = "generated-go/store";

// OpenLineageRunSummary stores what one persisted OpenLineage run is: its
// identity, the task it belongs to, and the state it was last seen in.
//
// What its payload yields about datasets (input_count, output_count,
// has_lineage) and when the row was written (created_at, updated_at) are
// deliberately absent. They are the run table's to hold. Keeping them here gave
// one run's state more than one fingerprint, since updated_at moves on every
// delivery.
message OpenLineageRunSummary {
  string guid = 1;
  string task_guid = 2;
  string run_id = 3;
  string job_namespace = 4;
  string job_name = 5;
  string job_type = 6;
  string event_type = 7;
  google.protobuf.Timestamp event_time = 8;
  string producer = 9;
  string source = 10;
  string integration = 11;
  string processing_type = 12;
  string parent_job_namespace = 13;
  string parent_job_name = 14;
  string parent_run_id = 15;
  string root_job_namespace = 16;
  string root_job_name = 17;
  string root_run_id = 18;

  reserved 19 to 23;
  reserved "input_count", "output_count", "has_lineage", "created_at", "updated_at";
}

// OpenLineageTaskSummary stores what an aggregated task/job is: its identity and
// the job-level facets its runs report.
//
// Everything the task table derives from its runs - the latest run it saw and
// the counters over them - is deliberately absent. Mirroring them made the
// snapshot a second copy of the event stream, with a fingerprint that moved on
// every ingested event instead of when the job changed. The read path joins the
// run for those.
message OpenLineageTaskSummary {
  string guid = 1;
  string job_namespace = 2;
  string job_name = 3;
  string job_type = 4;
  string integration = 5;
  string processing_type = 6;
  string parent_job_namespace = 7;
  string parent_job_name = 8;
  string root_job_namespace = 9;
  string root_job_name = 10;

  reserved 11 to 20;
  reserved "latest_run_guid", "latest_run_id", "latest_event_time", "latest_producer", "latest_source", "run_count", "lineage_run_count", "created_at", "updated_at", "latest_event_type";
}
