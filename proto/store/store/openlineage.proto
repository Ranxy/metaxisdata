syntax = "proto3";

package metaxisdata.store;

import "google/protobuf/timestamp.proto";

option go_package = "generated-go/store";

// ExternalDataset represents a dataset outside of the managed instances,
// discovered through OpenLineage events (e.g., S3, Kafka, external databases).
message ExternalDataset {
  string guid = 1;
  string namespace = 2;
  string name = 3;
  string dataset_type = 4;
  repeated SchemaField schema_fields = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

// SchemaField describes a single field in a dataset schema.
message SchemaField {
  string name = 1;
  string type = 2;
  string description = 3;
}

// NamespaceMapping maps an OpenLineage namespace to an internal instance.
message NamespaceMapping {
  int64 id = 1;
  // The OpenLineage namespace, e.g. "postgres://host:5432".
  string namespace = 2;
  // The resource ID of the matched instance.
  string instance_resource_id = 3;
  // Optional database name override. If empty, the database is inferred from the dataset name.
  string database_name = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

// OpenLineageRunSummary stores the normalized metadata for a persisted COMPLETE run.
message OpenLineageRunSummary {
  string guid = 1;
  string task_guid = 2;
  string run_id = 3;
  string job_namespace = 4;
  string job_name = 5;
  string job_type = 6;
  string event_type = 7;
  google.protobuf.Timestamp event_time = 8;
  string producer = 9;
  string source = 10;
  string integration = 11;
  string processing_type = 12;
  string parent_job_namespace = 13;
  string parent_job_name = 14;
  string parent_run_id = 15;
  string root_job_namespace = 16;
  string root_job_name = 17;
  string root_run_id = 18;
  int32 input_count = 19;
  int32 output_count = 20;
  bool has_lineage = 21;
  google.protobuf.Timestamp created_at = 22;
  google.protobuf.Timestamp updated_at = 23;
}

// OpenLineageRun stores the normalized metadata together with the raw payload.
message OpenLineageRun {
  int64 id = 1;
  OpenLineageRunSummary summary = 2;
  bytes raw_payload = 3;
}

// OpenLineageTaskSummary stores the aggregated task/job-level view derived from persisted runs.
message OpenLineageTaskSummary {
  string guid = 1;
  string job_namespace = 2;
  string job_name = 3;
  string job_type = 4;
  string integration = 5;
  string processing_type = 6;
  string parent_job_namespace = 7;
  string parent_job_name = 8;
  string root_job_namespace = 9;
  string root_job_name = 10;
  string latest_run_guid = 11;
  string latest_run_id = 12;
  google.protobuf.Timestamp latest_event_time = 13;
  string latest_producer = 14;
  string latest_source = 15;
  int32 run_count = 16;
  int32 lineage_run_count = 17;
  google.protobuf.Timestamp created_at = 18;
  google.protobuf.Timestamp updated_at = 19;
}

// OpenLineageTask stores the aggregated task summary.
message OpenLineageTask {
  int64 id = 1;
  OpenLineageTaskSummary summary = 2;
}
