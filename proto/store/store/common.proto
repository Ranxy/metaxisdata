syntax = "proto3";

package metaxisdata.store;

option go_package = "generated-go/store";

// Used internally for obfuscating the page token.
message PageToken {
  int32 limit = 1;
  int32 offset = 2;
}

// Engine is the database engine of an instance. It must stay value-compatible
// with metaxisdata.v1.Engine.
enum Engine {
  ENGINE_UNSPECIFIED = 0;

  reserved 1, 4 to 5, 7 to 12, 15 to 28;
  reserved "CLICKHOUSE", "SNOWFLAKE", "SQLITE", "MONGODB", "REDIS", "ORACLE", "SPANNER", "MSSQL", "REDSHIFT", "STARROCKS", "DORIS", "HIVE", "ELASTICSEARCH", "BIGQUERY", "DYNAMODB", "DATABRICKS", "COCKROACHDB", "COSMOSDB", "TRINO", "CASSANDRA";

  MYSQL = 2;
  POSTGRES = 3;
  TIDB = 6;
  MARIADB = 13;
  OCEANBASE = 14;
}
