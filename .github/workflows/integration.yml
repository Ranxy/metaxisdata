name: Integration

# Two tiers in one file:
#   - a pull request runs only the migrator integration package: six scenarios,
#     a container each, ~30s of tests in all. LATEST.sql drifting from the
#     incrementals is the failure that has actually broken a pull request, and
#     the one that breaks every user's upgrade;
#   - a push to main runs the whole real-server suite, so main is verified
#     minutes after the merge without anyone waiting on it.
# The expensive matrix lives in nightly.yml; neither tier there blocks a
# pull request.
on:
  pull_request:
    paths:
      - .github/workflows/integration.yml
      - .github/workflows/integration-suite.yml
      - Makefile
      - go.mod
      - go.sum
      - backend/migrator/**
      - backend/test/integration/dockerutil/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/integration.yml
      - .github/workflows/integration-suite.yml
      - Makefile
      - backend/**
      - go.mod
      - go.sum
      - proto/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The event name keeps a manual dispatch in its own lane, so it neither
  # cancels a push verification nor is cancelled by one. Within a lane a newer
  # run cancels the older one: stacked merges verify the tip, which subsumes it.
  group: integration-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  migrator:
    name: Migrator
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run the migrator integration tests
        run: make test-integration-migrator

  full:
    name: Full suite
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/integration-suite.yml
