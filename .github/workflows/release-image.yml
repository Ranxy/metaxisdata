name: Release image

# Publishing a GitHub Release is what ships a version: the image is built from
# the commit the release points at and pushed to GHCR under the release tag.
# A prerelease gets its own tag but never moves :latest or the minor line, so a
# deployment tracking an alias is not handed a release candidate.
# workflow_dispatch is the manual rebuild path: on a branch it publishes only
# :sha-<commit> (a branch name is not a version), while dispatched on a tag it
# republishes that tag's set, still without touching the aliases.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  # The only write this workflow needs: pushing to the repository's own GHCR
  # package. It never writes to the repository.
  packages: write

concurrency:
  group: release-image-${{ github.ref }}
  # A release must not be cancelled half-pushed, so nothing cancels anything.
  cancel-in-progress: false

jobs:
  image:
    name: Build and push the multi-platform image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the released tag
        uses: actions/checkout@v4
        with:
          # On a release event this is the tag; on a manual run it is the
          # branch the run was started from.
          ref: ${{ github.event.release.tag_name || github.ref }}

      # arm64 needs emulation for the runtime stage only — the build stages are
      # pinned to $BUILDPLATFORM and cross-compile, so vue-tsc and the Go
      # toolchain never run under QEMU.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercased explicitly: GHCR rejects an uppercase owner path, and the
      # repository's owner is spelled Ranxy in its module path.
      - name: Resolve the image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # The commit is read from the checked-out checkout rather than from
      # github.sha: for a release event the latter is documented as the last
      # commit of the tagged release, and for an annotated tag it may name the
      # tag object. HEAD after checking out the tag is the commit the binary was
      # actually built from, which is what the OCI revision label must record.
      - name: Resolve the build metadata
        id: build
        run: |
          echo "version=${{ github.event.release.tag_name || github.sha }}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Tags: the release tag as published (v1.2.3), the bare semver (1.2.3),
      # the minor line (1.2), the commit (sha-abc1234), and :latest for a
      # release that is not a prerelease.
      #
      # flavor.latest=false is what makes the prerelease rule real, not the
      # enable expressions below. metadata-action sorts the tag list by
      # descending priority (semver 900, ref 600, raw 200, sha 100), and
      # version.latest is decided by the FIRST entry that yields a value and is
      # never revised: with the default `latest=auto`, a semver tag lets
      # semver's own prerelease rule decide (correct), but a tag semver cannot
      # parse — `rc-2026` — leaves the decision to the ref entry, which claims
      # latest=true, so a prerelease would move :latest. Turning the flavor off
      # removes every implicit source and leaves the gated raw entry as the only
      # one. Verified against docker/metadata-action@v5's own code.
      #
      # Aliases (1.2, latest) are stable-release only; the exact version and
      # sha tags publish on every release so an RC is still identifiable.
      - name: Resolve tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name != 'release' || github.event.release.prerelease == false }}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.event_name == 'release' && github.event.release.prerelease == false }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/docker/Dockerfile.server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.build.outputs.version }}
            GIT_COMMIT=${{ steps.build.outputs.commit }}
            BUILD_TIME=${{ steps.build.outputs.time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The push is the deliverable, so show the manifest it produced: a partial
      # or missing platform is then visible in the run instead of only at pull
      # time. Skipped on a manual run, whose tags are commit-derived.
      - name: Inspect the published manifest
        if: github.event_name == 'release'
        run: docker buildx imagetools inspect "${{ steps.image.outputs.name }}:${{ github.event.release.tag_name }}"
