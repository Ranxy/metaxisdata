name: CI

on:
  pull_request:
    paths:
      - .github/workflows/ci.yml
      - .golangci.yaml
      - backend/**
      - cli/**
      - frontend/**
      - go.mod
      - go.sum
      - Makefile
      - scripts/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/ci.yml
      - .golangci.yaml
      - backend/**
      - cli/**
      - frontend/**
      - go.mod
      - go.sum
      - Makefile
      - scripts/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The hermetic suite needs no PostgreSQL, MySQL or Docker, so it runs on every
  # change. -race is on because most of the concurrency in this server (store
  # caches, the LLM agent, the runners) is invisible to the plain build, and
  # -cover reports how much of each package the suite actually executes.
  unit:
    name: Unit Tests (race, cover)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run hermetic tests
        run: go test -race -count=1 -cover ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The repo config is golangci-lint v2 and enables the integration build
      # tag, so the harness is linted too.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.1
          args: --allow-parallel-runners

  # -tags release selects the prod profile, which the default build never
  # compiles: a release-only breakage (an import behind the tag, a profile
  # override) otherwise reached deployment unnoticed.
  release:
    name: Release build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build the release binary
        run: make build-release

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      # biome:ci and lint:ci are the read-only counterparts of the local
      # biome:check/lint scripts, which rewrite files.
      - name: Format and lint
        run: |
          pnpm --dir frontend biome:ci
          pnpm --dir frontend lint:ci

      # Standalone i18n audit: missing/unused keys, cross-locale key and
      # placeholder parity, and locale catalog ordering.
      - name: Check i18n catalogs
        run: pnpm --dir frontend i18n

      # --extendedDiagnostics prints the aggregate peak heap beside the timing,
      # which the metrics step below reads back out of the tee'd file.
      - name: Type check
        run: |
          set -o pipefail
          pnpm --dir frontend type-check:diagnostics | tee "$RUNNER_TEMP/typecheck.txt"

      # Fails on the shared layer's per-file coverage thresholds (lines and
      # functions 95%, branches 85%) — see frontend/vitest.config.ts. The json
      # report beside the coverage summary feeds the metrics step.
      - name: Test with coverage
        run: pnpm --dir frontend test:ci

      - name: Build
        run: pnpm --dir frontend build

      # Observation, not a gate: type-check heap, bundle size, test count and
      # the shared layer's coverage, appended to this run's summary so drift is
      # visible next to the run.
      - name: Report frontend metrics
        if: always()
        run: node frontend/scripts/frontend-metrics.mjs --typecheck "$RUNNER_TEMP/typecheck.txt"
