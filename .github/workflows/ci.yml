name: CI

on:
  pull_request:
    paths:
      - .github/workflows/ci.yml
      - .golangci.yaml
      - backend/**
      - frontend/**
      - go.mod
      - go.sum
      - Makefile
  push:
    branches:
      - main
    paths:
      - .github/workflows/ci.yml
      - .golangci.yaml
      - backend/**
      - frontend/**
      - go.mod
      - go.sum
      - Makefile
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The hermetic suite needs no PostgreSQL, MySQL or Docker, so it runs on every
  # change. -race is on because most of the concurrency in this server (store
  # caches, the LLM agent, the runners) is invisible to the plain build, and
  # -cover reports how much of each package the suite actually executes.
  unit:
    name: Unit Tests (race, cover)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run hermetic tests
        run: go test -race -count=1 -cover ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The repo config is golangci-lint v2 and enables the integration build
      # tag, so the harness is linted too.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.1
          args: --allow-parallel-runners

  # -tags release selects the prod profile, which the default build never
  # compiles: a release-only breakage (an import behind the tag, a profile
  # override) otherwise reached deployment unnoticed.
  release:
    name: Release build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build the release binary
        run: make build-release

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      # biome:ci and lint:ci are the read-only counterparts of the local
      # biome:check/lint scripts, which rewrite files.
      - name: Format and lint
        run: |
          pnpm --dir frontend biome:ci
          pnpm --dir frontend lint:ci

      # Standalone i18n audit: missing/unused keys, cross-locale key and
      # placeholder parity, and locale catalog ordering.
      - name: Check i18n catalogs
        run: pnpm --dir frontend i18n

      - name: Type check
        run: pnpm --dir frontend type-check

      # --coverage runs the same suite and reports per-file coverage; there is no
      # threshold yet, the report is meant to make gaps visible.
      - name: Test with coverage
        run: pnpm --dir frontend test:coverage

      - name: Build
        run: pnpm --dir frontend build
